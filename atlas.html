<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f5f2eb">
    <title>Zettel Lines</title>
    <style>
        :root {
            --bg: #f5f2eb;
            --paper: #fffefa;
            --ink: #171717;
            --muted: #777168;
            --line: #d9d4ca;
            --blue: #2455ff;
            --top: env(safe-area-inset-top);
            --bottom: env(safe-area-inset-bottom)
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            border: 0;
            background: none
        }

        #app {
            position: fixed;
            inset: 0;
            background: var(--bg)
        }

        header {
            position: absolute;
            z-index: 30;
            top: 0;
            left: 0;
            right: 0;
            height: calc(58px + var(--top));
            padding: var(--top) 12px 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
            background: var(--bg)
        }

        .brand {
            height: 42px;
            font-size: 12px;
            font-weight: 900
        }

        .search {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--paper);
            padding: 0 12px;
            outline: 0;
            min-width: 0;
            font-size: 14px
        }

        .filterBtn {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--paper);
            padding: 0 11px;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .06em
        }

        .toolbar {
            position: absolute;
            z-index: 29;
            left: 0;
            right: 0;
            top: calc(58px + var(--top));
            height: 44px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: auto;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            scrollbar-width: none
        }

        .toolbar::-webkit-scrollbar {
            display: none
        }

        .chip {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--paper);
            padding: 7px 10px;
            font-size: 9px;
            font-weight: 850;
            letter-spacing: .06em;
            color: var(--muted)
        }

        .chip.on {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        main {
            position: absolute;
            top: calc(102px + var(--top));
            bottom: calc(14px + var(--bottom));
            left: 0;
            right: 0;
            overflow: auto;
            background: var(--paper);
            scrollbar-width: none
        }

        main::-webkit-scrollbar {
            display: none
        }

        .zgroup {
            border-bottom: 7px solid var(--bg)
        }

        .zhead {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(255, 254, 250, .97);
            backdrop-filter: blur(12px);
            padding: 11px 12px 10px;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: start
        }

        .zid {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: 3px
        }

        .ztitle {
            font-size: 14px;
            line-height: 1.18;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .ztype {
            font-size: 9px;
            font-weight: 850;
            color: var(--muted);
            white-space: nowrap
        }

        .lineRow {
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 12px;
            padding: 13px 12px;
            border-bottom: 1px solid #e8e3da;
            background: var(--paper);
            position: relative;
            user-select: none
        }

        .lineRow:last-child {
            border-bottom: 0
        }

        .lineRow.selected {
            background: var(--ink);
            color: #fff
        }

        .lineRow.selected .fieldName {
            color: #bdb8af
        }

        .fieldName {
            font-size: 8px;
            line-height: 1.3;
            font-weight: 900;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase;
            padding-top: 3px;
            word-break: break-word
        }

        .lineText {
            font-family: ui-serif, Georgia, serif;
            font-size: 17px;
            line-height: 1.48;
            white-space: pre-wrap
        }

        .lineRow[data-field="TITLE"] .lineText,
        .lineRow[data-field="QUESTION"] .lineText,
        .lineRow[data-field="DEEPER QUESTION"] .lineText {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            font-weight: 760;
            letter-spacing: -.025em
        }

        .lineRow[data-field="TITLE"] .lineText {
            font-size: 19px;
            line-height: 1.22
        }

        .lineRow[data-field="QUESTION"] .lineText {
            font-size: 20px;
            line-height: 1.24
        }

        .lineRow[data-field="DEEPER QUESTION"] .lineText {
            font-size: 18px;
            line-height: 1.28
        }

        .lineRow[data-field="PASSAGE"] .lineText {
            font-size: 18px
        }

        .lineRow.code .lineText {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            line-height: 1.55;
            background: #f2eee6;
            padding: 10px;
            border-radius: 10px;
            overflow: auto
        }

        .lineRow.selected.code .lineText {
            background: #272727
        }

        .empty {
            padding: 50px 18px;
            text-align: center;
            color: var(--muted);
            font-size: 13px
        }

        .selection {
            position: absolute;
            z-index: 40;
            left: 10px;
            right: 10px;
            bottom: calc(8px + var(--bottom));
            min-height: 56px;
            border-radius: 16px;
            background: var(--ink);
            color: #fff;
            display: none;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px;
            padding: 7px 8px 7px 13px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .18)
        }

        .selection.open {
            display: grid
        }

        .selCount {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .05em
        }

        .selection button {
            height: 40px;
            padding: 0 12px;
            border-radius: 11px;
            background: #2a2a2a;
            color: #fff;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .06em
        }

        .selection .primary {
            background: #fff;
            color: #111
        }

        .stack {
            position: absolute;
            z-index: 70;
            inset: 0;
            background: var(--paper);
            transform: translateY(104%);
            transition: transform .24s cubic-bezier(.2, .8, .2, 1);
            display: flex;
            flex-direction: column
        }

        .stack.open {
            transform: translateY(0)
        }

        .stackHead {
            height: calc(58px + var(--top));
            padding: var(--top) 10px 0;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center
        }

        .stackHead button {
            height: 42px;
            font-size: 20px
        }

        .stackHead div {
            text-align: center;
            font-size: 10px;
            font-weight: 850;
            color: var(--muted);
            letter-spacing: .07em
        }

        .stackScroll {
            flex: 1;
            overflow: auto;
            padding: 12px 14px calc(20px + var(--bottom))
        }

        .stackItem {
            padding: 16px 0;
            border-bottom: 1px solid var(--line)
        }

        .stackMeta {
            font-size: 8px;
            color: var(--muted);
            font-weight: 850;
            letter-spacing: .08em;
            margin-bottom: 6px
        }

        .stackText {
            font-family: ui-serif, Georgia, serif;
            font-size: 20px;
            line-height: 1.48
        }

        .stackItem[data-field="QUESTION"] .stackText {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            font-weight: 760;
            letter-spacing: -.03em
        }

        .scrim {
            position: absolute;
            z-index: 80;
            inset: 0;
            background: rgba(20, 18, 15, .18);
            display: none
        }

        .scrim.open {
            display: block
        }

        .sheet {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: calc(10px + var(--bottom));
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, .16)
        }

        .sheetTitle {
            padding: 9px 10px;
            font-size: 10px;
            font-weight: 850;
            color: var(--muted);
            letter-spacing: .07em
        }

        .sheetGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px
        }

        .sheetGrid button {
            min-height: 48px;
            border-radius: 12px;
            background: var(--bg);
            font-size: 10px;
            font-weight: 800
        }

        .sheetGrid button.on {
            background: var(--ink);
            color: #fff
        }

        .toast {
            position: absolute;
            z-index: 100;
            left: 50%;
            bottom: calc(76px + var(--bottom));
            transform: translateX(-50%);
            background: var(--ink);
            color: #fff;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 11px;
            display: none;
            white-space: nowrap
        }

        .toast.open {
            display: block
        }

        @media(min-width:760px) {

            header,
            .toolbar,
            main {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: min(820px, 100%)
            }

            .selection {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 520px
            }

            .lineRow {
                grid-template-columns: 120px 1fr;
                padding-left: 18px;
                padding-right: 18px
            }

            .zhead {
                padding-left: 18px;
                padding-right: 18px
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <header><button class="brand">ZETTEL</button><input id="search" class="search" placeholder="Search lines"
                autocomplete="off"><button id="filterBtn" class="filterBtn">ALL</button></header>
        <div class="toolbar">
            <button class="chip on" data-filter="ALL">ALL</button><button class="chip"
                data-filter="QUESTION">QUESTIONS</button>
            <button class="chip" data-filter="PASSAGE">PASSAGES</button><button class="chip"
                data-filter="RESEARCH OBJECT">OBJECTS</button>
            <button class="chip" data-filter="TYPE">TYPES</button><button class="chip"
                data-filter="SOURCE">SOURCES</button>
        </div>
        <main id="table"></main>
        <div class="selection" id="selection">
            <div class="selCount" id="selCount">0 selected</div><button id="clearBtn">CLEAR</button><button
                id="stackBtn" class="primary">READ</button>
        </div>
        <section class="stack" id="stack">
            <div class="stackHead"><button id="stackBack">←</button>
                <div id="stackCount">SELECTED</div><button id="copyBtn">⧉</button>
            </div>
            <div class="stackScroll" id="stackScroll"></div>
        </section>
        <div class="scrim" id="filterScrim">
            <div class="sheet">
                <div class="sheetTitle">SHOW</div>
                <div class="sheetGrid" id="sheetGrid"></div>
            </div>
        </div>
        <div class="toast" id="toast"></div>
    </div>
    <script>
        (() => {
            const notes = [
                {
                    id: "Z-SEM-143",
                    title: "NATURALIZE is not one operation in Geertz: “of-courseness” belongs to a five-dimensional style of common sense.",
                    type: "NATURALIZE", topic: "Common Sense", symbol: "Na",
                    source: "Clifford Geertz — “Common Sense as a Cultural System” — 1975; reprinted in Local Knowledge — 1983 — pp. 85–92.",
                    passage: "[PARAPHRASE] Geertz says common sense can be characterized less by invariant content than by recurrent stylistic qualities: naturalness, practicalness, thinness, immethodicalness, and accessibleness. These qualities are attributed to reality by common sense rather than simply discovered as properties already residing in things.",
                    fields: {
                        "RESEARCH OBJECT": "NATURALIZATION is one dimension of an EPISTEMIC STYLE.",
                        "LOCAL MOVE": "The parent modeled NATURALIZE primarily as suppression of provenance.\n\nGeertz’s fuller account shows that common sense also makes an interpretation appear: obvious, practical, simple, non-specialist, available to anyone.",
                        "SOURCE TERMS": "naturalness practicalness thinness immethodicalness accessibleness common sense cultural system reality style",
                        "WHAT BECAME STRANGE": "A proposition can be historically constructed yet become powerful not merely because its origin disappears.\n\nIt also acquires a characteristic interface: “obvious,” “simple,” “what anyone can see,” “the sensible thing to do.”",
                        "QUESTION": "Should NATURALIZE be decomposed into several operators rather than represented as provenance erasure alone?",
                        "DEEPER QUESTION": "Which of Geertz’s five common-sense qualities most directly converts interpretation into action?",
                        "MECHANISM": "interpretation I → cultural styling → I acquires naturalness / practicality / thinness / immethodicalness / accessibility → alternative interpretations become increasingly marked as: overcomplicated, impractical, esoteric, unnatural.",
                        "FORMAL SHIFT": "<INTERPRETATION I> → [COMMON-SENSE STYLING] → <I AS OBVIOUS / PRACTICAL / SIMPLE / ACCESSIBLE> → <REDUCED PRESSURE TO REINTERPRET>",
                        "SOURCE FORMALISM": "Geertz supplies five named “quasi-qualities” for the style of common sense. He supplies no algorithm relating them.",
                        "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nNATURALIZE(I) may be a vector transformation:\nN(I) = { naturalness ↑, practicalness ↑, thinness ↑, immethodicalness ↑, accessibleness ↑ }\nrather than:\nmutable(I) := false.",
                        "TENSION": "[[Z-SEM-133]] correctly identifies provenance suppression as one effect. But Geertz suggests that what makes common sense powerful is also its POSITIVE PRESENTATIONAL FORM.",
                        "MISSING": "The causal relations among the five qualities.\nDoes: THINNESS → NATURALNESS?\nDoes: ACCESSIBILITY → NATURALNESS?\nDoes: PRACTICALNESS → resistance to reconsideration?",
                        "BOUNDARY": "The five-dimensional representation is OUR computational reconstruction. Geertz presents stylistic features, not independent state variables.",
                        "CITATION TRAIL": "[[Z-SEM-133]] → Geertz’s five quasi-qualities → isolate NATURALNESS from THINNESS → test whether common-sense authority is produced by provenance loss or stylistic compression.",
                        "TEST": "Take one contested interpretation and rewrite it in five variants, changing only: NATURALNESS, PRACTICALNESS, THINNESS, IMMETHODICALNESS, ACCESSIBILITY. Measure which alteration most strongly changes judgments that the claim is: obvious, true, actionable, not worth questioning.",
                        "PLATFORM": "[[NATURALIZE]]",
                        "LINKS": "[[Z-SEM-133]] [[Z-SEM-135]] [[Common Sense as Epistemic Style]]",
                        "BIBTEX": "@article{geertz1975commonsense,\n  author = {Geertz, Clifford},\n  title = {Common Sense as a Cultural System},\n  journal = {The Antioch Review},\n  year = {1975},\n  volume = {33},\n  number = {1},\n  pages = {5--26}\n}"
                    }
                },
                {
                    id: "Z-SEM-144", title: "THICKEN can be tested through success and failure conditions: a thicker act-description changes what would count as accomplishing the act.",
                    type: "THICKEN", topic: "Act Type", symbol: "Th",
                    source: "Gilbert Ryle — “The Thinking of Thoughts: What Is ‘Le Penseur’ Doing?” — 1968; reprinted in Collected Papers, Volume 2 — 2009 — pp. 494–510. Julia Tanney — Foreword to Collected Papers, Volume 2 — 2009 — pp. xvi–xviii.",
                    passage: "[PARAPHRASE] The Rylean wink differs from a twitch not merely because additional facts are known. Winking to signal has success and failure conditions involving an addressee, recognition of a code, uptake, and subsequent action. Parodying the wink and rehearsing the parody introduce still different success conditions.",
                    fields: {
                        "RESEARCH OBJECT": "THICKER ACT-TYPE → DIFFERENT COUNTERFACTUAL SUCCESS CONDITIONS.",
                        "LOCAL MOVE": "[[Z-SEM-134]] defined THICKEN as inferential act-typing. Ryle adds an operational test: if the description truly identifies a different accomplishment, its conditions of success and failure should also change.",
                        "SOURCE TERMS": "thin description thick description success failure code signal wink parody practice accomplishment",
                        "WHAT BECAME STRANGE": "Thickness is not merely more explanatory metadata. A thick description changes the counterfactual space surrounding an act. The same eyelid movement can succeed or fail as: signal, parody, rehearsal under entirely different conditions.",
                        "QUESTION": "Could THICKEN be operationalized as recovery of an act’s success/failure topology?",
                        "DEEPER QUESTION": "Can two descriptions count as genuinely different act-types if all of their possible success and failure conditions are identical?",
                        "MECHANISM": "observable movement e → candidate act A → recover purpose / code / recipient / circumstances → derive success conditions SC(A) → derive failure conditions FC(A) → distinguish A from rival act-types",
                        "FORMAL SHIFT": "<OBSERVABLE e> → <ACT-TYPE A> → [RECOVER COUNTERFACTUAL CONDITIONS] → <SC(A), FC(A)>",
                        "SOURCE FORMALISM": "Ryle’s examples distinguish accomplishment levels partly through different conditions under which winking, parodying, and practicing parodying succeed or fail. No mathematical formalism is supplied.",
                        "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nTHICKEN(e) returns candidate A such that:\nA = { observable, purpose, code, participants, SC, FC }\nA₁ ≠ A₂ when:\nSC(A₁) ≠ SC(A₂) or FC(A₁) ≠ FC(A₂).",
                        "TENSION": "A culturally meaningful act may remain meaningful even when unsuccessful. Failure conditions therefore help identify the act but cannot define its entire meaning.",
                        "MISSING": "How actors themselves determine which accomplishment level is relevant.",
                        "BOUNDARY": "The success/failure formalization is our extraction from Ryle’s examples. Ryle does not present thick description as a formal verification procedure.",
                        "CITATION TRAIL": "[[Z-SEM-134]] → Ryle’s success/failure conditions → accomplishment levels → speech-act felicity → counterfactual tests of thick interpretation.",
                        "TEST": "Hold one physical action constant. Construct three candidate interpretations with different: PURPOSE, RECIPIENT, CODE. For each derive success/failure conditions. If the conditions cannot be distinguished, reject the proposed act-type distinction as insufficiently thick.",
                        "PLATFORM": "[[THICKEN]]",
                        "LINKS": "[[Z-SEM-134]] [[Z-PROMPT-049]] [[Counterfactual Thick Description]]",
                        "BIBTEX": "@incollection{ryle1968thinking,\n  author = {Ryle, Gilbert},\n  title = {The Thinking of Thoughts: What Is `Le Penseur' Doing?},\n  booktitle = {Collected Papers, Volume 2: Collected Essays 1929--1968},\n  year = {2009},\n  publisher = {Routledge},\n  pages = {494--510},\n  note = {Originally delivered in 1968}\n}"
                    }
                },
                {
                    id: "Z-SEM-145", title: "NATURALIZE may work partly by THINNING: common sense suppresses the subordinate clauses that thick description restores.",
                    type: "COUPLING", topic: "Common Sense", symbol: "Nt",
                    source: "Clifford Geertz — “Common Sense as a Cultural System” — 1975 / 1983 — pp. 85–92. Clifford Geertz — “Thick Description: Toward an Interpretive Theory of Culture” — 1973 — pp. 6–10. Gilbert Ryle — “The Thinking of Thoughts” — 1968.",
                    passage: "[PARAPHRASE] Geertz names “thinness” as one stylistic quality of common sense: events are presented literally and simply, without elaborate complication. His thick-description argument, drawing on Ryle, moves in the opposite direction by recovering nested structures of intention, code, implication, parody, circumstance, and interpretation.",
                    fields: {
                        "RESEARCH OBJECT": "NATURALIZATION and THICKENING may systematically alter opposite properties of an interpretation.",
                        "LOCAL MOVE": "[[Z-SEM-135]] treated THICKEN and NATURALIZE as different dimensions. The sources reveal a stronger possible relation: common sense NATURALIZES partly by presenting interpretations THINLY. Thick description reopens exactly what common sense closes.",
                        "SOURCE TERMS": "thinness naturalness thick description meaningful structures implication common sense literalness simplicity",
                        "WHAT BECAME STRANGE": "“What obviously happened” often contains fewer visible interpretive steps than “what happened once its cultural conditions are reconstructed.” The appearance of direct access to reality may therefore be produced by deleting interpretive depth.",
                        "QUESTION": "Is THINNING one mechanism by which NATURALNESS is manufactured?",
                        "DEEPER QUESTION": "Can political or technical systems make interpretations appear objective by compressing away the relations required to produce them?",
                        "MECHANISM": "historically situated interpretation → omit provenance → omit rival interpretations → omit subordinate relational clauses → present residue literally → interpretation appears natural/self-evident\n\nReverse direction:\nself-evident claim → recover omitted relations/history/rivals → THICKEN → claim reappears as contingent interpretation",
                        "FORMAL SHIFT": "<THICK INTERPRETATION I*> → [THIN] → [NATURALIZE] → <“JUST HOW THINGS ARE”>",
                        "SOURCE FORMALISM": "Geertz explicitly identifies THINNESS and NATURALNESS as separate stylistic qualities of common sense. Ryle/Geertz identify thick description with ascending levels of contextual and implication structure. The causal link between these is not supplied by the sources.",
                        "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nPossible coupling:\nTHIN(I) ↑ → NATURALNESS(I) ↑\nTHICKEN(I) → visible mediation ↑ → NATURALNESS(I) potentially ↓.",
                        "TENSION": "Some extremely thick narratives can also naturalize a worldview through overwhelming detail. Thickness therefore cannot be treated as automatically critical or denaturalizing.",
                        "MISSING": "Empirical evidence for the causal relation between: INTERPRETIVE THINNESS and PERCEIVED NATURALNESS.",
                        "BOUNDARY": "THICKEN and NATURALIZE are not logical inverses. The proposed coupling is a research hypothesis.",
                        "CITATION TRAIL": "[[Z-SEM-135]] → [[Z-SEM-133]] → [[Z-SEM-134]] → Geertzian thinness → test naturalization through interpretive compression.",
                        "TEST": "Present one event in three descriptions: THIN: bare event claim. THICK: same claim plus provenance, actors, codes, history, and alternatives. VERBOSE-THIN: many irrelevant details but no interpretive relations. Measure perceived: obviousness, naturalness, certainty, contestability.",
                        "PLATFORM": "[[Executable Semiotics Operator Algebra]]",
                        "LINKS": "[[Z-SEM-135]] [[Z-SEM-133]] [[Z-SEM-134]] [[Naturalization Through Thinning]]",
                        "BIBTEX": "@article{geertz1975commonsense,\n author={Geertz, Clifford}, title={Common Sense as a Cultural System}, journal={The Antioch Review}, year={1975}, volume={33}, number={1}, pages={5--26}}\n\n@inbook{geertz1973thick,\n author={Geertz, Clifford}, title={Thick Description: Toward an Interpretive Theory of Culture}, booktitle={The Interpretation of Cultures: Selected Essays}, year={1973}, publisher={Basic Books}, pages={3--30}}"
                    }
                },
                {
                    id: "Z-DRT-146", title: "A DRS update is not automatically a belief update: DRT inserts a semantic representation between discourse and truth.",
                    type: "DISTINCTION", topic: "Representation", symbol: "Dr",
                    source: "Hans Kamp, Josef van Genabith, Uwe Reyle — “Discourse Representation Theory” — 2011 — Handbook of Philosophical Logic, Vol. 15, pp. 125–394.",
                    passage: "[PARAPHRASE] DRT assigns natural-language expressions discourse representation structures that function as logical forms or semantic representations. Those structures subsequently receive model-theoretic interpretation. DRT was motivated by incremental discourse understanding, but the representational structure and its truth in a model remain distinct stages.",
                    fields: {
                        "RESEARCH OBJECT": "DISCOURSE STATE ≠ BELIEF STATE.",
                        "LOCAL MOVE": "[[Z-DRT-136]] identified DRT as a strong precedent for explicit state update. But calling that state “what the system believes” imports an additional epistemic commitment.",
                        "SOURCE TERMS": "Discourse Representation Structure logical form semantic representation model-theoretic interpretation discourse referent condition dynamic semantics",
                        "WHAT BECAME STRANGE": "A discourse representation can contain: “A dragon entered the laboratory.” without requiring the interpreter to believe that a dragon actually entered a laboratory. The representation records what discourse makes available for interpretation, reference, and inference under the discourse model.",
                        "QUESTION": "What additional operation converts a discourse representation into an endorsed epistemic commitment?",
                        "DEEPER QUESTION": "Should executable-semiotic systems separately represent: MENTIONED, REPRESENTED, ASSUMED, BELIEVED, KNOWN, AUTHORIZED?",
                        "MECHANISM": "utterance u → semantic construction → DRS K → model-theoretic evaluation / discourse inference\n\nSeparate possible operation:\nK → epistemic assessment → BELIEF / REJECTION / SUSPENSION.",
                        "FORMAL SHIFT": "UTTERANCE → DRS ≠ BELIEF",
                        "SOURCE FORMALISM": "DRS: K = ⟨U_K, Con_K⟩ where the structure contains discourse referents and conditions whose satisfaction can be evaluated with respect to a model.",

            function setFilter(f) {
                filter = f; $("#filterBtn").textContent = f === "ALL" ? "ALL" : f === "RESEARCH OBJECT" ? "OBJECTS" : f;
                $$(".chip").forEach(b => b.classList.toggle("on", b.dataset.filter === f)); $("#filterScrim").classList.remove("open"); render();
            }
            function openFilter() {
                const opts = ["ALL", "QUESTION", "PASSAGE", "RESEARCH OBJECT", "TYPE", "SOURCE", "LOCAL MOVE", "WHAT BECAME STRANGE", "DEEPER QUESTION", "MECHANISM", "FORMAL SHIFT", "TENSION", "MISSING", "BOUNDARY", "TEST", "BIBTEX"];
                $("#sheetGrid").innerHTML = opts.map(f => `<button class="${filter === f ? 'on' : ''}" data-f="${esc(f)}">${esc(f)}</button>`).join("");
                $$("#sheetGrid button").forEach(b => b.onclick = () => setFilter(b.dataset.f)); $("#filterScrim").classList.add("open");
            }
            function toast(msg) { clearTimeout(toastTimer); $("#toast").textContent = msg; $("#toast").classList.add("open"); toastTimer = setTimeout(() => $("#toast").classList.remove("open"), 1200) }
            $("#search").addEventListener("input", render); $$(".chip").forEach(b => b.onclick = () => setFilter(b.dataset.filter)); $("#filterBtn").onclick = openFilter;
            $("#filterScrim").addEventListener("pointerdown", e => { if (e.target === $("#filterScrim")) $("#filterScrim").classList.remove("open") });
            $("#clearBtn").onclick = clearSelected; $("#stackBtn").onclick = openStack; $("#stackBack").onclick = closeStack; $("#copyBtn").onclick = copySelected;
            document.addEventListener("keydown", e => { if (e.key === "Escape") { closeStack(); $("#filterScrim").classList.remove("open") } });
            render();
        })();
    </script>
</body>

</html>
