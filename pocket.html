<script>
const D=JSON.parse(document.getElementById('IDX').textContent);
const CASES=D.c, Z=D.z, BASE='slipcases/';
const $=s=>document.querySelector(s);
const list=$('#list'), qi=$('#q'), nEl=$('#n'), topBtn=$('#top');
let filt=null, shown=[], drawn=0, term='';
const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function hl(s,t){ if(!t)return esc(s); const i=s.toLowerCase().indexOf(t);
 return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length)); }

// case filter chips
const chips=$('#chips');
chips.innerHTML='<span class="chip on" data-c="">ALL '+Z.length+'</span>'+
 CASES.map((c,i)=>`<span class="chip" data-c="${i}">${c[0]} · ${c[1].split('—').slice(-1)[0].trim().slice(0,26)}</span>`).join('');
chips.onclick=e=>{const t=e.target.closest('.chip'); if(!t)return;
 [...chips.children].forEach(x=>x.classList.toggle('on',x===t));
 filt=t.dataset.c===''?null:+t.dataset.c; run(); window.scrollTo(0,0);};

function match(z){ if(filt!==null&&z[2]!==filt) return false;
 if(!term) return true; return (z[0]+' '+z[1]).toLowerCase().includes(term); }
function run(){ shown=Z.filter(match); drawn=0; list.innerHTML='';
 nEl.textContent=shown.length+(shown.length===Z.length?'':' / '+Z.length);
 if(!shown.length){ list.innerHTML='<div class="empty">no slip matches</div>'; return; } draw(); }
function draw(){ const n=Math.min(drawn+60,shown.length); let h='';
 for(let i=drawn;i<n;i++){ const z=shown[i];
  h+=`<div class="s" data-i="${i}"><div class="sid">${CASES[z[2]][0]} · ${esc(z[0])}</div><div class="st">${hl(z[1],term)}</div></div><div class="body" id="b${i}"></div>`; }
 list.insertAdjacentHTML('beforeend',h); drawn=n; }
addEventListener('scroll',()=>{ topBtn.classList.toggle('on',scrollY>900);
 if(drawn<shown.length && innerHeight+scrollY > document.body.offsetHeight-1200) draw(); },{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});

list.onclick=async e=>{ const s=e.target.closest('.s'); if(!s)return;
 const i=+s.dataset.i, b=document.getElementById('b'+i);
 if(b.classList.contains('on')){ b.classList.remove('on'); return; }
 b.classList.add('on');
 if(b.dataset.done){ return; }
 const z=shown[i], url=BASE+encodeURIComponent(CASES[z[2]][2])+'/'+encodeURIComponent(z[3])+'.txt';
 b.innerHTML='<div class="ld">opening…</div>';
 try{ const r=await fetch(url); if(!r.ok) throw 0; const t=await r.text();
  b.innerHTML=`<div class="tools"><a class="tool" href="${url}" target="_blank" rel="noopener">raw</a>`+
   `<button class="tool" data-copy="${i}">copy</button></div><pre>${esc(t)}</pre>`;
  b.dataset.done=1; b.dataset.txt=t;
 }catch(_){ b.innerHTML='<div class="ld">could not load this slip — try “raw”</div>'; } };
list.addEventListener('click',e=>{ const c=e.target.closest('[data-copy]'); if(!c)return;
 e.stopPropagation(); const b=document.getElementById('b'+c.dataset.copy);
 navigator.clipboard?.writeText(b.dataset.txt||'').then(()=>{c.textContent='copied';setTimeout(()=>c.textContent='copy',1200);}); });

let t0; qi.addEventListener('input',()=>{ clearTimeout(t0);
 t0=setTimeout(()=>{ term=qi.value.trim().toLowerCase(); run(); },110); });
$('#clr').onclick=()=>{ qi.value=''; term=''; run(); qi.focus(); };
run();
</script></body></html>
