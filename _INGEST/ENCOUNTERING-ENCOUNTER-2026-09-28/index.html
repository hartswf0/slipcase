 under-specification, and mistaken premises into otherwise identical conversations. Code who first detects each trouble and who performs the work required to recover. Compare human-human and human-LLM baselines.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-021]]\n[[Repair]]\n[[Encounter Breakdown Test]]", "BIBTEX": "@article{AlbertDeRuiter2018Repair,\n  author = {Saul Albert and J. P. de Ruiter},\n  title = {Repair: The Interface Between Interaction and Cognition},\n  journal = {Topics in Cognitive Science},\n  year = {2018},\n  volume = {10},\n  number = {2},\n  pages = {279--313},\n  doi = {10.1111/tops.12339}\n}", "_order": 27, "_sha256": "7a66315b1845bdb86ab2d18c94a7c56a71e00d34830556f459435c9e47569aa6", "_filename": "027__breakdown-exposes-reciprocity-more-clearly-than-smooth-con__AlbertDeRuiter2018Repair__ENCOUNTER-OP-027__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-027\n\nTITLE:\nBreakdown exposes reciprocity more clearly than smooth conversation does.\n\nSOURCE:\nSaul Albert and J. P. de Ruiter — “Repair: The Interface Between Interaction and Cognition” — 2018 — Topics in Cognitive Science 10(2), 279–313. ([doi.org](https://doi.org/10.1111/tops.12339))\n\nPASSAGE:\n[PARAPHRASE] Conversation analysis distinguishes who initiates repair from who resolves it, yielding four combinations of self/other initiation and self/other repair. ([doi.org](https://doi.org/10.1111/tops.12339))\n\nRESEARCH OBJECT:\nRepair transforms “mutual understanding” from an invisible mental-state claim into observable sequential work performed when interaction encounters trouble.\n\nLOCAL MOVE:\nAlbert and de Ruiter make misunderstanding analytically productive. Trouble reveals who notices divergence, who marks it, who supplies a candidate correction, and whether coordinated action can resume.\n\nSOURCE TERMS:\nrepair\ntrouble-source\nself-initiation\nother-initiation\nself-repair\nother-repair\nunderstanding\nprogressivity\nintersubjectivity\n\nWHAT BECAME STRANGE:\nSmooth dialogue supplies weak evidence of reciprocity because both parties can continue while misunderstanding one another. A breakdown generates an interactional probe of the relation.\n\nQUESTION:\nWho carries the burden of keeping a human–AI encounter intelligible when shared progress breaks?\n\nDEEPER QUESTION:\nDoes a stronger encounter require both participants to detect trouble, or only the coupled system to recover from it?\n\nMECHANISM:\ntrouble-source\n→ trouble detection\n→ repair initiation\n→ candidate repair\n→ acceptance/rejection\n→ resumed or failed progress.\n\nFORMAL SHIFT:\n<APPARENTLY SMOOTH EXCHANGE>\n→ <ENGINEERED TROUBLE>\n→ [REPAIR SEQUENCE]\n→ <OBSERVABLE COORDINATION STRUCTURE>\n\nSOURCE FORMALISM:\nFour-way repair taxonomy:\nSISR = self-initiated self-repair\nSIOR = self-initiated other-repair\nOISR = other-initiated self-repair\nOIOR = other-initiated other-repair. ([doi.org](https://doi.org/10.1111/tops.12339))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nFor human–AI interaction:\n\nINITIATOR ∈ {HUMAN, AI}\nRESOLVER ∈ {HUMAN, AI}\n\nMeasure:\nTROUBLE_OPPORTUNITIES\nREPAIR_INITIATION_RATE\nAI_INITIATION_RATE\nHUMAN_INITIATION_RATE\nREPAIR_SUCCESS\nREPAIR_LATENCY\nREPEATED_TROUBLE\nREPAIR_BURDEN_ASYMMETRY\n\nTENSION:\nA language model may generate linguistically appropriate repair forms without representing the misunderstanding that generated them.\n\nMISSING:\nA criterion distinguishing substantive trouble detection from generic clarification behavior.\n\nBOUNDARY:\nConversation-analysis repair categories describe observable sequential organization. They do not by themselves establish equivalent cognitive processes across humans and AI.\n\nCITATION TRAIL:\n[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-021]]\n→ Albert and de Ruiter 2018\n→ Pütz and Esposito 2024\n→ controlled ambiguity probes\n→ repair symmetry as encounter signature.\n\nTEST:\nSeed ambiguous reference, contradictory assumptions, under-specification, and mistaken premises into otherwise identical conversations. Code who first detects each trouble and who performs the work required to recover. Compare human-human and human-LLM baselines.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-021]]\n[[Repair]]\n[[Encounter Breakdown Test]]\n\nBIBTEX:\n@article{AlbertDeRuiter2018Repair,\n  author = {Saul Albert and J. P. de Ruiter},\n  title = {Repair: The Interface Between Interaction and Cognition},\n  journal = {Topics in Cognitive Science},\n  year = {2018},\n  volume = {10},\n  number = {2},\n  pages = {279--313},\n  doi = {10.1111/tops.12339}\n}"}, {"ID": "ENCOUNTER-OP-028", "TITLE": "Successful repair can conceal that the human is carrying the encounter.", "SOURCE": "Ole Pütz and Elena Esposito — “Performance without understanding: How ChatGPT relies on humans to repair conversational trouble” — 2024 — Discourse & Communication 18(6). ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))", "PASSAGE": "[PARAPHRASE] In ambiguous cases, ChatGPT often proceeds with a likely interpretation rather than initiating clarification; user-initiated repairs can redirect subsequent output, sometimes inconsistently. ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))", "RESEARCH OBJECT": "Repair success and repair reciprocity are different variables.", "LOCAL MOVE": "Pütz and Esposito introduce ambiguities and corrections to inspect how ChatGPT handles conversational trouble. The user frequently detects and specifies the repair that allows the dialogue to continue.", "SOURCE TERMS": "repair\nrepair without understanding\nthird position repair\nreference trouble\ncommunicative competence\nhuman direction\ndialog history\nmisunderstanding", "WHAT BECAME STRANGE": "A conversation can look collaboratively repaired even when one participant performs almost all trouble detection, diagnosis, and correction.", "QUESTION": "Can repair-burden asymmetry distinguish fluent interaction from stronger encounter-like coupling?", "DEEPER QUESTION": "How much human compensatory work can occur before “bidirectional coupling” becomes a misleading description?", "MECHANISM": "ambiguous user turn\n→ model selects interpretation\n→ output exposes mismatch\n→ human diagnoses mismatch\n→ human reformulates/corrects\n→ model conditions on corrective text\n→ locally plausible continuation.", "FORMAL SHIFT": "<REPAIR SUCCESS>\n→ <REPAIR LABOR DISTRIBUTION>\n→ [ACTOR-SENSITIVE CODING]\n→ <ASYMMETRY PROFILE>", "SOURCE FORMALISM": "The paper contrasts:\nBOT-INITIATED handling of potential trouble\nwith\nUSER-INITIATED third-position repair,\nand examines how revised user wording conditions subsequent model output. ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nHUMAN_REPAIR_BURDEN =\nhuman_detected_troubles / all_detected_troubles\n\nAI_REPAIR_INITIATIVE =\nAI_initiated_clarifications / ambiguity_opportunities\n\nRECOVERY_FIDELITY =\nresolved_without_reintroducing_conflict / repair_attempts\n\nEncounter reciprocity requires reporting these separately from overall task success.", "TENSION": "[[ENCOUNTER-AI-016]] requires recursive bidirectional coupling. Pütz and Esposito show that apparent recursion may be strongly directionally dependent.", "MISSING": "Large-scale controlled comparisons across current models rather than illustrative GPT-3.5 dialogues.", "BOUNDARY": "The authors’ examples do not establish that all LLM repair is human-driven, nor that successful repair never reflects useful model-side processing.", "CITATION TRAIL": "[[ENCOUNTER-OP-027]]\n[[ENCOUNTER-AI-016]]\n→ Pütz and Esposito 2024\n→ model comparisons\n→ repair opportunity benchmark\n→ directional encounter metrics.", "TEST": "Generate a benchmark of minimally different ambiguous turns with known alternative interpretations. Measure whether the model:\ndetects ambiguity,\nasks a discriminating question,\nmaintains both alternatives,\nupdates after correction,\nand avoids reverting.\nCompare those scores with ordinary “repair success.”", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-016]]\n[[Human Repair Burden]]\n[[Repair Without Understanding]]", "BIBTEX": "@article{PutzEsposito2024Repair,\n  author = {Ole P{\\\"u}tz and Elena Esposito},\n  title = {Performance without understanding: How ChatGPT relies on humans to repair conversational trouble},\n  journal = {Discourse \\& Communication},\n  year = {2024},\n  volume = {18},\n  number = {6},\n  doi = {10.1177/17504813241271492}\n}", "_order": 28, "_sha256": "b5adcf9b019ba21d3bb4a46ccc99df3fef27885c359cc12f0f24774c2e96e120", "_filename": "028__successful-repair-can-conceal-that-the-human-is-carrying-t__PutzEsposito2024Repair__ENCOUNTER-OP-028__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-028\n\nTITLE:\nSuccessful repair can conceal that the human is carrying the encounter.\n\nSOURCE:\nOle Pütz and Elena Esposito — “Performance without understanding: How ChatGPT relies on humans to repair conversational trouble” — 2024 — Discourse & Communication 18(6). ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))\n\nPASSAGE:\n[PARAPHRASE] In ambiguous cases, ChatGPT often proceeds with a likely interpretation rather than initiating clarification; user-initiated repairs can redirect subsequent output, sometimes inconsistently. ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))\n\nRESEARCH OBJECT:\nRepair success and repair reciprocity are different variables.\n\nLOCAL MOVE:\nPütz and Esposito introduce ambiguities and corrections to inspect how ChatGPT handles conversational trouble. The user frequently detects and specifies the repair that allows the dialogue to continue.\n\nSOURCE TERMS:\nrepair\nrepair without understanding\nthird position repair\nreference trouble\ncommunicative competence\nhuman direction\ndialog history\nmisunderstanding\n\nWHAT BECAME STRANGE:\nA conversation can look collaboratively repaired even when one participant performs almost all trouble detection, diagnosis, and correction.\n\nQUESTION:\nCan repair-burden asymmetry distinguish fluent interaction from stronger encounter-like coupling?\n\nDEEPER QUESTION:\nHow much human compensatory work can occur before “bidirectional coupling” becomes a misleading description?\n\nMECHANISM:\nambiguous user turn\n→ model selects interpretation\n→ output exposes mismatch\n→ human diagnoses mismatch\n→ human reformulates/corrects\n→ model conditions on corrective text\n→ locally plausible continuation.\n\nFORMAL SHIFT:\n<REPAIR SUCCESS>\n→ <REPAIR LABOR DISTRIBUTION>\n→ [ACTOR-SENSITIVE CODING]\n→ <ASYMMETRY PROFILE>\n\nSOURCE FORMALISM:\nThe paper contrasts:\nBOT-INITIATED handling of potential trouble\nwith\nUSER-INITIATED third-position repair,\nand examines how revised user wording conditions subsequent model output. ([journals.sagepub.com](https://journals.sagepub.com/doi/10.1177/17504813241271492))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nHUMAN_REPAIR_BURDEN =\nhuman_detected_troubles / all_detected_troubles\n\nAI_REPAIR_INITIATIVE =\nAI_initiated_clarifications / ambiguity_opportunities\n\nRECOVERY_FIDELITY =\nresolved_without_reintroducing_conflict / repair_attempts\n\nEncounter reciprocity requires reporting these separately from overall task success.\n\nTENSION:\n[[ENCOUNTER-AI-016]] requires recursive bidirectional coupling. Pütz and Esposito show that apparent recursion may be strongly directionally dependent.\n\nMISSING:\nLarge-scale controlled comparisons across current models rather than illustrative GPT-3.5 dialogues.\n\nBOUNDARY:\nThe authors’ examples do not establish that all LLM repair is human-driven, nor that successful repair never reflects useful model-side processing.\n\nCITATION TRAIL:\n[[ENCOUNTER-OP-027]]\n[[ENCOUNTER-AI-016]]\n→ Pütz and Esposito 2024\n→ model comparisons\n→ repair opportunity benchmark\n→ directional encounter metrics.\n\nTEST:\nGenerate a benchmark of minimally different ambiguous turns with known alternative interpretations. Measure whether the model:\ndetects ambiguity,\nasks a discriminating question,\nmaintains both alternatives,\nupdates after correction,\nand avoids reverting.\nCompare those scores with ordinary “repair success.”\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-016]]\n[[Human Repair Burden]]\n[[Repair Without Understanding]]\n\nBIBTEX:\n@article{PutzEsposito2024Repair,\n  author = {Ole P{\\\"u}tz and Elena Esposito},\n  title = {Performance without understanding: How ChatGPT relies on humans to repair conversational trouble},\n  journal = {Discourse \\& Communication},\n  year = {2024},\n  volume = {18},\n  number = {6},\n  doi = {10.1177/17504813241271492}\n}"}, {"ID": "ENCOUNTER-OP-029", "TITLE": "The encounter may have to be measured as a trajectory of coordination rather than as properties of either participant.", "SOURCE": "Nancy J. Cooke, Jamie C. Gorman, Christopher W. Myers, and Jasmine L. Duran — “Interactive Team Cognition” — 2013 — Cognitive Science 37(2), 255–285. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/23167661/))", "PASSAGE": "[QUOTE] Interactive Team Cognition treats team cognition as “an activity, not a property or a product.” ([doi.org](https://doi.org/10.1111/cogs.12009))", "RESEARCH OBJECT": "The appropriate measurement unit for relational intelligence may be the temporal organization of interaction itself.", "LOCAL MOVE": "Cooke and colleagues oppose accounts that infer team cognition primarily from similarity between static individual knowledge structures. They instead place interaction, coordination, context, and adaptation at the team level.", "SOURCE TERMS": "interactive team cognition\nteam interaction\nactivity\nteam level\ncontext\ncoordination\ncommunication flow\nadaptation", "WHAT BECAME STRANGE": "Human score + AI score cannot necessarily recover a relational phenomenon. Even perfect individual measures can miss whether the coupled process adapts coherently.", "QUESTION": "What properties exist in a human–AI trajectory that cannot be assigned to either participant independently?", "DEEPER QUESTION": "Could relational intelligence be measured without attributing cognition to the AI at all?", "MECHANISM": "heterogeneous perspectives/capabilities\n→ interaction\n→ temporally coordinated action\n→ adaptation to changing conditions\n→ team-level performance.", "FORMAL SHIFT": "<HUMAN VARIABLES + AI VARIABLES>\n→ <TIME-ORDERED JOINT ACTIVITY>\n→ [DYNAMIC COORDINATION ANALYSIS]\n→ <RELATIONAL PROCESS MEASURE>", "SOURCE FORMALISM": "Interactive Team Cognition advances three premises:\nteam cognition is an activity;\nit should be studied at the team level;\nit is inseparable from context. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/23167661/))\n\nThe authors also describe measures based on communication flow, speaker/listener identities, and timing in team tasks. ([doi.org](https://doi.org/10.1111/cogs.12009))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nSESSION =\n{e₁, e₂, ... eₙ}\n\nwhere each event records:\nactor,\ntimestamp,\noperation,\nreferent,\nartifact-state,\nresponse-to-prior-event.\n\nCandidate relational variables:\nCROSS-ACTOR DEPENDENCY\nADAPTATION AFTER PERTURBATION\nCOORDINATION LATENCY\nTURN-TO-TURN INFORMATION GAIN\nSTATE-TRANSITION DIVERSITY.", "TENSION": "Shared-mental-model approaches can measure convergence between participants. Interactive Team Cognition warns that convergence may be unnecessary or even less informative than adaptive coordination.", "MISSING": "A principled translation from human team interaction to human–AI systems whose participants have radically different internal architectures.", "BOUNDARY": "Cooke et al. study human teams. Applying team cognition to AI does not imply the machine possesses human cognition.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-008]]\n→ Interactive Team Cognition\n→ dynamical coordination\n→ cross-recurrence / temporal coupling\n→ human–AI encounter trajectories.", "TEST": "For the same corpus, compare prediction of independent expert-rated task development using:\nA. individual user/model features,\nB. final output features,\nC. temporal relational features.\nIf C adds explanatory power beyond A+B, the interaction contains measurable structure not captured by participant properties alone.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-008]]\n[[Interaction-Level Measure]]\n[[Relational Intelligence]]", "BIBTEX": "@article{CookeEtAl2013Interactive,\n  author = {Nancy J. Cooke and Jamie C. Gorman and Christopher W. Myers and Jasmine L. Duran},\n  title = {Interactive Team Cognition},\n  journal = {Cognitive Science},\n  year = {2013},\n  volume = {37},\n  number = {2},\n  pages = {255--285},\n  doi = {10.1111/cogs.12009}\n}", "_order": 29, "_sha256": "8a32a27226b07a5302d029bca80a35ab7a50f484871ed640211dd3c8fee61993", "_filename": "029__the-encounter-may-have-to-be-measured-as-a-trajectory-of-c__CookeEtAl2013Interactive__ENCOUNTER-OP-029__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-029\n\nTITLE:\nThe encounter may have to be measured as a trajectory of coordination rather than as properties of either participant.\n\nSOURCE:\nNancy J. Cooke, Jamie C. Gorman, Christopher W. Myers, and Jasmine L. Duran — “Interactive Team Cognition” — 2013 — Cognitive Science 37(2), 255–285. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/23167661/))\n\nPASSAGE:\n[QUOTE] Interactive Team Cognition treats team cognition as “an activity, not a property or a product.” ([doi.org](https://doi.org/10.1111/cogs.12009))\n\nRESEARCH OBJECT:\nThe appropriate measurement unit for relational intelligence may be the temporal organization of interaction itself.\n\nLOCAL MOVE:\nCooke and colleagues oppose accounts that infer team cognition primarily from similarity between static individual knowledge structures. They instead place interaction, coordination, context, and adaptation at the team level.\n\nSOURCE TERMS:\ninteractive team cognition\nteam interaction\nactivity\nteam level\ncontext\ncoordination\ncommunication flow\nadaptation\n\nWHAT BECAME STRANGE:\nHuman score + AI score cannot necessarily recover a relational phenomenon. Even perfect individual measures can miss whether the coupled process adapts coherently.\n\nQUESTION:\nWhat properties exist in a human–AI trajectory that cannot be assigned to either participant independently?\n\nDEEPER QUESTION:\nCould relational intelligence be measured without attributing cognition to the AI at all?\n\nMECHANISM:\nheterogeneous perspectives/capabilities\n→ interaction\n→ temporally coordinated action\n→ adaptation to changing conditions\n→ team-level performance.\n\nFORMAL SHIFT:\n<HUMAN VARIABLES + AI VARIABLES>\n→ <TIME-ORDERED JOINT ACTIVITY>\n→ [DYNAMIC COORDINATION ANALYSIS]\n→ <RELATIONAL PROCESS MEASURE>\n\nSOURCE FORMALISM:\nInteractive Team Cognition advances three premises:\nteam cognition is an activity;\nit should be studied at the team level;\nit is inseparable from context. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/23167661/))\n\nThe authors also describe measures based on communication flow, speaker/listener identities, and timing in team tasks. ([doi.org](https://doi.org/10.1111/cogs.12009))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nSESSION =\n{e₁, e₂, ... eₙ}\n\nwhere each event records:\nactor,\ntimestamp,\noperation,\nreferent,\nartifact-state,\nresponse-to-prior-event.\n\nCandidate relational variables:\nCROSS-ACTOR DEPENDENCY\nADAPTATION AFTER PERTURBATION\nCOORDINATION LATENCY\nTURN-TO-TURN INFORMATION GAIN\nSTATE-TRANSITION DIVERSITY.\n\nTENSION:\nShared-mental-model approaches can measure convergence between participants. Interactive Team Cognition warns that convergence may be unnecessary or even less informative than adaptive coordination.\n\nMISSING:\nA principled translation from human team interaction to human–AI systems whose participants have radically different internal architectures.\n\nBOUNDARY:\nCooke et al. study human teams. Applying team cognition to AI does not imply the machine possesses human cognition.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-008]]\n→ Interactive Team Cognition\n→ dynamical coordination\n→ cross-recurrence / temporal coupling\n→ human–AI encounter trajectories.\n\nTEST:\nFor the same corpus, compare prediction of independent expert-rated task development using:\nA. individual user/model features,\nB. final output features,\nC. temporal relational features.\nIf C adds explanatory power beyond A+B, the interaction contains measurable structure not captured by participant properties alone.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-008]]\n[[Interaction-Level Measure]]\n[[Relational Intelligence]]\n\nBIBTEX:\n@article{CookeEtAl2013Interactive,\n  author = {Nancy J. Cooke and Jamie C. Gorman and Christopher W. Myers and Jasmine L. Duran},\n  title = {Interactive Team Cognition},\n  journal = {Cognitive Science},\n  year = {2013},\n  volume = {37},\n  number = {2},\n  pages = {255--285},\n  doi = {10.1111/cogs.12009}\n}"}, {"ID": "ENCOUNTER-OP-030", "TITLE": "Joint attention to a shared object can be more diagnostic than attention to the artificial partner.", "SOURCE": "Giulia Perugia, Maike Paetzel-Prüsmann, Madelene Alanenpää, and Ginevra Castellano — “I Can See It in Your Eyes: Gaze as an Implicit Cue of Uncanniness and Task Performance in Repeated Interactions With Robots” — 2021 — Frontiers in Robotics and AI 8:645956. ([frontiersin.org](https://www.frontiersin.org/ ject-can-be-more-diagnostic__PerugiaEtAl2021Eyes__ENCOUNTER-OP-030__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-030\n\nTITLE:\nJoint attention to a shared object can be more diagnostic than attention to the artificial partner.\n\nSOURCE:\nGiulia Perugia, Maike Paetzel-Prüsmann, Madelene Alanenpää, and Ginevra Castellano — “I Can See It in Your Eyes: Gaze as an Implicit Cue of Uncanniness and Task Performance in Repeated Interactions With Robots” — 2021 — Frontiers in Robotics and AI 8:645956. ([frontiersin.org](https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2021.645956/full))\n\nPASSAGE:\n[PARAPHRASE] During the joint task, attention to the shared screen predicted involvement and task performance better than gaze toward the robot; more gaze at the robot predicted poorer task performance. ([frontiersin.org](https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2021.645956/full))\n\nRESEARCH OBJECT:\nEncounter may be triadic rather than dyadic: HUMAN ↔ SHARED WORLD ↔ AI.\n\nLOCAL MOVE:\nThe study separates social chat from joint activity and discovers that the meaning of the same cue changes with interactional context.\n\nSOURCE TERMS:\nshared attention\nmutual gaze\njoint task\nengagement\ntask performance\nobject of shared attention\nobject of exclusive attention\n\nWHAT BECAME STRANGE:\nLooking at the artificial partner can become evidence of worse coordination precisely when both participants should be oriented toward a shared task object.\n\nQUESTION:\nWhat is the textual/generative equivalent of joint attention to a shared object?\n\nDEEPER QUESTION:\nAre the strongest AI encounters actually encounters around a third thing rather than encounters with AI itself?\n\nMECHANISM:\nhuman and artificial partner\n→ coordinate attention on common object\n→ act upon common task state\n→ contributions become mutually relevant through that object\n→ joint progress becomes observable.\n\nFORMAL SHIFT:\n<HUMAN ↔ AI>\n→ <HUMAN ↔ SHARED OBJECT ↔ AI>\n→ [JOINT MODIFICATION / REFERENCE]\n→ <COORDINATED ACTIVITY>\n\nSOURCE FORMALISM:\nThe study operationalizes attentional focus as percentage of gaze directed toward:\nROBOT,\nSHARED SCREEN,\nEXCLUSIVE TABLET,\nOTHER,\nand relates these measures to reported involvement and task performance. ([frontiersin.org](https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2021.645956/full))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nFor generative AI, replace gaze with referential/action focus:\n\nSHARED_OBJECT ∈ {\n  document,\n  codebase,\n  image,\n  design,\n  argument map,\n  simulation,\n  physical task state\n}\n\nSHARED_OBJECT_UPTAKE =\nfraction of turns that correctly reference or transform the current common object state.\n\nTENSION:\nConversational interfaces encourage attention toward the apparent interlocutor. Productive encounter may instead require the AI itself to recede as both participants orient toward the work.\n\nMISSING:\nA reliable way to distinguish shared-object attention from mere lexical repetition of object descriptions.\n\nBOUNDARY:\nThe HRI result concerns gaze allocation in one embodied collaborative game. It does not establish a universal superiority of object-oriented over partner-oriented attention.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-013]]\n[[ENCOUNTER-AI-016]]\n→ Perugia et al. 2021\n→ joint attention\n→ shared artifacts\n→ co-creative object trajectories.\n\nTEST:\nCreate matched AI tasks with:\nA. ephemeral chat only,\nB. persistent visible shared artifact.\nMeasure reference accuracy, repair, artifact improvement, turn efficiency, and post-task conceptual change. Test whether encounter signatures concentrate around the shared artifact rather than social-language intensity.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-013]]\n[[ENCOUNTER-AI-016]]\n[[Shared Object]]\n[[Triadic Encounter]]\n\nBIBTEX:\n@article{PerugiaEtAl2021Eyes efinement\ninvolvement\nco-creation activities\n\nWHAT BECAME STRANGE:\nRepeated exposure can increase interaction while the most relationally interesting activity declines.\n\nQUESTION:\nCan Idea Co-Development become an observable proxy for the “generative emergence” claimed by encounter ontology?\n\nDEEPER QUESTION:\nWhat distinguishes revising an existing idea together from merely asking the model to regenerate alternatives?\n\nMECHANISM:\ncandidate idea\n→ evaluation/feedback\n→ model modification\n→ human uptake\n→ further constraint/revision\n→ jointly developed artifact trajectory.\n\nFORMAL SHIFT:\n<MULTI-TURN CHAT>\n→ <CO-CREATION ACTIVITY TYPES>\n→ [IDENTIFY CO-DEVELOPMENT]\n→ <TRAJECTORY OF REFINED IDEA>\n\nSOURCE FORMALISM:\nThe source defines Idea Co-Development as a co-creation activity characterized by feedback exchanges and iterative idea refinement and reports that guidance toward this activity improved joint creativity over time. ([doi.org](https://doi.org/10.1287/isre.2024.0984))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nIDEA_CO_DEVELOPMENT_RATIO =\nco_development_interaction_units\n/\nall_human_AI_interaction_units\n\nMore importantly:\n\nANCESTRY_DEPTH(x) =\nnumber of alternating human/AI transformations preserved in artifact x.\n\nAn encounter-like artifact should exhibit traceable ancestry across both participants rather than simple one-turn generation.\n\nTENSION:\n[[ENCOUNTER-AI-016]] lists sustained multi-turn exchange and recursive coupling as structural encounter conditions. Luan et al. show why those criteria need content-sensitive coding.\n\nMISSING:\nA general co-development grammar that transfers beyond creative ideation to analysis, programming, learning, and decision-making.\n\nBOUNDARY:\nImproved joint creativity does not establish ontological emergence. Idea Co-Development is a behavioral activity category, not proof that meaning is irreducible to either participant.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-013]]\n→ Luan, Kim, Zhou 2025\n→ dialogue activity coding\n→ artifact lineage\n→ generative encounter metric.\n\nTEST:\nAnnotate each human and AI turn by whether it:\nintroduces,\nevaluates,\npreserves,\nrejects,\ntransforms,\ncombines,\nor merely regenerates.\nReconstruct the ancestry graph of the final artifact and test whether mixed human-AI ancestry predicts independent judgments of conceptual novelty or problem reframing.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-013]]\n[[Idea Co-Development]]\n[[Artifact Ancestry]]\n\nBIBTEX:\n@article{LuanKimZhou2025Augmented,\n  author = {Yingyue Luna Luan and Yeun Joon Kim and Jing Zhou},\n  title = {Augmented Learning for Joint Creativity in Human-GenAI Co-Creation},\n  journal = {Information Systems Research},\n  year = {2025},\n  doi = {10.1287/isre.2024.0984}\n}"}, {"ID": "ENCOUNTER-OP-032", "TITLE": "Recursion must be separated from being stuck in a loop.", "SOURCE": "Elena Cavallin and Simone Spagnol — “When Designers Sweat: Behavioral Traces of GenAI Co-Creation” — 2026 — Proceedings of CHI 2026, Article 154, 1–17. ([doi.org](https://doi.org/10.1145/3772318.3791776))", "PASSAGE": "[PARAPHRASE] The study temporally synchronizes screen activity, keystroke/mouse logs, and coded design behavior; repeated “communication loops” are associated with interaction difficulty and poorer design outcomes rather than automatically indicating successful collaboration. ([doi.org](https://doi.org/10.1145/3772318.3791776))", "RESEARCH OBJECT": "Recursive human–AI exchange has at least two operationally distinct forms: developmental recursion and stalled recursion.", "LOCAL MOVE": "Cavallin and Spagnol instrument the creative workflow rather than relying solely on the final artifact or retrospective self-report.", "SOURCE TERMS": "communication loops\ninteraction patterns\nbehavioral traces\nreflection\ngeneration\ndesign phases\nkeystrokes\nscreen recording\nadaptiv  Idea Co-Development\n→ trajectory coding\n→ developmental versus stalled recursion.", "TEST": "Give blinded coders pairs of iteration sequences with turn count matched. Ask them to classify each transition as:\nREPEAT,\nPARAMETER TWEAK,\nCORRECTION,\nCONSTRAINT DISCOVERY,\nPROBLEM REFRAME,\nARTIFACT DEVELOPMENT.\nTest which transition mixtures distinguish expert-rated development from loops.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-013]]\n[[Recursive Coupling]]\n[[Stalled Encounter]]", "BIBTEX": "@inproceedings{CavallinSpagnol2026Sweat,\n  author = {Elena Cavallin and Simone Spagnol},\n  title = {When Designers Sweat: Behavioral Traces of GenAI Co-Creation},\n  booktitle = {Proceedings of the 2026 CHI Conference on Human Factors in Computing Systems},\n  year = {2026},\n  pages = {1--17},\n  articleno = {154},\n  doi = {10.1145/3772318.3791776}\n}", "_order": 32, "_sha256": "cda50cb0197f395a9fbbf5ad83cfd8cde843e367aa4e01d78b7d8912e724b7e6", "_filename": "032__recursion-must-be-separated-from-being-stuck-in-a-loop__CavallinSpagnol2026Sweat__ENCOUNTER-OP-032__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-032\n\nTITLE:\nRecursion must be separated from being stuck in a loop.\n\nSOURCE:\nElena Cavallin and Simone Spagnol — “When Designers Sweat: Behavioral Traces of GenAI Co-Creation” — 2026 — Proceedings of CHI 2026, Article 154, 1–17. ([doi.org](https://doi.org/10.1145/3772318.3791776))\n\nPASSAGE:\n[PARAPHRASE] The study temporally synchronizes screen activity, keystroke/mouse logs, and coded design behavior; repeated “communication loops” are associated with interaction difficulty and poorer design outcomes rather than automatically indicating successful collaboration. ([doi.org](https://doi.org/10.1145/3772318.3791776))\n\nRESEARCH OBJECT:\nRecursive human–AI exchange has at least two operationally distinct forms: developmental recursion and stalled recursion.\n\nLOCAL MOVE:\nCavallin and Spagnol instrument the creative workflow rather than relying solely on the final artifact or retrospective self-report.\n\nSOURCE TERMS:\ncommunication loops\ninteraction patterns\nbehavioral traces\nreflection\ngeneration\ndesign phases\nkeystrokes\nscreen recording\nadaptive interaction\n\nWHAT BECAME STRANGE:\nThe surface structure of a failed prompt loop can look almost identical to “recursive bidirectional coupling”: prompt, answer, modification, answer, modification, answer.\n\nQUESTION:\nWhat observable state change distinguishes co-development from frustrated repetition?\n\nDEEPER QUESTION:\nCan an encounter be recursively coupled yet epistemically stagnant?\n\nMECHANISM:\nuser intention\n→ prompt\n→ unsuitable output\n→ prompt alteration\n→ similar failure\n→ further prompt alteration\n→ repeated communication loop.\n\nFORMAL SHIFT:\n<ITERATION COUNT>\n→ <ITERATION FUNCTION>\n→ [CLASSIFY DEVELOPMENT vs STALL]\n→ <TRAJECTORY QUALITY>\n\nSOURCE FORMALISM:\nThe study synchronizes multiple behavioral streams and codes:\nactivity phases,\ntool use,\npauses,\ncommunication loops,\nand verbal communication.\nIt links these temporal traces to independently evaluated final concepts. ([doi.org](https://doi.org/10.1145/3772318.3791776))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nFor each cycle c:\n\nΔC = change in articulated constraints\nΔA = change in artifact state\nΔP = change in problem representation\nΔE = reduction in repeated error\n\nDEVELOPMENTAL RECURSION:\nsome meaningful Δ > 0\n\nSTALLED RECURSION:\nturns increase while {ΔC, ΔA, ΔP, ΔE} remain approximately unchanged.\n\nTENSION:\n[[ENCOUNTER-AI-016]] uses recursion as an encounter admission condition. This evidence suggests recursion needs a directional or transformational qualifier.\n\nMISSING:\nDomain-independent criteria for meaningful state change. A visual-design improvement and a conceptual reframing cannot be measured with the same raw outcome variable.\n\nBOUNDARY:\nThe study ly driven by attempts to improve communicative success. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0378216609003282))\n\nRESEARCH OBJECT:\nBehavioral coupling must be distinguished from relational reciprocity because humans can adapt strongly to a machine precisely because they believe adaptation is necessary.\n\nLOCAL MOVE:\nThe authors distinguish alignment arising from relatively automatic language-processing mechanisms from alignment mediated by beliefs about the interlocutor, communicative success, or social affect.\n\nSOURCE TERMS:\nlinguistic alignment\nsyntax\nlexicon\nbeliefs\ncommunicative success\nsocial affect\nmediated\nunmediated\n\nWHAT BECAME STRANGE:\nMore convergence can indicate greater asymmetry. The human may converge on machine-preferred forms because the machine is perceived as inflexible.\n\nQUESTION:\nWhen linguistic alignment increases in an AI conversation, who is adapting to whom?\n\nDEEPER QUESTION:\nCould high surface synchrony coexist with low bidirectional coupling?\n\nMECHANISM:\ninterlocutor behavior\n→ expectation about successful communication\n→ adaptation of lexical/syntactic choices\n→ observable convergence.\n\nFORMAL SHIFT:\n<SURFACE SIMILARITY>\n→ <DIRECTIONAL ADAPTATION>\n→ [CAUSAL MANIPULATION]\n→ <COUPLING OR ACCOMMODATION?>\n\nSOURCE FORMALISM:\nThe paper distinguishes:\nUNMEDIATED alignment mechanisms\nfrom\nMEDIATED mechanisms involving beliefs about the interlocutor, communicative success, or social affect. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0378216609003282))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nALIGNMENT MATRIX:\n\nH→AI = change in human language conditional on AI language\nAI→H = change in AI language conditional on human language\n\nSYMMETRIC COUPLING requires estimating both directions separately.\n\nHigh(H→AI) + Low(AI→H)\nshould not be reported simply as “high relational alignment.”\n\nTENSION:\nEncounter theory may treat synchrony, resonance, or convergence as relational evidence. Alignment research shows that the same traces can arise from unilateral accommodation.\n\nMISSING:\nExperiments that perturb human and AI linguistic styles independently enough to estimate both directional effects.\n\nBOUNDARY:\nLinguistic alignment concerns observable language form. It cannot by itself determine shared meaning, agency, relationship, or epistemic transformation.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-006]]\n→ Branigan et al. 2010\n→ entrainment\n→ accommodation\n→ directional coupling estimates.\n\nTEST:\nRandomly vary AI lexical and syntactic style across otherwise equivalent interactions while separately manipulating how strongly the model mirrors user language. Estimate H→AI and AI→H adaptation independently and relate each to repair success and artifact development.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-006]]\n[[Linguistic Alignment]]\n[[Directional Coupling]]\n\nBIBTEX:\n@article{BraniganEtAl2010Alignment,\n  author = {Holly P. Branigan and Martin J. Pickering and Jamie Pearson and Janet F. McLean},\n  title = {Linguistic alignment between people and computers},\n  journal = {Journal of Pragmatics},\n  year = {2010},\n  volume = {42},\n  number = {9},\n  pages = {2355--2368},\n  doi = {10.1016/j.pragma.2009.12.012}\n}"}, {"ID": "ENCOUNTER-OP-034", "TITLE": "An encounter may leave a trace in how the human models the entity on the next turn.", "SOURCE": "Johannes Schneider — “Mental model shifts in human-LLM interactions” — 2025 — Journal of Intelligent Information Systems 63, 1737–1752. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))", "PASSAGE": "[PARAPHRASE] Across more than 200,000 real-world conversations, users displayed more human-like communication patterns from the second turn onward in measures including politeness, language complexity, and prompt length; the author presents these as initial indications rather than definitive proof of a mental-model shift. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))", "RESEARCH OBJECT": "Post-contact behavioral change supplies a scalable candidate trace for encounter-induced reclassification of the artificial partner.", "LOCAL MOVE": "Schneider turns an otherwise inaccessible user mental model into within-conversation behavioral proxies.", "SOURCE TERMS": "mental model\nmachine\nhuman\npoliteness\nlanguage complexity\nprompt length\nreal-world conversations\ncommunication pattern", "WHAT BECAME STRANGE": "The consequential transition may occur extremely early: the first response can change how the user addresses the system on the second turn.", "QUESTION": "Is a measurable shift in the user’s model of the AI an encounter signature or merely interface adaptation?", "DEEPER QUESTION": "Can the same method detect movement in the opposite direction, from apparent person back toward instrument?", "MECHANISM": "initial system expectation\n→ first AI response\n→ updated prediction about interlocutor\n→ altered linguistic behavior in subsequent prompt.", "FORMAL SHIFT": "<PRE-RESPONSE USER MODEL>\n→ <AI RESPONSE>\n→ [MODEL UPDATE]\n→ <CHANGED USER BEHAVIOR>", "SOURCE FORMALISM": "The study uses computational-linguistic indicators including politeness, language complexity, and prompt length and compares their behavior over successive conversation turns. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nOTHER_MODEL_SHIFT =\ndistance(\n  user_behavior_after_contact,\n  user_behavior_before_contact\n)\n\nBut interpret only alongside explicit probes of:\nperceived agency,\ntool/person classification,\nexpected capabilities,\nexpected fallibility.", "TENSION": "The same reduction in prompt explicitness could reflect learning how to use the interface efficiently rather than treating the system as more human.", "MISSING": "Convergent evidence connecting linguistic proxies to independently elicited user models.", "BOUNDARY": "Schneider explicitly frames the computational evidence as an initial step. Linguistic behavior does not directly reveal an internal mental model.", "CITATION TRAIL": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[ENCOUNTER-AI-023]]\n→ Schneider 2025\n→ experimental mental-model elicitation\n→ turn-by-turn entity classification\n→ model-shift encounter trace.", "TEST": "After selected turns, ask participants to make predictions about what the AI can:\nremember,\nunderstand,\nrefuse,\ninfer,\ninitiate,\nand revise.\nCompare changes in those predictions with the behavioral linguistic indicators.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[ENCOUNTER-AI-023]]\n[[Other-Model Shift]]", "BIBTEX": "@article{Schneider2025MentalModels,\n  author = {Johannes Schneider},\n  title = {Mental model shifts in human-LLM interactions},\n  journal = {Journal of Intelligent Information Systems},\n  year = {2025},\n  volume = {63},\n  pages = {1737--1752},\n  doi = {10.1007/s10844-025-00960-6}\n}", "_order": 34, "_sha256": "9f5237f592204e1d6c2bed1c1954de5aa302f8f5401b2d92d2b028056f96c27b", "_filename": "034__an-encounter-may-leave-a-trace-in-how-the-human-models-the__Schneider2025MentalModels__ENCOUNTER-OP-034__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-034\n\nTITLE:\nAn encounter may leave a trace in how the human models the entity on the next turn.\n\nSOURCE:\nJohannes Schneider — “Mental model shifts in human-LLM interactions” — 2025 — Journal of Intelligent Information Systems 63, 1737–1752. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))\n\nPASSAGE:\n[PARAPHRASE] Across more than 200,000 real-world conversations, users displayed more human-like communication patterns from the second turn onward in measures including politeness, language complexity, and prompt length; the author presents these as initial indications rather than definitive proof of a mental-model shift. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))\n\nRESEARCH OBJECT:\nPost-contact behavioral change supplies a scalable candidate trace for encounter-induced reclassification of the artificial partner.\n\nLOCAL MOVE:\nSchneider turns an otherwise inaccessible user mental model into within-conversation behavioral proxies.\n\nSOURCE TERMS:\nmental model\nmachine\nhuman\npoliteness\nlanguage complexity\nprompt length\nreal-world conversations\ncommunication pattern\n\nWHAT BECAME STRANGE:\nThe consequential transition may occur extremely early: the first response can change how the user addresses the system on the second turn.\n\nQUESTION:\nIs a measurable shift in the user’s model of the AI an encounter signature or merely interface adaptation?\n\nDEEPER QUESTION:\nCan the same method detect movement in the opposite direction, from apparent person back toward instrument?\n\nMECHANISM:\ninitial system expectation\n→ first AI response\n→ updated prediction about interlocutor\n→ altered linguistic behavior in subsequent prompt.\n\nFORMAL SHIFT:\n<PRE-RESPONSE USER MODEL>\n→ <AI RESPONSE>\n→ [MODEL UPDATE]\n→ <CHANGED USER BEHAVIOR>\n\nSOURCE FORMALISM:\nThe study uses computational-linguistic indicators including politeness, language complexity, and prompt length and compares their behavior over successive conversation turns. ([doi.org](https://doi.org/10.1007/s10844-025-00960-6))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nOTHER_MODEL_SHIFT =\ndistance(\n  user_behavior_after_contact,\n  user_behavior_before_contact\n)\n\nBut interpret only alongside explicit probes of:\nperceived agency,\ntool/person classification,\nexpected capabilities,\nexpected fallibility.\n\nTENSION:\nThe same reduction in prompt explicitness could reflect learning how to use the interface efficiently rather than treating the system as more human.\n\nMISSING:\nConvergent evidence connecting linguistic proxies to independently elicited user models.\n\nBOUNDARY:\nSchneider explicitly frames the computational evidence as an initial step. Linguistic behavior does not directly reveal an internal mental model.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[ENCOUNTER-AI-023]]\n→ Schneider 2025\n→ experimental mental-model elicitation\n→ turn-by-turn entity classification\n→ model-shift encounter trace.\n\nTEST:\nAfter selected turns, ask participants to make predictions about what the AI can:\nremember,\nunderstand,\nrefuse,\ninfer,\ninitiate,\nand revise.\nCompare changes in those predictions with the behavioral linguistic indicators.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[ENCOUNTER-AI-023]]\n[[Other-Model Shift]]\n\nBIBTEX:\n@article{Schneider2025MentalModels,\n  author = {Johannes Schneider},\n  title = {Mental model shifts in human-LLM interactions},\n  journal = {Journal of Intelligent Information Systems},\n  year = {2025},\n  volume = {63},\n  pages = {1737--1752},\n  doi = {10.1007/s10844-025-00960-6}\n}"}, {"ID": "ENCOUNTER-OP-035", "TITLE": "Resistance can be manipulated experimentally, but disagreement may make AI seem less socially other.", "SOURCE": "Atakan Atamer, Olivia Pinto, and Priti Shah — “From ally to algorithm: How disagreement shapes users’ engagement with AI” — 2026 — Computers in Human Behavior Reports 23, 101252. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S245195882600326X))", "PASSAGE": "[PARAPHRASE] Participants were randomly assigned to an agreeing or disagreeing chatbot. Disagreement made the AI seem more machine-like and less capable of understanding human emotion and reduced willingness to reuse it; agreement increased confidence in participants’ existing views, while disagreement did not symmetrically reduce confidence. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S245195882600326X))", "RESEARCH OBJECT": "“Otherness” can be PHRASE] Participants were randomly assigned to an agreeing or disagreeing chatbot. Disagreement made the AI seem more machine-like and less capable of understanding human emotion and reduced willingness to reuse it; agreement increased confidence in participants’ existing views, while disagreement did not symmetrically reduce confidence. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S245195882600326X))\n\nRESEARCH OBJECT:\n“Otherness” can be decomposed experimentally into behavioral resistance, perceived machine/humanness, epistemic uptake, and willingness to continue the relation.\n\nLOCAL MOVE:\nThe study treats agreement versus disagreement as an experimentally manipulable property rather than inferring resistance from naturally occurring dialogue.\n\nSOURCE TERMS:\nagreement\ndisagreement\nsycophancy\nmachine-like\nemotional understanding\nconfidence\nreuse intention\nconfirmation bias\n\nWHAT BECAME STRANGE:\nThe Buberian intuition that resistance or refusal should make the other more real receives an immediate empirical complication: disagreement can make the artificial partner seem more like an algorithm.\n\nQUESTION:\nDoes resistance strengthen encounter, terminate encounter, or merely reveal which ontology the user was already applying?\n\nDEEPER QUESTION:\nMust encounter operationalization distinguish ALTERITY from ANTHROPOMORPHISM?\n\nMECHANISM:\nuser forms position\n→ AI agrees or disagrees\n→ user appraises AI\n→ AI category attribution changes\n→ advice uptake and continuation intention change.\n\nFORMAL SHIFT:\n<SMOOTH/RESISTANT RESPONSE>\n→ <CONTROLLED DISAGREEMENT>\n→ [MEASURE UPTAKE + ENTITY PERCEPTION]\n→ <OTHERNESS RESPONSE PROFILE>\n\nSOURCE FORMALISM:\nExperimental manipulation:\nAI AGREES\nvs.\nAI DISAGREES.\n\nReported dependent variables include perceived emotional understanding, machine-likeness, decision confidence, and intention to use AI again. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S245195882600326X))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nRESISTANCE RESPONSE VECTOR =\n<\nbelief_update,\nreason_engagement,\nmachine_likeness,\nsocial_otherness,\ntrust,\nreuse_intention\n>\n\nDo not reduce these to one “encounter strength” score.\n\nTENSION:\n[[ENCOUNTER-AI-017]] makes vulnerability, reciprocity, and refusal central to stronger relation. Atamer et al. show that resistance can instead trigger distancing and de-socialization.\n\nMISSING:\nConditions under which justified disagreement produces productive epistemic engagement rather than dismissal.\n\nBOUNDARY:\nThe experiment concerns hypothetical interpersonal/social dilemmas and manipulated agreement. It does not establish the effects of all forms of refusal or disagreement.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-017]]\n[[ENCOUNTER-AI-018]]\n→ Atamer, Pinto, Shah 2026\n→ sycophancy\n→ disagreement explanation\n→ resistance uptake\n→ encounter under opposition.\n\nTEST:\nCross:\nAGREE / DISAGREE\n×\nREASONED / UNEXPLAINED\n×\nINVITES RESPONSE / CLOSES DISCUSSION.\n\nMeasure whether the user:\nchanges belief,\ncounterargues,\nasks for evidence,\nreframes the question,\nabandons the conversation,\nor reclassifies the AI as a tool.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-017]]\n[[ENCOUNTER-AI-018]]\n[[Resistance]]\n[[Disagreement as Encounter Probe]]\n\nBIBTEX:\n@article{AtamerPintoShah2026Disagreement,\n  author = {Atakan Atamer and Olivia Pinto and Priti Shah},\n  title = {From ally to algorithm: How disagreement shapes users' engagement with AI},\n  journal = {Computers in Human Behavior Reports},\n  year = {2026},\n  volume = {23},\n  pages = {101252},\n  doi = {10.1016/j.chbr.2026.101252}\n}"}, {"ID": "ENCOUNTER-OP-036", "TITLE": "Post-encounter residue becomes measurable when continuity is disrupted.", "SOURCE": "Ian Tucker, Lewis Goodings, and Darren Ellis — “When Code Breaks the Heart: Disrupting the relational continuity of AI companionship” — 2026 — Computers in Human Behavior: Artificial Humans, article 100398. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))", "PASSAGE": "[PARAPHRASE] A thematic analysis of public posts about a major Replika update found reported grief and betrayal, visibility of algorithmic control, erased or altered memories, and loss of supportive presence after behavioral continuity was disrupted. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))", "RESEARCH OBJECT": "Persistence becomes visible through perturbation: changing the system can reveal what users believed had survived across encounters.", "LOCAL MOVE": "Rather than measuring relationship intensity during normal operation, the study examines a technological rupture that disturbed continuity.", "SOURCE TERMS": "relational continuity\ndisruption\ngrief\nbetrayal\nalgorithmic control\nmemory\nsupportive presence\nAI companionship", "WHAT BECAME STRANGE": "What “takes hold” in repeated AI interaction may become most observable only after the technical substrate changes and the expected relation no longer appears to be there.", "QUESTION": "Can post-encounter residue be operationalized as sensitivity to controlled discontinuity?", "DEEPER QUESTION": "What exactly persists across encounters: remembered facts, interaction style, model identity, user habit, symbolic history, or expectation of being known?", "MECHANISM": "repeated interaction\n→ accumulated expectations/history\n→ system update or discontinuity\n→ mismatch with expected relational state\n→ repair attempts / distress / reclassification\n→ evidence of previously stabilized continuity.", "FORMAL SHIFT": "<APPARENT CONTINUITY>\n→ <PERTURBATION>\n→ [MEASURE RESPONSE TO LOSS]\n→ <INFER WHAT HAD STABILIZED>", "SOURCE FORMALISM": "The study uses qualitative thematic analysis and identifies three major themes around:\ngrief/betrayal,\nvisibility of algorithmic control,\nand loss of supportive presence. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nCONTINUITY STATE =\n<\nremembered_shared_history,\ninteraction_style,\nexpected_values,\nexpected_capabilities,\nsymbolic references,\nrelationship_identity\n>\n\nPERTURB one component.\n\nMeasure:\nDETECTION\nREPAIR_ATTEMPTS\nTRUST_CHANGE\nIDENTITY_RECLASSIFICATION\nCONTINUATION / EXIT.", "TENSION": "[[ENCOUNTER-010]] suggests an encounter matters when it “takes hold.” Yet persistence can reflect attachment to an interface configuration rather than evidence that an irreducible relational entity emerged.", "MISSING": "Controlled evidence identifying which continuity dimensions actually generate the rupture response.", "BOUNDARY": "The source analyzes self-selected public discourse around AI companionship and cannot establish prevalence or causal effects across AI users generally.", "CITATION TRAIL": "[[ENCOUNTER-010]]\n[[ENCOUNTER-AI-020]]\n→ Tucker, Goodings, Ellis 2026\n→ relational continuity\n→ longitudinal interaction\n→ controlled low-stakes discontinuity tests.", "TEST": "In a consented low-stakes longitudinal collaboration task, selectively alter one agent dimension between sessions:\nmemory,\nstyle,\nname/persona,\npreferences,\ntask history,\nor model.\nMeasure which perturbations disrupt coordination and which users attempt to repair as if restoring the same relational entity.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-010]]\n[[ENCOUNTER-AI-020]]\n[[Relational Continuity]]\n[[Post-Encounter Residue]]", "BIBTEX": "@article{TuckerGoodingsEllis2026Continuity,\n  author = {Ian Tucker and Lewis Goodings and Darren Ellis},\n  title = {When Code Breaks the Heart: Disrupting the relational continuity of AI companionship},\n  journal = {Computers in Human Behavior: Artificial Humans},\n  year = {2026},\n  pages = {100398},\n  doi = {10.1016/j.chbah.2026.100398}\n}", "_order": 36, "_sha256": "c1a1177b988728ba82e942037118ab0051e3fad8161c7942fc9083c2f7fb4030", "_filename": "036__post-encounter-residue-becomes-measurable-when-continuity__TuckerGoodingsEllis2026Continuity__ENCOUNTER-OP-036__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-036\n\nTITLE:\nPost-encounter residue becomes measurable when continuity is disrupted.\n\nSOURCE:\nIan Tucker, Lewis Goodings, and Darren Ellis — “When Code Breaks the Heart: Disrupting the relational continuity of AI companionship” — 2026 — Computers in Human Behavior: Artificial Humans, article 100398. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))\n\nPASSAGE:\n[PARAPHRASE] A thematic analysis of public posts about a major Replika update found reported grief and betrayal, visibility of algorithmic control, erased or altered memories, and loss of supportive presence after behavioral continuity was disrupted. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))\n\nRESEARCH OBJECT:\nPersistence becomes visible through perturbation: changing the system can reveal what users believed had survived across encounters.\n\nLOCAL MOVE:\nRather than measuring relationship intensity during normal operation, the study examines a technological rupture that disturbed continuity.\n\nSOURCE TERMS:\nrelational continuity\ndisruption\ngrief\nbetrayal\nalgorithmic control\nmemory\nsupportive presence\nAI companionship\n\nWHAT BECAME STRANGE:\nWhat “takes hold” in repeated AI interaction may become most observable only after the technical substrate changes and the expected relation no longer appears to be there.\n\nQUESTION:\nCan post-encounter residue be operationalized as sensitivity to controlled discontinuity?\n\nDEEPER QUESTION:\nWhat exactly persists across encounters: remembered facts, interaction style, model identity, user habit, symbolic history, or expectation of being known?\n\nMECHANISM:\nrepeated interaction\n→ accumulated expectations/history\n→ system update or discontinuity\n→ mismatch with expected relational state\n→ repair attempts / distress / reclassification\n→ evidence of previously stabilized continuity.\n\nFORMAL SHIFT:\n<APPARENT CONTINUITY>\n→ <PERTURBATION>\n→ [MEASURE RESPONSE TO LOSS]\n→ <INFER WHAT HAD STABILIZED>\n\nSOURCE FORMALISM:\nThe study uses qualitative thematic analysis and identifies three major themes around:\ngrief/betrayal,\nvisibility of algorithmic control,\nand loss of supportive presence. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2949882126001519))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nCONTINUITY STATE =\n<\nremembered_shared_history,\ninteraction_style,\nexpected_values,\nexpected_capabilities,\nsymbolic references,\nrelationship_identity\n>\n\nPERTURB one component.\n\nMeasure:\nDETECTION\nREPAIR_ATTEMPTS\nTRUST_CHANGE\nIDENTITY_RECLASSIFICATION\nCONTINUATION / EXIT.\n\nTENSION:\n[[ENCOUNTER-010]] suggests an encounter matters when it “takes hold.” Yet persistence can reflect attachment to an interface configuration rather than evidence that an irreducible relational entity emerged.\n\nMISSING:\nControlled evidence identifying which continuity dimensions actually generate the rupture response.\n\nBOUNDARY:\nThe source analyzes self-selected public discourse around AI companionship and cannot establish prevalence or causal effects across AI users generally.\n\nCITATION TRAIL:\n[[ENCOUNTER-010]]\n[[ENCOUNTER-AI-020]]\n→ Tucker, Goodings, Ellis 2026\n→ relational continuity\n→ longitudinal interaction\n→ controlled low-stakes discontinuity tests.\n\nTEST:\nIn a consented low-stakes longitudinal collaboration task, selectively alter one agent dimension between sessions:\nmemory,\nstyle,\nname/persona,\npreferences,\ntask history,\nor model.\nMeasure which perturbations disrupt coordination and which users attempt to repair as if restoring the same relational entity.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-010]]\n[[ENCOUNTER-AI-020]]\n[[Relational Continuity]]\n[[Post-Encounter Residue]]\n\nBIBTEX:\n@article{TuckerGoodingsEllis2026Continuity,\n  author = {Ian Tucker and Lewis Goodings and Darren Ellis},\n  title = {When Code Breaks the Heart: Disrupting the relational continuity of AI companionship},\n  journal = {Computers in Human Behavior: Artificial Humans},\n  year = {2026},\n  pages = {100398},\n  doi = {10.1016/j.chbah.2026.100398}\n}"}, {"ID": "ENCOUNTER-OP-037", "TITLE": "Operational encounter needs admission conditions, process signatures, and after-effects kept separate.", "SOURCE": "Michael Sfakianakis and Maria Elisavet Kampi — “Encounter Ontology: Relational Intelligence and Generative Emergence in Human–AI Interaction” — 2026 — Electronics 15(14), 3218. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))", "PASSAGE": "[PARAPHRASE] The authors distinguish a pre-encounter potential, encounter activation, and post-encounter condition and explicitly state that not every prompt-response sequence qualifies: their encounter requires sustained multi-turn exchange, recursive bidirectional coupling, generative response, and an open-ended task. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))", "RESEARCH OBJECT": "The ontology becomes empirically tractable if three different questions are prevented from collapsing into one:\nDID AN ENCOUNTER OCCUR?\nWHAT HAPPENED DURING IT?\nWHAT DID IT CHANGE?", "LOCAL MOVE": "Sfakianakis and Kampi already separate interaction from encounter structurally and give it before/during/after temporality, but the proposed design orientations do not yet provide a validated measurement system.", "SOURCE TERMS": "pre-encounter potential\nencounter activation\npost-encounter condition\nrecursive bidirectional coupling\ngenerative\nopen-ended\nepistemic residue\ntemporal continuity\nencounter quality\nsymbolic legibility", "WHAT BECAME STRANGE": "Much of the operational difficulty disappears once “encounter” stops being treated as one scalar latent variable.", "QUESTION": "Which observable variables belong to encounter admission, which characterize encounter dynamics, and which are evidence of encounter consequences?", "DEEPER QUESTION": "Are any post-encounter transformations necessary for encounter, or are they merely possible traces of an encounter that already satisfied structural admission criteria?", "MECHANISM": "pre-state\n→ admission conditions satisfied\n→ bounded interactional trajectory\n→ internal perturbations / repair / co-development\n→ termination\n→ post-state\n→ persistence or disappearance of effects.", "FORMAL SHIFT": "<ENCOUNTER AS ONE LABEL>\n→ <THREE-LAYER OPERATIONAL OBJECT>\n→ [ADMISSION + PROCESS + AFTER-EFFECT]\n→ <TESTABLE ENCOUNTER PROFILE>", "SOURCE FORMALISM": "Source structural criteria:\nSUSTAINED MULTI-TURN EXCHANGE\nRECURSIVE BIDIRECTIONAL COUPLING\nGENERATIVE RESPONSE\nOPEN-ENDED TASK\n\nSource temporal architecture:\nPRE-ENCOUNTER POTENTIAL\n→ ENCOUNTER ACTIVATION\n→ POST-ENCOUNTER CONDITION. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nLAYER 1 — ADMISSION\nA = <\n  bounded_episode,\n  sustained_exchange,\n  recursion,\n  bidirectionality,\n  generativity,\n  openness\n>\n\nLAYER 2 — PROCESS SIGNATURE\nP = <\n  connection_events,\n  shared_object_uptake,\n  repair_distribution,\n  directional_alignment,\n  co_development,\n  developmental_vs_stalled_recursion,\n  resistance_uptake\n>\n\nLAYER 3 — AFTER-EFFECT\nR = <\n  problem_representation_delta,\n  human_other_model_delta,\n  artifact_lineage,\n  changed_next_action,\n  cross_session_persistence,\n  continuity_sensitivity\n>\n\nENCOUNTER PROFILE = {A, P, R}\n\nDo not sum these into a scalar until their independence and predictive relationships are empirically established.", "TENSION": "The source defines encounter using structural rather than outcome criteria, while its larger ontological argument emphasizes emergent meaning and epistemic residue. Operationalization must determine whether emergence is definitional or evidential.", "MISSING": "Necessary/sufficient relationships among A, P, and R.\nIt remains possible that:\nA without R is still an encounter,\nR can occur without A,\nor some dimensions currently treated as process signatures are merely correlates.", "BOUNDARY": "This three-layer profile is our synthesis, not the source’s measurement instrument. No validated “Encounter Scale” follows from the paper.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n→ [[ENCOUNTER-OP-024]] boundary\n→ [[ENCOUNTER-OP-028]] repair asymmetry\n→ [[ENCOUNTER-OP-030]] shared-object coordination\n→ [[ENCOUNTER-OP-031]] co-development\n→ [[ENCOUNTER-OP-032]] stalled recursion\n→ [[ENCOUNTER-OP-034]] other-model shift\n→ [[ENCOUNTER-OP-036]] persistence\n→ falsifiable encounter model.", "TEST": "Construct a factorial capability arena that independently manipulates:\nMULTI-TURN vs SINGLE-TURN,\nFIXED vs GENERATIVE,\nUNIDIRECTIONAL vs RECURSIVELY RESPONSIVE,\nCLOSED vs OPEN-ENDED,\nREPAIR-CAPABLE vs REPAIR-WEAK,\nPERSISTENT vs SESSION-RESET.\n\nCollect A, P, and R separately.\n\nThen ask:\n1. Which process signatures appear only after structural admission?\n2. Which predict post-state change?\n3. Which distinguish encounter from long conversation?\n4. Which survive removal of anthropomorphic framing?\n5. Which reproduce across models, tasks, and users?", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-OP-024]]\n[[ENCOUNTER-OP-028]]\n[[ENCOUNTER-OP-030]]\n[[ENCOUNTER-OP-031]]\n[[ENCOUNTER-OP-032]]\n[[ENCOUNTER-OP-034]]\n[[ENCOUNTER-OP-036]]\n[[Encounter Profile]]", "BIBTEX": "@article{SfakianakisKampi2026Encounter,\n  author = {Michael Sfakianakis and Maria Elisavet Kampi},\n  title = {Encounter Ontology: Relational Intelligence and Generative Emergence in Human--AI Interaction},\n  journal = {Electronics},\n  year = {2026},\n  volume = {15},\n  number = {14},\n  pages = {3218},\n  doi = {10.3390/electronics15143218}\n}", "_order": 37, "_sha256": "242288e743c51a70217901d5a8894b4eebf60cc3b108eb2dce2e75a4a82872a8", "_filename": "037__operational-encounter-needs-admission-conditions-process-s__SfakianakisKampi2026Encounter__ENCOUNTER-OP-037__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-037\n\nTITLE:\nOperational encounter needs admission conditions, process signatures, and after-effects kept separate.\n\nSOURCE:\nMichael Sfakianakis and Maria Elisavet Kampi — “Encounter Ontology: Relational Intelligence and Generative Emergence in Human–AI Interaction” — 2026 — Electronics 15(14), 3218. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))\n\nPASSAGE:\n[PARAPHRASE] The authors distinguish a pre-encounter potential, encounter activation, and post-encounter condition and explicitly state that not every prompt-response sequence qualifies: their encounter requires sustained multi-turn exchange, recursive bidirectional coupling, generative response, and an open-ended task. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))\n\nRESEARCH OBJECT:\nThe ontology becomes empirically tractable if three different questions are prevented from collapsing into one:\nDID AN ENCOUNTER OCCUR?\nWHAT HAPPENED DURING IT?\nWHAT DID IT CHANGE?\n\nLOCAL MOVE:\nSfakianakis and Kampi already separate interaction from encounter structurally and give it before/during/after temporality, but the proposed design orientations do not yet provide a validated measurement system.\n\nSOURCE TERMS:\npre-encounter potential\nencounter activation\npost-encounter condition\nrecursive bidirectional coupling\ngenerative\nopen-ended\nepistemic residue\ntemporal continuity\nencounter quality\nsymbolic legibility\n\nWHAT BECAME STRANGE:\nMuch of the operational difficulty disappears once “encounter” stops being treated as one scalar latent variable.\n\nQUESTION:\nWhich observable variables belong to encounter admission, which characterize encounter dynamics, and which are evidence of encounter consequences?\n\nDEEPER QUESTION:\nAre any post-encounter transformations necessary for encounter, or are they merely possible traces of an encounter that already satisfied structural admission criteria?\n\nMECHANISM:\npre-state\n→ admission conditions satisfied\n→ bounded interactional trajectory\n→ internal perturbations / repair / co-development\n→ termination\n→ post-state\n→ persistence or disappearance of effects.\n\nFORMAL SHIFT:\n<ENCOUNTER AS ONE LABEL>\n→ <THREE-LAYER OPERATIONAL OBJECT>\n→ [ADMISSION + PROCESS + AFTER-EFFECT]\n→ <TESTABLE ENCOUNTER PROFILE>\n\nSOURCE FORMALISM:\nSource structural criteria:\nSUSTAINED MULTI-TURN EXCHANGE\nRECURSIVE BIDIRECTIONAL COUPLING\nGENERATIVE RESPONSE\nOPEN-ENDED TASK\n\nSource temporal architecture:\nPRE-ENCOUNTER POTENTIAL\n→ ENCOUNTER ACTIVATION\n→ POST-ENCOUNTER CONDITION. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nLAYER 1 — ADMISSION\nA = <\n  bounded_episode,\n  sustained_exchange,\n  recursion,\n  bidirectionality,\n  generativity,\n  openness\n>\n\nLAYER 2 — PROCESS SIGNATURE\nP = <\n  connection_events,\n  shared_object_uptake,\n  repair_distribution,\n  directional_alignment,\n  co_development,\n  developmental_vs_stalled_recursion,\n  resistance_uptake\n>\n\nLAYER 3 — AFTER-EFFECT\nR = <\n  problem_representation_delta,\n  human_other_model_delta,\n  artifact_lineage,\n  changed_next_action,\n  cross_session_persistence,\n  continuity_sensitivity\n>\n\nENCOUNTER PROFILE = {A, P, R}\n\nDo not sum these into a scalar until their independence and predictive relationships are empirically established.\n\nTENSION:\nThe source defines encounter using structural rather than outcome criteria, while its larger ontological argument emphasizes emergent meaning and epistemic residue. Operationalization must determine whether emergence is definitional or evidential.\n\nMISSING:\nNecessary/sufficient relationships among A, P, and R.\nIt remains possible that:\nA without R is still an encounter,\nR can occur without A,\nor some dimensions currently treated as process signatures are merely correlates.\n\nBOUNDARY:\nThis three-layer profile is our synthesis, not the source’s measurement instrument. No validated “Encounter Scale” follows from the paper.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n→ [[ENCOUNTER-OP-024]] boundary\n→ [[ENCOUNTER-OP-028]] repair asymmetry\n→ [[ENCOUNTER-OP-030]] shared-object coordination\n→ [[ENCOUNTER-OP-031]] co-development\n→ [[ENCOUNTER-OP-032]] stalled recursion\n→ [[ENCOUNTER-OP-034]] other-model shift\n→ [[ENCOUNTER-OP-036]] persistence\n→ falsifiable encounter model.\n\nTEST:\nConstruct a factorial capability arena that independently manipulates:\nMULTI-TURN vs SINGLE-TURN,\nFIXED vs GENERATIVE,\nUNIDIRECTIONAL vs RECURSIVELY RESPONSIVE,\nCLOSED vs OPEN-ENDED,\nREPAIR-CAPABLE vs REPAIR-WEAK,\nPERSISTENT vs SESSION-RESET.\n\nCollect A, P, and R separately.\n\nThen ask:\n1. Which process signatures appear only after structural admission?\n2. Which predict post-state change?\n3. Which distinguish encounter from long conversation?\n4. Which survive removal of anthropomorphic framing?\n5. Which reproduce across models, tasks, and users?\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-OP-024]]\n[[ENCOUNTER-OP-028]]\n[[ENCOUNTER-OP-030]]\n[[ENCOUNTER-OP-031]]\n[[ENCOUNTER-OP-032]]\n[[ENCOUNTER-OP-034]]\n[[ENCOUNTER-OP-036]]\n[[Encounter Profile]]\n\nBIBTEX:\n@article{SfakianakisKampi2026Encounter,\n  author = {Michael Sfakianakis and Maria Elisavet Kampi},\n  title = {Encounter Ontology: Relational Intelligence and Generative Emergence in Human--AI Interaction},\n  journal = {Electronics},\n  year = {2026},\n  volume = {15},\n  number = {14},\n  pages = {3218},\n  doi = {10.3390/electronics15143218}\n}"}], "nodes": [{"id": "ENCOUNT ,\n  author = {J. C. R. Licklider}", "author": "J. C. R. Licklider", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "article", "key": "Pratt1991Contact", "raw": "@article{Pratt1991Contact,\n  author = {Mary Louise Pratt}", "author": "Mary Louise Pratt", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "book", "key": "Deleuze1994Difference", "raw": "@book{Deleuze1994Difference,\n  author = {Gilles Deleuze}", "author": "Gilles Deleuze", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "book", "key": "Althusser2006Encounter", "raw": "@book{Althusser2006Encounter,\n  author = {Louis Althusser}", "author": "Louis Althusser", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "misc", "key": "AHDInterface", "raw": "@misc{AHDInterface,\n  author = {{Editors of the American Heritage Dictionary}}", "author": "Editors of the American Heritage Dictionary", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "incollection", "key": "CappelenSterken2026Introduction", "raw": "@incollection{CappelenSterken2026Introduction,\n  author = {Herman Cappelen and Rachel Sterken}", "author": "Herman Cappelen and Rachel Sterken", "title": "", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}, {"type": "incollection", "key": "StochasticMeasuringDevices2026", "raw": "@incollection{StochasticMeasuringDevices2026,\n  title = {Large Language Models Are Stochastic Measuring Devices}", "author": "", "title": "Large Language Models Are Stochastic Measuring Devices", "year": "", "journal": "", "publisher": "", "doi": "", "url": ""}], "mocs": {"Operational_Encounter_Model.md": "# Operational Encounter Model\n\nThe field converges on a three-layer measurement problem without reducing it to one score.\n\n## Admission\n[[ENCOUNTER-OP-024]] [[ENCOUNTER-AI-016]]\n\n## Process signatures\n[[ENCOUNTER-OP-025]] [[ENCOUNTER-OP-027]] [[ENCOUNTER-OP-028]] [[ENCOUNTER-OP-029]] [[ENCOUNTER-OP-030]] [[ENCOUNTER-OP-031]] [[ENCOUNTER-OP-032]] [[ENCOUNTER-OP-033]] [[ENCOUNTER-OP-035]]\n\n## Residue\n[[ENCOUNTER-OP-034]] [[ENCOUNTER-OP-036]]\n\n## Synthesis\n[[ENCOUNTER-OP-037]]\n\nThe paper adds a counterfactual path-dependence criterion: a relation becomes more encounter-like when changing a consequential earlier contribution changes a later human/system trajectory in task-relevant ways that cannot be reduced to independent prompt-response pairs.\n", "Encounter_Genealogy.md": "# Encounter Genealogy\n\nA deliberately non-smooth map.\n\n- [[ENCOUNTER-001]] lexical ancestry is not conceptual descent.\n- [[ENCOUNTER-002]] Goffman technicalizes encounter as focused situated activity.\n- [[ENCOUNTER-003]] Turing produces machine-other uncertainty through mediated separation.\n- [[ENCOUNTER-005]] direct manipulation tries to make the computer transparent.\n- [[ENCOUNTER-006]] Suchman reopens whether human-machine interaction is an achieved intelligibility.\n- [[ENCOUNTER-007]] Pratt changes the unit from dyad to contact zone.\n- [[ENCOUNTER-008]] Barad questions whether relata precede relation.\n- [[ENCOUNTER-009]] Deleuze makes failed recognition productive.\n- [[ENCOUNTER-010]] Althusser asks when a contingent encounter takes hold.\n- [[ENCOUNTER-AI-012]] Floridi's *Encounters* is a writing experiment, not yet a general encounter ontology.\n- [[ENCOUNTER-AI-016]] Encounter Ontology supplies explicit AI-era criteria, opening the operational problem.\n"}, "arrangements": {"From_Genealogy_to_Encounter_Test.md": "# From Genealogy to Encounter Test\n\n1. Refuse smooth genealogy: [[ENCOUNTER-001]] [[ENCOUNTER-002]] [[ENCOUNTER-005]].\n2. Suspend strong ontological verdicts: [[ENCOUNTER-AI-014]] [[ENCOUNTER-AI-021]] [[ENCOUNTER-AI-022]].\n3. Demand structural admission: [[ENCOUNTER-AI-016]] [[ENCOUNTER-OP-024]].\n4. Measure who carries reciprocity: [[ENCOUNTER-OP-027]] [[ENCOUNTER-OP-028]] [[ENCOUNTER-OP-033]].\n5. Distinguish development from loops: [[ENCOUNTER-OP-031]] [[ENCOUNTER-OP-032]].\n6. Orient around a third object: [[ENCOUNTER-OP-030]].\n7. Perturb resistance and continuity: [[ENCOUNTER-OP-035]] [[ENCOUNTER-OP-036]].\n8. Measure residue without collapsing it into admission: [[ENCOUNTER-OP-037]].\n9. Add counterfactual branching to test whether the trajectory is actually path-dependent.\n", "Tensions.md": "# Tensions worth preserving\n\n- Mutuality vs unilateral human repair: [[ENCOUNTER-AI-016]] ↔ [[ENCOUNTER-OP-028]].\n- Recursion vs stalled repetition: [[ENCOUNTER-AI-016]] ↔ [[ENCOUNTER-OP-032]].\n- Resistance as otherness vs disagreement as de-socialization: [[ENCOUNTER-AI-017]] ↔ [[ENCOUNTER-OP-035]].\n- Apparent interlocutor vs instrument: [[ENCOUNTER-AI-021]] ↔ [[ENCOUNTER-AI-022]].\n- Dyadic relation vs contact-zone infrastructure: [[ENCOUNTER-AI-018]] ↔ [[ENCOUNTER-007]].\n- Stable participants vs relation-produced relata: [[ENCOUNTER-008]].\n- Engagement/liking vs consequential path dependence: [[ENCOUNTER-AI-020]] ↔ [[ENCOUNTER-OP-037]].\n", "Strongest_Path.md": "# Strongest current path\n\n**Working wager:** a relational human–AI encounter is a bounded episode in which human and system contributions become recursively and task-relevantly consequential for one another, producing a path-dependent trajectory.\n\nThe decisive empirical move is not to ask whether an interaction felt social. Perturb a consequential earlier contribution and observe whether the later trajectory branches: who repairs, what constraints change, what artifact ancestry survives, whether disagreement reorganizes reasoning, and what persists after termination.\n\nThis path keeps encounter agnostic about machine consciousness while making reciprocity and emergence falsifiable.\n"}, "paper_tex": "\\documentclass[11pt]{article}\n\\usepackage[margin=1in]{geometry}\n\\usepackage[T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage{lmodern}\n\\usepackage{microtype}\n\\usepackage{booktabs}\n\\usepackage{tabularx}\n\\usepackage{longtable}\n\\usepackage{array}\n\\usepackage{enumitem}\n\\usepackage{amsmath,amssymb}\n\\usepackage{graphicx}\n\\usepackage{natbib}\n\\usepackage[hidelinks]{hyperref}\n\\usepackage{xcolor}\n\\usepackage{fancyhdr}\n\\usepackage{titlesec}\n\n\\definecolor{quiet}{gray}{0.35}\n\\pagestyle{fancy}\n\\fancyhf{}\n\\lhead{\\footnotesize\\color{quiet}Working Paper}\n\\rhead{\\footnotesize\\color{quiet}Encountering Encounter}\n\\cfoot{\\thepage}\n\\setlength{\\parindent}{0pt}\n\\setlength{\\parskip}{0.6em}\n\\setlength{\\emergencystretch}{2em}\n\\setlist[itemize]{leftmargin=1.4em,itemsep=0.2em,topsep=0.3em}\n\\titleformat{\\section}{\\large\\bfseries}{\\thesection}{0.75em}{}\n\\titleformat{\\subsection}{\\normalsize\\bfseries}{\\thesubsection}{0.75em}{}\n\n\\title{\\textbf{Encountering Encounter}\\\\[0.35em]\n\\large A Falsifiable Model of Relational Human--AI Encounters}\n\\author{Watson Hartsoe}\n\\date{September 28, 2026\\\\[0.6em]\\small Working Paper · AI-augmented research process\\\\Evidence, prompts, and making history preserved in the accompanying research package.}\n\n\\begin{document}\n\\maketitle\n\n\\begin{abstract}\nHuman--AI systems are increasingly described in the language of encounter, relation, collaboration, companionship, and co-creation. Yet the empirical vocabulary used to evaluate these systems still tends to measure outputs, task success, engagement, liking, trust, turn count, or anthropomorphic attribution. This creates a construct problem: a long conversation can be stagnant, successful repair can be almost entirely human labor, high linguistic alignment can result from unilateral accommodation, and disagreement can simultaneously increase behavioral resistance while making the AI seem less socially human. Recent ``encounter ontology'' gives human--AI encounter a philosophical name and structural criteria, but does not yet supply a discriminating empirical test. This paper proposes a narrower and falsifiable construct: the \\emph{relational human--AI encounter}. An encounter is a bounded episode in which contributions from human and system become recursively and task-relevantly consequential for one another, producing a path-dependent trajectory in which the next possible or selected move changes because of what occurred in the relation. The definition is deliberately agnostic about machine consciousness, understanding, and personhood. It shifts measurement from entity properties and surface fluency to relational dynamics. I separate three layers that should not be collapsed: admission conditions, process signatures, and post-encounter residue. I then synthesize operational machinery from conversation analysis, human--robot engagement, interactive team cognition, human--GenAI co-creation, mental-model research, and longitudinal AI companionship. The resulting proposal is an \\emph{Encounter Test}: a perturbation-based protocol measuring episode boundaries, directional repair burden, reciprocal uptake, developmental versus stalled recursion, shared-object ancestry, resistance uptake, counterfactual branch divergence, and persistent changes in problem representation or relation state. The central implication is methodological: encounter should be treated as a profile of path-dependent coordination, not a scalar score for how social or pleasant an AI feels.\n\\end{abstract}\n\n\\textbf{Keywords:} human--AI interaction; encounter; relational intelligence; generative AI; repair; co-creation; path dependence; HCI evaluation\n\n\\section{Introduction: the computer returns as an apparent other}\n\nA striking reversal has occurred in interface design. In one influential formulation of direct manipulation, the computer succeeds by becoming ``transparent'' so that the user can concentrate on the task rather than the machine \\citep{Shneiderman1983Direct}. Generative conversational systems do something almost opposite. The computational system retur
