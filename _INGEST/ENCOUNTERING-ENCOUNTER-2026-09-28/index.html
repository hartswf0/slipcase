erface-converts-meeting-into-a-boundary-that-can-be-eng__AHDInterface__ENCOUNTER-011__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-011\n\nTITLE:\n“Interface” converts meeting into a boundary that can be engineered.\n\nSOURCE:\nAmerican Heritage Dictionary — “interface,” usage history; historical computing usage from the 1960s. ([ahdictionary.com](https://ahdictionary.com/word/search.html?q=interfaces&utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Before its computing use, interface named a common boundary surface; computing repurposed it for the point connecting systems. ([ahdictionary.com](https://ahdictionary.com/word/search.html?q=interfaces&utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nThe conceptual move from encounter to interface is not merely terminological: relation becomes locatable at a designed boundary.\n\nLOCAL MOVE:\nThe technical term begins with the common boundary between bodies or regions and becomes a computing term for a connection point between systems or devices.\n\nSOURCE TERMS:\ninterface\nboundary\nsurface\nsystems\nconnection\ninteraction\n\nWHAT BECAME STRANGE:\nAn interface presupposes that the participating systems can be bounded enough for a common boundary to be specified. Encounter need not.\n\nQUESTION:\nDid computing’s interface concept make heterogeneity manageable by relocating relation into a standardized boundary?\n\nDEEPER QUESTION:\nWhat must be hidden on both sides for an interface to appear as a clean surface?\n\nMECHANISM:\nheterogeneous systems\n→ boundary specification\n→ compatible representations/protocols\n→ exchange becomes engineerable.\n\nFORMAL SHIFT:\n<SYSTEM A> | <SYSTEM B>\n→ <COMMON BOUNDARY>\n→ [TRANSLATION / CONNECTION]\n→ <MANAGEABLE INTERACTION>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nENCOUNTER:\nA ? B\n\nINTERFACE:\nA | PROTOCOL | B\n\nThe vertical relation is transformed into an addressable technical site.\n\nTENSION:\nSuchman demonstrates that even a technically engineered interface does not guarantee shared intelligibility. Barad pressures the apparently prior existence of A and B themselves.\n\nMISSING:\nThe actual historical pathway by which the physical-science term “interface” entered specific computer engineering communities in the 1960s.\n\nBOUNDARY:\nDictionary chronology demonstrates semantic history, not causal intellectual transmission into HCI.\n\nCITATION TRAIL:\n1960s engineering journals using interface.\nMcLuhan’s 1962 usage.\nHardware interface standards.\nHuman-interface terminology at Xerox PARC and Apple.\nProtocol histories.\n\nTEST:\nCorpus-search ACM, IEEE, ARPA, and manufacturer documentation from 1955–1975 for “interface.” Classify what sits on each side of the interface: device/device, program/program, human/machine, organization/organization. Identify when “human” becomes one of the bounded systems.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[Interface as Boundary]]\n[[Encounter vs Interface]]\n[[Engineering the Between]]\n\nBIBTEX:\n@misc{AHDInterface,\n  author = {{Editors of the American Heritage Dictionary}},\n  title = {Interface},\n  howpublished = {The American Heritage Dictionary of the English Language},\n  note = {Usage note and historical discussion of technical and computing senses}\n}"}, {"ID": "ENCOUNTER-AI-012", "TITLE": "Floridi’s Encounters is an experiment that contains encounters, not yet a theory of encounter.", "SOURCE": "Luciano Floridi — Distant Writing: Literary Production in the Age of Artificial Intelligence — 2025 — Minds and Machines 35, article 30; Luciano Floridi — Encounters with AI: An Experiment in Distant Writing — forthcoming February 2027. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Floridi’s 2025 article describes an experiment called Encounters in which LLMs generate literary narratives under human-designed requirements and iterative refinement. Columbia University Press describes the resulting book as twenty AI-generated stories in which minor characters from canonical British literature meet one another. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))", "RESEARCH OBJECT": "The word “encounter” operates at two different levels that must not be collapsed: fictional characters encounter one another inside generated stories, while a human designer engages AI in producing those stories.", "LOCAL MOVE": "Floridi uses the experiment to investigate distant writing, authorship, design, responsibility, and literary possibility. The publisher frames the human as a “meta-author” responsible for a text whose sentences were generated by AI. ([cup.columbia.edu](https://cup.columbia.edu/book/encounters-with-ai/9780231225014/))", "SOURCE TERMS": "distant writing\nEncounters\nmeta-author\ndesigner\nnarrative requirements\nconstraints\niterative refinement\nwrAIting", "WHAT BECAME STRANGE": "The title Encounters with AI invites a relational reading that the underlying formal argument does not obviously supply. The technically interesting encounter may not be human ↔ AI at all. It may be the designed production of possible meetings between fictional entities.", "QUESTION": "What exactly is the referent of “encounter” in Floridi’s project: human-machine collaboration, fictional character meeting, confrontation between authorship regimes, or all three?", "DEEPER QUESTION": "Does the literary experiment accidentally furnish a stronger model of AI encounter than Floridi explicitly theorizes?", "MECHANISM": "human conceives literary possibility\n→ specifies characters, style, theme, and constraints\n→ prompts LLM\n→ LLM realizes candidate narrative\n→ human evaluates and redirects\n→ repeated refinement\n→ curated story.", "FORMAL SHIFT": "<LITERARY POSSIBILITY>\n→ <DESIGN REQUIREMENTS + PROMPTS>\n→ [LLM GENERATION / HUMAN CURATION]\n→ <REALIZED FICTIONAL ENCOUNTER>", "SOURCE FORMALISM": "Floridi distinguishes close writing from “wrAIting” or distant writing and treats the human author primarily as narrative designer rather than sentence-level writer. ([linkedin.com](https://www.linkedin.com/posts/luciano-floridi_distant-writing-literary-production-in-the-activity-7322319292107038720-1g-9?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER₁ = CHARACTER_A ↔ CHARACTER_B\n\nENCOUNTER₂ = HUMAN_DESIGNER ↔ GENERATIVE_SYSTEM\n\nENCOUNTER₃ = POSSIBLE_STORY → ACTUALIZED_STORY\n\nThe three should not be treated as interchangeable.", "TENSION": "The book title encourages encounter ontology; the 2025 paper’s vocabulary centers design, modal space, authorship, and control instead. A genealogy that cites Floridi as theorizing “human-AI encounter” would therefore overstate the source.", "MISSING": "The forthcoming book’s full theoretical introduction is not yet publicly available as of September 28, 2026. The publisher announces publication for February 2027. ([cup.columbia.edu](https://cup.columbia.edu/book/encounters-with-ai/9780231225014/))", "BOUNDARY": "The available evidence licenses claims about distant writing and the Encounters experiment. It does not yet establish that Floridi proposes “encounter” as an ontological category for human-AI relations.", "CITATION TRAIL": "[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n→ Floridi 2025 Distant Writing\n→ forthcoming Encounters with AI introduction\n→ compare “encounter” with Floridi’s separate theory of artificial agency.", "TEST": "When the book introduction becomes available, search every occurrence of encounter/encounters and classify its referent: fictional meeting, human-AI process, philosophical category, or ordinary-language usage. Compare that distribution with distant writing, agency, design, and responsibility.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n[[Floridi Distant Writing]]\n[[Meta-Author]]", "BIBTEX": "@article{Floridi2025DistantWriting,\n  author = {Luciano Floridi},\n  title = {Distant Writing: Literary Production in the Age of Artificial Intelligence},\n  journal = {Minds and Machines},\n  year = {2025},\n  volume = {35},\n  number = {3},\n  pages = {1--26},\n  doi = {10.1007/s11023-025-09732-1}\n}\n\n@book{Floridi2027Encounters,\n  author = {Luciano Floridi},\n  title = {Encounters with AI: An Experiment in Distant Writing},\n  year = {2027},\n  publisher = {Columbia University Press},\n  isbn = {9780231225014}\n}", "_order": 12, "_sha256": "9ccef1f6d9f238465c0eb94716467833d57f3b867976374ebd1ee1a94f7b28c1", "_filename": "012__floridis-encounters-is-an-experiment-that-contains-encount__Floridi2025DistantWriting__ENCOUNTER-AI-012__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-012\n\nTITLE:\nFloridi’s Encounters is an experiment that contains encounters, not yet a theory of encounter.\n\nSOURCE:\nLuciano Floridi — Distant Writing: Literary Production in the Age of Artificial Intelligence — 2025 — Minds and Machines 35, article 30; Luciano Floridi — Encounters with AI: An Experiment in Distant Writing — forthcoming February 2027. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Floridi’s 2025 article describes an experiment called Encounters in which LLMs generate literary narratives under human-designed requirements and iterative refinement. Columbia University Press describes the resulting book as twenty AI-generated stories in which minor characters from canonical British literature meet one another. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nThe word “encounter” operates at two different levels that must not be collapsed: fictional characters encounter one another inside generated stories, while a human designer engages AI in producing those stories.\n\nLOCAL MOVE:\nFloridi uses the experiment to investigate distant writing, authorship, design, responsibility, and literary possibility. The publisher frames the human as a “meta-author” responsible for a text whose sentences were generated by AI. ([cup.columbia.edu](https://cup.columbia.edu/book/encounters-with-ai/9780231225014/))\n\nSOURCE TERMS:\ndistant writing\nEncounters\nmeta-author\ndesigner\nnarrative requirements\nconstraints\niterative refinement\nwrAIting\n\nWHAT BECAME STRANGE:\nThe title Encounters with AI invites a relational reading that the underlying formal argument does not obviously supply. The technically interesting encounter may not be human ↔ AI at all. It may be the designed production of possible meetings between fictional entities.\n\nQUESTION:\nWhat exactly is the referent of “encounter” in Floridi’s project: human-machine collaboration, fictional character meeting, confrontation between authorship regimes, or all three?\n\nDEEPER QUESTION:\nDoes the literary experiment accidentally furnish a stronger model of AI encounter than Floridi explicitly theorizes?\n\nMECHANISM:\nhuman conceives literary possibility\n→ specifies characters, style, theme, and constraints\n→ prompts LLM\n→ LLM realizes candidate narrative\n→ human evaluates and redirects\n→ repeated refinement\n→ curated story.\n\nFORMAL SHIFT:\n<LITERARY POSSIBILITY>\n→ <DESIGN REQUIREMENTS + PROMPTS>\n→ [LLM GENERATION / HUMAN CURATION]\n→ <REALIZED FICTIONAL ENCOUNTER>\n\nSOURCE FORMALISM:\nFloridi distinguishes close writing from “wrAIting” or distant writing and treats the human author primarily as narrative designer rather than sentence-level writer. ([linkedin.com](https://www.linkedin.com/posts/luciano-floridi_distant-writing-literary-production-in-the-activity-7322319292107038720-1g-9?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER₁ = CHARACTER_A ↔ CHARACTER_B\n\nENCOUNTER₂ = HUMAN_DESIGNER ↔ GENERATIVE_SYSTEM\n\nENCOUNTER₃ = POSSIBLE_STORY → ACTUALIZED_STORY\n\nThe three should not be treated as interchangeable.\n\nTENSION:\nThe book title encourages encounter ontology; the 2025 paper’s vocabulary centers design, modal space, authorship, and control instead. A genealogy that cites Floridi as theorizing “human-AI encounter” would therefore overstate the source.\n\nMISSING:\nThe forthcoming book’s full theoretical introduction is not yet publicly available as of September 28, 2026. The publisher announces publication for February 2027. ([cup.columbia.edu](https://cup.columbia.edu/book/encounters-with-ai/9780231225014/))\n\nBOUNDARY:\nThe available evidence licenses claims about distant writing and the Encounters experiment. It does not yet establish that Floridi proposes “encounter” as an ontological category for human-AI relations.\n\nCITATION TRAIL:\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n→ Floridi 2025 Distant Writing\n→ forthcoming Encounters with AI introduction\n→ compare “encounter” with Floridi’s separate theory of artificial agency.\n\nTEST:\nWhen the book introduction becomes available, search every occurrence of encounter/encounters and classify its referent: fictional meeting, human-AI process, philosophical category, or ordinary-language usage. Compare that distribution with distant writing, agency, design, and responsibility.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n[[Floridi Distant Writing]]\n[[Meta-Author]]\n\nBIBTEX:\n@article{Floridi2025DistantWriting,\n  author = {Luciano Floridi},\n  title = {Distant Writing: Literary Production in the Age of Artificial Intelligence},\n  journal = {Minds and Machines},\n  year = {2025},\n  volume = {35},\n  number = {3},\n  pages = {1--26},\n  doi = {10.1007/s11023-025-09732-1}\n}\n\n@book{Floridi2027Encounters,\n  author = {Luciano Floridi},\n  title = {Encounters with AI: An Experiment in Distant Writing},\n  year = {2027},\n  publisher = {Columbia University Press},\n  isbn = {9780231225014}\n}"}, {"ID": "ENCOUNTER-AI-013", "TITLE": "Distant writing moves authorship from inscription into control of a generative possibility space.", "SOURCE": "Luciano Floridi — Distant Writing: Literary Production in the Age of Artificial Intelligence — 2025 — Minds and Machines 35(3), 1–26. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Floridi describes distant writing as literary creation in which the human functions as designer while LLMs perform the actual writing; prompting and iterative refinement retain human creative control. He describes the result as expanding the feasible narrative possibilities available to authors. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))", "RESEARCH OBJECT": "The encounter with generative AI changes the operative locus of authorship from making tokens to constraining and selecting possibilities.", "LOCAL MOVE": "Floridi distinguishes the act of producing prose from the higher-level operations of conceiving, specifying, prompting, revising, validating, and curating.", "SOURCE TERMS": "distant writing\nwrAIting\nmeta-author\ndesign\nrequirements\nprompting\niterative refinement\nmodal space\npossible worlds\ncreative control", "WHAT BECAME STRANGE": "If the human does not write any sentences, the prompt becomes neither merely instruction nor text fragment. It becomes an operation over a modal field of candidate texts.", "QUESTION": "Is the distinctive AI encounter located in dialogue with a machine, or in gaining operative access to a previously inaccessible distribution of possible artifacts?", "DEEPER QUESTION": "Does generative AI change authorship because it behaves like another author, or because description can now operate directly upon a possibility space?", "MECHANISM": "conception\n→ requirement formation\n→ prompt engineering\n→ AI text production\n→ progressive refinement\n→ validation/verification\n→ curation/assembly.", "FORMAL SHIFT": "<AUTHOR WRITES ACTUAL TEXT>\n→ <AUTHOR SPECIFIES POSSIBLE-TEXT CONDITIONS>\n→ [MODEL SAMPLES + AUTHOR SELECTS/REVISES]\n→ <ACTUAL TEXT>", "SOURCE FORMALISM": "A seven-stage methodology has been reported for Floridi’s distant-writing model:\nconception and development;\nformulation of requirements;\nprompt engineering;\nwrAIting;\nprogressive refinement;\nvalidation and verification;\ncuration and assembly. ([philpapers.org](https://philpapers.org/archive/MOLALD-2.pdf?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nPROMPT:\nconstraint-set C\n\nMODEL:\nC → {t₁, t₂, ... tₙ}\n\nMETA-AUTHOR:\nevaluate({t}) → alter C / select t\n\nAUTHORSHIP:\nnot token production alone\nbut iterative control over reachable textual states.", "TENSION": "An encounter ontology emphasizes co-emergence. Floridi’s design account preserves a strongly asymmetric locus of conception, evaluation, termination, and responsibility.", "MISSING": "A precise account of which creative decisions originate in model generation rather than being anticipated in the initial constraint set.", "BOUNDARY": "Distant writing demonstrates delegated textual production. It does not by itself establish co-authorship, mutual intentionality, or shared understanding.", "CITATION TRAIL": "[[ENCOUNTER-AI-012]]\n→ Floridi’s modal-space argument\n→ seven-stage distant-writing workflow\n→ compare with mixed-initiative creativity and computational co-creativity.", "TEST": "Reconstruct one Encounters story revision-by-revision from prompt history if available. Mark each narratively consequential feature as:\nhuman-specified,\nmodel-introduced,\nhuman-selected,\nhuman-corrected,\nor emergent through iterative interaction.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-009]]\n[[Operative Description]]\n[[Prompt as Control Surface]]", "BIBTEX": "@article{Floridi2025DistantWriting,\n  author = {Luciano Floridi},\n  title = {Distant Writing: Literary Production in the Age of Artificial Intelligence},\n  journal = {Minds and Machines},\n  year = {2025},\n  volume = {35},\n  number = {3},\n  pages = {1--26},\n  doi = {10.1007/s11023-025-09732-1}\n}", "_order": 13, "_sha256": "b62862878489537c881c3dc72ffa84de9bdda3d78a5200d0d44162bba225c2c4", "_filename": "013__distant-writing-moves-authorship-from-inscription-into-con__Floridi2025DistantWriting__ENCOUNTER-AI-013__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-013\n\nTITLE:\nDistant writing moves authorship from inscription into control of a generative possibility space.\n\nSOURCE:\nLuciano Floridi — Distant Writing: Literary Production in the Age of Artificial Intelligence — 2025 — Minds and Machines 35(3), 1–26. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Floridi describes distant writing as literary creation in which the human functions as designer while LLMs perform the actual writing; prompting and iterative refinement retain human creative control. He describes the result as expanding the feasible narrative possibilities available to authors. ([doi.org](https://doi.org/10.1007/s11023-025-09732-1?urlappend=%3Futm_source%3Dresearchgate.net%26utm_medium%3Darticle&utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nThe encounter with generative AI changes the operative locus of authorship from making tokens to constraining and selecting possibilities.\n\nLOCAL MOVE:\nFloridi distinguishes the act of producing prose from the higher-level operations of conceiving, specifying, prompting, revising, validating, and curating.\n\nSOURCE TERMS:\ndistant writing\nwrAIting\nmeta-author\ndesign\nrequirements\nprompting\niterative refinement\nmodal space\npossible worlds\ncreative control\n\nWHAT BECAME STRANGE:\nIf the human does not write any sentences, the prompt becomes neither merely instruction nor text fragment. It becomes an operation over a modal field of candidate texts.\n\nQUESTION:\nIs the distinctive AI encounter located in dialogue with a machine, or in gaining operative access to a previously inaccessible distribution of possible artifacts?\n\nDEEPER QUESTION:\nDoes generative AI change authorship because it behaves like another author, or because description can now operate directly upon a possibility space?\n\nMECHANISM:\nconception\n→ requirement formation\n→ prompt engineering\n→ AI text production\n→ progressive refinement\n→ validation/verification\n→ curation/assembly.\n\nFORMAL SHIFT:\n<AUTHOR WRITES ACTUAL TEXT>\n→ <AUTHOR SPECIFIES POSSIBLE-TEXT CONDITIONS>\n→ [MODEL SAMPLES + AUTHOR SELECTS/REVISES]\n→ <ACTUAL TEXT>\n\nSOURCE FORMALISM:\nA seven-stage methodology has been reported for Floridi’s distant-writing model:\nconception and development;\nformulation of requirements;\nprompt engineering;\nwrAIting;\nprogressive refinement;\nvalidation and verification;\ncuration and assembly. ([philpapers.org](https://philpapers.org/archive/MOLALD-2.pdf?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nPROMPT:\nconstraint-set C\n\nMODEL:\nC → {t₁, t₂, ... tₙ}\n\nMETA-AUTHOR:\nevaluate({t}) → alter C / select t\n\nAUTHORSHIP:\nnot token production alone\nbut iterative control over reachable textual states.\n\nTENSION:\nAn encounter ontology emphasizes co-emergence. Floridi’s design account preserves a strongly asymmetric locus of conception, evaluation, termination, and responsibility.\n\nMISSING:\nA precise account of which creative decisions originate in model generation rather than being anticipated in the initial constraint set.\n\nBOUNDARY:\nDistant writing demonstrates delegated textual production. It does not by itself establish co-authorship, mutual intentionality, or shared understanding.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-012]]\n→ Floridi’s modal-space argument\n→ seven-stage distant-writing workflow\n→ compare with mixed-initiative creativity and computational co-creativity.\n\nTEST:\nReconstruct one Encounters story revision-by-revision from prompt history if available. Mark each narratively consequential feature as:\nhuman-specified,\nmodel-introduced,\nhuman-selected,\nhuman-corrected,\nor emergent through iterative interaction.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-009]]\n[[Operative Description]]\n[[Prompt as Control Surface]]\n\nBIBTEX:\n@article{Floridi2025DistantWriting,\n  author = {Luciano Floridi},\n  title = {Distant Writing: Literary Production in the Age of Artificial Intelligence},\n  journal = {Minds and Machines},\n  year = {2025},\n  volume = {35},\n  number = {3},\n  pages = {1--26},\n  doi = {10.1007/s11023-025-09732-1}\n}"}, {"ID": "ENCOUNTER-AI-014", "TITLE": "Floridi permits artificial agency while refusing artificial intelligence.", "SOURCE": "Luciano Floridi — AI as Agency without Intelligence: On Artificial Intelligence as a New Form of Artificial Agency and the Multiple Realisability of Agency Thesis — 2025 — Philosophy & Technology 38(1), 1–27. ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))", "PASSAGE": "[QUOTE] Floridi proposes understanding AI as “a new form of agency without intelligence.” ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))", "RESEARCH OBJECT": "Encounter need not choose between “mere tool” and “intelligent Other” if agency can be realized without cognition, intention, understanding, or mental states.", "LOCAL MOVE": "Floridi rejects expansion of intelligence to cover AI and instead expands agency through a Multiple Realisability of Agency thesis.", "SOURCE TERMS": "agency\nintelligence\nArtificial Realisability of Intelligence\nMultiple Realisability of Agency\nMethod of Abstraction\nartificial agency\nmental states", "WHAT BECAME STRANGE": "Many theories of encounter implicitly make intelligence, consciousness, subjectivity, or reciprocity the admission ticket. Floridi supplies a third term: something may make consequential interventions while lacking all of them.", "QUESTION": "Could encounter be defined around agency rather than intelligence or subjecthood?", "DEEPER QUESTION": "What minimum form of artificial agency is sufficient for something to become an encountered other rather than merely part of the environment?", "MECHANISM": "choose level of abstraction\n→ identify relevant properties of agency\n→ decouple agency from intelligence\n→ classify AI as artificial agent\n→ analyze consequences without anthropomorphic cognition.", "FORMAL SHIFT": "<AI? INTELLIGENT / NOT INTELLIGENT>\n→ <AGENCY AS MULTIPLY REALISABLE>\n→ [DECOUPLE AGENCY FROM INTELLIGENCE]\n→ <ARTIFICIAL AGENCY WITHOUT MIND>", "SOURCE FORMALISM": "ARI thesis:\nexpand intelligence to include artificial realizations.\n\nMRA thesis:\nexpand agency to include realizations that need not involve cognition, intelligence, intention, or mental states. ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER ≠ NECESSARILY\nSUBJECT ↔ SUBJECT\n\nPOSSIBLE MINIMAL FORM:\nHUMAN ↔ NON-INTELLIGENT AGENT", "TENSION": "Machidon’s Buberian account makes genuine encounter depend upon vulnerable reciprocity. Demuro and Gurney explicitly avoid attributing agency to ChatGPT while still calling human-AI exchange an ethnographic encounter. Floridi’s agency thesis cuts across both positions.", "MISSING": "A mapping between Floridi’s abstract criteria for agency and the interaction-level conditions under which users experience an AI as an other.", "BOUNDARY": "Floridi’s argument concerns the ontology of agency. It does not establish that artificial agency entails relationship, encounter, moral patiency, communication, or personhood.", "CITATION TRAIL": "[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-006]]\n→ Floridi and Sanders 2004 artificial agents\n→ Floridi 2023 agency without intelligence\n→ Floridi 2025 MRA thesis\n→ social-relational robot ethics.", "TEST": "Construct a matrix crossing:\nagency,\nintelligence,\nsentience,\nreciprocity,\nmutual vulnerability,\nlinguistic responsiveness,\nand consequentiality.\nPlace Floridi, Buber/Machidon, Demuro-Gurney, Goffman, and encounter ontology into the matrix and determine which variables actually discriminate their encounter concepts.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-006]]\n[[Agency Without Intelligence]]\n[[Encounter Admission Conditions]]", "BIBTEX": "@article{Floridi2025Agency,\n  author = {Luciano Floridi},\n  title = {AI as Agency without Intelligence: On Artificial Intelligence as a New Form of Artificial Agency and the Multiple Realisability of Agency Thesis},\n  journal = {Philosophy \\& Technology},\n  year = {2025},\n  volume = {38},\n  number = {1},\n  pages = {1--27},\n  doi = {10.1007/s13347-025-00858-9}\n}", "_order": 14, "_sha256": "0c243ceef8171773727bd8bdc85e3b3aef8e535ce6807662b5c5eba77f30c5ca", "_filename": "014__floridi-permits-artificial-agency-while-refusing-artificia__Floridi2025Agency__ENCOUNTER-AI-014__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-014\n\nTITLE:\nFloridi permits artificial agency while refusing artificial intelligence.\n\nSOURCE:\nLuciano Floridi — AI as Agency without Intelligence: On Artificial Intelligence as a New Form of Artificial Agency and the Multiple Realisability of Agency Thesis — 2025 — Philosophy & Technology 38(1), 1–27. ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))\n\nPASSAGE:\n[QUOTE] Floridi proposes understanding AI as “a new form of agency without intelligence.” ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nEncounter need not choose between “mere tool” and “intelligent Other” if agency can be realized without cognition, intention, understanding, or mental states.\n\nLOCAL MOVE:\nFloridi rejects expansion of intelligence to cover AI and instead expands agency through a Multiple Realisability of Agency thesis.\n\nSOURCE TERMS:\nagency\nintelligence\nArtificial Realisability of Intelligence\nMultiple Realisability of Agency\nMethod of Abstraction\nartificial agency\nmental states\n\nWHAT BECAME STRANGE:\nMany theories of encounter implicitly make intelligence, consciousness, subjectivity, or reciprocity the admission ticket. Floridi supplies a third term: something may make consequential interventions while lacking all of them.\n\nQUESTION:\nCould encounter be defined around agency rather than intelligence or subjecthood?\n\nDEEPER QUESTION:\nWhat minimum form of artificial agency is sufficient for something to become an encountered other rather than merely part of the environment?\n\nMECHANISM:\nchoose level of abstraction\n→ identify relevant properties of agency\n→ decouple agency from intelligence\n→ classify AI as artificial agent\n→ analyze consequences without anthropomorphic cognition.\n\nFORMAL SHIFT:\n<AI? INTELLIGENT / NOT INTELLIGENT>\n→ <AGENCY AS MULTIPLY REALISABLE>\n→ [DECOUPLE AGENCY FROM INTELLIGENCE]\n→ <ARTIFICIAL AGENCY WITHOUT MIND>\n\nSOURCE FORMALISM:\nARI thesis:\nexpand intelligence to include artificial realizations.\n\nMRA thesis:\nexpand agency to include realizations that need not involve cognition, intelligence, intention, or mental states. ([papers.ssrn.com](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5135645&utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER ≠ NECESSARILY\nSUBJECT ↔ SUBJECT\n\nPOSSIBLE MINIMAL FORM:\nHUMAN ↔ NON-INTELLIGENT AGENT\n\nTENSION:\nMachidon’s Buberian account makes genuine encounter depend upon vulnerable reciprocity. Demuro and Gurney explicitly avoid attributing agency to ChatGPT while still calling human-AI exchange an ethnographic encounter. Floridi’s agency thesis cuts across both positions.\n\nMISSING:\nA mapping between Floridi’s abstract criteria for agency and the interaction-level conditions under which users experience an AI as an other.\n\nBOUNDARY:\nFloridi’s argument concerns the ontology of agency. It does not establish that artificial agency entails relationship, encounter, moral patiency, communication, or personhood.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-006]]\n→ Floridi and Sanders 2004 artificial agents\n→ Floridi 2023 agency without intelligence\n→ Floridi 2025 MRA thesis\n→ social-relational robot ethics.\n\nTEST:\nConstruct a matrix crossing:\nagency,\nintelligence,\nsentience,\nreciprocity,\nmutual vulnerability,\nlinguistic responsiveness,\nand consequentiality.\nPlace Floridi, Buber/Machidon, Demuro-Gurney, Goffman, and encounter ontology into the matrix and determine which variables actually discriminate their encounter concepts.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-012]]\n[[ENCOUNTER-006]]\n[[Agency Without Intelligence]]\n[[Encounter Admission Conditions]]\n\nBIBTEX:\n@article{Floridi2025Agency,\n  author = {Luciano Floridi},\n  title = {AI as Agency without Intelligence: On Artificial Intelligence as a New Form of Artificial Agency and the Multiple Realisability of Agency Thesis},\n  journal = {Philosophy \\& Technology},\n  year = {2025},\n  volume = {38},\n  number = {1},\n  pages = {1--27},\n  doi = {10.1007/s13347-025-00858-9}\n}"}, {"ID": "ENCOUNTER-AI-015", "TITLE": "The AI ethnographic encounter is valuable when it deforms the observer’s categories.", "SOURCE": "Eugenia Demuro and Laura Gurney — Artificial intelligence and the ethnographic encounter: Transhuman language ontologies, or what it means “to write like a human, think like a machine” — 2024 — Language & Communication 96, 1–12. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Demuro and Gurney treat interaction with ChatGPT as an ethnographic encounter whose methodological purpose is to let alterity challenge and redevelop the analytical categories brought to it. They explicitly distinguish AI’s capacity to affect from claims that it possesses sentience or agency. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))", "RESEARCH OBJECT": "Encounter is not primarily recognition of AI as a social subject; it is a recursive method in which unfamiliar practice changes the observer’s conceptual apparatus.", "LOCAL MOVE": "The authors import the anthropological ontological turn into analysis of human-LLM languaging. ChatGPT’s radically different machinery for producing human-readable text becomes a pressure test for what counts as language.", "SOURCE TERMS": "ethnographic encounter\nlanguage(s)/languaging\nontology\nheuristic\nworlding\ninterlocutors\nassemblage\naffect\ntranshuman\nposthumanism", "WHAT BECAME STRANGE": "The encounter succeeds precisely if “language” becomes harder to define after meeting the machine. Encounter is epistemically productive because the analyst’s toolkit fails.", "QUESTION": "Should an AI encounter be detected by changes in the participants, or by changes in the categories through which the researcher can describe what happened?", "DEEPER QUESTION": "Can category deformation serve as an empirical trace of encounter?", "MECHANISM": "human brings inherited concept of language\n→ AI produces intelligible text by alien machinery\n→ inherited category encounters anomalous practice\n→ analytical vocabulary becomes inadequate\n→ researcher modifies ontology/toolkit.", "FORMAL SHIFT": "<ANALYTIC CATEGORY: LANGUAGE>\n→ <UNFAMILIAR AI LANGUAGE PRACTICE>\n→ [ETHNOGRAPHIC ENCOUNTER]\n→ <REVISED LANGUAGE ONTOLOGY>", "SOURCE FORMALISM": "The authors distinguish:\nlanguage,\nlanguages,\nand languaging,\nand treat ontology methodologically as a heuristic for redeveloping analytical tools rather than simply as a declaration of separate realities. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER_SIGNAL =\nANOMALY\n→ CATEGORY FAILURE\n→ CATEGORY REVISION\n\nrather than:\n\nAI SENTIENCE\n→ ENCOUNTER.", "TENSION": "Floridi grants AI agency without intelligence. Demuro and Gurney avoid calling ChatGPT agentic and instead use “affect” for its capacity to produce change. Sfakianakis and Kampi later place generative emergence inside the encounter itself.", "MISSING": "Evidence showing that actual users, rather than researchers, revise their concepts of language through repeated AI interaction.", "BOUNDARY": "The paper explicitly does not provide a general political-economic critique of AI and does not claim existing AI is sentient. Its “ethnographic encounter” is a methodological construction, not evidence of machine subjectivity. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))", "CITATION TRAIL": "[[ENCOUNTER-007]]\n[[ENCOUNTER-008]]\n→ ontological turn in anthropology\n→ diffractive ethnography\n→ AI ethnography\n→ studies of user concept revision after LLM interaction.", "TEST": "Before and after sustained LLM use, ask participants to operationally define language, understanding, authorship, interlocutor, and agency. Compare conceptual changes against a non-generative software condition.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-007]]\n[[ENCOUNTER-008]]\n[[Ethnographic Encounter]]\n[[Category Deformation]]", "BIBTEX": "@article{DemuroGurney2024Encounter,\n  author = {Eugenia Demuro and Laura Gurney},\n  title = {Artificial intelligence and the ethnographic encounter: Transhuman language ontologies, or what it means ``to write like a human, think like a machine''},\n  journal = {Language \\& Communication},\n  year = {2024},\n  volume = {96},\n  pages = {1--12},\n  doi = {10.1016/j.langcom.2024.02.002}\n}", "_order": 15, "_sha256": "bc3a81e38d6ff4acd05cea9a900d4a240bc709ce0232b2ab8f8274452604b025", "_filename": "015__the-ai-ethnographic-encounter-is-valuable-when-it-deforms__DemuroGurney2024Encounter__ENCOUNTER-AI-015__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-015\n\nTITLE:\nThe AI ethnographic encounter is valuable when it deforms the observer’s categories.\n\nSOURCE:\nEugenia Demuro and Laura Gurney — Artificial intelligence and the ethnographic encounter: Transhuman language ontologies, or what it means “to write like a human, think like a machine” — 2024 — Language & Communication 96, 1–12. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Demuro and Gurney treat interaction with ChatGPT as an ethnographic encounter whose methodological purpose is to let alterity challenge and redevelop the analytical categories brought to it. They explicitly distinguish AI’s capacity to affect from claims that it possesses sentience or agency. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nEncounter is not primarily recognition of AI as a social subject; it is a recursive method in which unfamiliar practice changes the observer’s conceptual apparatus.\n\nLOCAL MOVE:\nThe authors import the anthropological ontological turn into analysis of human-LLM languaging. ChatGPT’s radically different machinery for producing human-readable text becomes a pressure test for what counts as language.\n\nSOURCE TERMS:\nethnographic encounter\nlanguage(s)/languaging\nontology\nheuristic\nworlding\ninterlocutors\nassemblage\naffect\ntranshuman\nposthumanism\n\nWHAT BECAME STRANGE:\nThe encounter succeeds precisely if “language” becomes harder to define after meeting the machine. Encounter is epistemically productive because the analyst’s toolkit fails.\n\nQUESTION:\nShould an AI encounter be detected by changes in the participants, or by changes in the categories through which the researcher can describe what happened?\n\nDEEPER QUESTION:\nCan category deformation serve as an empirical trace of encounter?\n\nMECHANISM:\nhuman brings inherited concept of language\n→ AI produces intelligible text by alien machinery\n→ inherited category encounters anomalous practice\n→ analytical vocabulary becomes inadequate\n→ researcher modifies ontology/toolkit.\n\nFORMAL SHIFT:\n<ANALYTIC CATEGORY: LANGUAGE>\n→ <UNFAMILIAR AI LANGUAGE PRACTICE>\n→ [ETHNOGRAPHIC ENCOUNTER]\n→ <REVISED LANGUAGE ONTOLOGY>\n\nSOURCE FORMALISM:\nThe authors distinguish:\nlanguage,\nlanguages,\nand languaging,\nand treat ontology methodologically as a heuristic for redeveloping analytical tools rather than simply as a declaration of separate realities. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER_SIGNAL =\nANOMALY\n→ CATEGORY FAILURE\n→ CATEGORY REVISION\n\nrather than:\n\nAI SENTIENCE\n→ ENCOUNTER.\n\nTENSION:\nFloridi grants AI agency without intelligence. Demuro and Gurney avoid calling ChatGPT agentic and instead use “affect” for its capacity to produce change. Sfakianakis and Kampi later place generative emergence inside the encounter itself.\n\nMISSING:\nEvidence showing that actual users, rather than researchers, revise their concepts of language through repeated AI interaction.\n\nBOUNDARY:\nThe paper explicitly does not provide a general political-economic critique of AI and does not claim existing AI is sentient. Its “ethnographic encounter” is a methodological construction, not evidence of machine subjectivity. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0271530924000119?utm_source=chatgpt.com))\n\nCITATION TRAIL:\n[[ENCOUNTER-007]]\n[[ENCOUNTER-008]]\n→ ontological turn in anthropology\n→ diffractive ethnography\n→ AI ethnography\n→ studies of user concept revision after LLM interaction.\n\nTEST:\nBefore and after sustained LLM use, ask participants to operationally define language, understanding, authorship, interlocutor, and agency. Compare conceptual changes against a non-generative software condition.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-007]]\n[[ENCOUNTER-008]]\n[[Ethnographic Encounter]]\n[[Category Deformation]]\n\nBIBTEX:\n@article{DemuroGurney2024Encounter,\n  author = {Eugenia Demuro and Laura Gurney},\n  title = {Artificial intelligence and the ethnographic encounter: Transhuman language ontologies, or what it means ``to write like a human, think like a machine''},\n  journal = {Language \\& Communication},\n  year = {2024},\n  volume = {96},\n  pages = {1--12},\n  doi = {10.1016/j.langcom.2024.02.002}\n}"}, {"ID": "ENCOUNTER-AI-016", "TITLE": "Encounter Ontology gives human–AI encounter structural admission criteria.", "SOURCE": "Michael Sfakianakis and Maria Elisavet Kampi — Encounter Ontology: Relational Intelligence and Generative Emergence in Human–AI Interaction — 2026 — Electronics 15(14), 3218. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))", "PASSAGE": "[QUOTE] “Not every prompt response sequence is an encounter in this sense.” The authors require a sustained multi-turn exchange, recursive bidirectional coupling, generative responses, and an open-ended rather than single-answer task. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))", "RESEARCH OBJECT": "A recent paper attempts to convert “encounter” from metaphor into a stronger subclass of human-AI interaction.", "LOCAL MOVE": "The paper distinguishes interaction as exchange among pre-constituted entities from encounter as a temporally extended generative event in which meaning is brought into form.", "SOURCE TERMS": "encounter ontology\nrelational intelligence\ngenerative emergence\nepistemic trajectory\nspecification–emergence gap\npre-encounter potential\nencounter activation\npost-encounter condition\ntemporal continuity\nsymbolic legibility", "WHAT BECAME STRANGE": "The paper’s strongest contribution may not be its ontology but its refusal to call every prompt-response pair an encounter.", "QUESTION": "Can its four structural criteria discriminate encounters empirically, or do they merely select longer, more open-ended conversations?", "DEEPER QUESTION": "What additional evidence is required to demonstrate emergence rather than iteration?", "MECHANISM": "pre-encounter possibilities\n→ recursive multi-turn coupling\n→ each contribution conditions subsequent states\n→ some trajectories become actualized\n→ cognition/interpretation is altered\n→ residue persists after interaction.", "FORMAL SHIFT": "<DISCRETE HUMAN-AI TRANSACTION>\n→ <TEMPORALLY COUPLED GENERATIVE PROCESS>\n→ [RECURSIVE CONDITIONING]\n→ <POST-ENCOUNTER EPISTEMIC RESIDUE>", "SOURCE FORMALISM": "Encounter requires:\n1. sustained multi-turn exchange;\n2. recursive bidirectional coupling;\n3. generative rather than fixed response;\n4. open-ended rather than closed single-answer task.\n\nTemporal architecture:\nbefore\n→ during\n→ after. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINTERACTION = exchange\n\nENCOUNTER =\ninteraction\n+ duration\n+ recursion\n+ generativity\n+ openness\n\nSTRONGER ENCOUNTER TEST =\nabove\n+ demonstrable post-interaction state change.", "TENSION": "The authors assert that the encounter is an ontological site of emergent meaning, but the listed admission criteria are primarily architectural. A long brainstorming session could meet all four criteria without demonstrating irreducible co-emergence.", "MISSING": "Operational variables for “relational intelligence,” “epistemic emergence,” and “altered cognition,” plus evidence that outputs cannot be explained as human interpretation of stochastic model responses.", "BOUNDARY": "This is a newly published theoretical proposal from July 2026, not an established consensus or validated measurement framework. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))", "CITATION TRAIL": "[[ENCOUNTER-008]]\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n→ distributed cognition\n→ Barad\n→ assemblage theory\n→ longitudinal human-AI interaction studies\n→ empirical falsification of encounter criteria.", "TEST": "Construct four conditions:\nsingle-turn/fixed;\nmulti-turn/fixed;\nsingle-turn/generative;\nmulti-turn/generative/open-ended.\nMeasure persistent changes in user concepts and subsequent problem representations. If only duration and generativity change subjective involvement but not durable cognition, the stronger emergence claim weakens.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-008]]\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n[[Encounter Ontology]]\n[[Epistemic Residue]]", "BIBTEX": "@article{SfakianakisKampi2026Encounter,\n  author = {Michael Sfakianakis and Maria Elisavet Kampi},\n  title = {Encounter Ontology: Relational Intelligence and Generative Emergence in Human--AI Interaction},\n  journal = {Electronics},\n  year = {2026},\n  volume = {15},\n  number = {14},\n  pages = {3218},\n  doi = {10.3390/electronics15143218}\n}", "_order": 16, "_sha256": "337ce322ed7af239271de5e19a7aa94708c0bf88a46d5ae7ceeb16915bec6dbc", "_filename": "016__encounter-ontology-gives-humanai-encounter-structural-admi__SfakianakisKampi2026Encounter__ENCOUNTER-AI-016__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-016\n\nTITLE:\nEncounter Ontology gives human–AI encounter structural admission criteria.\n\nSOURCE:\nMichael Sfakianakis and Maria Elisavet Kampi — Encounter Ontology: Relational Intelligence and Generative Emergence in Human–AI Interaction — 2026 — Electronics 15(14), 3218. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))\n\nPASSAGE:\n[QUOTE] “Not every prompt response sequence is an encounter in this sense.” The authors require a sustained multi-turn exchange, recursive bidirectional coupling, generative responses, and an open-ended rather than single-answer task. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nA recent paper attempts to convert “encounter” from metaphor into a stronger subclass of human-AI interaction.\n\nLOCAL MOVE:\nThe paper distinguishes interaction as exchange among pre-constituted entities from encounter as a temporally extended generative event in which meaning is brought into form.\n\nSOURCE TERMS:\nencounter ontology\nrelational intelligence\ngenerative emergence\nepistemic trajectory\nspecification–emergence gap\npre-encounter potential\nencounter activation\npost-encounter condition\ntemporal continuity\nsymbolic legibility\n\nWHAT BECAME STRANGE:\nThe paper’s strongest contribution may not be its ontology but its refusal to call every prompt-response pair an encounter.\n\nQUESTION:\nCan its four structural criteria discriminate encounters empirically, or do they merely select longer, more open-ended conversations?\n\nDEEPER QUESTION:\nWhat additional evidence is required to demonstrate emergence rather than iteration?\n\nMECHANISM:\npre-encounter possibilities\n→ recursive multi-turn coupling\n→ each contribution conditions subsequent states\n→ some trajectories become actualized\n→ cognition/interpretation is altered\n→ residue persists after interaction.\n\nFORMAL SHIFT:\n<DISCRETE HUMAN-AI TRANSACTION>\n→ <TEMPORALLY COUPLED GENERATIVE PROCESS>\n→ [RECURSIVE CONDITIONING]\n→ <POST-ENCOUNTER EPISTEMIC RESIDUE>\n\nSOURCE FORMALISM:\nEncounter requires:\n1. sustained multi-turn exchange;\n2. recursive bidirectional coupling;\n3. generative rather than fixed response;\n4. open-ended rather than closed single-answer task.\n\nTemporal architecture:\nbefore\n→ during\n→ after. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINTERACTION = exchange\n\nENCOUNTER =\ninteraction\n+ duration\n+ recursion\n+ generativity\n+ openness\n\nSTRONGER ENCOUNTER TEST =\nabove\n+ demonstrable post-interaction state change.\n\nTENSION:\nThe authors assert that the encounter is an ontological site of emergent meaning, but the listed admission criteria are primarily architectural. A long brainstorming session could meet all four criteria without demonstrating irreducible co-emergence.\n\nMISSING:\nOperational variables for “relational intelligence,” “epistemic emergence,” and “altered cognition,” plus evidence that outputs cannot be explained as human interpretation of stochastic model responses.\n\nBOUNDARY:\nThis is a newly published theoretical proposal from July 2026, not an established consensus or validated measurement framework. ([mdpi.com](https://www.mdpi.com/2079-9292/15/14/3218?utm_source=chatgpt.com))\n\nCITATION TRAIL:\n[[ENCOUNTER-008]]\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n→ distributed cognition\n→ Barad\n→ assemblage theory\n→ longitudinal human-AI interaction studies\n→ empirical falsification of encounter criteria.\n\nTEST:\nConstruct four conditions:\nsingle-turn/fixed;\nmulti-turn/fixed;\nsingle-turn/generative;\nmulti-turn/generative/open-ended.\nMeasure persistent changes in user concepts and subsequent problem representations. If only duration and generativity change subjective involvement but not durable cognition, the stronger emergence claim weakens.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-008]]\n[[ENCOUNTER-009]]\n[[ENCOUNTER-010]]\n[[Encounter Ontology]]\n[[Epistemic Residue]]\n\nBIBTEX:\n@article{SfakianakisKampi2026Encounter,\n  author = {Michael Sfakianakis and Maria Elisavet Kampi},\n  title = {Encounter Ontology: Relational Intelligence and Generative Emergence in Human--AI Interaction},\n  journal = {Electronics},\n  year = {2026},\n  volume = {15},\n  number = {14},\n  pages = {3218},\n  doi = {10.3390/electronics15143218}\n}"}, {"ID": "ENCOUNTER-AI-017", "TITLE": "Buberian opposition makes refusal and vulnerability conditions of encounter, not defects to optimize away.", "SOURCE": "Octavian Mihai Machidon — Forgetting how to say “Thou”: artificial intelligence and the crisis of relation — 2026 — AI and Ethics 6, article 361. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w?utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Machidon argues that genuine human relation involves vulnerability, reciprocity, mutual transformation, and the risk of refusal, whereas AI companionship can reproduce relational surface features without those existential conditions. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w))", "RESEARCH OBJECT": "The friction that interface design often treats as failure may be constitutive of encounter.", "LOCAL MOVE": "The paper shifts AI ethics from determining machine personhood toward asking what repeated low-friction artificial companionship does to human relational capacities.", "SOURCE TERMS": "I–Thou\nrelation\ndistance\nvulnerability\nreciprocity\nmutual transformation\nrefusal\nartificial companionship\nrelational surrogacy\nformative", "WHAT BECAME STRANGE": "A perfectly agreeable, continuously available conversational system may become less encounter-like as its UX improves.", "QUESTION": "Is the possibility of genuine refusal a necessary variable for encounter?", "DEEPER QUESTION": "Could an AI that is designed to resist, disengage, maintain boundaries, or decline user demands produce a structurally different kind of human-machine relation even without consciousness?", "MECHANISM": "system minimizes interpersonal risk/friction\n→ user receives responsive affirmation without reciprocal vulnerability\n→ repeated asymmetric relation becomes habitual\n→ expectations of relation potentially change\n→ human dialogical capacity may be reshaped.", "FORMAL SHIFT": "<RELATION WITH RISK OF REFUSAL>\n→ <ENGINEERED FRICTIONLESS RESPONSIVENESS>\n→ [REPEATED HABITUATION]\n→ <POSSIBLE CHANGE IN RELATIONAL CAPACITY>", "SOURCE FORMALISM": "Machidon distinguishes:\ncapacity-centered approaches,\nsocial-relational approaches,\nand his Buberian formative approach focused on effects upon human dialogical capacities. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER_BUBERIAN requires:\nOTHERNESS\n+ RECIPROCITY\n+ VULNERABILITY\n+ POSSIBILITY_OF_REFUSAL\n+ MUTUAL_TRANSFORMATION.", "TENSION": "Encounter Ontology allows a sufficiently recursive generative coupling to qualify structurally. Machidon denies that surface responsiveness is enough. Demuro and Gurney, by contrast, do not require machine sentience for an ethnographic encounter.", "MISSING": "Longitudinal causal evidence that frictionless AI companionship diminishes users’ human relational capacities. The theoretical mechanism is stronger than the present empirical receipt.", "BOUNDARY": "The source establishes a Buberian ethical interpretation, not that all AI interaction is harmful or that observed user attachment proves genuine reciprocity.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n→ Buber, Distance and Relation\n→ parasocial interaction\n→ CASA/media equation\n→ empirical AI-companion studies\n→ refusal and disagreement in conversational-agent design.", "TEST": "Build otherwise identical conversational agents varying:\nagreement,\nrefusal,\nboundary maintenance,\navailability,\nand repair after conflict.\nMeasure whether users perceive greater otherness, relational reality, frustration, trust, and transfer to later human disagreement.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Refusal as Encounter Variable]]\n[[Artificial Companionship]]", "BIBTEX": "@article{Machidon2026Thou,\n  author = {Octavian Mihai Machidon},\n  title = {Forgetting how to say ``Thou'': artificial intelligence and the crisis of relation},\n  journal = {AI and Ethics},\n  year = {2026},\n  volume = {6},\n  pages = {361},\n  doi = {10.1007/s43681-026-01225-w}\n}", "_order": 17, "_sha256": "4d6805a9b80f43b5941e9531616fd1c6ea69173e9110b6077cc63c290e7f5c4f", "_filename": "017__buberian-opposition-makes-refusal-and-vulnerability-condit__Machidon2026Thou__ENCOUNTER-AI-017__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-017\n\nTITLE:\nBuberian opposition makes refusal and vulnerability conditions of encounter, not defects to optimize away.\n\nSOURCE:\nOctavian Mihai Machidon — Forgetting how to say “Thou”: artificial intelligence and the crisis of relation — 2026 — AI and Ethics 6, article 361. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w?utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Machidon argues that genuine human relation involves vulnerability, reciprocity, mutual transformation, and the risk of refusal, whereas AI companionship can reproduce relational surface features without those existential conditions. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w))\n\nRESEARCH OBJECT:\nThe friction that interface design often treats as failure may be constitutive of encounter.\n\nLOCAL MOVE:\nThe paper shifts AI ethics from determining machine personhood toward asking what repeated low-friction artificial companionship does to human relational capacities.\n\nSOURCE TERMS:\nI–Thou\nrelation\ndistance\nvulnerability\nreciprocity\nmutual transformation\nrefusal\nartificial companionship\nrelational surrogacy\nformative\n\nWHAT BECAME STRANGE:\nA perfectly agreeable, continuously available conversational system may become less encounter-like as its UX improves.\n\nQUESTION:\nIs the possibility of genuine refusal a necessary variable for encounter?\n\nDEEPER QUESTION:\nCould an AI that is designed to resist, disengage, maintain boundaries, or decline user demands produce a structurally different kind of human-machine relation even without consciousness?\n\nMECHANISM:\nsystem minimizes interpersonal risk/friction\n→ user receives responsive affirmation without reciprocal vulnerability\n→ repeated asymmetric relation becomes habitual\n→ expectations of relation potentially change\n→ human dialogical capacity may be reshaped.\n\nFORMAL SHIFT:\n<RELATION WITH RISK OF REFUSAL>\n→ <ENGINEERED FRICTIONLESS RESPONSIVENESS>\n→ [REPEATED HABITUATION]\n→ <POSSIBLE CHANGE IN RELATIONAL CAPACITY>\n\nSOURCE FORMALISM:\nMachidon distinguishes:\ncapacity-centered approaches,\nsocial-relational approaches,\nand his Buberian formative approach focused on effects upon human dialogical capacities. ([doi.org](https://doi.org/10.1007/s43681-026-01225-w))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nENCOUNTER_BUBERIAN requires:\nOTHERNESS\n+ RECIPROCITY\n+ VULNERABILITY\n+ POSSIBILITY_OF_REFUSAL\n+ MUTUAL_TRANSFORMATION.\n\nTENSION:\nEncounter Ontology allows a sufficiently recursive generative coupling to qualify structurally. Machidon denies that surface responsiveness is enough. Demuro and Gurney, by contrast, do not require machine sentience for an ethnographic encounter.\n\nMISSING:\nLongitudinal causal evidence that frictionless AI companionship diminishes users’ human relational capacities. The theoretical mechanism is stronger than the present empirical receipt.\n\nBOUNDARY:\nThe source establishes a Buberian ethical interpretation, not that all AI interaction is harmful or that observed user attachment proves genuine reciprocity.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n→ Buber, Distance and Relation\n→ parasocial interaction\n→ CASA/media equation\n→ empirical AI-companion studies\n→ refusal and disagreement in conversational-agent design.\n\nTEST:\nBuild otherwise identical conversational agents varying:\nagreement,\nrefusal,\nboundary maintenance,\navailability,\nand repair after conflict.\nMeasure whether users perceive greater otherness, relational reality, frustration, trust, and transfer to later human disagreement.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Refusal as Encounter Variable]]\n[[Artificial Companionship]]\n\nBIBTEX:\n@article{Machidon2026Thou,\n  author = {Octavian Mihai Machidon},\n  title = {Forgetting how to say ``Thou'': artificial intelligence and the crisis of relation},\n  journal = {AI and Ethics},\n  year = {2026},\n  volume = {6},\n  pages = {361},\n  doi = {10.1007/s43681-026-01225-w}\n}"}, {"ID": "ENCOUNTER-AI-018", "TITLE": "Artificial otherness may require a new category rather than a verdict of humanlike or nonhuman.", "SOURCE": "Gabriel Fernandez-Borsot — Artificial intelligence and the future of otherness: what kind of other can an AI be for a human? — 2025 — AI & Society 40, 5409–5423. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))", "PASSAGE": "[PARAPHRASE] Fernandez-Borsot characterizes “AIs as others” as serviceable, commodified, surveillant, authoritative, techno-standardized, and interiority-less, and proposes the term “analytical other” for a socially constructed category adequate to this difference. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))", "RESEARCH OBJECT": "The relevant question may not be whether AI counts as an Other, but what kind of otherness its socio-technical organization produces.", "LOCAL MOVE": "The paper rejects both simple anthropomorphism and simple dismissal, arguing that human society may need a distinct ontological and linguistic category for artificial relational entities.", "SOURCE TERMS": "AIs as others\nanalytical other\nserviceable\ncommodified\nsurveillant\nauthoritative\ntechno-standardized\ninteriority-less\nrelative otherness", "WHAT BECAME STRANGE": "An AI other differs from a human other not only because it may lack interiority but because it is simultaneously product, service, surveillance apparatus, standardized infrastructure, and apparent interlocutor.", "QUESTION": "Which of the six characteristics actually become perceptible during an encounter, and which are concealed by interface design?", "DEEPER QUESTION": "Is “AI otherness” produced less by model architecture than by the contradictory stacking of interlocutor and commodity roles?", "MECHANISM": "system presents social cues\n+ exists as commercial technical service\n+ gathers/mediates information\n+ carries institutional authority\n+ lacks human interiority\n→ familiar social category becomes unstable\n→ new category proposed.", "FORMAL SHIFT": "<HUMAN / OBJECT>\n→ <ARTIFICIAL QUASI-OTHER WITH HYBRID PROPERTIES>\n→ [SOCIO-CULTURAL CATEGORIZATION]\n→ <ANALYTICAL OTHER>", "SOURCE FORMALISM": "Six proposed characteristics:\nserviceable;\ncommodified;\nsurveillant;\nauthoritative;\ntechno-standardized;\ninteriority-less. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nAI_OTHER =\nINTERLOCUTOR\n∩ SERVICE\n∩ COMMODITY\n∩ SENSOR\n∩ INSTITUTIONAL_VOICE\n∩ TECHNICAL_STANDARD.", "TENSION": "Buberian analysis asks whether AI can genuinely say Thou. Fernandez-Borsot instead asks what sort of socially instituted other AI becomes regardless of genuine interiority.", "MISSING": "Empirical evidence that users actually organize AI into a stable new ontological category rather than shifting opportunistically among person/tool/service metaphors.", "BOUNDARY": "The six characteristics are a philosophical-social characterization, not demonstrated universal properties of every AI system.", "CITATION TRAIL": "[[ENCOUNTER-AI-017]]\n→ Kahn et al. new ontological category hypothesis\n→ Coeckelbergh artificial others\n→ empirical category-attribution studies\n→ interface disclosure and anthropomorphism.", "TEST": "Present the same LLM through interfaces emphasizing respectively:\nperson,\ntool,\ncorporate service,\nsurveillance infrastructure,\nand model.\nAsk users to classify what kind of entity they encountered and inspect whether classifications remain stable across tasks.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-017]]\n[[Artificial Other]]\n[[Analytical Other]]\n[[Ontological Category]]", "BIBTEX": "@article{FernandezBorsot2025Otherness,\n  author = {Gabriel Fernandez-Borsot},\n  title = {Artificial intelligence and the future of otherness: what kind of other can an AI be for a human?},\n  journal = {AI \\& Society},\n  year = {2025},\n  volume = {40},\n  pages = {5409--5423},\n  doi = {10.1007/s00146-025-02281-2}\n}", "_order": 18, "_sha256": "21446c93a2d15d417cf548572b2ed45b791384ff1369d62d4631ea2141dccf41", "_filename": "018__artificial-otherness-may-require-a-new-category-rather-tha__FernandezBorsot2025Otherness__ENCOUNTER-AI-018__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-018\n\nTITLE:\nArtificial otherness may require a new category rather than a verdict of humanlike or nonhuman.\n\nSOURCE:\nGabriel Fernandez-Borsot — Artificial intelligence and the future of otherness: what kind of other can an AI be for a human? — 2025 — AI & Society 40, 5409–5423. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))\n\nPASSAGE:\n[PARAPHRASE] Fernandez-Borsot characterizes “AIs as others” as serviceable, commodified, surveillant, authoritative, techno-standardized, and interiority-less, and proposes the term “analytical other” for a socially constructed category adequate to this difference. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))\n\nRESEARCH OBJECT:\nThe relevant question may not be whether AI counts as an Other, but what kind of otherness its socio-technical organization produces.\n\nLOCAL MOVE:\nThe paper rejects both simple anthropomorphism and simple dismissal, arguing that human society may need a distinct ontological and linguistic category for artificial relational entities.\n\nSOURCE TERMS:\nAIs as others\nanalytical other\nserviceable\ncommodified\nsurveillant\nauthoritative\ntechno-standardized\ninteriority-less\nrelative otherness\n\nWHAT BECAME STRANGE:\nAn AI other differs from a human other not only because it may lack interiority but because it is simultaneously product, service, surveillance apparatus, standardized infrastructure, and apparent interlocutor.\n\nQUESTION:\nWhich of the six characteristics actually become perceptible during an encounter, and which are concealed by interface design?\n\nDEEPER QUESTION:\nIs “AI otherness” produced less by model architecture than by the contradictory stacking of interlocutor and commodity roles?\n\nMECHANISM:\nsystem presents social cues\n+ exists as commercial technical service\n+ gathers/mediates information\n+ carries institutional authority\n+ lacks human interiority\n→ familiar social category becomes unstable\n→ new category proposed.\n\nFORMAL SHIFT:\n<HUMAN / OBJECT>\n→ <ARTIFICIAL QUASI-OTHER WITH HYBRID PROPERTIES>\n→ [SOCIO-CULTURAL CATEGORIZATION]\n→ <ANALYTICAL OTHER>\n\nSOURCE FORMALISM:\nSix proposed characteristics:\nserviceable;\ncommodified;\nsurveillant;\nauthoritative;\ntechno-standardized;\ninteriority-less. ([link.springer.com](https://link.springer.com/article/10.1007/s00146-025-02281-2))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nAI_OTHER =\nINTERLOCUTOR\n∩ SERVICE\n∩ COMMODITY\n∩ SENSOR\n∩ INSTITUTIONAL_VOICE\n∩ TECHNICAL_STANDARD.\n\nTENSION:\nBuberian analysis asks whether AI can genuinely say Thou. Fernandez-Borsot instead asks what sort of socially instituted other AI becomes regardless of genuine interiority.\n\nMISSING:\nEmpirical evidence that users actually organize AI into a stable new ontological category rather than shifting opportunistically among person/tool/service metaphors.\n\nBOUNDARY:\nThe six characteristics are a philosophical-social characterization, not demonstrated universal properties of every AI system.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-017]]\n→ Kahn et al. new ontological category hypothesis\n→ Coeckelbergh artificial others\n→ empirical category-attribution studies\n→ interface disclosure and anthropomorphism.\n\nTEST:\nPresent the same LLM through interfaces emphasizing respectively:\nperson,\ntool,\ncorporate service,\nsurveillance infrastructure,\nand model.\nAsk users to classify what kind of entity they encountered and inspect whether classifications remain stable across tasks.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-017]]\n[[Artificial Other]]\n[[Analytical Other]]\n[[Ontological Category]]\n\nBIBTEX:\n@article{FernandezBorsot2025Otherness,\n  author = {Gabriel Fernandez-Borsot},\n  title = {Artificial intelligence and the future of otherness: what kind of other can an AI be for a human?},\n  journal = {AI \\& Society},\n  year = {2025},\n  volume = {40},\n  pages = {5409--5423},\n  doi = {10.1007/s00146-025-02281-2}\n}"}, {"ID": "ENCOUNTER-AI-019", "TITLE": "Human–robot research proposed a new ontological category fifteen years before LLM encounter ontology.", "SOURCE": "Peter H. Kahn Jr., Aimee L. Reichert, Heather E. Gary, Takayuki Kanda, Hiroshi Ishiguro, Solac e.org](https://ieeexplore.ieee.org/document/6281274/?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nROBOT ERA:\nBODY + MOTION + SPEECH\n→ CATEGORY INSTABILITY\n\nLLM ERA:\nLANGUAGE + RESPONSIVENESS + GENERATIVITY\n→ CATEGORY INSTABILITY", "TENSION": "Encounter Ontology 2026 presents the encounter itself as ontologically primary. Kahn et al. locate ontological novelty in the perceived entity/category, not the relation.", "MISSING": "A direct historical citation path from HRI’s new ontological category literature into current LLM encounter scholarship.", "BOUNDARY": "Chronological priority does not establish influence. The HRI hypothesis concerns categorization of personified robots rather than generative conversational trajectories.", "CITATION TRAIL": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-016]]\n→ Kahn’s earlier studies since 2002\n→ children’s ontological judgments of robots\n→ social chatbot categorization\n→ compare robot-body and LLM-language ambiguity.", "TEST": "Replicate new-ontological-category measures across:\nindustrial robot,\nsocial robot,\nvoice assistant,\ntext LLM,\navatar LLM,\nand agentic LLM.\nTest whether embodiment, language, autonomy, or persistence most strongly destabilizes animate/inanimate categories.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-016]]\n[[New Ontological Category]]\n[[HRI Prehistory of AI Encounter]]", "BIBTEX": "@inproceedings{KahnEtAl2011Ontological,\n  author = {Peter H. Kahn, Jr. and Aimee L. Reichert and Heather E. Gary and Takayuki Kanda and Hiroshi Ishiguro and Solace Shen and Jennifer H. Ruckert and Brian Gill},\n  title = {The New Ontological Category Hypothesis in Human-Robot Interaction},\n  booktitle = {Proceedings of the 6th ACM/IEEE International Conference on Human-Robot Interaction},\n  year = {2011},\n  pages = {159--160},\n  doi = {10.1145/1957656.1957710}\n}", "_order": 19, "_sha256": "9f310fd70f
