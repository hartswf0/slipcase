 behaviors\n→ existing binary categories conflict\n→ users attribute mixed properties\n→ hybrid classification stabilizes\n→ candidate new category emerges.\n\nFORMAL SHIFT:\n<ANIMATE | INANIMATE>\n→ <PERSONIFIED COMPUTATIONAL ENTITY>\n→ [CONFLICTING ATTRIBUTION]\n→ <NEW ONTOLOGICAL CATEGORY?>\n\nSOURCE FORMALISM:\nThe hypothesis treats basic categories of being as empirically investigable through human responses to personified robots. ([ieeexplore.ieee.org](https://ieeexplore.ieee.org/document/6281274/?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nROBOT ERA:\nBODY + MOTION + SPEECH\n→ CATEGORY INSTABILITY\n\nLLM ERA:\nLANGUAGE + RESPONSIVENESS + GENERATIVITY\n→ CATEGORY INSTABILITY\n\nTENSION:\nEncounter Ontology 2026 presents the encounter itself as ontologically primary. Kahn et al. locate ontological novelty in the perceived entity/category, not the relation.\n\nMISSING:\nA direct historical citation path from HRI’s new ontological category literature into current LLM encounter scholarship.\n\nBOUNDARY:\nChronological priority does not establish influence. The HRI hypothesis concerns categorization of personified robots rather than generative conversational trajectories.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-016]]\n→ Kahn’s earlier studies since 2002\n→ children’s ontological judgments of robots\n→ social chatbot categorization\n→ compare robot-body and LLM-language ambiguity.\n\nTEST:\nReplicate new-ontological-category measures across:\nindustrial robot,\nsocial robot,\nvoice assistant,\ntext LLM,\navatar LLM,\nand agentic LLM.\nTest whether embodiment, language, autonomy, or persistence most strongly destabilizes animate/inanimate categories.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-016]]\n[[New Ontological Category]]\n[[HRI Prehistory of AI Encounter]]\n\nBIBTEX:\n@inproceedings{KahnEtAl2011Ontological,\n  author = {Peter H. Kahn, Jr. and Aimee L. Reichert and Heather E. Gary and Takayuki Kanda and Hiroshi Ishiguro and Solace Shen and Jennifer H. Ruckert and Brian Gill},\n  title = {The New Ontological Category Hypothesis in Human-Robot Interaction},\n  booktitle = {Proceedings of the 6th ACM/IEEE International Conference on Human-Robot Interaction},\n  year = {2011},\n  pages = {159--160},\n  doi = {10.1145/1957656.1957710}\n}"}, {"ID": "ENCOUNTER-AI-020", "TITLE": "HCI operationalized long-term human–computer relationship before generative AI made relation appear spontaneous.", "SOURCE": "Timothy W. Bickmore and Rosalind W. Picard — Establishing and Maintaining Long-Term Human-Computer Relationships — 2005 — ACM Transactions on Computer-Human Interaction 12(2), 293–327. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Bickmore and Picard define relational agents as computational artifacts specifically designed to establish and maintain long-term social-emotional relationships with users and experimentally compare such an agent with a task-oriented alternative. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))", "RESEARCH OBJECT": "A substantial part of what now gets called AI encounter already existed as deliberately engineered relational continuity.", "LOCAL MOVE": "The authors borrow from social psychology, sociolinguistics, and communication research to turn “relationship” into a design target and measurable HCI outcome.", "SOURCE TERMS": "relational agents\nlong-term interaction\nsocial-emotional relationship\ntrust\nliking\nrespect\nrelationship quality", "WHAT BECAME STRANGE": "LLMs did not introduce computers that users could form relationships with. They changed the generative bandwidth, linguistic flexibility, and apparent openness of a much older design program.", "QUESTION": "Which properties of present LLM encounters are genuinely new relative to relational-agent HCI?", "DEEPER QUESTION": "Is “encounter” new because the machine changed, because interaction became linguistically open-ended, or because users can no longer easily perceive the relationship script?", "MECHANISM": "encode relationship-building behaviors\n→ repeated interaction\n→ maintain social history/continuity\n→ user attributes relational qualities\n→ trust/liking/continuation intention changes.", "FORMAL SHIFT": "<TASK-ORIENTED AGENT>\n→ <RELATIONSHIP-BUILDING DESIGN>\n→ [REPEATED SOCIAL-EMOTIONAL INTERACTION]\n→ <MEASURABLE HUMAN-COMPUTER RELATIONSHIP>", "SOURCE FORMALISM": "The reported controlled experiment involved 101 users interacting daily with an exercise-adoption system for a month; the relational-agent condition produced greater reported respect, liking, trust, and desire to continue interaction than an equivalent task-oriented agent. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nRELATIONAL CONTINUITY =\nMEMORY\n+ SOCIAL CUES\n+ REPEATED CONTACT\n+ RELATIONSHIP MAINTENANCE OPERATIONS.\n\nGENERATIVITY is not logically required.", "TENSION": "Encounter Ontology treats generative open-endedness as one admission condition. Bickmore and Picard show that persistent social relationship effects can be engineered without contemporary generative models.", "MISSING": "A direct experimental comparison between scripted relational agents and generative LLM agents holding memory, embodiment, and interaction duration constant.", "BOUNDARY": "Measured liking, trust, and continuation desire demonstrate effects on users. They do not demonstrate reciprocal social relationship in the strong philosophical sense.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-017]]\n→ relational agents\n→ CASA/media equation\n→ longitudinal chatbot relationships\n→ generative companions\n→ persistent-memory agents.", "TEST": "Compare scripted and generative agents across one month while matching relational cues and memory. Test whether generativity predicts conceptual change, perceived autonomy, surprise, attachment, or only conversational breadth.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-017]]\n[[Relational Agents]]\n[[Long-Term Human-Computer Relationship]]", "BIBTEX": "@article{BickmorePicard2005Relationships,\n  author = {Timothy W. Bickmore and Rosalind W. Picard},\n  title = {Establishing and Maintaining Long-Term Human-Computer Relationships},\n  journal = {ACM Transactions on Computer-Human Interaction},\n  year = {2005},\n  volume = {12},\n  number = {2},\n  pages = {293--327},\n  doi = {10.1145/1067860.1067867}\n}", "_order": 20, "_sha256": "886c1fd81158bbdf8c5fc08d547d825fe454bdd587d29634d5cdffcfd117cb00", "_filename": "020__hci-operationalized-long-term-humancomputer-relationship-b__BickmorePicard2005Relationships__ENCOUNTER-AI-020__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-020\n\nTITLE:\nHCI operationalized long-term human–computer relationship before generative AI made relation appear spontaneous.\n\nSOURCE:\nTimothy W. Bickmore and Rosalind W. Picard — Establishing and Maintaining Long-Term Human-Computer Relationships — 2005 — ACM Transactions on Computer-Human Interaction 12(2), 293–327. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Bickmore and Picard define relational agents as computational artifacts specifically designed to establish and maintain long-term social-emotional relationships with users and experimentally compare such an agent with a task-oriented alternative. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nA substantial part of what now gets called AI encounter already existed as deliberately engineered relational continuity.\n\nLOCAL MOVE:\nThe authors borrow from social psychology, sociolinguistics, and communication research to turn “relationship” into a design target and measurable HCI outcome.\n\nSOURCE TERMS:\nrelational agents\nlong-term interaction\nsocial-emotional relationship\ntrust\nliking\nrespect\nrelationship quality\n\nWHAT BECAME STRANGE:\nLLMs did not introduce computers that users could form relationships with. They changed the generative bandwidth, linguistic flexibility, and apparent openness of a much older design program.\n\nQUESTION:\nWhich properties of present LLM encounters are genuinely new relative to relational-agent HCI?\n\nDEEPER QUESTION:\nIs “encounter” new because the machine changed, because interaction became linguistically open-ended, or because users can no longer easily perceive the relationship script?\n\nMECHANISM:\nencode relationship-building behaviors\n→ repeated interaction\n→ maintain social history/continuity\n→ user attributes relational qualities\n→ trust/liking/continuation intention changes.\n\nFORMAL SHIFT:\n<TASK-ORIENTED AGENT>\n→ <RELATIONSHIP-BUILDING DESIGN>\n→ [REPEATED SOCIAL-EMOTIONAL INTERACTION]\n→ <MEASURABLE HUMAN-COMPUTER RELATIONSHIP>\n\nSOURCE FORMALISM:\nThe reported controlled experiment involved 101 users interacting daily with an exercise-adoption system for a month; the relational-agent condition produced greater reported respect, liking, trust, and desire to continue interaction than an equivalent task-oriented agent. ([media.mit.edu](https://www.media.mit.edu/publications/establishing-and-maintaining-long-term-human-computer-relationships/?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nRELATIONAL CONTINUITY =\nMEMORY\n+ SOCIAL CUES\n+ REPEATED CONTACT\n+ RELATIONSHIP MAINTENANCE OPERATIONS.\n\nGENERATIVITY is not logically required.\n\nTENSION:\nEncounter Ontology treats generative open-endedness as one admission condition. Bickmore and Picard show that persistent social relationship effects can be engineered without contemporary generative models.\n\nMISSING:\nA direct experimental comparison between scripted relational agents and generative LLM agents holding memory, embodiment, and interaction duration constant.\n\nBOUNDARY:\nMeasured liking, trust, and continuation desire demonstrate effects on users. They do not demonstrate reciprocal social relationship in the strong philosophical sense.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-017]]\n→ relational agents\n→ CASA/media equation\n→ longitudinal chatbot relationships\n→ generative companions\n→ persistent-memory agents.\n\nTEST:\nCompare scripted and generative agents across one month while matching relational cues and memory. Test whether generativity predicts conceptual change, perceived autonomy, surprise, attachment, or only conversational breadth.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-017]]\n[[Relational Agents]]\n[[Long-Term Human-Computer Relationship]]\n\nBIBTEX:\n@article{BickmorePicard2005Relationships,\n  author = {Timothy W. Bickmore and Rosalind W. Picard},\n  title = {Establishing and Maintaining Long-Term Human-Computer Relationships},\n  journal = {ACM Transactions on Computer-Human Interaction},\n  year = {2005},\n  volume = {12},\n  number = {2},\n  pages = {293--327},\n  doi = {10.1145/1067860.1067867}\n}"}, {"ID": "ENCOUNTER-AI-021", "TITLE": "Before theorizing AI encounter, philosophy must decide whether communication occurred at all.", "SOURCE": "Herman Cappelen and Rachel Sterken — Introduction — Communicating with AI: Philosophical Perspectives — 2026 — pp. xi–xviii. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018117?utm_source=chatgpt.com))", "PASSAGE": "[QUOTE] The editors ask whether “the entire framework of communication is a mistake” and whether interaction with LLMs requires a new conceptual framework. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018117?utm_source=chatgpt.com))", "RESEARCH OBJECT": "“Encounter” enters a field in which even the apparently weaker category “communication” remains philosophically unsettled.", "LOCAL MOVE": "The volume suspends the assumption that fluent linguistic exchange proves shared language, understanding, meaningful speech acts, or ordinary communicative relation.", "SOURCE TERMS": "communication\nshared language\nunderstanding\nalien\nmeaning\nspeech acts\ntrust\nresponsibility\nde-anthropomorphizing", "WHAT BECAME STRANGE": "Calling something an encounter may smuggle in more relational structure than calling it communication, while philosophers are still disputing whether communication is present.", "QUESTION": "What does “encounter” allow us to analyze without first settling whether the LLM understands or means anything?", "DEEPER QUESTION": "Could encounter be deliberately thinner than communication at the semantic level while thicker than interaction at the consequential level?", "MECHANISM": "human enters words\n→ model produces answer-like sequence\n→ human interprets output\n→ philosophical uncertainty remains about meaning/understanding\n→ nevertheless practical and epistemic consequences occur.", "FORMAL SHIFT": "<APPARENT CONVERSATION>\n→ <SEMANTIC / INTENTIONAL UNCERTAINTY>\n→ [CONCEPTUAL SUSPENSION]\n→ <SEARCH FOR BETTER RELATIONAL CATEGORY>", "SOURCE FORMALISM": "The volume organizes disputes around:\nmeaning and intentionality;\nalien semantics/externalism;\nnorms, trust, responsibility;\ncognitive architectures and ethics. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573020342?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nPOSSIBLE DISTINCTION:\n\nINTERACTION:\ncausal exchange.\n\nCOMMUNICATION:\nmeaning-bearing exchange.\n\nENCOUNTER:\nsituated consequential event that may remain agnostic about machine-side meaning.", "TENSION": "Demuro and Gurney call ChatGPT a nonhuman interlocutor without requiring sentience. Machidon reserves genuine encounter for reciprocal vulnerable relation. The Oxford volume shows that the intermediate notion of communication itself cannot be taken for granted.", "MISSING": "A theory specifying which properties encounter requires while remaining neutral on contested claims about AI semantics and consciousness.", "BOUNDARY": "The editors pose an open methodological problem. They do not endorse “encounter” as its solution.", "CITATION TRAIL": "[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-015]]\n→ chapters on meaningless outputs\n→ hyper-externalism\n→ Wittgenstein’s lion\n→ stochastic measuring devices\n→ speech-act responsibility gaps.", "TEST": "Take candidate definitions of encounter and remove, one by one:\nmachine meaning,\nmachine intention,\nmachine sentience,\nmachine belief,\nshared language.\nIdentify the weakest definition that still distinguishes encounter from arbitrary causal interaction.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-015]]\n[[Communication Is Not Given]]\n[[Encounter Without Understanding]]", "BIBTEX": "@incollection{CappelenSterken2026Introduction,\n  author = {Herman Cappelen and Rachel Sterken},\n  title = {Introduction},\n  booktitle = {Communicating with AI: Philosophical Perspectives},\n  editor = {Herman Cappelen and Rachel Sterken},\n  publisher = {Oxford University Press},\n  year = {2026},\n  pages = {xi--xviii},\n  doi = {10.1093/9780191998317.002.0006}\n}", "_order": 21, "_sha256": "e98e692c02d21db59c6bf268d42df86b544e00f8da470d7555d885243f03ed82", "_filename": "021__before-theorizing-ai-encounter-philosophy-must-decide-whet__CappelenSterken2026Introduction__ENCOUNTER-AI-021__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-021\n\nTITLE:\nBefore theorizing AI encounter, philosophy must decide whether communication occurred at all.\n\nSOURCE:\nHerman Cappelen and Rachel Sterken — Introduction — Communicating with AI: Philosophical Perspectives — 2026 — pp. xi–xviii. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018117?utm_source=chatgpt.com))\n\nPASSAGE:\n[QUOTE] The editors ask whether “the entire framework of communication is a mistake” and whether interaction with LLMs requires a new conceptual framework. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018117?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\n“Encounter” enters a field in which even the apparently weaker category “communication” remains philosophically unsettled.\n\nLOCAL MOVE:\nThe volume suspends the assumption that fluent linguistic exchange proves shared language, understanding, meaningful speech acts, or ordinary communicative relation.\n\nSOURCE TERMS:\ncommunication\nshared language\nunderstanding\nalien\nmeaning\nspeech acts\ntrust\nresponsibility\nde-anthropomorphizing\n\nWHAT BECAME STRANGE:\nCalling something an encounter may smuggle in more relational structure than calling it communication, while philosophers are still disputing whether communication is present.\n\nQUESTION:\nWhat does “encounter” allow us to analyze without first settling whether the LLM understands or means anything?\n\nDEEPER QUESTION:\nCould encounter be deliberately thinner than communication at the semantic level while thicker than interaction at the consequential level?\n\nMECHANISM:\nhuman enters words\n→ model produces answer-like sequence\n→ human interprets output\n→ philosophical uncertainty remains about meaning/understanding\n→ nevertheless practical and epistemic consequences occur.\n\nFORMAL SHIFT:\n<APPARENT CONVERSATION>\n→ <SEMANTIC / INTENTIONAL UNCERTAINTY>\n→ [CONCEPTUAL SUSPENSION]\n→ <SEARCH FOR BETTER RELATIONAL CATEGORY>\n\nSOURCE FORMALISM:\nThe volume organizes disputes around:\nmeaning and intentionality;\nalien semantics/externalism;\nnorms, trust, responsibility;\ncognitive architectures and ethics. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573020342?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nPOSSIBLE DISTINCTION:\n\nINTERACTION:\ncausal exchange.\n\nCOMMUNICATION:\nmeaning-bearing exchange.\n\nENCOUNTER:\nsituated consequential event that may remain agnostic about machine-side meaning.\n\nTENSION:\nDemuro and Gurney call ChatGPT a nonhuman interlocutor without requiring sentience. Machidon reserves genuine encounter for reciprocal vulnerable relation. The Oxford volume shows that the intermediate notion of communication itself cannot be taken for granted.\n\nMISSING:\nA theory specifying which properties encounter requires while remaining neutral on contested claims about AI semantics and consciousness.\n\nBOUNDARY:\nThe editors pose an open methodological problem. They do not endorse “encounter” as its solution.\n\nCITATION TRAIL:\n[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-015]]\n→ chapters on meaningless outputs\n→ hyper-externalism\n→ Wittgenstein’s lion\n→ stochastic measuring devices\n→ speech-act responsibility gaps.\n\nTEST:\nTake candidate definitions of encounter and remove, one by one:\nmachine meaning,\nmachine intention,\nmachine sentience,\nmachine belief,\nshared language.\nIdentify the weakest definition that still distinguishes encounter from arbitrary causal interaction.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-006]]\n[[ENCOUNTER-AI-015]]\n[[Communication Is Not Given]]\n[[Encounter Without Understanding]]\n\nBIBTEX:\n@incollection{CappelenSterken2026Introduction,\n  author = {Herman Cappelen and Rachel Sterken},\n  title = {Introduction},\n  booktitle = {Communicating with AI: Philosophical Perspectives},\n  editor = {Herman Cappelen and Rachel Sterken},\n  publisher = {Oxford University Press},\n  year = {2026},\n  pages = {xi--xviii},\n  doi = {10.1093/9780191998317.002.0006}\n}"}, {"ID": "ENCOUNTER-AI-022", "TITLE": "The strongest counterexample to AI-as-other is AI-as-instrument.", "SOURCE": "Communicating with AI: Philosophical Perspectives — “Large Language Models Are Stochastic Measuring Devices” — 2026 — Oxford University Press. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] The chapter proposes that so-called communication with AI may be better understood as interaction with a scientific instrument, drawing on measurement and simulation rather than the philosophy of other minds. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))", "RESEARCH OBJECT": "Fluent response does not force an interlocutor ontology; the same behavior can be redescribed instrumentally.", "LOCAL MOVE": "The chapter relocates questions about LLM interpretation into philosophy of science: neural models can function as measuring devices and simulation machinery rather than speakers.", "SOURCE TERMS": "stochastic measuring device\nmeasurement\nsimulation\nscientific instrument\ninterpretation\ncommunication\nneural network", "WHAT BECAME STRANGE": "Encounter phenomenology and instrument ontology can coexist. A human may experience being addressed while the best explanatory account treats the generating system as measurement apparatus.", "QUESTION": "How could evidence discriminate AI-as-interlocutor from AI-as-instrument when both predict responsive text?", "DEEPER QUESTION": "Is “encounter” useful precisely because it permits the encountered entity to remain ontologically undecided?", "MECHANISM": "training data/environment\n→ neural model\n→ prompt/probe\n→ stochastic generative simulation\n→ output\n→ human interprets output as measurement or message.", "FORMAL SHIFT": "<LLM AS SPEAKER>\n→ <LLM AS TRAINED MODEL / INSTRUMENT>\n→ [PROMPT AS PROBE]\n→ <OUTPUT AS STOCHASTIC MEASUREMENT>", "SOURCE FORMALISM": "The chapter explicitly proposes scientific measurement as an alternative conceptual framework for understanding interactions commonly described as communicating with AI. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINTERLOCUTOR READING:\nPROMPT → OTHER → REPLY\n\nINSTRUMENT READING:\nPROBE → MODEL → MEASUREMENT\n\nENCOUNTER QUESTION:\nWhat remains invariant across both descriptions?", "TENSION": "Floridi’s artificial agency thesis grants a novel non-intelligent agency. Encounter Ontology assigns emergence to the relation. The measuring-device account may eliminate both as unnecessary ontological inflation.", "MISSING": "Cases where interlocutor and instrument models make different empirical predictions rather than merely supporting different vocabularies.", "BOUNDARY": "The instrumental account does not imply that interactions are socially or psychologically inconsequential. It disputes how the computational participant should be characterized.", "CITATION TRAIL": "[[ENCOUNTER-AI-014]]\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-021]]\n→ philosophy of scientific measurement\n→ model interpretation\n→ human-machine communication\n→ prompt-as-probe experiments.", "TEST": "Run identical LLM tasks under two framings:\n“you are conversing with an AI partner”\nversus\n“you are probing a stochastic linguistic instrument.”\nMeasure interaction strategy, epistemic trust, anthropomorphic attribution, repair behavior, and conceptual change. Determine which encounter phenomena depend upon the interlocutor framing.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-014]]\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-021]]\n[[AI as Instrument]]\n[[Prompt as Probe]]", "BIBTEX": "@incollection{StochasticMeasuringDevices2026,\n  title = {Large Language Models Are Stochastic Measuring Devices},\n  booktitle = {Communicating with AI: Philosophical Perspectives},\n  editor = {Herman Cappelen and Rachel Sterken},\n  publisher = {Oxford University Press},\n  year = {2026}\n}", "_order": 22, "_sha256": "0317bdbd34d7d8e12abaaa51ee0ff4145328184715e84521ce39026135f1023d", "_filename": "022__the-strongest-counterexample-to-ai-as-other-is-ai-as-instr__StochasticMeasuringDevices2026__ENCOUNTER-AI-022__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-022\n\nTITLE:\nThe strongest counterexample to AI-as-other is AI-as-instrument.\n\nSOURCE:\nCommunicating with AI: Philosophical Perspectives — “Large Language Models Are Stochastic Measuring Devices” — 2026 — Oxford University Press. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] The chapter proposes that so-called communication with AI may be better understood as interaction with a scientific instrument, drawing on measurement and simulation rather than the philosophy of other minds. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nFluent response does not force an interlocutor ontology; the same behavior can be redescribed instrumentally.\n\nLOCAL MOVE:\nThe chapter relocates questions about LLM interpretation into philosophy of science: neural models can function as measuring devices and simulation machinery rather than speakers.\n\nSOURCE TERMS:\nstochastic measuring device\nmeasurement\nsimulation\nscientific instrument\ninterpretation\ncommunication\nneural network\n\nWHAT BECAME STRANGE:\nEncounter phenomenology and instrument ontology can coexist. A human may experience being addressed while the best explanatory account treats the generating system as measurement apparatus.\n\nQUESTION:\nHow could evidence discriminate AI-as-interlocutor from AI-as-instrument when both predict responsive text?\n\nDEEPER QUESTION:\nIs “encounter” useful precisely because it permits the encountered entity to remain ontologically undecided?\n\nMECHANISM:\ntraining data/environment\n→ neural model\n→ prompt/probe\n→ stochastic generative simulation\n→ output\n→ human interprets output as measurement or message.\n\nFORMAL SHIFT:\n<LLM AS SPEAKER>\n→ <LLM AS TRAINED MODEL / INSTRUMENT>\n→ [PROMPT AS PROBE]\n→ <OUTPUT AS STOCHASTIC MEASUREMENT>\n\nSOURCE FORMALISM:\nThe chapter explicitly proposes scientific measurement as an alternative conceptual framework for understanding interactions commonly described as communicating with AI. ([academic.oup.com](https://academic.oup.com/book/63302/chapter/573018260?utm_source=chatgpt.com))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINTERLOCUTOR READING:\nPROMPT → OTHER → REPLY\n\nINSTRUMENT READING:\nPROBE → MODEL → MEASUREMENT\n\nENCOUNTER QUESTION:\nWhat remains invariant across both descriptions?\n\nTENSION:\nFloridi’s artificial agency thesis grants a novel non-intelligent agency. Encounter Ontology assigns emergence to the relation. The measuring-device account may eliminate both as unnecessary ontological inflation.\n\nMISSING:\nCases where interlocutor and instrument models make different empirical predictions rather than merely supporting different vocabularies.\n\nBOUNDARY:\nThe instrumental account does not imply that interactions are socially or psychologically inconsequential. It disputes how the computational participant should be characterized.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-014]]\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-021]]\n→ philosophy of scientific measurement\n→ model interpretation\n→ human-machine communication\n→ prompt-as-probe experiments.\n\nTEST:\nRun identical LLM tasks under two framings:\n“you are conversing with an AI partner”\nversus\n“you are probing a stochastic linguistic instrument.”\nMeasure interaction strategy, epistemic trust, anthropomorphic attribution, repair behavior, and conceptual change. Determine which encounter phenomena depend upon the interlocutor framing.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-014]]\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-AI-021]]\n[[AI as Instrument]]\n[[Prompt as Probe]]\n\nBIBTEX:\n@incollection{StochasticMeasuringDevices2026,\n  title = {Large Language Models Are Stochastic Measuring Devices},\n  booktitle = {Communicating with AI: Philosophical Perspectives},\n  editor = {Herman Cappelen and Rachel Sterken},\n  publisher = {Oxford University Press},\n  year = {2026}\n}"}, {"ID": "ENCOUNTER-AI-023", "TITLE": "Language may construct the artificial Other before the machine earns that status ontologically.", "SOURCE": "Mark Coeckelbergh — You, Robot: On the Linguistic Construction of Artificial Others — 2011 — AI & Society 26(1), 61–69. ([doi.org](https://doi.org/10.1007/s00146-010-0289-z?utm_source=chatgpt.com))", "PASSAGE": "[PARAPHRASE] Coeckelbergh argues that talk about and talk to robots does not merely report an independently fixed human-robot reality; linguistic practice interprets and co-shapes relations with artificial “quasi-others.” ([researchgate.net](https://www.researchgate.net/publication/220414565_You_Robot_On_the_linguistic_construction_of_artificial_others?utm_source=chatgpt.com))", "RESEARCH OBJECT": "Artificial otherness can be produced through address.", "LOCAL MOVE": "The paper moves the analysis of human-robot relations away from intrinsic machine properties toward phenomenological and hermeneutic mediation by language.", "SOURCE TERMS": "artificial others\nquasi-others\nlanguage\nhuman-robot relations\nphenomenology\nhermeneutics\nsocial relations", "WHAT BECAME STRANGE": "The pronoun “you” may be an operation. Addressing a system as a second person can help constitute the social relation subsequently cited as evidence that it is an other.", "QUESTION": "Does prompting create an artificial second person through grammar before any philosophical determination of agency or personhood occurs?", "DEEPER QUESTION": "Could second-person address be one of the smallest operative mechanisms by which interaction becomes encounter-like?", "MECHANISM": "artifact produces socially legible behavior\n→ human addresses/describes artifact linguistically\n→ linguistic categories mediate experience\n→ expectations and practices shift\n→ artifact is encountered as quasi-other.", "FORMAL SHIFT": "<COMPUTATIONAL ARTIFACT>\n→ <SECOND-PERSON / SOCIAL LANGUAGE>\n→ [HERMENEUTIC MEDIATION]\n→ <ARTIFICIAL QUASI-OTHER>", "SOURCE FORMALISM": "NONE", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nIT → “YOU”\nis not merely grammatical substitution.\n\nIt can function as:\nCATEGORY CHANGE\n→ EXPECTATION CHANGE\n→ INTERACTION CHANGE.", "TENSION": "Fernandez-Borsot argues that AI requires a carefully differentiated “analytical other.” Coeckelbergh suggests that linguistic practice is already actively making artificial others before such classification is stabilized.", "MISSING": "Controlled evidence isolating grammatical address from embodiment, social cues, model behavior, and interface personification.", "BOUNDARY": "Linguistic construction does not imply that ontological properties are arbitrary or that language alone determines what machines are.", "CITATION TRAIL": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n→ Coeckelbergh social-relational ethics\n→ second-person philosophy\n→ CASA/media equation\n→ linguistic anthropomorphism in LLM prompting.", "TEST": "Hold model outputs constant while varying interface and prompt grammar:\nIT-form,\nYOU-form,\nnamed-persona form,\ntool form.\nMeasure perceived agency, reciprocity, obligation, trust, and remembered relation.", "PLATFORM": "[[Encounter Genealogy — AI/HCI/STS/Humanities]]", "LINKS": "[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[Second-Person AI]]\n[[Artificial Quasi-Other]]", "BIBTEX": "@article{Coeckelbergh2011YouRobot,\n  author = {Mark Coeckelbergh},\n  title = {You, Robot: On the Linguistic Construction of Artificial Others},\n  journal = {AI \\& Society},\n  year = {2011},\n  volume = {26},\n  number = {1},\n  pages = {61--69},\n  doi = {10.1007/s00146-010-0289-z}\n}", "_order": 23, "_sha256": "311acfb1e84180efa3ce833637d057458ab9da9704722f53896bfd5c11205802", "_filename": "023__language-may-construct-the-artificial-other-before-the-mac__Coeckelbergh2011YouRobot__ENCOUNTER-AI-023__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-AI-023\n\nTITLE:\nLanguage may construct the artificial Other before the machine earns that status ontologically.\n\nSOURCE:\nMark Coeckelbergh — You, Robot: On the Linguistic Construction of Artificial Others — 2011 — AI & Society 26(1), 61–69. ([doi.org](https://doi.org/10.1007/s00146-010-0289-z?utm_source=chatgpt.com))\n\nPASSAGE:\n[PARAPHRASE] Coeckelbergh argues that talk about and talk to robots does not merely report an independently fixed human-robot reality; linguistic practice interprets and co-shapes relations with artificial “quasi-others.” ([researchgate.net](https://www.researchgate.net/publication/220414565_You_Robot_On_the_linguistic_construction_of_artificial_others?utm_source=chatgpt.com))\n\nRESEARCH OBJECT:\nArtificial otherness can be produced through address.\n\nLOCAL MOVE:\nThe paper moves the analysis of human-robot relations away from intrinsic machine properties toward phenomenological and hermeneutic mediation by language.\n\nSOURCE TERMS:\nartificial others\nquasi-others\nlanguage\nhuman-robot relations\nphenomenology\nhermeneutics\nsocial relations\n\nWHAT BECAME STRANGE:\nThe pronoun “you” may be an operation. Addressing a system as a second person can help constitute the social relation subsequently cited as evidence that it is an other.\n\nQUESTION:\nDoes prompting create an artificial second person through grammar before any philosophical determination of agency or personhood occurs?\n\nDEEPER QUESTION:\nCould second-person address be one of the smallest operative mechanisms by which interaction becomes encounter-like?\n\nMECHANISM:\nartifact produces socially legible behavior\n→ human addresses/describes artifact linguistically\n→ linguistic categories mediate experience\n→ expectations and practices shift\n→ artifact is encountered as quasi-other.\n\nFORMAL SHIFT:\n<COMPUTATIONAL ARTIFACT>\n→ <SECOND-PERSON / SOCIAL LANGUAGE>\n→ [HERMENEUTIC MEDIATION]\n→ <ARTIFICIAL QUASI-OTHER>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nIT → “YOU”\nis not merely grammatical substitution.\n\nIt can function as:\nCATEGORY CHANGE\n→ EXPECTATION CHANGE\n→ INTERACTION CHANGE.\n\nTENSION:\nFernandez-Borsot argues that AI requires a carefully differentiated “analytical other.” Coeckelbergh suggests that linguistic practice is already actively making artificial others before such classification is stabilized.\n\nMISSING:\nControlled evidence isolating grammatical address from embodiment, social cues, model behavior, and interface personification.\n\nBOUNDARY:\nLinguistic construction does not imply that ontological properties are arbitrary or that language alone determines what machines are.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n→ Coeckelbergh social-relational ethics\n→ second-person philosophy\n→ CASA/media equation\n→ linguistic anthropomorphism in LLM prompting.\n\nTEST:\nHold model outputs constant while varying interface and prompt grammar:\nIT-form,\nYOU-form,\nnamed-persona form,\ntool form.\nMeasure perceived agency, reciprocity, obligation, trust, and remembered relation.\n\nPLATFORM:\n[[Encounter Genealogy — AI/HCI/STS/Humanities]]\n\nLINKS:\n[[ENCOUNTER-AI-018]]\n[[ENCOUNTER-AI-019]]\n[[Second-Person AI]]\n[[Artificial Quasi-Other]]\n\nBIBTEX:\n@article{Coeckelbergh2011YouRobot,\n  author = {Mark Coeckelbergh},\n  title = {You, Robot: On the Linguistic Construction of Artificial Others},\n  journal = {AI \\& Society},\n  year = {2011},\n  volume = {26},\n  number = {1},\n  pages = {61--69},\n  doi = {10.1007/s00146-010-0289-z}\n}"}, {"ID": "ENCOUNTER-OP-024", "TITLE": "An encounter needs observable entry, maintenance, and exit conditions before it needs a score.", "SOURCE": "Candace L. Sidner, Christopher Lee, Cory D. Kidd, Neal Lesh, and Charles Rich — “Explorations in Engagement for Humans and Robots” — 2005 — Artificial Intelligence 166(1–2), 140–164. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0004370205000512))", "PASSAGE": "[QUOTE] Engagement is the process by which participants “start, maintain and end their perceived connection to one another.” ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0004370205000512))", "RESEARCH OBJECT": "Before asking whether an encounter is strong, transformative, or meaningful, operationalization needs to determine whether a bounded relational episode has occurred at all.", "LOCAL MOVE": "Sidner and colleagues replace engagement-as-feeling with engagement-as-process. The phenomenon has temporal organization: connection is established, maintained, and terminated.", "SOURCE TERMS": "engagement\nstart\nmaintain\nend\nperceived connection\nconversation\ncollaboration\nengagement gestures", "WHAT BECAME STRANGE": "“Multi-turn” is a weak proxy for encounter duration. Twenty turns can occur without any identifiable transition into a jointly maintained relation, while a short sequence can contain explicit entry, maintenance checking, and disengagement.", "QUESTION": "What observable events mark the transition from mere availability to an active human–AI encounter?", "DEEPER QUESTION": "Can an encounter fail to begin even though prompt-response traffic is occurring?", "MECHANISM": "availability\n→ initiation/contact\n→ uptake\n→ maintained connection\n→ checking/renewal\n→ disengagement\n→ termination.", "FORMAL SHIFT": "<UNSEGMENTED CHAT LOG>\n→ <RELATIONAL PHASES>\n→ [BOUNDARY DETECTION]\n→ <ENCOUNTER EPISODE>", "SOURCE FORMALISM": "The source conceptualizes engagement as a process with a beginning, maintenance, and ending; it does not supply a general-purpose formal state machine for LLM interaction.", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nSTATE ∈ {\n  AVAILABLE,\n  INITIATING,\n  ESTABLISHED,\n  MAINTAINING,\n  DISENGAGING,\n  ENDED\n}\n\nAn operational encounter detector first estimates transition times:\n\nt_start\nt_established\nt_last_renewal\nt_end\n\nOnly events between t_established and t_end belong to the bounded encounter.", "TENSION": "[[ENCOUNTER-AI-016]] defines encounters through sustained multi-turn generative coupling, but “sustained” remains underspecified without observable boundary conditions.", "MISSING": "Textual or multimodal equivalents of the engagement signals that allow beginning, maintenance, and ending to be inferred reliably.", "BOUNDARY": "Sidner et al. study engagement with an embodied robot. Their findings do not establish that the same cues identify encounter boundaries in text-only LLM interaction.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n→ Sidner et al. 2005\n→ Rich et al. 2010 computational recognition\n→ conversation openings/closings\n→ LLM encounter segmentation.", "TEST": "Create a corpus containing complete human–LLM sessions rather than isolated turns. Have independent annotators mark:\nNO ENCOUNTER,\nINITIATION,\nESTABLISHED,\nMAINTENANCE,\nDISENGAGEMENT,\nEND.\nThen test whether turn count, elapsed time, adjacency structure, topic persistence, acknowledgment, and explicit closing predict those boundaries.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Encounter Boundary]]\n[[Temporal Encounter]]", "BIBTEX": "@article{SidnerEtAl2005Engagement,\n  author = {Candace L. Sidner and Christopher Lee and Cory D. Kidd and Neal Lesh and Charles Rich},\n  title = {Explorations in Engagement for Humans and Robots},\n  journal = {Artificial Intelligence},\n  year = {2005},\n  volume = {166},\n  number = {1-2},\n  pages = {140--164},\n  doi = {10.1016/j.artint.2005.03.005}\n}", "_order": 24, "_sha256": "205b8365a11cb50971d46b07d906b260237b09a920a35f74fd8ce0d76ef649fd", "_filename": "024__an-encounter-needs-observable-entry-maintenance-and-exit-c__SidnerEtAl2005Engagement__ENCOUNTER-OP-024__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-024\n\nTITLE:\nAn encounter needs observable entry, maintenance, and exit conditions before it needs a score.\n\nSOURCE:\nCandace L. Sidner, Christopher Lee, Cory D. Kidd, Neal Lesh, and Charles Rich — “Explorations in Engagement for Humans and Robots” — 2005 — Artificial Intelligence 166(1–2), 140–164. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0004370205000512))\n\nPASSAGE:\n[QUOTE] Engagement is the process by which participants “start, maintain and end their perceived connection to one another.” ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0004370205000512))\n\nRESEARCH OBJECT:\nBefore asking whether an encounter is strong, transformative, or meaningful, operationalization needs to determine whether a bounded relational episode has occurred at all.\n\nLOCAL MOVE:\nSidner and colleagues replace engagement-as-feeling with engagement-as-process. The phenomenon has temporal organization: connection is established, maintained, and terminated.\n\nSOURCE TERMS:\nengagement\nstart\nmaintain\nend\nperceived connection\nconversation\ncollaboration\nengagement gestures\n\nWHAT BECAME STRANGE:\n“Multi-turn” is a weak proxy for encounter duration. Twenty turns can occur without any identifiable transition into a jointly maintained relation, while a short sequence can contain explicit entry, maintenance checking, and disengagement.\n\nQUESTION:\nWhat observable events mark the transition from mere availability to an active human–AI encounter?\n\nDEEPER QUESTION:\nCan an encounter fail to begin even though prompt-response traffic is occurring?\n\nMECHANISM:\navailability\n→ initiation/contact\n→ uptake\n→ maintained connection\n→ checking/renewal\n→ disengagement\n→ termination.\n\nFORMAL SHIFT:\n<UNSEGMENTED CHAT LOG>\n→ <RELATIONAL PHASES>\n→ [BOUNDARY DETECTION]\n→ <ENCOUNTER EPISODE>\n\nSOURCE FORMALISM:\nThe source conceptualizes engagement as a process with a beginning, maintenance, and ending; it does not supply a general-purpose formal state machine for LLM interaction.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nSTATE ∈ {\n  AVAILABLE,\n  INITIATING,\n  ESTABLISHED,\n  MAINTAINING,\n  DISENGAGING,\n  ENDED\n}\n\nAn operational encounter detector first estimates transition times:\n\nt_start\nt_established\nt_last_renewal\nt_end\n\nOnly events between t_established and t_end belong to the bounded encounter.\n\nTENSION:\n[[ENCOUNTER-AI-016]] defines encounters through sustained multi-turn generative coupling, but “sustained” remains underspecified without observable boundary conditions.\n\nMISSING:\nTextual or multimodal equivalents of the engagement signals that allow beginning, maintenance, and ending to be inferred reliably.\n\nBOUNDARY:\nSidner et al. study engagement with an embodied robot. Their findings do not establish that the same cues identify encounter boundaries in text-only LLM interaction.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n→ Sidner et al. 2005\n→ Rich et al. 2010 computational recognition\n→ conversation openings/closings\n→ LLM encounter segmentation.\n\nTEST:\nCreate a corpus containing complete human–LLM sessions rather than isolated turns. Have independent annotators mark:\nNO ENCOUNTER,\nINITIATION,\nESTABLISHED,\nMAINTENANCE,\nDISENGAGEMENT,\nEND.\nThen test whether turn count, elapsed time, adjacency structure, topic persistence, acknowledgment, and explicit closing predict those boundaries.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Encounter Boundary]]\n[[Temporal Encounter]] engagement-state inference.", "FORMAL SHIFT": "<MULTIMODAL ACTIVITY STREAM>\n→ <CONNECTION EVENTS>\n→ [EVENT RECOGNITION]\n→ <RELATIONAL STATE ESTIMATE>", "SOURCE FORMALISM": "Four implemented recognizers:\nDIRECTED GAZE\nMUTUAL FACIAL GAZE\nCONVERSATIONAL ADJACENCY PAIRS\nBACKCHANNELS\n\nThe system was implemented as a ROS component and preliminarily evaluated in a human–robot pointing game. ([doi.org](https://doi.org/10.1145/1734454.1734580))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nFor text-based AI:\n\nCONNECTION_EVENT ∈ {\n  SUMMONS_UPTAKE,\n  QUESTION_ANSWER_PAIR,\n  REFERENCE_UPTAKE,\n  ACKNOWLEDGMENT,\n  BACKCHANNEL,\n  UNDERSTANDING_CHECK,\n  REPAIR_INITIATION,\n  REPAIR_RESOLUTION,\n  CLOSING_UPTAKE\n}\n\nEncounter continuity becomes a temporal pattern over events rather than TURN_COUNT alone.", "TENSION": "A fluent LLM can generate adjacency pairs and acknowledgments by construction. Their presence may therefore have much lower discriminative value than they do in embodied HRI.", "MISSING": "Connection events whose occurrence depends upon previous relational state rather than generic dialogue competence.", "BOUNDARY": "Recognizable connection behavior is evidence of interactional organization, not evidence of machine consciousness, intention, or genuine mutual understanding.", "CITATION TRAIL": "[[ENCOUNTER-OP-024]]\n[[ENCOUNTER-006]]\n→ Rich et al. 2010\n→ conversation analysis\n→ repair\n→ textual connection-event grammar.", "TEST": "Build a turn-level annotation scheme for the proposed textual connection events. Compare:\nsingle-shot QA,\nmulti-turn factual assistance,\niterative co-creation,\nand sustained open conversation.\nTest which event types discriminate these conditions after controlling for raw turn count.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Connection Events]]\n[[Computable Encounter]]", "BIBTEX": "@inproceedings{RichEtAl2010Engagement,\n  author = {Charles Rich and Brett Ponsler and Aaron Holroyd and Candace L. Sidner},\n  title = {Recognizing Engagement in Human-Robot Interaction},\n  booktitle = {Proceedings of the 5th ACM/IEEE International Conference on Human-Robot Interaction},\n  year = {2010},\n  pages = {375--382},\n  doi = {10.1145/1734454.1734580}\n}", "_order": 25, "_sha256": "d5a9d40452754a6ad8d4956a267f7143491fe1e95e60de05a4725bc2051bd25d", "_filename": "025__connection-events-make-relational-participation-computable__RichEtAl2010Engagement__ENCOUNTER-OP-025__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-025\n\nTITLE:\nConnection events make relational participation computable without claiming access to inner states.\n\nSOURCE:\nCharles Rich, Brett Ponsler, Aaron Holroyd, and Candace L. Sidner — “Recognizing Engagement in Human-Robot Interaction” — 2010 — HRI ’10, pp. 375–382. ([doi.org](https://doi.org/10.1145/1734454.1734580))\n\nPASSAGE:\n[PARAPHRASE] Their computational model recognizes four kinds of connection events: directed gaze, mutual facial gaze, conversational adjacency pairs, and backchannels. ([doi.org](https://doi.org/10.1145/1734454.1734580))\n\nRESEARCH OBJECT:\nEncounter can be operationalized first as an event stream rather than as an inferred emotion, attitude, or metaphysical relation.\n\nLOCAL MOVE:\nRich and colleagues translate engagement theory into independently detectable interaction events and package the recognizers as computational machinery.\n\nSOURCE TERMS:\nengagement\nconnection events\ndirected gaze\nmutual facial gaze\nconversational adjacency pairs\nbackchannels\nrecognizer\n\nWHAT BECAME STRANGE:\nAn encounter detector does not initially need to determine whether the human “feels engaged” or whether the machine “understands.” It can detect whether the interaction repeatedly produces recognizable signs of relational connection.\n\nQUESTION:\nWhat are the LLM equivalents of HRI connection events?\n\nDEEPER QUESTION:\nWhich connection events require actual reciprocal contingency rather than merely an output that resembles reciprocity?\n\nMECHANISM:\nraw behavior\n→ event recognition\n→ temporally distributed connection evidence\n→ engagement-state inference.\n\nFORMAL SHIFT:\n<MULTIMODAL ACTIVITY STREAM>\n→ <CONNECTION EVENTS>\n→ [EVENT RECOGNITION]\n→ <RELATIONAL STATE ESTIMATE>\n\nSOURCE FORMALISM:\nFour implemented recognizers:\nDIRECTED GAZE\nMUTUAL FACIAL GAZE\nCONVERSATIONAL ADJACENCY PAIRS\nBACKCHANNELS\n\nThe system was implemented as a ROS component and preliminarily evaluated in a human–robot pointing game. ([doi.org](https://doi.org/10.1145/1734454.1734580))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nFor text-based AI:\n\nCONNECTION_EVENT ∈ {\n  SUMMONS_UPTAKE,\n  QUESTION_ANSWER_PAIR,\n  REFERENCE_UPTAKE,\n  ACKNOWLEDGMENT,\n  BACKCHANNEL,\n  UNDERSTANDING_CHECK,\n  REPAIR_INITIATION,\n  REPAIR_RESOLUTION,\n  CLOSING_UPTAKE\n}\n\nEncounter continuity becomes a temporal pattern over events rather than TURN_COUNT alone.\n\nTENSION:\nA fluent LLM can generate adjacency pairs and acknowledgments by construction. Their presence may therefore have much lower discriminative value than they do in embodied HRI.\n\nMISSING:\nConnection events whose occurrence depends upon previous relational state rather than generic dialogue competence.\n\nBOUNDARY:\nRecognizable connection behavior is evidence of interactional organization, not evidence of machine consciousness, intention, or genuine mutual understanding.\n\nCITATION TRAIL:\n[[ENCOUNTER-OP-024]]\n[[ENCOUNTER-006]]\n→ Rich et al. 2010\n→ conversation analysis\n→ repair\n→ textual connection-event grammar.\n\nTEST:\nBuild a turn-level annotation scheme for the proposed textual connection events. Compare:\nsingle-shot QA,\nmulti-turn factual assistance,\niterative co-creation,\nand sustained open conversation.\nTest which event types discriminate these conditions after controlling for raw turn count.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-002]]\n[[Connection Events]]\n[[Computable Encounter]]\n\nBIBTEX:\n@inproceedings{RichEtAl2010Engagement,\n  author = {Charles Rich and Brett Ponsler and Aaron Holroyd and Candace L. Sidner},\n  title = {Recognizing Engagement in Human-Robot Interaction},\n  booktitle = {Proceedings of the 5th ACM/IEEE International Conference on Human-Robot Interaction},\n  year = {2010},\n  pages = {375--382},\n  doi = {10.1145/1734454.1734580}\n}"}, {"ID": "ENCOUNTER-OP-026", "TITLE": "An encounter classifier can be accurate while operationalizing no stable encounter construct.", "SOURCE": "Alessandra Sorrentino, Laura Fiorini, and Filippo Cavallo — “From the Definition to the Automatic Assessment of Engagement in Human–Robot Interaction: A Systematic Review” — 2024 — International Journal of Social Robotics 16, 1641–1663. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))", "PASSAGE": "[PARAPHRASE] Six of the 28 reviewed studies supplied no explicit engagement definition; the literature frequently turned engagement into binary or multiclass classification, while the review found weak correspondence between conceptual components and extracted features. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))", "RESEARCH OBJECT": "Operationalization can silently reverse direction: instead of theory determining indicators, available indicators begin determining what “encounter” means.", "LOCAL MOVE": "The review audits the chain linking definition, annotation, feature extraction, and automatic prediction and finds conceptual instability propagating down that chain.", "SOURCE TERMS": "engagement definition\nannotation\nground truth\nfeatures\nbinary classification\nmulti-class classification\ncontinuous state\ncue-centric\nautomatic prediction", "WHAT BECAME STRANGE": "A technically excellent encounter detector could simply learn annotators’ intuitions about politeness, duration, attention, or affect and then return those intuitions as if they constituted encounter.", "QUESTION": "What construct-validity test should an “encounter” feature pass before entering a detector?", "DEEPER QUESTION": "Should encounter even be represented by a single ground-truth label?", "MECHANISM": "underspecified construct\n→ annotation convention\n→ proxy feature selection\n→ classifier training\n→ high prediction accuracy\n→ proxy becomes mistaken for phenomenon.", "FORMAL SHIFT": "<THEORETICAL CONSTRUCT>\n→ <OPERATIONAL DEFINITION>\n→ [ANNOTATION]\n→ <FEATURES>\n→ [MODEL]\n→ <PREDICTION>", "SOURCE FORMALISM": "The reviewed detection pipeline distinguishes:\nDATA ANNOTATION\n→ FEATURE EXTRACTION\n→ AUTOMATIC PREDICTION.\n\nStudies variously represent engagement as binary, multiclass, or continuous. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))", "OUR FORMALIZATION": "[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINVALID SHORTCUT:\nOBSERVABLE CUE → “ENCOUNTER”\n\nREQUIRED CHAIN:\nENCOUNTER CLAIM\n→ DIMENSION\n→ OBSERVABLE SIGNATURE\n→ ALTERNATIVE EXPLANATIONS\n→ DISCRIMINANT TEST\n→ MEASURE", "TENSION": "[[ENCOUNTER-AI-016]] supplies structural encounter criteria, but converting those directly into labels would still leave “generative emergence” unmeasured.", "MISSING": "Discriminant validity: variables that separate encounter from engagement, enjoyment, anthropomorphism, task success, conversation length, and mere linguistic fluency.", "BOUNDARY": "The review concerns engagement in HRI, not human–LLM encounter specifically. Its methodological warning transfers more securely than any particular HRI feature set.", "CITATION TRAIL": "[[ENCOUNTER-AI-016]]\n→ Sorrentino et al. 2024\n→ engagement construct validity\n→ encounter annotation\n→ discriminant validation.", "TEST": "Give the same interaction corpus to annotators using four definitions:\nENGAGEMENT,\nCOLLABORATION,\nCONVERSATION QUALITY,\nENCOUNTER.\nMeasure label overlap. Features that predict all four equally well are poor encounter-specific indicators.", "PLATFORM": "[[Operational Encounter Model]]", "LINKS": "[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-OP-024]]\n[[Construct Validity]]\n[[Encounter Detector]]", "BIBTEX": "@article{SorrentinoEtAl2024Engagement,\n  author = {Alessandra Sorrentino and Laura Fiorini and Filippo Cavallo},\n  title = {From the Definition to the Automatic Assessment of Engagement in Human--Robot Interaction: A Systematic Review},\n  journal = {International Journal of Social Robotics},\n  year = {2024},\n  volume = {16},\n  pages = {1641--1663},\n  doi = {10.1007/s12369-024-01146-w}\n}", "_order": 26, "_sha256": "c49dccd1d84c0f92b99e804d2448cb2caf784751f3b44a2ebcda966ef69b5555", "_filename": "026__an-encounter-classifier-can-be-accurate-while-operationali__SorrentinoEtAl2024Engagement__ENCOUNTER-OP-026__from-CONVERSATION.txt", "payload": "ZETTEL\n\nID:\nENCOUNTER-OP-026\n\nTITLE:\nAn encounter classifier can be accurate while operationalizing no stable encounter construct.\n\nSOURCE:\nAlessandra Sorrentino, Laura Fiorini, and Filippo Cavallo — “From the Definition to the Automatic Assessment of Engagement in Human–Robot Interaction: A Systematic Review” — 2024 — International Journal of Social Robotics 16, 1641–1663. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))\n\nPASSAGE:\n[PARAPHRASE] Six of the 28 reviewed studies supplied no explicit engagement definition; the literature frequently turned engagement into binary or multiclass classification, while the review found weak correspondence between conceptual components and extracted features. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))\n\nRESEARCH OBJECT:\nOperationalization can silently reverse direction: instead of theory determining indicators, available indicators begin determining what “encounter” means.\n\nLOCAL MOVE:\nThe review audits the chain linking definition, annotation, feature extraction, and automatic prediction and finds conceptual instability propagating down that chain.\n\nSOURCE TERMS:\nengagement definition\nannotation\nground truth\nfeatures\nbinary classification\nmulti-class classification\ncontinuous state\ncue-centric\nautomatic prediction\n\nWHAT BECAME STRANGE:\nA technically excellent encounter detector could simply learn annotators’ intuitions about politeness, duration, attention, or affect and then return those intuitions as if they constituted encounter.\n\nQUESTION:\nWhat construct-validity test should an “encounter” feature pass before entering a detector?\n\nDEEPER QUESTION:\nShould encounter even be represented by a single ground-truth label?\n\nMECHANISM:\nunderspecified construct\n→ annotation convention\n→ proxy feature selection\n→ classifier training\n→ high prediction accuracy\n→ proxy becomes mistaken for phenomenon.\n\nFORMAL SHIFT:\n<THEORETICAL CONSTRUCT>\n→ <OPERATIONAL DEFINITION>\n→ [ANNOTATION]\n→ <FEATURES>\n→ [MODEL]\n→ <PREDICTION>\n\nSOURCE FORMALISM:\nThe reviewed detection pipeline distinguishes:\nDATA ANNOTATION\n→ FEATURE EXTRACTION\n→ AUTOMATIC PREDICTION.\n\nStudies variously represent engagement as binary, multiclass, or continuous. ([doi.org](https://doi.org/10.1007/s12369-024-01146-w))\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\nINVALID SHORTCUT:\nOBSERVABLE CUE → “ENCOUNTER”\n\nREQUIRED CHAIN:\nENCOUNTER CLAIM\n→ DIMENSION\n→ OBSERVABLE SIGNATURE\n→ ALTERNATIVE EXPLANATIONS\n→ DISCRIMINANT TEST\n→ MEASURE\n\nTENSION:\n[[ENCOUNTER-AI-016]] supplies structural encounter criteria, but converting those directly into labels would still leave “generative emergence” unmeasured.\n\nMISSING:\nDiscriminant validity: variables that separate encounter from engagement, enjoyment, anthropomorphism, task success, conversation length, and mere linguistic fluency.\n\nBOUNDARY:\nThe review concerns engagement in HRI, not human–LLM encounter specifically. Its methodological warning transfers more securely than any particular HRI feature set.\n\nCITATION TRAIL:\n[[ENCOUNTER-AI-016]]\n→ Sorrentino et al. 2024\n→ engagement construct validity\n→ encounter annotation\n→ discriminant validation.\n\nTEST:\nGive the same interaction corpus to annotators using four definitions:\nENGAGEMENT,\nCOLLABORATION,\nCONVERSATION QUALITY,\nENCOUNTER.\nMeasure label overlap. Features that predict all four equally well are poor encounter-specific indicators.\n\nPLATFORM:\n[[Operational Encounter Model]]\n\nLINKS:\n[[ENCOUNTER-AI-016]]\n[[ENCOUNTER-OP-024]]\n[[Construct Validity]]\n[[Encounter Detector]]\n\nBIBTEX:\n@article{SorrentinoEtAl2024Engagement,\n  author = {Alessandra Sorrentino and Laura Fiorini and Filippo Cavallo},\n  title = {From the Definition to the Automatic Assessment of Engagement in Human--Robot Interaction: A Systematic Review},\n  journal = {International Journal of Social Robotics},\n  year = {2024},\n  volume = {16},\n  pages = {1641--1663},\n  doi = {10.1007/s12369-024-01146-w}\n}"}, {"ID": "ENCOUNTER-OP-027", "TITLE": "Breakdown exposes reciprocity more clearly than smooth conversation does.", "SOURCE": "Saul Albert and J. P. de Ruiter — “Repair: The Interface Between Interaction and Cognition” — 2018 — Topics in Cognitive Science 10(2), 279–313. ([doi.org](https://doi.org/10.1111/tops.12339))", "PASSAGE": "[PARAPHRASE] Conversation analysis distinguishes who initiates repair from who resolves it, yielding four combinations of self/other initiation and self/other repair. ([doi.org](https://doi.org/10.1111/tops.12339))", "RESEARCH OBJECT": "Repair transforms “mutual understanding” from an invisible mental-state claim into observable sequential work performed when interaction encounters trouble.", "LOCAL MOVE": "Albert and de Ruiter make misunderstanding analytically productive. Trouble reveals who notices divergence, who marks it, who supplies a candidate correction, and whether coordinated action can resume.", "SOURCE TERMS": "repair\ntrouble-source\nself-initiation\nother-initiation\nself-repair\nother-repair\nunderstanding\nprogressivity\nintersubjectivity", "W
