name: Ingest The Model Is Training You Slipcase 2026-09-01

on:
  push:
    paths:
      - '_INGEST/MODEL-TRAINING-YOU-2026-09-01/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify field
        shell: bash
        run: |
          set -euo pipefail
          INGEST="_INGEST/MODEL-TRAINING-YOU-2026-09-01"
          TARGET="slipcases/2026-09-01__the-model-is-training-you__MODEL-TRAINING-YOU-2026-09-01"
          ZIP_SHA="f471c6c3fdfc35490d04bef7f5a4b21cdcac83d6b2629e22b14d8fc78d15e8b3"

          cat "$INGEST"/zip/part-*.b64 | base64 -d > /tmp/model-training-you-slipcase.zip
          echo "$ZIP_SHA  /tmp/model-training-you-slipcase.zip" | sha256sum -c -

          rm -rf "$TARGET" /tmp/model-training-you-unpack
          mkdir -p "$TARGET" /tmp/model-training-you-unpack
          unzip -q /tmp/model-training-you-slipcase.zip -d /tmp/model-training-you-unpack
          cp -a /tmp/model-training-you-unpack/slipcase_stronger_essay/. "$TARGET"/
          cp /tmp/model-training-you-slipcase.zip "$TARGET/the-model-is-training-you__slipcase.zip"

          mkdir -p "$TARGET/_SLIPCASE"
          {
            echo "github_ingest_verified: true"
            echo "checkpoint: MODEL-TRAINING-YOU-2026-09-01"
            echo "package_sha256: $ZIP_SHA"
            echo "target: $TARGET"
          } > "$TARGET/_SLIPCASE/GITHUB_INGEST.txt"

      - name: Rebuild Slipcase readers and indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 build_all.py

      - name: Commit native field and rebuilt desk
        shell: bash
        run: |
          set -euo pipefail
          TARGET="slipcases/2026-09-01__the-model-is-training-you__MODEL-TRAINING-YOU-2026-09-01"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET" index.html slipcases.json map.html atlas.html map-02.html box.html slipcase-reader-v3.html pocket.html || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "add the model is training you slipcase"
          git push
