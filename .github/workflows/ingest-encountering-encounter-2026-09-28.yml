name: Ingest Encountering Encounter Slipcase 2026-09-28

on:
  push:
    branches:
      - main
    paths:
      - '_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify capsule and reconstruct field
        run: |
          set -euo pipefail
          INGEST="_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28"
          TARGET="slipcases/2026-09-28__encountering-encounter__AI-ENCOUNTER__v15.55-AM"
          echo "9fe104eab98e66956b3887eeb9b5ccd9661637116cb7441cdc03025875d57113  $INGEST/index.html" | sha256sum -c -
          python3 "$INGEST/ingest_encounter.py" "$INGEST/index.html" "$TARGET" "$INGEST"

      - name: Install document build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern librsvg2-bin zip >/dev/null

      - name: Build mark and paper PDFs
        run: |
          set -euo pipefail
          TARGET="slipcases/2026-09-28__encountering-encounter__AI-ENCOUNTER__v15.55-AM"
          cd "$TARGET"
          rsvg-convert -f pdf -o MARK.pdf MARK.svg
          test -s MARK.pdf
          pdflatex -interaction=nonstopmode -halt-on-error encountering-encounter__2026-09-28.tex >/tmp/encounter-pdflatex-1.log || { cat /tmp/encounter-pdflatex-1.log; exit 1; }
          bibtex encountering-encounter__2026-09-28 >/tmp/encounter-bibtex.log || { cat /tmp/encounter-bibtex.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error encountering-encounter__2026-09-28.tex >/tmp/encounter-pdflatex-2.log || { cat /tmp/encounter-pdflatex-2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error encountering-encounter__2026-09-28.tex >/tmp/encounter-pdflatex-3.log || { cat /tmp/encounter-pdflatex-3.log; exit 1; }
          test -s encountering-encounter__2026-09-28.pdf

      - name: Finalize verification and field ZIP
        run: |
          set -euo pipefail
          TARGET="slipcases/2026-09-28__encountering-encounter__AI-ENCOUNTER__v15.55-AM"
          python3 -c "from pathlib import Path; p=Path('$TARGET'); files=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file()); (p/'000__INDEX.txt').write_text('INDEX\\n\\n'+'\\n'.join(files)+'\\n',encoding='utf-8'); (p/'_SLIPCASE'/'VERIFICATION.txt').write_text('GITHUB VERIFICATION\\n\\nADMITTED ZETTELS: 37\\nROOT CARD TXT: 37\\n_MD MIRRORS: 37\\nCAPSULE SHA-256: 9fe104eab98e66956b3887eeb9b5ccd9661637116cb7441cdc03025875d57113\\nORIGINAL LOCAL ZIP SHA-256 RECEIPT: 29c318381f496313f6284908a71ede8c193da77249b02cf33490bcc111d1a024\\nPDF STATUS: built from preserved TeX source on GitHub\\nZIP STATUS: verified below\\n',encoding='utf-8')"
          rm -f "_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28/encounter_slipcase_20260928__github-reconstructed.zip"
          (cd slipcases && zip -qr "../_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28/encounter_slipcase_20260928__github-reconstructed.zip" "2026-09-28__encountering-encounter__AI-ENCOUNTER__v15.55-AM")
          unzip -t "_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28/encounter_slipcase_20260928__github-reconstructed.zip" >/dev/null

      - name: Rebuild master Slipcase desk
        run: python3 build_all.py

      - name: Commit field and rebuilt master desk
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "slipcases/2026-09-28__encountering-encounter__AI-ENCOUNTER__v15.55-AM"             "_INGEST/ENCOUNTERING-ENCOUNTER-2026-09-28/encounter_slipcase_20260928__github-reconstructed.zip"             index.html slipcases.json map.html atlas.html map-02.html box.html slipcase-reader-v3.html pocket.html             heads-pdf-map.html heads-pdf-map.json heads-pdf-map.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "add encountering encounter slipcase"
          git pull --rebase origin main
          git push origin HEAD:main
