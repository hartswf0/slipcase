<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StoryCorps Field</title>
<style>
:root{
  --bg:#f3f0e9; --paper:#fffdf8; --ink:#171714; --muted:#6f6b62; --line:#d8d2c6;
  --accent:#b73f2d; --soft:#ece6da; --focus:#255f9d; --ok:#2f6b45; --danger:#8a2e24;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}
#app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr;background:var(--paper)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:800;letter-spacing:.06em;white-space:nowrap}
.source{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.status{margin-left:auto;font-size:11px;white-space:nowrap;color:var(--muted)}
.status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#faf8f2}
.search{width:100%;min-width:0;border:1px solid var(--line);background:white;padding:10px 11px;border-radius:0;font-size:16px}
.toolbuttons{display:flex;gap:6px;flex-wrap:wrap}
.smallbtn,.tab{border:1px solid var(--line);background:var(--paper);padding:9px 10px;min-height:42px}
.smallbtn:hover,.tab:hover{background:var(--soft)}
.fileinput{display:none}
main{min-height:0;display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr)}
.listpane{min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr}
.listhead{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--line);background:#faf8f2;overflow-x:auto}
.tab{padding:6px 9px;min-height:34px;font-size:12px;white-space:nowrap}
.tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
#results{overflow:auto;min-height:0;overscroll-behavior:contain}
.row{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 11px}
.row:hover{background:#f4efe5}.row.active{background:#e9e1d2;box-shadow:inset 3px 0 0 var(--accent)}
.rowtitle{font-family:ui-serif,Georgia,serif;font-size:16px;line-height:1.2;margin-bottom:4px}
.rowmeta{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{overflow:auto;min-height:0;overscroll-behavior:contain;padding:clamp(14px,3vw,34px)}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font:700 clamp(28px,4.8vw,54px)/.98 ui-serif,Georgia,serif;letter-spacing:-.035em;margin:0 0 12px;max-width:900px}
.desc{font:18px/1.45 ui-serif,Georgia,serif;max-width:850px;margin:0 0 20px;color:#2e2b26}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,240px);gap:24px;align-items:start}
.cover{width:100%;aspect-ratio:1.25;object-fit:cover;border:1px solid var(--line);background:var(--soft)}
.data{display:grid;gap:16px;margin-top:22px;max-width:920px}
.block{border-top:1px solid var(--line);padding-top:11px}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;padding:7px 8px;min-height:34px;text-align:left}
.chip:hover{border-color:var(--ink);background:var(--soft)}
.chip strong{font-weight:700}.chip span{color:var(--muted);font-size:10px;margin-left:5px}
.people{display:flex;flex-wrap:wrap;gap:8px}.person{padding:6px 0;border-bottom:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
a.action,button.action{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 12px;min-height:44px}
a.action.secondary,button.action.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
a.action:hover,button.action:hover{opacity:.88}
audio{width:min(100%,680px);margin-top:8px}
.provenance{font-size:11px;color:var(--muted);margin-top:24px;padding-top:10px;border-top:1px solid var(--line);word-break:break-word}
.relationTitle{font:700 30px/1 ui-serif,Georgia,serif;margin:2px 0 8px}.relationNote{color:var(--muted);margin-bottom:20px}
.relationGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.relcard{border:1px solid var(--line);background:transparent;padding:12px;text-align:left;min-height:96px}.relcard:hover{background:var(--soft)}
.relname{font-family:ui-serif,Georgia,serif;font-size:16px;line-height:1.2}.relmeta{font-size:10px;color:var(--muted);margin-top:8px}
.mobileNav{display:none}
@media(max-width:720px){
  #app{grid-template-rows:auto auto auto 1fr}
  header{padding:8px 10px}.source{display:none}.status{font-size:10px}
  .toolbar{grid-template-columns:1fr auto;padding:7px}.toolbuttons .smallbtn:not(.loadbtn){display:none}
  .mobileNav{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .mobileNav button{border:0;border-right:1px solid var(--line);background:#faf8f2;min-height:43px}.mobileNav button.active{background:var(--ink);color:var(--paper)}
  main{display:block;position:relative;min-height:0;overflow:hidden}
  .listpane,.detail{position:absolute;inset:0}.listpane{border-right:0}.detail{background:var(--paper)}
  body[data-mobile="detail"] .listpane{display:none} body[data-mobile="list"] .detail{display:none}
  .hero{display:block}.cover{max-width:210px;margin:10px 0 18px}.detail{padding:18px 16px 32px}
  h1{font-size:34px}.desc{font-size:17px}.relationGrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-mobile="list">
<div id="app">
<header>
  <div class="brand">STORYCORPS / FIELD</div>
  <div class="source" id="sourceLabel">edsu/storycorps-meta · storycorps.json</div>
  <div class="status" id="status">loading…</div>
</header>
<div class="toolbar">
  <input id="search" class="search" type="search" placeholder="Search names, descriptions, themes, places…" autocomplete="off" aria-label="Search StoryCorps records">
  <div class="toolbuttons">
    <button class="smallbtn loadbtn" id="loadLocal" type="button">Open JSON</button>
    <button class="smallbtn" id="clear" type="button">Clear</button>
  </div>
  <input id="fileInput" class="fileinput" type="file" accept="application/json,.json">
</div>
<div class="mobileNav" aria-label="Mobile view">
  <button id="mobileList" class="active" type="button">Records</button>
  <button id="mobileDetail" type="button">Selected</button>
</div>
<main>
  <section class="listpane" aria-label="Corpus index">
    <div class="listhead">
      <button class="tab active" data-mode="stories" type="button">STORIES</button>
      <button class="tab" data-mode="themes" type="button">THEMES</button>
      <button class="tab" data-mode="places" type="button">PLACES</button>
      <span class="count" id="count"></span>
    </div>
    <div id="results"></div>
  </section>
  <article class="detail" id="detail" aria-live="polite"><div class="empty">Loading the historical dataset from GitHub.</div></article>
</main>
</div>
<script>
(() => {
  'use strict';
  const DEFAULT_URL='https://raw.githubusercontent.com/edsu/storycorps-meta/master/storycorps.json';
  const $=s=>document.querySelector(s);
  const els={
    status:$('#status'),source:$('#sourceLabel'),search:$('#search'),results:$('#results'),detail:$('#detail'),count:$('#count'),
    file:$('#fileInput'),load:$('#loadLocal'),clear:$('#clear'),mList:$('#mobileList'),mDetail:$('#mobileDetail')
  };
  const state={stories:[],themes:[],places:[],mode:'stories',query:'',selected:null,relation:null,source:DEFAULT_URL};

  function text(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function safeUrl(v){try{const u=new URL(String(v)); if(!/^https?:$/.test(u.protocol)) return ''; if(u.protocol==='http:' && /(^|\.)storycorps\.org$|(^|\.)cdn\.storycorps\.org$/.test(u.hostname)) u.protocol='https:'; return u.href;}catch{return '';}}
  function arr(v){return Array.isArray(v)?v:(v==null?[]:[v]);}
  function named(v){return arr(v).map(x=>typeof x==='string'?x:(x&&x.name)||'').map(s=>String(s).trim()).filter(Boolean);}
  function unique(a){return [...new Set(a)];}
  function recordSearch(s){return [s.name,s.description,...s.themes,...s.places,...s.contributors].join(' ').toLowerCase();}
  function normalize(raw){
    const graph=Array.isArray(raw)?raw:(raw && Array.isArray(raw['@graph'])?raw['@graph']:[]);
    return graph.map((r,i)=>({
      index:i,id:String(r['@id']||r.id||`record-${i}`),type:String(r['@type']||''),name:String(r.name||r.title||`Record ${i+1}`),
      description:String(r.description||''),audio:safeUrl(r.audio||r.contentUrl||''),image:safeUrl(r.image||''),
      contributors:unique(named(r.contributor)),themes:unique(named(r.about)),places:unique(named(r.contentLocation)),raw:r
    })).filter(s=>s.name || s.id);
  }
  function buildFacets(stories,key){
    const map=new Map();
    stories.forEach((s,idx)=>s[key].forEach(name=>{if(!map.has(name))map.set(name,[]);map.get(name).push(idx);}));
    return [...map].map(([name,indices])=>({name,count:indices.length,indices})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
  }
  function ingest(raw,label){
    const stories=normalize(raw);
    if(!stories.length) throw new Error('No records found. Expected a JSON-LD @graph or an array of records.');
    state.stories=stories;state.themes=buildFacets(stories,'themes');state.places=buildFacets(stories,'places');state.selected=stories[0];state.relation=null;state.query='';els.search.value='';
    els.source.textContent=label; setStatus(`${stories.length.toLocaleString()} records`,true); render(); showStory(state.selected,false);
  }
  function setStatus(msg,ok=false,bad=false){els.status.textContent=msg;els.status.className='status'+(ok?' ok':'')+(bad?' bad':'');}
  function matches(s,q){return !q || recordSearch(s).includes(q);}
  function visibleItems(){
    const q=state.query.trim().toLowerCase();
    if(state.mode==='stories') return state.stories.filter(s=>matches(s,q));
    const source=state.mode==='themes'?state.themes:state.places;
    if(!q) return source;
    return source.filter(f=>f.name.toLowerCase().includes(q) || f.indices.some(i=>matches(state.stories[i],q)));
  }
  function render(){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
    const items=visibleItems(); els.count.textContent=`${items.length.toLocaleString()} ${state.mode}`;
    if(!items.length){els.results.innerHTML='<div class="empty">No matches.</div>';return;}
    const cap=Math.min(items.length,1200);
    if(state.mode==='stories'){
      els.results.innerHTML=items.slice(0,cap).map(s=>`<button class="row${state.selected&&s.id===state.selected.id?' active':''}" data-story="${s.index}" type="button"><div class="rowtitle">${text(s.name)}</div><div class="rowmeta">${text([...s.places,...s.themes].slice(0,4).join(' · '))}</div></button>`).join('')+(items.length>cap?`<div class="rowmeta" style="padding:12px">Showing first ${cap.toLocaleString()} of ${items.length.toLocaleString()} matches. Refine search.</div>`:'');
    } else {
      els.results.innerHTML=items.slice(0,cap).map(f=>`<button class="row" data-facet="${text(f.name)}" type="button"><div class="rowtitle">${text(f.name)}</div><div class="rowmeta">${f.count.toLocaleString()} ${f.count===1?'story':'stories'}</div></button>`).join('');
    }
  }
  function relationChip(kind,name,count){return `<button class="chip" type="button" data-relation-kind="${kind}" data-relation-name="${text(name)}"><strong>${text(name)}</strong><span>${count}</span></button>`;}
  function relatedCount(kind,name){const key=kind==='theme'?'themes':'places';return state.stories.reduce((n,s)=>n+(s[key].includes(name)?1:0),0);}
  function showStory(s,switchMobile=true){
    if(!s)return; state.selected=s; state.relation=null;
    const img=s.image?`<img class="cover" src="${text(s.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
    const audio=s.audio?`<div class="block"><div class="label">Audio</div><audio controls preload="none" src="${text(s.audio)}"></audio></div>`:'';
    const storyUrl=safeUrl(s.id);
    els.detail.innerHTML=`
      <div class="eyebrow">${text(s.type||'StoryCorps record')}</div>
      <div class="hero"><div><h1>${text(s.name)}</h1>${s.description?`<p class="desc">${text(s.description)}</p>`:''}
      <div class="actions">${storyUrl?`<a class="action" href="${text(storyUrl)}" target="_blank" rel="noreferrer">Open original</a>`:''}<button class="action secondary" id="rawRecord" type="button">Raw record</button></div></div>${img}</div>
      <div class="data">
        ${s.themes.length?`<div class="block"><div class="label">Themes · click to follow</div><div class="chips">${s.themes.map(n=>relationChip('theme',n,relatedCount('theme',n))).join('')}</div></div>`:''}
        ${s.places.length?`<div class="block"><div class="label">Places · click to follow</div><div class="chips">${s.places.map(n=>relationChip('place',n,relatedCount('place',n))).join('')}</div></div>`:''}
        ${s.contributors.length?`<div class="block"><div class="label">Contributors</div><div class="people">${s.contributors.map(n=>`<div class="person">${text(n)}</div>`).join('')}</div></div>`:''}
        ${audio}
      </div>
      <div class="provenance">record ${s.index+1} · source: ${text(state.source)}</div>`;
    render(); if(switchMobile)setMobile('detail');
    const raw=$('#rawRecord'); if(raw) raw.addEventListener('click',()=>showRaw(s));
  }
  function showRaw(s){
    els.detail.innerHTML=`<div class="eyebrow">Raw archive object</div><h1>${text(s.name)}</h1><div class="actions"><button class="action secondary" id="backStory" type="button">Back to record</button></div><pre style="white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;border-top:1px solid var(--line);padding-top:14px">${text(JSON.stringify(s.raw,null,2))}</pre>`;
    $('#backStory').addEventListener('click',()=>showStory(s,false));
  }
  function showRelation(kind,name){
    const key=kind==='theme'?'themes':'places';const hits=state.stories.filter(s=>s[key].includes(name));state.relation={kind,name};
    els.detail.innerHTML=`<div class="eyebrow">${text(kind)}</div><div class="relationTitle">${text(name)}</div><div class="relationNote">${hits.length.toLocaleString()} ${hits.length===1?'story':'stories'} share this ${text(kind)}. This is a direct relation from the archive metadata.</div><div class="relationGrid">${hits.map(s=>`<button class="relcard" data-story="${s.index}" type="button"><div class="relname">${text(s.name)}</div><div class="relmeta">${text((kind==='theme'?s.places:s.themes).slice(0,3).join(' · '))}</div></button>`).join('')}</div>`;
    setMobile('detail');
  }
  function setMobile(which){document.body.dataset.mobile=which;els.mList.classList.toggle('active',which==='list');els.mDetail.classList.toggle('active',which==='detail');}
  async function loadRemote(){
    setStatus('loading…');
    try{const res=await fetch(DEFAULT_URL,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const raw=await res.json();state.source=DEFAULT_URL;ingest(raw,'edsu/storycorps-meta · storycorps.json');}
    catch(err){setStatus('data load failed',false,true);els.detail.innerHTML=`<div class="empty"><div><strong>Could not load the GitHub dataset.</strong><br><br>${text(err.message)}<br><br>Use <b>Open JSON</b> and choose a downloaded copy of storycorps.json.</div></div>`;els.results.innerHTML='<div class="empty">No archive data loaded.</div>';}
  }
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render();setMobile('list');}));
  els.search.addEventListener('input',()=>{state.query=els.search.value;render();});
  els.clear.addEventListener('click',()=>{state.query='';els.search.value='';state.mode='stories';render();});
  els.results.addEventListener('click',e=>{const story=e.target.closest('[data-story]');if(story){showStory(state.stories[Number(story.dataset.story)]);return;}const facet=e.target.closest('[data-facet]');if(facet){showRelation(state.mode==='themes'?'theme':'place',facet.dataset.facet);}});
  els.detail.addEventListener('click',e=>{const chip=e.target.closest('[data-relation-kind]');if(chip){showRelation(chip.dataset.relationKind,chip.dataset.relationName);return;}const story=e.target.closest('[data-story]');if(story)showStory(state.stories[Number(story.dataset.story)]);});
  els.load.addEventListener('click',()=>els.file.click());
  els.file.addEventListener('change',async()=>{const f=els.file.files&&els.file.files[0];if(!f)return;try{setStatus('reading file…');const raw=JSON.parse(await f.text());state.source=`local:${f.name}`;ingest(raw,f.name);}catch(err){setStatus('invalid JSON',false,true);alert(`Could not load JSON: ${err.message}`);}finally{els.file.value='';}});
  els.mList.addEventListener('click',()=>setMobile('list'));els.mDetail.addEventListener('click',()=>setMobile('detail'));
  loadRemote();
})();
</script>
</body>
</html>
