            function toField() {

                view =
                    "FIELD";


                caseFan =
                    false;


                tableItems = [];

                relations = [];

                relationMode =
                    false;

                relationAnchor =
                    null;


                renderField();

            }


            /* ============================================================
               PRIMARY ACTION
               ============================================================ */

            function act() {

                if (
                    view === "FIELD"
                ) {

                    if (
                        tray.length
                    ) {

                        view =
                            "TRAY";


                        trayIdx =
                            0;


                        renderTray();

                    }


                    return;

                }


                if (
                    view === "CASE"
                ) {

                    if (
                        caseFan
                    ) {

                        spreadCase();

                    }

                    else {

                        caseFan =
                            true;


                        renderCase();

                    }


                    return;

                }


                if (
                    view === "SLIP"
                ) {

                    const c =
                        currentCase();


                    const slip =
                        currentSlip();


                    if (
                        !c
                        ||
                        !slip
                    ) {
                        return;
                    }


                    const at =
                        inTray(
                            c.i,
                            slip.f
                        );


                    if (
                        at >= 0
                    ) {

                        tray.splice(
                            at,
                            1
                        );

                    }

                    else {

                        tray.push({

                            i: c.i,

                            f: slip.f

                        });

                    }


                    renderSlip();

                    return;

                }


                if (
                    view === "TABLE"
                ) {

                    returnToCase();

                    return;

                }


                copyTray();

            }


            /* ============================================================
               COPY TRAY
               ============================================================ */

            async function copyTray() {

                let output = "";


                for (
                    const entry
                    of tray
                ) {

                    output +=

                        notes[entry.i].id

                        + " — "

                        + entry.f

                        + "\n"

                        + valueFor(
                            notes[entry.i],
                            entry.f
                        )

                        + "\n\n";

                }


                try {

                    await navigator.clipboard
                        .writeText(
                            output.trimEnd()
                        );


                    $("posLabel").innerHTML = `

      <b>

        COPIED

        ${tray.length}

        SLIPS

      </b>

    `;

                }

                catch (error) {

                    $("posLabel").innerHTML = `

      <b>

        COPY UNAVAILABLE

      </b>

    `;

                }

            }


            /* ============================================================
               CASE / SLIP CLICK
               ============================================================ */

            stage.addEventListener(

                "click",

                event => {

                    const caseCard =
                        event.target.closest(
                            ".caseCard"
                        );


                    if (caseCard) {

                        openCase(
                            Number(
                                caseCard.dataset.k
                            )
                        );

                        return;

                    }


                    const caseSlip =
                        event.target.closest(
                            ".caseSlip"
                        );


                    if (
                        caseSlip
                        &&
                        view === "CASE"
                    ) {

                        const index =
                            Number(
                                caseSlip.dataset.slip
                            );


                        /*
                          In compressed case:
                            selecting a rear slip
                            brings it to front.
                  
                          Clicking the front slip
                            pulls it into reading.
                  
                          In FAN:
                            selecting any slip reads it.
                        */

                        if (
                            caseFan
                            ||
                            index === slipIdx
                        ) {

                            readSlip(
                                index
                            );

                        }

                        else {

                            slipIdx =
                                index;


                            renderCase();

                        }


                        return;

                    }


                    const zone =
                        event.target.closest(
                            ".zone"
                        );


                    if (zone) {

                        nav(
                            Number(
                                zone.dataset.nav
                            )
                        );

                        return;

                    }


                    const tableTool =
                        event.target.closest(
                            "[data-table-action]"
                        );


                    if (
                        tableTool
                        &&
                        view === "TABLE"
                    ) {

                        const action =
                            tableTool.dataset.tableAction;


                        if (
                            action === "RELATE"
                        ) {

                            relationMode =
                                !relationMode;


                            relationAnchor =
                                null;


                            renderTable();

                        }


                        else if (
                            action === "COMPARE"
                        ) {

                            comparePinned();

                        }


                        else if (
                            action === "RESET"
                        ) {

                            resetTable();

                        }


                        return;

                    }


                    const tableSlip =
                        event.target.closest(
                            ".tableSlip"
                        );


                    if (
                        tableSlip
                        &&
                        view === "TABLE"
                        &&
                        relationMode
                        &&
                        !tableDrag
                    ) {

                        const key =
                            tableSlip.dataset.key;


                        if (
                            !relationAnchor
                        ) {

                            relationAnchor =
                                key;


                            renderTable();

                        }

                        else {

                            relateKeys(
                                relationAnchor,
                                key
                            );


                            relationAnchor =
                                null;


                            renderTable();

                        }

                    }

                }

            );


            /* ============================================================
               DOUBLE CLICK = PIN
               ============================================================ */

            stage.addEventListener(

                "dblclick",

                event => {

                    if (
                        view !== "TABLE"
                    ) {
                        return;
                    }


                    const element =
                        event.target.closest(
                            ".tableSlip"
                        );


                    if (!element) {
                        return;
                    }


                    const item =
                        findTableItem(
                            element.dataset.key
                        );


                    if (!item) {
                        return;
                    }


                    item.pinned =
                        !item.pinned;


                    item.z =
                        ++tableZ;


                    renderTable();

                }

            );


            /* ============================================================
               TABLE DRAG
            
               Only <working position> changes.
               ============================================================ */

            stage.addEventListener(

                "pointerdown",

                event => {

                    const tableCard =
                        event.target.closest(
                            ".tableSlip"
                        );


                    if (
                        view === "TABLE"
                        &&
                        tableCard
                    ) {

                        const key =
                            tableCard.dataset.key;


                        const item =
                            findTableItem(
                                key
                            );


                        if (!item) {
                            return;
                        }


                        const rect =
                            stage.getBoundingClientRect();


                        tableDrag = {

                            pointerId:
                                event.pointerId,

                            item,

                            element:
                                tableCard,

                            offsetX:
                                event.clientX
                                -
                                rect.left
                                -
                                item.x,

                            offsetY:
                                event.clientY
                                -
                                rect.top
                                -
                                item.y

                        };


                        item.z =
                            ++tableZ;


                        tableCard.style.zIndex =
                            item.z;


                        tableCard.classList.add(
                            "dragging"
                        );


                        tableCard.setPointerCapture?.(
                            event.pointerId
                        );


                        event.preventDefault();

                        return;

                    }


                    /*
                      swipe begins only outside
                      table drag.
                    */

                    swipe = {

                        x: event.clientX,

                        y: event.clientY

                    };

                }

            );


            stage.addEventListener(

                "pointermove",

                event => {

                    if (
                        !tableDrag
                        ||
                        view !== "TABLE"
                    ) {
                        return;
                    }


                    const rect =
                        stage.getBoundingClientRect();


                    const element =
                        tableDrag.element;


                    const cardRect =
                        element.getBoundingClientRect();


                    const maxX =

                        Math.max(

                            TABLE_MARGIN,

                            rect.width
                            -
                            cardRect.width
                            -
                            TABLE_MARGIN

                        );


                    const maxY =

                        Math.max(

                            60,

                            rect.height
                            -
                            cardRect.height
                            -
                            TABLE_MARGIN

                        );


                    const x =

                        Math.min(

                            maxX,

                            Math.max(

                                TABLE_MARGIN,

                                event.clientX
                                -
                                rect.left
                                -
                                tableDrag.offsetX

                            )

                        );


                    const y =

                        Math.min(

                            maxY,

                            Math.max(

                                58,

                                event.clientY
                                -
                                rect.top
                                -
                                tableDrag.offsetY

                            )

                        );


                    tableDrag.item.x =
                        x;


                    tableDrag.item.y =
                        y;


                    element.style.left =
                        x + "px";


                    element.style.top =
                        y + "px";


                    drawRelations();

                }

            );


            stage.addEventListener(

                "pointerup",

                event => {

                    if (tableDrag) {

                        const drag =
                            tableDrag;


                        tableDrag =
                            null;


                        drag.element.classList.remove(
                            "dragging"
                        );


                        stackNearest(
                            drag.item
                        );


                        renderTable();

                        return;

                    }


                    if (!swipe) {
                        return;
                    }


                    const dx =
                        event.clientX
                        -
                        swipe.x;


                    const dy =
                        event.clientY
                        -
                        swipe.y;


                    swipe =
                        null;


                    if (
                        Math.abs(dx)
                        >=
                        SWIPE_PX

                        &&

                        Math.abs(dy)
                        <
                        SWIPE_SLOP
                    ) {

                        nav(
                            dx < 0
                                ? 1
                                : -1
                        );

                    }

                }

            );


            stage.addEventListener(

                "pointercancel",

                () => {

                    tableDrag =
                        null;


                    swipe =
                        null;

                }

            );


            /* ============================================================
               FOOTER
               ============================================================ */

            $("prevBtn")
                .addEventListener(

                    "click",

                    () =>
                        nav(-1)

                );


            $("nextBtn")
                .addEventListener(

                    "click",

                    () =>
                        nav(1)

                );


            $("actBtn")
                .addEventListener(

                    "click",

                    act

                );


            $("homeBtn")
                .addEventListener(

                    "click",

                    toField

                );


            /* ============================================================
               KEYBOARD
               ============================================================ */

            document.addEventListener(

                "keydown",

                event => {

                    if (
                        event.target.tagName
                        ===
                        "INPUT"
                    ) {
                        return;
                    }


                    if (
                        event.key === "ArrowRight"
                        ||
                        event.key === "j"
                    ) {

                        nav(1);

                        return;

                    }


                    if (
                        event.key === "ArrowLeft"
                        ||
                        event.key === "k"
                    ) {

                        nav(-1);

                        return;

                    }


                    if (
                        event.key === "Escape"
                    ) {

                        if (
                            view === "SLIP"
                        ) {

                            view =
                                "CASE";


                            renderCase();

                        }

                        else if (
                            view === "TABLE"
                        ) {

                            returnToCase();

                        }

                        else if (
                            view === "CASE"
                            ||
                            view === "TRAY"
                        ) {

                            toField();

                        }


                        return;

                    }


                    if (
                        event.key === "Enter"
                    ) {

                        if (
                            view === "CASE"
                        ) {

                            readSlip();

                        }

                        else if (
                            view === "SLIP"
                        ) {

                            act();

                        }


                        return;

                    }


                    if (
                        event.key.toLowerCase()
                        ===
                        "f"

                        &&

                        view === "CASE"
                    ) {

                        caseFan =
                            !caseFan;


                        renderCase();

                        return;

                    }


                    if (
                        event.key.toLowerCase()
                        ===
                        "s"

                        &&

                        view === "CASE"
                    ) {

                        spreadCase();

                        return;

                    }


                    if (
                        event.key.toLowerCase()
                        ===
                        "r"

                        &&

                        view === "TABLE"
                    ) {

                        relationMode =
                            !relationMode;


                        relationAnchor =
                            null;


                        renderTable();

                    }

                }

            );


            /* ============================================================
               SEARCH
               ============================================================ */

            $("search")
                .addEventListener(

                    "input",

                    event => {

                        clearTimeout(
                            searchTimer
                        );


                        searchTimer =
                            setTimeout(

                                () => {

                                    qTokens =

                                        event.target.value

                                            .trim()

                                            .toLowerCase()

                                            .split(/\s+/)

                                            .filter(Boolean)

                                            .slice(
                                                0,
                                                MAX_QUERY_TOKENS
                                            );


                                    filtered = [];


                                    for (
                                        let index = 0;
                                        index < CASES.length;
                                        index++
                                    ) {

                                        if (
                                            !qTokens.length
                                            ||
                                            match(
                                                CASES[index].low
                                            )
                                        ) {

                                            filtered.push(
                                                index
                                            );

                                        }

                                    }


                                    fieldPage =
                                        0;


                                    view =
                                        "FIELD";


                                    caseFan =
                                        false;


                                    tableItems = [];

                                    relations = [];

                                    relationMode =
                                        false;

                                    relationAnchor =
                                        null;


                                    render();

                                },

                                SEARCH_DEBOUNCE_MS

                            );

                    }

                );


            /* ============================================================
               RESIZE
            
               Archive positions remain logical.
            
               TABLE working positions reset because
               screen coordinate topology has changed.
               ============================================================ */

            addEventListener(

                "resize",

                () => {

                    if (
                        view === "FIELD"
                    ) {

                        renderField();

                    }


                    else if (
                        view === "TABLE"
                    ) {

                        makeTableItems();

                        renderTable();

                    }

                }

            );


            /* ============================================================
               START
               ============================================================ */

            render();


        })();
    </script>

</body>

</html>
