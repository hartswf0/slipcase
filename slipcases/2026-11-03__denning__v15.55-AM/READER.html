Management?", "url": "https://www.stevedenning.com/Documents/what-is-radical-management-aug-2-2010.pdf", "year": "2010"}, {"author": "Denning, Steve", "cards": ["z-d72bd0c0d8c220e15c5c902c2c27c8204fd67998feedeace8bd083818daef599"], "citation": "Denning, Steve · About", "doi": "", "explicit": ["z-d72bd0c0d8c220e15c5c902c2c27c8204fd67998feedeace8bd083818daef599"], "key": "denningAbout", "raw": "@misc{denningAbout,\n  author = {Denning, Steve},\n  title = {About},\n  howpublished = {Leadership Storytelling by Steve Denning},\n  url = {https://stevedenning.com/about/}\n}", "status": "UNIQUE", "title": "About", "url": "https://stevedenning.com/about/", "year": ""}], "cards": [{"filename": "001__Positive-Sum-Rivalry__Porter-2008__ZF-MGMT-001__from-forage.txt", "id": "ZF-MGMT-001", "key": "z-91a44d8eaf8c1fd3c13dbbdc072e686f0a22fe613b27f35ec1f8454cb6f36899", "name": "Positive-Sum-Rivalry", "object": "The difference between a mechanism for better serving customer segments and a routine for discovering what customers will need next.", "order": 1, "payload": "ZETTEL\n\nID:\nZF-MGMT-001\n\nTITLE:\nPorter gives customer needs a role in expanding the market\n\nSOURCE:\nMichael E. Porter — The Five Competitive Forces That Shape Strategy — 2008 — “Rivalry Among Existing Competitors.”\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §4.\n\nPASSAGE:\n[QUOTE — Porter] “Such competition can not only support higher average profitability but also expand the industry, as the needs of more customer groups are better met.”\n[QUOTE — Denning] “there is no mechanism for systematically raising the value delivered to customers.”\n\nRESEARCH OBJECT:\nThe difference between a mechanism for better serving customer segments and a routine for discovering what customers will need next.\n\nLOCAL MOVE:\nPorter identifies an exception to zero-sum rivalry. Denning asks whether the framework can make continuous improvement an operating practice.\n\nSOURCE TERMS:\n“positive sum”; “customer segments”; “average profitability”; “systematically.”\n\nWHAT BECAME STRANGE:\nThe text used to indict Five Forces for dividing an existing pie explicitly allows competition to expand it. The disagreement shifts to how managers would repeatedly find and act on unmet needs.\n\nQUESTION:\nDoes Porter’s account of differentiated rivalry help managers discover neglected needs, or does it explain the benefits once firms have already identified them?\n\nDEEPER QUESTION:\nWhere does the capacity to learn enter a framework organized around industry structure?\n\nMECHANISM:\n[PARAPHRASE] Firms tailor different mixes of price, features, services, or products to different customer segments. Better coverage of those needs can expand the industry and support higher average profitability.\n\nFORMAL SHIFT:\nCustomer segments with different needs → differentiated offers → [firms compete on different dimensions] → possible market expansion.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\nPorter explains a way customer needs can be better met. Denning’s narrower challenge concerns a recurring process for sensing, testing, and revising what firms deliver.\n\nMISSING:\nAn explicit update rule linking observed customer outcomes to the next change in the offer.\n\nBOUNDARY:\nThe passage establishes that Porter recognizes positive-sum rivalry. It leaves the comparative effectiveness of Five Forces as a management practice open.\n\nCITATION TRAIL:\nRead Porter’s Paccar example under “Positioning the Company” for the operating practices that sustain a differentiated offer.\n\nTEST:\nGive two teams the same unfamiliar market case. Ask each to specify its next customer observation, decision owner, and revision trigger. Give one team Porter’s article and the other a customer-discovery protocol. Compare the resulting decision sequences.\n\nPLATFORM:\n[[Strategy as a learning process]]\n\nLINKS:\n[[Customer benefit as a means or an end]]\n[[Five Forces as diagnosis]]\n[[Value creation and value capture]]\n\nBIBTEX:\n@article{porter2008five,\n  author = {Porter, Michael E.},\n  title = {The Five Competitive Forces That Shape Strategy},\n  journal = {Harvard Business Review},\n  year = {2008},\n  url = {https://hbr.org/2008/01/the-five-competitive-forces-that-shape-strategy}\n}", "sha": "91a44d8eaf8c1fd3c13dbbdc072e686f0a22fe613b27f35ec1f8454cb6f36899", "title": "Porter gives customer needs a role in expanding the market"}, {"filename": "002__The-Next-Windfall__Acemoglu-et-al-2022__ZF-MGMT-002__from-forage.txt", "id": "ZF-MGMT-002", "key": "z-672da344345095a97f7e921a61453f3c0b9783dd6c9a9dfd57628979a1f64243", "name": "The-Next-Windfall", "object": "The response of worker pay to a favorable demand shock after a leadership change.", "order": 2, "payload": "ZETTEL\n\nID:\nZF-MGMT-002\n\nTITLE:\nA new CEO can change who shares in the next windfall\n\nSOURCE:\nDaron Acemoglu, Alex Xi He, and Daniel le Maire — Eclipse of Rent-Sharing — NBER working paper issued 2022, forthcoming journal version — abstract.\n\nPASSAGE:\n[QUOTE] “Exploiting exogenous export shocks, we establish that a key mechanism for these wage effects is changes in rent-sharing practices”\n\nRESEARCH OBJECT:\nThe response of worker pay to a favorable demand shock after a leadership change.\n\nLOCAL MOVE:\nThe authors use export shocks to examine how gains are distributed, moving from a wage outcome to a candidate mechanism.\n\nSOURCE TERMS:\n“business degree”; “exogenous export shocks”; “rent-sharing practices”; “labor share.”\n\nWHAT BECAME STRANGE:\nA management appointment can change the rule by which workers participate in gains. A snapshot of wages alone can miss that change.\n\nQUESTION:\nWhich pay-setting decision weakens the transmission of favorable demand shocks into wages?\n\nDEEPER QUESTION:\nHow much of the difference travels through classroom instruction, manager selection, or the board’s mandate at appointment?\n\nMECHANISM:\n[PARAPHRASE] The authors link wage effects to changes in rent-sharing after business managers take over. They present shareholder-value prioritization as a suggested explanation.\n\nFORMAL SHIFT:\nExport-demand shock → comparison of wage responses across manager types → [estimate shock-to-wage transmission] → evidence on rent-sharing.\n\nSOURCE FORMALISM:\nThe abstract describes an instrumental-variable strategy using board composition at appointment and a separate analysis exploiting export shocks.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Separate the change in baseline pay after appointment from the change in how strongly pay responds to favorable demand.\n\nTENSION:\nThe wage evidence puts pressure on management practices. Marquis’s curriculum argument requires a further link from educational exposure to those practices.\n\nMISSING:\nA trace from a specific curricular exposure to a specific pay-setting decision, with evidence about the board’s mandate.\n\nBOUNDARY:\nThe reported estimates concern CEO business-degree status and firm outcomes in the US and Denmark. They leave the contribution of any individual course or doctrine unresolved.\n\nCITATION TRAIL:\nFollow the published article’s supplemental appendix and the working paper’s export-shock specifications.\n\nTEST:\nIn one documented succession, examine compensation rules and board instructions before and after appointment. Look for a change to bonuses, bargaining, or wage progression that would predict a smaller worker share of the next comparable demand gain.\n\nPLATFORM:\n[[Management education and the distribution of gains]]\n\nLINKS:\n[[Selection versus instruction]]\n[[Board mandate]]\n[[Value creation and value capture]]\n\nBIBTEX:\n@techreport{acemoglu2022eclipse,\n  author = {Acemoglu, Daron and He, Alex Xi and le Maire, Daniel},\n  title = {Eclipse of Rent-Sharing: The Effects of Managers' Business Education on Wages and the Labor Share in the US and Denmark},\n  institution = {National Bureau of Economic Research},\n  number = {29874},\n  year = {2022},\n  doi = {10.3386/w29874},\n  note = {Forthcoming American Economic Review abstract quoted. Journal DOI 10.1257/aer.20231640}\n}", "sha": "672da344345095a97f7e921a61453f3c0b9783dd6c9a9dfd57628979a1f64243", "title": "A new CEO can change who shares in the next windfall"}, {"filename": "003__The-Investment-Hurdle__Koller-et-al-2026__ZF-MGMT-003__from-forage.txt", "id": "ZF-MGMT-003", "key": "z-ddd48dd93f0687e0cc05640928a080c58b1680551b5d9dd7af4936c9044c1275", "name": "The-Investment-Hurdle", "object": "The difference between mentioning customer benefit and giving it independent weight in capital allocation.", "order": 3, "payload": "ZETTEL\n\nID:\nZF-MGMT-003\n\nTITLE:\nA customer outcome can appear in the argument and still lose the investment decision\n\nSOURCE:\nTim Koller, Whitney Zimmerman, and Andy West — Why you can’t separate strategy from value—and vice versa — 2026 — response to the question about AI.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §3.\n\nPASSAGE:\n[QUOTE — Koller] “It allows you to innovate faster, perhaps provide better customer service, lower your manufacturing costs, your distribution costs, and so on.”\n[QUOTE — Denning] “with (so far) no mention of the customer.”\n\nRESEARCH OBJECT:\nThe difference between mentioning customer benefit and giving it independent weight in capital allocation.\n\nLOCAL MOVE:\nKoller lists better service among the effects AI can enable, then frames competitive differentiation in terms of returns on capital or revenue growth.\n\nSOURCE TERMS:\n“customer service”; “differentiate”; “return on capital”; “grow my revenues faster.”\n\nWHAT BECAME STRANGE:\nThe authors’ interview supplies the missing word while leaving open whether the customer has any standing when the financial case weakens.\n\nQUESTION:\nWould the framework fund a measurable customer improvement whose expected financial return stays below the hurdle rate?\n\nDEEPER QUESTION:\nCan a customer outcome function as a commitment, a constraint, or a decision criterion when it cannot be converted into a credible revenue forecast?\n\nMECHANISM:\n[OUR INFERENCE] A project’s customer effects may enter a capital-allocation decision through projected retention, growth, pricing, or cost. Whether those effects can independently justify approval remains open.\n\nFORMAL SHIFT:\nCustomer improvement → forecast business effects → [apply investment criteria] → approve, redesign, or reject.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Hold risk, cost, and financial return constant across two projects. Vary the customer outcome and observe whether the ranking changes.\n\nTENSION:\nDenning addresses the book’s public framing. The interview is a separate artifact. It establishes that customer service enters the authors’ account while leaving its decision weight unresolved.\n\nMISSING:\nA worked case in which a customer outcome and a financial hurdle point toward opposite decisions.\n\nBOUNDARY:\nThe interview supports a distinction between rhetorical presence and decision authority. It leaves the book’s full allocation rules and client practice open.\n\nCITATION TRAIL:\nCompare the book’s capital-allocation examples with the authors’ public interview. Search for rejected or redesigned projects as well as approved ones.\n\nTEST:\nFind one below-hurdle project approved for a documented customer outcome. Check whether the outcome carried independent weight or whether the team revised its financial projections before approval.\n\nPLATFORM:\n[[What counts as value in a decision]]\n\nLINKS:\n[[Customer benefit as a means or an end]]\n[[Capital-allocation vetoes]]\n[[Metrics as decision rules]]\n\nBIBTEX:\n@misc{koller2026strategyauthortalks,\n  author = {Koller, Tim and Zimmerman, Whitney and West, Andy},\n  title = {Why You Can't Separate Strategy from Value---and Vice Versa},\n  year = {2026},\n  organization = {McKinsey \\& Company},\n  note = {Interview with Roberta Fusaro},\n  url = {https://www.mckinsey.com/featured-insights/mckinsey-on-books/author-talks-why-you-cant-separate-strategy-from-value-and-vice-versa}\n}", "sha": "ddd48dd93f0687e0cc05640928a080c58b1680551b5d9dd7af4936c9044c1275", "title": "A customer outcome can appear in the argument and still lose the investment decision"}, {"filename": "004__Signature-on-the-Deck__Denning-2026__ZF-MGMT-004__from-forage.txt", "id": "ZF-MGMT-004", "key": "z-a35b3120aa02fa101b38391428917b105ecf072d9b9fb0127f8616cd054e4f4e", "name": "Signature-on-the-Deck", "object": "The effect of consultant attribution on approval when the recommendation itself is held constant.", "order": 4, "payload": "ZETTEL\n\nID:\nZF-MGMT-004\n\nTITLE:\nA consulting firm can change which proposal gets approved without changing the proposal\n\nSOURCE:\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §6.\n\nPASSAGE:\n[QUOTE] “for legitimacy and political cover”\n\nRESEARCH OBJECT:\nThe effect of consultant attribution on approval when the recommendation itself is held constant.\n\nLOCAL MOVE:\nDenning gives a reason to hire consultants that operates through the organization’s approval process.\n\nSOURCE TERMS:\n“legitimacy”; “political cover”; “surge analytical capacity”; “proprietary benchmarks.”\n\nWHAT BECAME STRANGE:\nA deck can look analytically redundant and still perform consequential work. Its signature can change who feels able to authorize the decision.\n\nQUESTION:\nAt which approval step does outside endorsement change what an executive can get through?\n\nDEEPER QUESTION:\nWhen does the signature convey credible verification, and when does it redistribute blame for a decision already favored internally?\n\nMECHANISM:\n[OUR INFERENCE] An internal proposal stalls. An outside firm endorses it. Reviewers revise their belief in the analysis, their exposure if it fails, or both. The proposal clears the gate.\n\nFORMAL SHIFT:\nInternal proposal → externally attributed recommendation → [approval review] → possible change in approval or accountability.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Separate three effects: a change to the recommendation, a change to confidence in its evidence, and a change to who expects to answer for failure.\n\nTENSION:\nThe same unchanged recommendation could reflect independent corroboration or a purchase of cover. Approval alone cannot distinguish them.\n\nMISSING:\nVersioned recommendations, the review sequence, and evidence of what persuaded the reviewer who had been blocking the decision.\n\nBOUNDARY:\nDenning proposes a motive. The passage leaves its prevalence and its effect on decision quality unresolved.\n\nCITATION TRAIL:\nFollow the internal proposal, procurement brief, consultant deliverable, and approval minutes for one engagement.\n\nTEST:\nFind an engagement where the recommendation survives intact. Compare the objection recorded before the engagement with the rationale recorded at approval. Code whether new evidence, independent verification, or shifted accountability addressed the objection.\n\nPLATFORM:\n[[Consulting as organizational authorization]]\n\nLINKS:\n[[Decision rights]]\n[[Evidence versus endorsement]]\n[[Business school–consultancy interlock]]\n\nBIBTEX:\n@misc{denning2026businessschools,\n  author = {Denning, Steve},\n  title = {Why Business Schools And Consulting Firms Are Adding So Little Value},\n  year = {2026},\n  month = nov,\n  howpublished = {Forbes},\n  url = {https://www.forbes.com/sites/stevedenning/2026/11/02/why-business-schools-and-consulting-firms-are-adding-so-little-value/}\n}", "sha": "a35b3120aa02fa101b38391428917b105ecf072d9b9fb0127f8616cd054e4f4e", "title": "A consulting firm can change which proposal gets approved without changing the proposal"}, {"filename": "005__Enablement-and-Exit__Denning-2026__ZF-MGMT-005__from-forage.txt", "id": "ZF-MGMT-005", "key": "z-641a7621b253ccdd48355a16b6bee8bcf683314dff46eaddcf491196a5d78f25", "name": "Enablement-and-Exit", "object": "The use of investor returns as evidence for a management model defined by customer outcomes.", "order": 5, "payload": "ZETTEL\n\nID:\nZF-MGMT-005\n\nTITLE:\nAn investor return cannot distinguish customer enablement from customer dependence\n\nSOURCE:\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§5, 8.\n\nPASSAGE:\n[QUOTE] “extraordinary 10-year total returns”\n\nRESEARCH OBJECT:\nThe use of investor returns as evidence for a management model defined by customer outcomes.\n\nLOCAL MOVE:\nDenning places observed investor returns alongside his account of customer enablement and long-term reinvestment at selected firms.\n\nSOURCE TERMS:\n“customer enablement”; “long-term reinvestment”; “customer outcomes”; “10-year total returns.”\n\nWHAT BECAME STRANGE:\nA product can expand what a customer is able to do while increasing what it costs that customer to leave. Both changes can support the same investor return.\n\nQUESTION:\nIn one named firm, what evidence would distinguish repeat purchasing driven by better outcomes from repeat purchasing driven by switching costs?\n\nDEEPER QUESTION:\nCan enablement today produce dependence tomorrow through the same investment in training, integrations, or accumulated workflows?\n\nMECHANISM:\n[OUR INFERENCE] Adoption builds useful capabilities and firm-specific knowledge. Customers gain from using the product, while the cost of rebuilding those capabilities elsewhere can rise. Retention can reflect both effects.\n\nFORMAL SHIFT:\nInvestor return → candidate operating explanations → [compare task outcomes and ability to switch] → evidence separating benefit from dependence.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Track three outcomes independently: performance on the customer’s task, cost to preserve that performance after switching, and investor return.\n\nTENSION:\nCustomer enablement and bargaining power can coexist inside a single product decision. The stock-return figure supplies no way to apportion their contributions.\n\nMISSING:\nCustomer-level task outcomes, switching costs, and a comparable group facing different switching conditions.\n\nBOUNDARY:\nThe selected firms generate hypotheses about operating practices. Their returns leave the causal contribution of those practices and their transferability unresolved.\n\nCITATION TRAIL:\nPair Porter’s discussion of switching costs with product migration records and customer procurement decisions for one firm Denning names.\n\nTEST:\nFind a change that lowered the cost of switching for some customers while leaving core functionality stable. Compare retention and task performance for affected customers and a comparable unaffected group.\n\nPLATFORM:\n[[Customer value and right of exit]]\n\nLINKS:\n[[Customer benefit as a means or an end]]\n[[Complementary assets]]\n[[Value creation and value capture]]\n\nBIBTEX:\n@misc{denning2026businessschools,\n  author = {Denning, Steve},\n  title = {Why Business Schools And Consulting Firms Are Adding So Little Value},\n  year = {2026},\n  month = nov,\n  howpublished = {Forbes},\n  url = {https://www.forbes.com/sites/stevedenning/2026/11/02/why-business-schools-and-consulting-firms-are-adding-so-little-value/}\n}", "sha": "641a7621b253ccdd48355a16b6bee8bcf683314dff46eaddcf491196a5d78f25", "title": "An investor return cannot distinguish customer enablement from customer dependence"}, {"filename": "006__The-Paid-Alibi__Graeber-2018__ZF-MGMT-006__from-opposition.txt", "id": "ZF-MGMT-006", "key": "z-3f4ca86cb09388b22fd84021540031b9bbd562f1fffa02c9f85c9eae270db32d", "name": "The-Paid-Alibi", "object": "A deliverable that fails its stated purpose and succeeds at protecting its buyer.", "order": 6, "payload": "ZETTEL\n\nID:\nZF-MGMT-006\n\nTITLE:\nThe deck can be bullshit and still earn every dollar of its fee\n\nSOURCE:\nDavid Graeber — Bullshit Jobs: A Theory — 2018 — final working definition.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §6.\n\nPASSAGE:\n[QUOTE — Graeber] “the employee feels obliged to pretend that this is not the case”\n[QUOTE — Denning] “for legitimacy and political cover”\n\nRESEARCH OBJECT:\nA deliverable that fails its stated purpose and succeeds at protecting its buyer.\n\nLOCAL MOVE:\nGraeber makes compelled pretense part of the definition. Denning identifies a reason the executive might be satisfied with work the analyst privately considers a sham.\n\nSOURCE TERMS:\n“pretend”; “legitimacy”; “political cover.”\n\nWHAT BECAME STRANGE:\nA repeat client can be evidence that the hidden service is excellent. The analyst sold an independent judgment in public and supplied an alibi in private.\n\nQUESTION:\nWhat happens to the engagement when the analyst’s best-supported answer contradicts the sponsor’s preferred decision?\n\nDEEPER QUESTION:\nWho inside the engagement can say what the client is really buying without jeopardizing the contract or their job?\n\nMECHANISM:\n[OUR INFERENCE] The buyer commissions ostensibly open analysis. The team learns which conclusions can survive review. The final deck gives a prior decision the appearance of having been independently reached.\n\nFORMAL SHIFT:\nPredetermined decision → apparently open inquiry → [filter findings through sponsor review] → signed endorsement.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Score an engagement separately on whether findings changed the decision, whether attribution changed its defensibility, and whether staff felt obliged to misrepresent the work.\n\nTENSION:\nAn independent review can genuinely confirm the prior decision. The decisive distinction is whether the reviewers had permission and practical means to reach the opposite result.\n\nMISSING:\nThe original brief, discarded findings, review comments, and private accounts from the people who did the work.\n\nBOUNDARY:\nOne foreclosed engagement supports a claim about that assignment. Graeber’s job-level diagnosis requires evidence about the employee’s role and the pretense it demands.\n\nCITATION TRAIL:\nGraeber’s final working definition and “Box-tickers.” Denning §6. Follow the statement of work into redlines, board minutes, and analyst interviews.\n\nTEST:\nFind one analytically material result that cut against the sponsor’s preference. Trace whether it reached the decision packet intact and whether anyone could act on it.\n\nPLATFORM:\n[[Consulting as organizational authorization]]\n\nLINKS:\n[[Compelled pretense]]\n[[Evidence versus endorsement]]\n[[The buyer of the alibi]]\n\nBIBTEX:\n@book{graeber2018bullshit,\n  author = {Graeber, David},\n  title = {Bullshit Jobs: A Theory},\n  year = {2018},\n  publisher = {Simon \\& Schuster},\n  url = {https://www.simonandschuster.biz/books/Bullshit-Jobs/David-Graeber/9781501143335}\n}", "sha": "3f4ca86cb09388b22fd84021540031b9bbd562f1fffa02c9f85c9eae270db32d", "title": "The deck can be bullshit and still earn every dollar of its fee"}, {"filename": "007__Who-Can-Reverse-It__Davies__ZF-MGMT-007__from-opposition.txt", "id": "ZF-MGMT-007", "key": "z-d93f9dc6135dc59a756cda04cfbe9989ddc4fd1496bb2a222750249298348440", "name": "Who-Can-Reverse-It", "object": "The path from a documented harm to someone with authority to change the decision that caused it.", "order": 7, "payload": "ZETTEL\n\nID:\nZF-MGMT-007\n\nTITLE:\nEverybody can sign the decision and nobody can reverse it\n\nSOURCE:\nDan Davies — Taming the Unaccountability Machine — “The unaccountability machine.”\n\nPASSAGE:\n[QUOTE] “the feedback link is broken between the consequences of decisions and the body responsible for making them”\n\nRESEARCH OBJECT:\nThe path from a documented harm to someone with authority to change the decision that caused it.\n\nLOCAL MOVE:\nDavies locates the failure in the return path from consequences to decision authority.\n\nSOURCE TERMS:\n“accountability sinks”; “feedback link”; “blank contractual wall.”\n\nWHAT BECAME STRANGE:\nA decision can leave an immaculate audit trail and still be practically unappealable. Every signature can establish that someone performed their assigned step while leaving the affected person without a route to correction.\n\nQUESTION:\nWhen a worker challenges a consultant-designed staffing cut using evidence of harm, where does the evidence stop moving?\n\nDEEPER QUESTION:\nWho designed the jurisdictional boundaries that let every participant give a locally accurate reason why the decision belongs somewhere else?\n\nMECHANISM:\n[OUR INFERENCE] The consultant points to the client’s sign-off. The executive points to the approved benchmark. HR points to policy. The appeal closes because each participant can explain their own step and none accepts the power to reopen the whole decision.\n\nFORMAL SHIFT:\nHarm → complaint → [route through limited mandates] → case closure or authorized reconsideration.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Draw a directed path from the affected person to a role able to receive the original evidence, reopen the case, and amend the rule for future cases. Mark where any of those powers disappears.\n\nTENSION:\nDividing responsibilities can make decisions more accountable when escalation has a real endpoint. The same organizational chart can support either result.\n\nMISSING:\nAppeal records, actual override rights, and evidence that a successful appeal can change the rule as well as the individual outcome.\n\nBOUNDARY:\nThe staffing example is a hypothetical application of Davies. Delay or multiple handoffs alone establish friction. The stronger claim requires a broken route to corrective authority.\n\nCITATION TRAIL:\nDavies’s discussion of outsourcing and democratic feedback. Follow a consulting recommendation into the client’s delegation matrix and appeals procedure.\n\nTEST:\nTake one upheld complaint. Check who heard it, who could change the individual outcome, and who could change the next decision. A reasoned reopening by an empowered owner defeats the strong sink diagnosis for that route.\n\nPLATFORM:\n[[Accountability as a feedback path]]\n\nLINKS:\n[[Formal approval versus corrective authority]]\n[[The appeal that changes the rule]]\n[[Consulting as organizational authorization]]\n\nBIBTEX:\n@misc{daviesTaming,\n  author = {Davies, Dan},\n  title = {Taming the Unaccountability Machine},\n  howpublished = {Niskanen Center},\n  url = {https://hypertext.niskanencenter.org/p/taming-the-unaccountability-machine}\n}", "sha": "d93f9dc6135dc59a756cda04cfbe9989ddc4fd1496bb2a222750249298348440", "title": "Everybody can sign the decision and nobody can reverse it"}, {"filename": "008__The-Flak-Catcher__Graeber__ZF-MGMT-008__from-opposition.txt", "id": "ZF-MGMT-008", "key": "z-00ba47ccfa8afacf35d09473aa396473e9bf78e2115fc7d6b4a96946905183ae", "name": "The-Flak-Catcher", "object": "A worker paid to receive the anger created by a capacity decision they lack authority to change.", "order": 8, "payload": "ZETTEL\n\nID:\nZF-MGMT-008\n\nTITLE:\nThe complaint handler is cheaper than fixing what people complain about\n\nSOURCE:\nDavid Graeber — The Rise of Bullshit Jobs — interview with Suzi Weissman — university carpenter example.\n\nPASSAGE:\n[QUOTE] “Be a flak-catcher, effectively.”\n\nRESEARCH OBJECT:\nA worker paid to receive the anger created by a capacity decision they lack authority to change.\n\nLOCAL MOVE:\nGraeber’s anecdote puts an apologetic intermediary between a broken shelf and a university with insufficient repair capacity.\n\nSOURCE TERMS:\n“flak-catcher”; “duct-taper”; “carpenter.”\n\nWHAT BECAME STRANGE:\nThe intermediary may be excellent at helping people and still make the underlying failure easier for management to live with. Their competence can be what keeps the problem below the threshold for intervention.\n\nQUESTION:\nDoes complaint handling reduce the underlying failure rate or mainly reduce the chance that the person who controls capacity has to encounter it?\n\nDEEPER QUESTION:\nDoes the organization count complaints as evidence of a capacity shortfall or as work items to close?\n\nMECHANISM:\n[OUR INFERENCE] Understaffing produces repeated failures. A coordinator absorbs the resulting complaints. Management receives a count of closed tickets while the same failure keeps recurring.\n\nFORMAL SHIFT:\nRecurring failure → complaint queue → [acknowledge and close] → lower reported backlog with possible persistence of the failure.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Track complaint closure, recurrence of the underlying problem, and whether the budget owner received evidence of recurrence.\n\nTENSION:\nA coordinator can aggregate incidents and make the case for capacity that an individual user could never make. That role becomes a sensor if someone with authority must act on what it detects.\n\nMISSING:\nWhat the coordinator escalated, who could authorize another hire, and how recurrence entered the budget process.\n\nBOUNDARY:\nGraeber gives an anecdote and a staffing counterfactual. Applying Davies requires separate evidence that the organizational arrangement intercepted corrective feedback.\n\nCITATION TRAIL:\nGraeber’s interview on duct-tapers. Davies’s section “Control and communication.” Follow raw tickets into capacity reviews.\n\nTEST:\nTrace three repetitions of the same failure. If the handler closed each ticket and no record of recurrence reached the budget owner, inspect who chose the reporting rule and whether that rule can be challenged.\n\nPLATFORM:\n[[Labor that absorbs the consequences of management]]\n\nLINKS:\n[[Accountability as a feedback path]]\n[[Complaint closure versus problem resolution]]\n[[Useful work inside a broken system]]\n\nBIBTEX:\n@misc{graeberRiseBullshitJobs,\n  author = {Graeber, David},\n  title = {The Rise of Bullshit Jobs},\n  note = {Interview by Suzi Weissman},\n  url = {https://davidgraeber.org/interviews/the-rise-of-bullshit-jobs/}\n}", "sha": "00ba47ccfa8afacf35d09473aa396473e9bf78e2115fc7d6b4a96946905183ae", "title": "The complaint handler is cheaper than fixing what people complain about"}, {"filename": "009__The-Absent-Sequel__Denning-2026__ZF-MGMT-009__from-opposition.txt", "id": "ZF-MGMT-009", "key": "z-7bbe72435667a93c982b2d843157c0b203345acb472bd9dbf023362dcb8d79e0", "name": "The-Absent-Sequel", "object": "Whether a teaching case gives people subject to a decision any power to reopen it.", "order": 9, "payload": "ZETTEL\n\nID:\nZF-MGMT-009\n\nTITLE:\nThe MBA case can end exactly where accountability begins\n\nSOURCE:\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — opening discussion of the case method.\nDan Davies — Taming the Unaccountability Machine — “Control and communication.”\n\nPASSAGE:\n[QUOTE — Denning] “the vantage point of a single top executive”\n[QUOTE — Davies] “the decided-upon”\n\nRESEARCH OBJECT:\nWhether a teaching case gives people subject to a decision any power to reopen it.\n\nLOCAL MOVE:\nDenning describes a restriction of viewpoint. Davies adds a separate question about whether the people living with a decision can communicate what the decision-maker’s model discarded.\n\nSOURCE TERMS:\n“case method”; “single top executive”; “the decided-upon.”\n\nWHAT BECAME STRANGE:\nA case can include moving testimony from workers and customers and still give them no standing. Their voices can become more material for the executive to interpret while the executive retains every decision right.\n\nQUESTION:\nWhat happens if students must design the appeal that could overturn their own recommendation?\n\nDEEPER QUESTION:\nDoes the exercise train managers to exercise judgment, or to treat other people’s judgment as data they alone are entitled to weigh?\n\nMECHANISM:\n[OUR INFERENCE] The case packet fixes what enters as evidence. The assignment hands the student a decision right. The exercise ends at recommendation, so consequences and appeals fall outside the graded task.\n\nFORMAL SHIFT:\nOrganizational conflict → bounded executive case → [choose and defend a decision] → grade issued before the consequences arrive.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Give a second group the same case plus a later harm report from an affected actor. Grade whether that actor can trigger review, introduce new evidence, and secure a binding revision.\n\nTENSION:\nA focused executive case can be a legitimate exercise in decision-making under pressure. Repetition and grading determine whether the omitted feedback becomes a durable lesson.\n\nMISSING:\nActual case packets, grading rubrics, sequels, and evidence of how graduates transfer the exercise to work.\n\nBOUNDARY:\nThe pasted article describes a tendency. Whether any particular course teaches unaccountability turns on its instructional design and assessment.\n\nCITATION TRAIL:\nRead an original teaching case with its instructor guide and any follow-up case. Locate the last moment at which an affected actor can change the outcome.\n\nTEST:\nCompare two versions of the same case. Both include affected actors’ testimony. Only one gives those actors a binding right to trigger review. Check whether students change their original decision or merely add sympathetic language.\n\nPLATFORM:\n[[The management classroom as a model of decision rights]]\n\nLINKS:\n[[Standing versus representation]]\n[[Accountability as a feedback path]]\n[[The absent sequel]]\n\nBIBTEX:\n@misc{denning2026businessschools,\n  author = {Denning, Steve},\n  title = {Why Business Schools And Consulting Firms Are Adding So Little Value},\n  year = {2026},\n  month = nov,\n  howpublished = {Forbes},\n  url = {https://www.forbes.com/sites/stevedenning/2026/11/02/why-business-schools-and-consulting-firms-are-adding-so-little-value/}\n}", "sha": "7bbe72435667a93c982b2d843157c0b203345acb472bd9dbf023362dcb8d79e0", "title": "The MBA case can end exactly where accountability begins"}, {"filename": "010__Dissent-in-the-Denominator__Graeber__ZF-MGMT-010__from-opposition.txt", "id": "ZF-MGMT-010", "key": "z-21839d18096767bc029f980cdf3e7749967fb556cf16256067ab09129f125d9e", "name": "Dissent-in-the-Denominator", "object": "A metric that certifies customer-centeredness while discarding the evidence that could force a change.", "order": 10, "payload": "ZETTEL\n\nID:\nZF-MGMT-010\n\nTITLE:\nThe dashboard can give dissent a place to die\n\nSOURCE:\nDavid Graeber — ‘I had to guard an empty room’: the rise of the pointless job — “Box-tickers.”\nDan Davies — Taming the Unaccountability Machine — “Control and communication.”\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§5, 7–8.\n\nPASSAGE:\n[QUOTE — Graeber] “allow an organisation to be able to claim it is doing something that, in fact, it is not doing”\n[QUOTE — Denning] “metrics focused on customer outcomes”\n\nRESEARCH OBJECT:\nA metric that certifies customer-centeredness while discarding the evidence that could force a change.\n\nLOCAL MOVE:\nGraeber asks what an organization can claim because a document exists. Davies asks what gets lost as information is made manageable. Together they put Denning’s proposed outcome metrics under pressure.\n\nSOURCE TERMS:\n“box-tickers”; “customer outcomes”; “the decided-upon.”\n\nWHAT BECAME STRANGE:\nA team can replace a margin target with a customer outcome target and preserve the same decision architecture. Whoever defines the denominator still decides whose experience is admissible.\n\nQUESTION:\nCan people excluded from the metric introduce evidence that compels the organization to change the service or the metric?\n\nDEEPER QUESTION:\nWho gets counted after they give up, leave, or fail to get through the front door?\n\nMECHANISM:\n[OUR INFERENCE] The dashboard includes completed journeys. The users most impeded by the process disappear before measurement. Staff produce evidence of improved outcomes for the remaining group. Leadership treats that improvement as permission to scale.\n\nFORMAL SHIFT:\nAttempted use → eligible measured cases → [aggregate recorded outcomes] → performance claim.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Recompute the metric for everyone who attempted to use the service. Keep abandonment, refusal, and unknown outcomes visible as separate categories.\n\nTENSION:\nA dashboard can reveal failure when it preserves exceptions and links them to review. The same instrument can hide failure when excluded people have no standing to contest its categories.\n\nMISSING:\nDenominator rules, abandoned journeys, cases coded out of scope, and the authority that can change those definitions.\n\nBOUNDARY:\nThis is a test of Denning’s proposed paradigm. It establishes no measurement practice at any of his named firms.\n\nCITATION TRAIL:\nFollow one customer outcome claim back through the dashboard specification, source data, complaint records, and the decision made from it.\n\nTEST:\nRebuild one celebrated outcome metric with abandoned cases visible. Take one material discrepancy to the metric owner. Observe whether it can alter the published claim or the decision made from it.\n\nPLATFORM:\n[[Customer value and the right to contradict the metric]]\n\nLINKS:\n[[The absent denominator]]\n[[Box-ticking as evidence production]]\n[[Standing versus representation]]\n\nBIBTEX:\n@misc{graeberPointlessJob,\n  author = {Graeber, David},\n  title = {`I had to guard an empty room': the rise of the pointless job},\n  url = {https://davidgraeber.org/articles/i-had-to-guard-an-empty-room/}\n}", "sha": "21839d18096767bc029f980cdf3e7749967fb556cf16256067ab09129f125d9e", "title": "The dashboard can give dissent a place to die"}, {"filename": "011__The-Change-Order__Davies__ZF-MGMT-011__from-opposition.txt", "id": "ZF-MGMT-011", "key": "z-4e59d24ab3b1859cfc91e9cfe1742b6d8466d1f9a35479821a303e2064c3f477", "name": "The-Change-Order", "object": "The price difference between winning the initial contract and repairing an inadequate specification.", "order": 11, "payload": "ZETTEL\n\nID:\nZF-MGMT-011\n\nTITLE:\nThe consultant can get paid again when the specification fails\n\nSOURCE:\nDan Davies — Taming the Unaccountability Machine — discussion immediately preceding “The unaccountability machine.”\n\nPASSAGE:\n[QUOTE] “future ‘changes of specification’ can be billed at the full hourly rate.”\n\nRESEARCH OBJECT:\nThe price difference between winning the initial contract and repairing an inadequate specification.\n\nLOCAL MOVE:\nDavies identifies an incentive for a vendor with better foresight to bid low at entry and earn more when the agreement has to change.\n\nSOURCE TERMS:\n“changes of specification”; “full hourly rate”; “cognitive deficit.”\n\nWHAT BECAME STRANGE:\nA bad specification can look like a procurement win at award and become a source of repeat revenue after award. The buyer can meet its savings target at the exact moment it commits to an expensive dependency.\n\nQUESTION:\nWhich foreseeable uncertainties did the vendor leave outside the base scope, and who later paid to bring them in?\n\nDEEPER QUESTION:\nDoes repeated outsourcing erode the buyer’s ability to detect the next under-specified bid?\n\nMECHANISM:\n[PARAPHRASE] The better-informed party can price the initial contract aggressively and bill subsequent changes at higher rates. [OUR INFERENCE] If the buyer also loses internal expertise, it may become less able to specify or contest the next engagement.\n\nFORMAL SHIFT:\nUncertain operating need → fixed bid specification → [price later deviations separately] → cheap award with potentially expensive adaptation.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Classify change orders by whether the need was unforeseeable, disclosed before award, or reasonably inferable from information available to the vendor.\n\nTENSION:\nPaid adaptation can be a sensible response to genuine uncertainty. The harder case is a recurring, foreseeable omission that one side is systematically better positioned to price.\n\nMISSING:\nBid assumptions, pre-award questions, change orders, margins, and evidence of the buyer’s internal capacity over time.\n\nBOUNDARY:\nThis mechanism comes from Davies’s discussion of public contracting. Its application to private strategy engagements requires contract-level evidence.\n\nCITATION TRAIL:\nDavies’s citation to Mariana Mazzucato and Rosie Collington’s The Big Con. Follow one original bid and its change-order history.\n\nTEST:\nPick the costliest change order. Look for the same requirement in pre-award communications or prior engagements. Compare who knew, who could have specified it, and who profited when it resurfaced.\n\nPLATFORM:\n[[Outsourcing and the loss of institutional capacity]]\n\nLINKS:\n[[The price of adaptation]]\n[[Who owns the specification]]\n[[Accountability as a feedback path]]\n\nBIBTEX:\n@misc{daviesTaming,\n  author = {Davies, Dan},\n  title = {Taming the Unaccountability Machine},\n  howpublished = {Niskanen Center},\n  url = {https://hypertext.niskanencenter.org/p/taming-the-unaccountability-machine}\n}", "sha": "4e59d24ab3b1859cfc91e9cfe1742b6d8466d1f9a35479821a303e2064c3f477", "title": "The consultant can get paid again when the specification fails"}, {"filename": "012__Patient-Shareholder-Value__Amazon-1997__ZF-MGMT-012__from-recursion.txt", "id": "ZF-MGMT-012", "key": "z-8f60363de5ceca0b8b65115e6c4e6623a2fbbb4303d05ea4a5a3044883c3fa9a", "name": "Patient-Shareholder-Value", "object": "A firm Denning presents as evidence of a new paradigm explicitly links customer benefit, market leadership, and shareholder value in one investment logic.", "order": 12, "payload": "ZETTEL\n\nID:\nZF-MGMT-012\n\nTITLE:\nAmazon puts customer obsession inside a shareholder-value strategy\n\nSOURCE:\nAmazon.com — 1997 Letter to Shareholders — “It’s All About the Long Term” and the investment principles that follow.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §5.\n\nPASSAGE:\n[QUOTE — Amazon] “We believe that a fundamental measure of our success will be the shareholder value we create over the long term.”\n[PARAPHRASE] The same letter commits Amazon to relentless customer focus, investing for market leadership, abandoning programs with inadequate returns, and prioritizing the present value of future cash flows over the appearance of accounting results.\n\nRESEARCH OBJECT:\nA firm Denning presents as evidence of a new paradigm explicitly links customer benefit, market leadership, and shareholder value in one investment logic.\n\nLOCAL MOVE:\nThe letter tells investors how management expects to make money and asks them to decide whether they can tolerate the path to getting there.\n\nSOURCE TERMS:\n“shareholder value”; “market leadership”; “future cash flows”; “acceptable returns.”\n\nWHAT BECAME STRANGE:\nDenning’s contrast bundles together two variables that Amazon separates: who ultimately benefits from the strategy and how long management is willing to wait. Amazon’s letter gives customer benefit a central operational role while declaring a long-run financial measure of success.\n\nQUESTION:\nWhich Amazon decision would a patient shareholder-value maximizer reject and a customer-first executive approve?\n\nDEEPER QUESTION:\nDoes investor tolerance for delayed payoffs buy management freedom to serve customers, or freedom to pursue dominance by serving customers exceptionally well at an early stage?\n\nMECHANISM:\n[PARAPHRASE] Amazon expects better customer experiences to build market leadership. Management expects leadership to improve the economics of the business over time. Investors are asked to judge investments on that horizon.\n\nFORMAL SHIFT:\nCustomer improvement → expected market leadership → [evaluate long-run investment return] → scale or discontinue.\n\nSOURCE FORMALISM:\nThe letter specifies present value of future cash flows as a decision criterion in a stated tradeoff. It supplies no cash-flow model for a named project.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Compare decisions where customer outcomes and expected long-run financial returns point in opposite directions. Choices where both improve are compatible with both accounts.\n\nTENSION:\nReading A: The change Denning identifies concerns management’s operating method and investment horizon. Amazon supports that reading. Reading B: The change displaces shareholder value as the ultimate criterion. Amazon’s stated doctrine puts that reading under pressure.\n\nMISSING:\nA decision made under explicit conflict between durable customer benefit and expected long-run shareholder return, with contemporaneous evidence of how management resolved it.\n\nBOUNDARY:\nThe letter establishes Amazon’s stated doctrine in 1997. It leaves actual project decisions, later policy, and outcomes for workers or sellers open.\n\nCITATION TRAIL:\n[[ZF-MGMT-003]] → Amazon’s 1997 investment principles → subsequent shareholder letters and contemporaneous investment explanations for a named customer program.\n\nTEST:\nSelect one launched and one discontinued customer-facing program. Use contemporary disclosures to distinguish expected financial losses from temporary losses and strategic option value. Code a conflict only where management itself expected the financial downside to persist.\n\nPLATFORM:\n[[Customer benefit as a means or an end]]\n\nLINKS:\n[[ZF-MGMT-003]]\n[[ZF-MGMT-005]]\n[[Patient shareholder value]]\n\nBIBTEX:\n@misc{amazon1997shareholderletter,\n  author = {{Amazon.com}},\n  title = {1997 Letter to Shareholders},\n  year = {1997},\n  note = {Reprinted with the 2001 shareholder letter},\n  url = {https://ir.aboutamazon.com/files/doc_financials/annual/2001_shareholderLetter.pdf}\n}", "sha": "8f60363de5ceca0b8b65115e6c4e6623a2fbbb4303d05ea4a5a3044883c3fa9a", "title": "Amazon puts customer obsession inside a shareholder-value strategy"}, {"filename": "013__Pricing-the-Gain__McKinsey-2000__ZF-MGMT-013__from-recursion.txt", "id": "ZF-MGMT-013", "key": "z-a741a48aa75eb6ff93e977ba15d5637f7099a132cb86cb3d4b59d7d46d234065", "name": "Pricing-the-Gain", "object": "A consulting instrument that makes the customer’s improvement legible as a quantity the seller can use.", "order": 13, "payload": "ZETTEL\n\nID:\nZF-MGMT-013\n\nTITLE:\nMcKinsey had a way to price customer benefit decades before the alleged break\n\nSOURCE:\nMcKinsey & Company — Delivering Value to Customers — 2000 — discussion of economic value to the customer.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §3.\n\nPASSAGE:\n[QUOTE — McKinsey] “quantify the additional value a product brings to customers above what they already receive from their present suppliers.”\n[PARAPHRASE] McKinsey’s retrospective traces customer price–value models to its own staff papers from 1979 and 1981.\n\nRESEARCH OBJECT:\nA consulting instrument that makes the customer’s improvement legible as a quantity the seller can use.\n\nLOCAL MOVE:\nThe article makes the customer’s existing supplier a baseline for evaluating the benefit of switching. It then connects the value proposition to the price charged to a segment.\n\nSOURCE TERMS:\n“economic value to the customer”; “present suppliers”; “value proposition”; “customer segment.”\n\nWHAT BECAME STRANGE:\nCustomer benefit has a history inside the very consultancy Denning casts as the carrier of an older paradigm. Putting that benefit into a model opens a further question: how much of the improvement is the model designed to leave with the customer?\n\nQUESTION:\nWhen the model finds additional customer value, does management change the product, the price, or the share of the gain it intends to keep?\n\nDEEPER QUESTION:\nDid this customer-centered vocabulary coexist with finance-led governance because it gave the seller a better way to calculate what it could capture?\n\nMECHANISM:\n[OUR INFERENCE] A supplier estimates the customer’s gain relative to an existing offer. The estimate can guide redesign or show how far price can rise before the customer loses the incentive to switch. The same evidence supports both operations.\n\nFORMAL SHIFT:\nExisting supplier and proposed offer → quantified difference in customer value → [inform design or pricing] → revised offer and division of gains.\n\nSOURCE FORMALISM:\nThe article supplies a comparative baseline and a price–value framework. The alternative uses of that estimate are separated here for analysis.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Record incremental customer benefit before price, incremental price, and the residual benefit to the customer. Track which of the three the recommendation seeks to increase.\n\nTENSION:\nThe historical source pressures a story about when consultancies discovered customer value. Denning’s stronger claim can survive as a claim about which decision criteria routinely win in practice.\n\nMISSING:\nOriginal staff papers and a client engagement that shows whether the model shifted engineering investment, pricing, or both.\n\nBOUNDARY:\nThe retrospective establishes a published consulting lineage. It leaves the prevalence and influence of that lineage inside McKinsey and among its clients unresolved.\n\nCITATION TRAIL:\n[[ZF-MGMT-001]] and [[ZF-MGMT-003]] → McKinsey’s retrospective → its cited 1979 equipment model and Harvey Golub and Jane Henry’s 1981 “Market strategy and the price-value model.”\n\nTEST:\nRecover one worked recommendation and vary only the estimated customer benefit. Observe which output changes first: the product specification, target price, or expected margin.\n\nPLATFORM:\n[[Genealogies of customer value]]\n\nLINKS:\n[[ZF-MGMT-001]]\n[[ZF-MGMT-003]]\n[[Value creation and value capture]]\n\nBIBTEX:\n@misc{mckinsey2000delivering,\n  author = {{McKinsey \\& Company}},\n  title = {Delivering Value to Customers},\n  year = {2000},\n  url = {https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/delivering-value-to-customers}\n}", "sha": "a741a48aa75eb6ff93e977ba15d5637f7099a132cb86cb3d4b59d7d46d234065", "title": "McKinsey had a way to price customer benefit decades before the alleged break"}, {"filename": "014__The-Limited-Assortment__Costco-2025__ZF-MGMT-014__from-recursion.txt", "id": "ZF-MGMT-014", "key": "z-80a0801dc0e4fb45f31d930ee0d5687711c7ed36c7ed932574bc463ad4c454f8", "name": "The-Limited-Assortment", "object": "The customer requests a business must decline to preserve its customer promise.", "order": 14, "payload": "ZETTEL\n\nID:\nZF-MGMT-014\n\nTITLE:\nCostco makes customer value by refusing to serve some customer preferences\n\nSOURCE:\nCostco Wholesale Corporation — 2025 Form 10-K — Item 1, “General.”\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§5 and 7.\n\nPASSAGE:\n[QUOTE — Costco] “We seek to limit most items to fast-selling models, sizes, and colors.”\n[PARAPHRASE] Costco links a restricted assortment and low prices to volume and rapid inventory turnover. It identifies purchasing, distribution, and reduced handling as ways the model supports lower merchandise margins.\n\nRESEARCH OBJECT:\nThe customer requests a business must decline to preserve its customer promise.\n\nLOCAL MOVE:\nCostco explains its economics through a deliberate assortment constraint. A smaller set of items is part of how the company can afford the offer it makes to members.\n\nSOURCE TERMS:\n“fast-selling”; “limited selection”; “rapid inventory turnover”; “gross margins.”\n\nWHAT BECAME STRANGE:\nThe firm may have to disappoint a customer asking for more choice to protect low prices for the membership. Learning what customers want and deciding which wants the business can afford to serve are different operations.\n\nQUESTION:\nAt what point does adding a locally desired item weaken the value members get from the system as a whole?\n\nDEEPER QUESTION:\nWhere does the cost of the restricted assortment land among members whose needs fit the fast-selling sizes and members whose needs regularly fall outside them?\n\nMECHANISM:\n[OUR INFERENCE] Restricting variants can concentrate purchasing volume and reduce handling. The resulting savings can support lower prices. Members who cannot find a suitable variant may have to spend additional time or money elsewhere.\n\nFORMAL SHIFT:\nCompeting assortment requests → item economics and member needs → [retain or exclude a variant] → changes in price, availability, and shopping burden.\n\nSOURCE FORMALISM:\nThe filing defines gross margin as net sales less merchandise costs. Its account of assortment, volume, turnover, and operating efficiency is qualitative.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Measure the customer effect of adding or removing a variant through basket price, failed shopping trips, and spending elsewhere. Break out households whose requirements are affected.\n\nTENSION:\nDenning emphasizes continuous adaptation. Costco describes a stable constraint that can make selective adaptation valuable. The two can coexist, but a generic instruction to deliver more of what customers want cannot resolve a conflict between breadth and price.\n\nMISSING:\nA documented assortment decision with internal item economics and independent evidence about shoppers who could not complete the intended purchase.\n\nBOUNDARY:\nThe filing describes Costco’s model. It leaves the causal effect of assortment limits and the distribution of gains across members to be tested.\n\nCITATION TRAIL:\n[[ZF-MGMT-010]] → Costco’s 10-K description of assortment → dated item additions or removals and shopping records that include trips ending without purchase.\n\nTEST:\nFind one removed variant. Compare basket costs and completion rates before and after removal for households that depended on it and households that did not. Check whether the reported performance metric registers the first group.\n\nPLATFORM:\n[[Customer value and the right to contradict the metric]]\n\nLINKS:\n[[ZF-MGMT-005]]\n[[ZF-MGMT-010]]\n[[Customer value through strategic refusal]]\n\nBIBTEX:\n@misc{costco2025form10k,\n  author = {{Costco Wholesale Corporation}},\n  title = {Annual Report on Form 10-K for the Fiscal Year Ended August 31, 2025},\n  year = {2025},\n  url = {https://www.sec.gov/Archives/edgar/data/909832/000090983225000101/cost-20250831.htm}\n}", "sha": "80a0801dc0e4fb45f31d930ee0d5687711c7ed36c7ed932574bc463ad4c454f8", "title": "Costco makes customer value by refusing to serve some customer preferences"}, {"filename": "015__Who-Enters-the-Loop__Denning-2010__ZF-MGMT-015__from-recursion.txt", "id": "ZF-MGMT-015", "key": "z-7af6e9ab9bbb3dd56bf55922d4557d4a2f1f3b64fac8b97eb0d8232f11280f8e", "name": "Who-Enters-the-Loop", "object": "The membership rule for a working feedback loop.", "order": 15, "payload": "ZETTEL\n\nID:\nZF-MGMT-015\n\nTITLE:\nDenning’s earlier model can hear the client without hearing the people affected\n\nSOURCE:\nStephen Denning — What Is Radical Management? — 2010 — opening Total Attorneys example, author-hosted version.\nDan Davies — Taming the Unaccountability Machine — “Control and communication.”\n\nPASSAGE:\n[QUOTE — Denning] “At the end of each cycle, the work is demonstrated to clients”\n[PARAPHRASE] Denning reports that client feedback enters the next cycle. Davies asks whether people living with the consequences of decisions can communicate what standardized representations leave out.\n\nRESEARCH OBJECT:\nThe membership rule for a working feedback loop.\n\nLOCAL MOVE:\nDenning’s earlier account supplies an operating mechanism missing from his 2026 examples: demonstrate work, solicit feedback, and feed it into the next cycle. Davies shifts attention to who can enter that cycle.\n\nSOURCE TERMS:\n“clients”; “cycles”; “feedback”; “the decided-upon.”\n\nWHAT BECAME STRANGE:\nA service can get better at satisfying the purchasing client while becoming harder for others to live with. In a legal-services workflow, the firm purchasing the software, the worker using it, and the person whose case passes through it can have different complaints and unequal access to the team.\n\nQUESTION:\nWho can get a backlog item changed when the paying client likes the feature and someone downstream bears the cost?\n\nDEEPER QUESTION:\nCan a loop that increases responsiveness to the purchaser also increase organizational ignorance about everyone the purchaser can speak for?\n\nMECHANISM:\n[OUR INFERENCE] The purchaser sees the demonstration and submits feedback. The team reprioritizes work against that feedback. Harm experienced elsewhere may remain invisible if the affected person lacks direct access or standing to trigger review.\n\nFORMAL SHIFT:\nProduct demonstration → admitted feedback → [reprioritize the next cycle] → revised service for the people represented in the loop.\n\nSOURCE FORMALISM:\nDenning describes cross-functional teams, prioritized work in cycles, demonstrations to clients, and incorporation of feedback. The account supplies no adjudication rule for conflicting feedback.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] For each affected role, record access to the demonstration, ability to submit evidence, authority to trigger review, and power to reverse a release.\n\nTENSION:\nThe paying client can be an effective proxy when its interests and downstream users’ interests align. The decisive case is a documented conflict in which the proxy has reason to suppress or discount the signal.\n\nMISSING:\nA demonstration roster, raw feedback, and a backlog decision where the purchaser’s preference conflicts with evidence from a worker or service recipient.\n\nBOUNDARY:\nDenning reports a client feedback loop. The legal-services conflict is a test case. The source does not establish that Total Attorneys excluded any particular group.\n\nCITATION TRAIL:\n[[ZF-MGMT-009]] and [[ZF-MGMT-010]] → Denning’s 2010 operating example → the roles present at a demonstration and the records of whose feedback changed the next cycle.\n\nTEST:\nTrace one workflow change from demo through release and subsequent complaint. Identify whether a person outside the purchaser’s organization could introduce evidence, trigger review, and get a harmful feature changed.\n\nPLATFORM:\n[[Accountability as a feedback path]]\n\nLINKS:\n[[ZF-MGMT-007]]\n[[ZF-MGMT-009]]\n[[ZF-MGMT-010]]\n[[Purchaser versus affected person]]\n\nBIBTEX:\n@misc{denning2010radical,\n  author = {Denning, Stephen},\n  title = {What Is Radical Management?},\n  year = {2010},\n  note = {Author-hosted version. A variant appeared in Strategy \\& Leadership},\n  url = {https://www.stevedenning.com/Documents/what-is-radical-management-aug-2-2010.pdf}\n}", "sha": "7af6e9ab9bbb3dd56bf55922d4557d4a2f1f3b64fac8b97eb0d8232f11280f8e", "title": "Denning’s earlier model can hear the client without hearing the people affected"}, {"filename": "016__The-Advisor-Crossing__Denning__ZF-MGMT-016__from-recursion.txt", "id": "ZF-MGMT-016", "key": "z-d72bd0c0d8c220e15c5c902c2c27c8204fd67998feedeace8bd083818daef599", "name": "The-Advisor-Crossing", "object": "The engagement as the unit of analysis for an argument drawn around whole institutions.", "order": 16, "payload": "ZETTEL\n\nID:\nZF-MGMT-016\n\nTITLE:\nDenning’s own client list crosses the divide his argument depends on\n\nSOURCE:\nSteve Denning — About — public professional biography.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§6–7.\n\nPASSAGE:\n[QUOTE — Denning biography] “His clients have included”\n[PARAPHRASE] The list includes McKinsey as well as Microsoft and Netflix, two firms Denning uses as exemplars of the customer-value paradigm. In Forbes, Denning says leading customer-value firms often rely less on the major consultancies for core strategy.\n\nRESEARCH OBJECT:\nThe engagement as the unit of analysis for an argument drawn around whole institutions.\n\nLOCAL MOVE:\nDenning’s biography names professional relationships across both sides of his distinction. It gives no dates, scopes, deliverables, or decision rights for those relationships.\n\nSOURCE TERMS:\n“clients”; “core strategy”; “rely less”; “radical management.”\n\nWHAT BECAME STRANGE:\nThe same person can sell management advice to a consultancy and to the companies offered as evidence that the consultancy’s model is obsolete. A client list proves contact and leaves open what actually crossed the boundary.\n\nQUESTION:\nWhich kinds of external advice do exemplar firms buy, and which decisions do they retain the capacity to make and revise themselves?\n\nDEEPER QUESTION:\nDoes the dividing line run between firms, or between engagements that build the client’s judgment and engagements that sell a decision the client can hide behind?\n\nMECHANISM:\n[OUR INFERENCE] External advice can supply evidence, teach a method, confer cover, or take over a decision process. Its organizational effect depends on who owns the model afterward, who can challenge it, and who can act when it fails.\n\nFORMAL SHIFT:\nFirm–advisor relationship → engagement scope and decision rights → [classify the work performed] → evidence of learning, dependency, authorization, or some combination.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] For each engagement, record who framed the question, who could reject the recommendation, who retained the working materials, and who handled post-decision evidence.\n\nTENSION:\nReading A: A common advisor can carry practices across a porous institutional boundary. Reading B: Speaking or training work can coexist with substantial differences in who controls core strategy. The biography leaves both readings alive.\n\nMISSING:\nEngagement scopes and a comparison group for “rely less.” The client list supplies neither.\n\nBOUNDARY:\nThe overlap does not establish that Denning advised any named firm on core strategy, that McKinsey adopted his approach, or that the professional relationship affected his article.\n\nCITATION TRAIL:\n[[ZF-MGMT-006]] and [[ZF-MGMT-011]] → Denning’s public client list → dated event programs, statements of work, and accounts from the people who owned the resulting decisions.\n\nTEST:\nRecover one documented engagement on each side of the divide. Classify both using the same criteria. Then seek one engagement at an exemplar firm where an outside advisor owned a decision model the client could not independently revise. That case would sharpen what “rely less” has to mean.\n\nPLATFORM:\n[[Business school–consultancy interlock]]\n\nLINKS:\n[[ZF-MGMT-006]]\n[[ZF-MGMT-007]]\n[[ZF-MGMT-011]]\n[[Consulting as capability transfer]]\n\nBIBTEX:\n@misc{denningAbout,\n  author = {Denning, Steve},\n  title = {About},\n  howpublished = {Leadership Storytelling by Steve Denning},\n  url = {https://stevedenning.com/about/}\n}", "sha": "d72bd0c0d8c220e15c5c902c2c27c8204fd67998feedeace8bd083818daef599", "title": "Denning’s own client list crosses the divide his argument depends on"}], "files": {"000__BIBLIOGRAPHY.txt": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\nUNIQUE · Porter, Michael E. · The Five Competitive Forces That Shape Strategy · 2008\nhttps://hbr.org/2008/01/the-five-competitive-forces-that-shape-strategy\nCards: ZF-MGMT-001\n@article{porter2008five,\n  author = {Porter, Michael E.},\n  title = {The Five Competitive Forces That Shape Strategy},\n  journal = {Harvard Business Review},\n  year = {2008},\n  ur
