\nSOURCE FORMALISM:\nThe letter specifies present value of future cash flows as a decision criterion in a stated tradeoff. It supplies no cash-flow model for a named project.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Compare decisions where customer outcomes and expected long-run financial returns point in opposite directions. Choices where both improve are compatible with both accounts.\n\nTENSION:\nReading A: The change Denning identifies concerns management’s operating method and investment horizon. Amazon supports that reading. Reading B: The change displaces shareholder value as the ultimate criterion. Amazon’s stated doctrine puts that reading under pressure.\n\nMISSING:\nA decision made under explicit conflict between durable customer benefit and expected long-run shareholder return, with contemporaneous evidence of how management resolved it.\n\nBOUNDARY:\nThe letter establishes Amazon’s stated doctrine in 1997. It leaves actual project decisions, later policy, and outcomes for workers or sellers open.\n\nCITATION TRAIL:\n[[ZF-MGMT-003]] → Amazon’s 1997 investment principles → subsequent shareholder letters and contemporaneous investment explanations for a named customer program.\n\nTEST:\nSelect one launched and one discontinued customer-facing program. Use contemporary disclosures to distinguish expected financial losses from temporary losses and strategic option value. Code a conflict only where management itself expected the financial downside to persist.\n\nPLATFORM:\n[[Customer benefit as a means or an end]]\n\nLINKS:\n[[ZF-MGMT-003]]\n[[ZF-MGMT-005]]\n[[Patient shareholder value]]\n\nBIBTEX:\n@misc{amazon1997shareholderletter,\n  author = {{Amazon.com}},\n  title = {1997 Letter to Shareholders},\n  year = {1997},\n  note = {Reprinted with the 2001 shareholder letter},\n  url = {https://ir.aboutamazon.com/files/doc_financials/annual/2001_shareholderLetter.pdf}\n}\n\n=== 013__Pricing-the-Gain__McKinsey-2000__ZF-MGMT-013__from-recursion.txt ===\n\nZETTEL\n\nID:\nZF-MGMT-013\n\nTITLE:\nMcKinsey had a way to price customer benefit decades before the alleged break\n\nSOURCE:\nMcKinsey & Company — Delivering Value to Customers — 2000 — discussion of economic value to the customer.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §3.\n\nPASSAGE:\n[QUOTE — McKinsey] “quantify the additional value a product brings to customers above what they already receive from their present suppliers.”\n[PARAPHRASE] McKinsey’s retrospective traces customer price–value models to its own staff papers from 1979 and 1981.\n\nRESEARCH OBJECT:\nA consulting instrument that makes the customer’s improvement legible as a quantity the seller can use.\n\nLOCAL MOVE:\nThe article makes the customer’s existing supplier a baseline for evaluating the benefit of switching. It then connects the value proposition to the price charged to a segment.\n\nSOURCE TERMS:\n“economic value to the customer”; “present suppliers”; “value proposition”; “customer segment.”\n\nWHAT BECAME STRANGE:\nCustomer benefit has a history inside the very consultancy Denning casts as the carrier of an older paradigm. Putting that benefit into a model opens a further question: how much of the improvement is the model designed to leave with the customer?\n\nQUESTION:\nWhen the model finds additional customer value, does management change the product, the price, or the share of the gain it intends to keep?\n\nDEEPER QUESTION:\nDid this customer-centered vocabulary coexist with finance-led governance because it gave the seller a better way to calculate what it could capture?\n\nMECHANISM:\n[OUR INFERENCE] A supplier estimates the customer’s gain relative to an existing offer. The estimate can guide redesign or show how far price can rise before the customer loses the incentive to switch. The same evidence supports both operations.\n\nFORMAL SHIFT:\nExisting supplier and proposed offer → quantified difference in customer value → [inform design or pricing] → revised offer and division of gains.\n\nSOURCE FORMALISM:\nThe article supplies a comparative baseline and a price–value framework. The alternative uses of that estimate are separated here for analysis.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Record incremental customer benefit before price, incremental price, and the residual benefit to the customer. Track which of the three the recommendation seeks to increase.\n\nTENSION:\nThe historical source pressures a story about when consultancies discovered customer value. Denning’s stronger claim can survive as a claim about which decision criteria routinely win in practice.\n\nMISSING:\nOriginal staff papers and a client engagement that shows whether the model shifted engineering investment, pricing, or both.\n\nBOUNDARY:\nThe retrospective establishes a published consulting lineage. It leaves the prevalence and influence of that lineage inside McKinsey and among its clients unresolved.\n\nCITATION TRAIL:\n[[ZF-MGMT-001]] and [[ZF-MGMT-003]] → McKinsey’s retrospective → its cited 1979 equipment model and Harvey Golub and Jane Henry’s 1981 “Market strategy and the price-value model.”\n\nTEST:\nRecover one worked recommendation and vary only the estimated customer benefit. Observe which output changes first: the product specification, target price, or expected margin.\n\nPLATFORM:\n[[Genealogies of customer value]]\n\nLINKS:\n[[ZF-MGMT-001]]\n[[ZF-MGMT-003]]\n[[Value creation and value capture]]\n\nBIBTEX:\n@misc{mckinsey2000delivering,\n  author = {{McKinsey \\& Company}},\n  title = {Delivering Value to Customers},\n  year = {2000},\n  url = {https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/delivering-value-to-customers}\n}\n\n=== 014__The-Limited-Assortment__Costco-2025__ZF-MGMT-014__from-recursion.txt ===\n\nZETTEL\n\nID:\nZF-MGMT-014\n\nTITLE:\nCostco makes customer value by refusing to serve some customer preferences\n\nSOURCE:\nCostco Wholesale Corporation — 2025 Form 10-K — Item 1, “General.”\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§5 and 7.\n\nPASSAGE:\n[QUOTE — Costco] “We seek to limit most items to fast-selling models, sizes, and colors.”\n[PARAPHRASE] Costco links a restricted assortment and low prices to volume and rapid inventory turnover. It identifies purchasing, distribution, and reduced handling as ways the model supports lower merchandise margins.\n\nRESEARCH OBJECT:\nThe customer requests a business must decline to preserve its customer promise.\n\nLOCAL MOVE:\nCostco explains its economics through a deliberate assortment constraint. A smaller set of items is part of how the company can afford the offer it makes to members.\n\nSOURCE TERMS:\n“fast-selling”; “limited selection”; “rapid inventory turnover”; “gross margins.”\n\nWHAT BECAME STRANGE:\nThe firm may have to disappoint a customer asking for more choice to protect low prices for the membership. Learning what customers want and deciding which wants the business can afford to serve are different operations.\n\nQUESTION:\nAt what point does adding a locally desired item weaken the value members get from the system as a whole?\n\nDEEPER QUESTION:\nWhere does the cost of the restricted assortment land among members whose needs fit the fast-selling sizes and members whose needs regularly fall outside them?\n\nMECHANISM:\n[OUR INFERENCE] Restricting variants can concentrate purchasing volume and reduce handling. The resulting savings can support lower prices. Members who cannot find a suitable variant may have to spend additional time or money elsewhere.\n\nFORMAL SHIFT:\nCompeting assortment requests → item economics and member needs → [retain or exclude a variant] → changes in price, availability, and shopping burden.\n\nSOURCE FORMALISM:\nThe filing defines gross margin as net sales less merchandise costs. Its account of assortment, volume, turnover, and operating efficiency is qualitative.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] Measure the customer effect of adding or removing a variant through basket price, failed shopping trips, and spending elsewhere. Break out households whose requirements are affected.\n\nTENSION:\nDenning emphasizes continuous adaptation. Costco describes a stable constraint that can make selective adaptation valuable. The two can coexist, but a generic instruction to deliver more of what customers want cannot resolve a conflict between breadth and price.\n\nMISSING:\nA documented assortment decision with internal item economics and independent evidence about shoppers who could not complete the intended purchase.\n\nBOUNDARY:\nThe filing describes Costco’s model. It leaves the causal effect of assortment limits and the distribution of gains across members to be tested.\n\nCITATION TRAIL:\n[[ZF-MGMT-010]] → Costco’s 10-K description of assortment → dated item additions or removals and shopping records that include trips ending without purchase.\n\nTEST:\nFind one removed variant. Compare basket costs and completion rates before and after removal for households that depended on it and households that did not. Check whether the reported performance metric registers the first group.\n\nPLATFORM:\n[[Customer value and the right to contradict the metric]]\n\nLINKS:\n[[ZF-MGMT-005]]\n[[ZF-MGMT-010]]\n[[Customer value through strategic refusal]]\n\nBIBTEX:\n@misc{costco2025form10k,\n  author = {{Costco Wholesale Corporation}},\n  title = {Annual Report on Form 10-K for the Fiscal Year Ended August 31, 2025},\n  year = {2025},\n  url = {https://www.sec.gov/Archives/edgar/data/909832/000090983225000101/cost-20250831.htm}\n}\n\n=== 015__Who-Enters-the-Loop__Denning-2010__ZF-MGMT-015__from-recursion.txt ===\n\nZETTEL\n\nID:\nZF-MGMT-015\n\nTITLE:\nDenning’s earlier model can hear the client without hearing the people affected\n\nSOURCE:\nStephen Denning — What Is Radical Management? — 2010 — opening Total Attorneys example, author-hosted version.\nDan Davies — Taming the Unaccountability Machine — “Control and communication.”\n\nPASSAGE:\n[QUOTE — Denning] “At the end of each cycle, the work is demonstrated to clients”\n[PARAPHRASE] Denning reports that client feedback enters the next cycle. Davies asks whether people living with the consequences of decisions can communicate what standardized representations leave out.\n\nRESEARCH OBJECT:\nThe membership rule for a working feedback loop.\n\nLOCAL MOVE:\nDenning’s earlier account supplies an operating mechanism missing from his 2026 examples: demonstrate work, solicit feedback, and feed it into the next cycle. Davies shifts attention to who can enter that cycle.\n\nSOURCE TERMS:\n“clients”; “cycles”; “feedback”; “the decided-upon.”\n\nWHAT BECAME STRANGE:\nA service can get better at satisfying the purchasing client while becoming harder for others to live with. In a legal-services workflow, the firm purchasing the software, the worker using it, and the person whose case passes through it can have different complaints and unequal access to the team.\n\nQUESTION:\nWho can get a backlog item changed when the paying client likes the feature and someone downstream bears the cost?\n\nDEEPER QUESTION:\nCan a loop that increases responsiveness to the purchaser also increase organizational ignorance about everyone the purchaser can speak for?\n\nMECHANISM:\n[OUR INFERENCE] The purchaser sees the demonstration and submits feedback. The team reprioritizes work against that feedback. Harm experienced elsewhere may remain invisible if the affected person lacks direct access or standing to trigger review.\n\nFORMAL SHIFT:\nProduct demonstration → admitted feedback → [reprioritize the next cycle] → revised service for the people represented in the loop.\n\nSOURCE FORMALISM:\nDenning describes cross-functional teams, prioritized work in cycles, demonstrations to clients, and incorporation of feedback. The account supplies no adjudication rule for conflicting feedback.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] For each affected role, record access to the demonstration, ability to submit evidence, authority to trigger review, and power to reverse a release.\n\nTENSION:\nThe paying client can be an effective proxy when its interests and downstream users’ interests align. The decisive case is a documented conflict in which the proxy has reason to suppress or discount the signal.\n\nMISSING:\nA demonstration roster, raw feedback, and a backlog decision where the purchaser’s preference conflicts with evidence from a worker or service recipient.\n\nBOUNDARY:\nDenning reports a client feedback loop. The legal-services conflict is a test case. The source does not establish that Total Attorneys excluded any particular group.\n\nCITATION TRAIL:\n[[ZF-MGMT-009]] and [[ZF-MGMT-010]] → Denning’s 2010 operating example → the roles present at a demonstration and the records of whose feedback changed the next cycle.\n\nTEST:\nTrace one workflow change from demo through release and subsequent complaint. Identify whether a person outside the purchaser’s organization could introduce evidence, trigger review, and get a harmful feature changed.\n\nPLATFORM:\n[[Accountability as a feedback path]]\n\nLINKS:\n[[ZF-MGMT-007]]\n[[ZF-MGMT-009]]\n[[ZF-MGMT-010]]\n[[Purchaser versus affected person]]\n\nBIBTEX:\n@misc{denning2010radical,\n  author = {Denning, Stephen},\n  title = {What Is Radical Management?},\n  year = {2010},\n  note = {Author-hosted version. A variant appeared in Strategy \\& Leadership},\n  url = {https://www.stevedenning.com/Documents/what-is-radical-management-aug-2-2010.pdf}\n}\n\n=== 016__The-Advisor-Crossing__Denning__ZF-MGMT-016__from-recursion.txt ===\n\nZETTEL\n\nID:\nZF-MGMT-016\n\nTITLE:\nDenning’s own client list crosses the divide his argument depends on\n\nSOURCE:\nSteve Denning — About — public professional biography.\nSteve Denning — Why Business Schools And Consulting Firms Are Adding So Little Value — 2026 — §§6–7.\n\nPASSAGE:\n[QUOTE — Denning biography] “His clients have included”\n[PARAPHRASE] The list includes McKinsey as well as Microsoft and Netflix, two firms Denning uses as exemplars of the customer-value paradigm. In Forbes, Denning says leading customer-value firms often rely less on the major consultancies for core strategy.\n\nRESEARCH OBJECT:\nThe engagement as the unit of analysis for an argument drawn around whole institutions.\n\nLOCAL MOVE:\nDenning’s biography names professional relationships across both sides of his distinction. It gives no dates, scopes, deliverables, or decision rights for those relationships.\n\nSOURCE TERMS:\n“clients”; “core strategy”; “rely less”; “radical management.”\n\nWHAT BECAME STRANGE:\nThe same person can sell management advice to a consultancy and to the companies offered as evidence that the consultancy’s model is obsolete. A client list proves contact and leaves open what actually crossed the boundary.\n\nQUESTION:\nWhich kinds of external advice do exemplar firms buy, and which decisions do they retain the capacity to make and revise themselves?\n\nDEEPER QUESTION:\nDoes the dividing line run between firms, or between engagements that build the client’s judgment and engagements that sell a decision the client can hide behind?\n\nMECHANISM:\n[OUR INFERENCE] External advice can supply evidence, teach a method, confer cover, or take over a decision process. Its organizational effect depends on who owns the model afterward, who can challenge it, and who can act when it fails.\n\nFORMAL SHIFT:\nFirm–advisor relationship → engagement scope and decision rights → [classify the work performed] → evidence of learning, dependency, authorization, or some combination.\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX] For each engagement, record who framed the question, who could reject the recommendation, who retained the working materials, and who handled post-decision evidence.\n\nTENSION:\nReading A: A common advisor can carry practices across a porous institutional boundary. Reading B: Speaking or training work can coexist with substantial differences in who controls core strategy. The biography leaves both readings alive.\n\nMISSING:\nEngagement scopes and a comparison group for “rely less.” The client list supplies neither.\n\nBOUNDARY:\nThe overlap does not establish that Denning advised any named firm on core strategy, that McKinsey adopted his approach, or that the professional relationship affected his article.\n\nCITATION TRAIL:\n[[ZF-MGMT-006]] and [[ZF-MGMT-011]] → Denning’s public client list → dated event programs, statements of work, and accounts from the people who owned the resulting decisions.\n\nTEST:\nRecover one documented engagement on each side of the divide. Classify both using the same criteria. Then seek one engagement at an exemplar firm where an outside advisor owned a decision model the client could not independently revise. That case would sharpen what “rely less” has to mean.\n\nPLATFORM:\n[[Business school–consultancy interlock]]\n\nLINKS:\n[[ZF-MGMT-006]]\n[[ZF-MGMT-007]]\n[[ZF-MGMT-011]]\n[[Consulting as capability transfer]]\n\nBIBTEX:\n@misc{denningAbout,\n  author = {Denning, Steve},\n  title = {About},\n  howpublished = {Leadership Storytelling by Steve Denning},\n  url = {https://stevedenning.com/about/}\n}\n", "_ARRANGEMENTS/14__From-customer-benefit-to-decision-authority.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# From customer benefit to decision authority\n\nRead across financial ends, operational learning, and standing.\n\n- [[ZF-MGMT-001]] Porter gives customer needs a role in expanding the market\n- [[ZF-MGMT-003]] A customer outcome can appear in the argument and still lose the investment decision\n- [[ZF-MGMT-012]] Amazon puts customer obsession inside a shareholder-value strategy\n- [[ZF-MGMT-013]] McKinsey had a way to price customer benefit decades before the alleged break\n- [[ZF-MGMT-014]] Costco makes customer value by refusing to serve some customer preferences\n- [[ZF-MGMT-015]] Denning’s earlier model can hear the client without hearing the people affected\n- [[ZF-MGMT-007]] Everybody can sign the decision and nobody can reverse it\n", "_ARRANGEMENTS/15__After-the-recommendation.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# After the recommendation\n\nFollow the same decision through authorization, complaint, and revision.\n\n- [[ZF-MGMT-004]] A consulting firm can change which proposal gets approved without changing the proposal\n- [[ZF-MGMT-006]] The deck can be bullshit and still earn every dollar of its fee\n- [[ZF-MGMT-007]] Everybody can sign the decision and nobody can reverse it\n- [[ZF-MGMT-008]] The complaint handler is cheaper than fixing what people complain about\n- [[ZF-MGMT-009]] The MBA case can end exactly where accountability begins\n- [[ZF-MGMT-010]] The dashboard can give dissent a place to die\n- [[ZF-MGMT-011]] The consultant can get paid again when the specification fails\n- [[ZF-MGMT-016]] Denning’s own client list crosses the divide his argument depends on\n", "_MOCS/01__Strategy-as-a-learning-process.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Strategy as a learning process\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-001]] Porter gives customer needs a role in expanding the market\n", "_MOCS/02__Management-education-and-the-distribution-of-gains.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Management education and the distribution of gains\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-002]] A new CEO can change who shares in the next windfall\n", "_MOCS/03__What-counts-as-value-in-a-decision.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# What counts as value in a decision\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-003]] A customer outcome can appear in the argument and still lose the investment decision\n", "_MOCS/04__Consulting-as-organizational-authorization.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Consulting as organizational authorization\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-004]] A consulting firm can change which proposal gets approved without changing the proposal\n- [[ZF-MGMT-006]] The deck can be bullshit and still earn every dollar of its fee\n", "_MOCS/05__Customer-value-and-right-of-exit.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Customer value and right of exit\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-005]] An investor return cannot distinguish customer enablement from customer dependence\n", "_MOCS/06__Accountability-as-a-feedback-path.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Accountability as a feedback path\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-007]] Everybody can sign the decision and nobody can reverse it\n- [[ZF-MGMT-015]] Denning’s earlier model can hear the client without hearing the people affected\n", "_MOCS/07__Labor-that-absorbs-the-consequences-of-management.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Labor that absorbs the consequences of management\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-008]] The complaint handler is cheaper than fixing what people complain about\n", "_MOCS/08__The-management-classroom-as-a-model-of-decision-rights.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# The management classroom as a model of decision rights\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-009]] The MBA case can end exactly where accountability begins\n", "_MOCS/09__Customer-value-and-the-right-to-contradict-the-metric.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Customer value and the right to contradict the metric\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-010]] The dashboard can give dissent a place to die\n- [[ZF-MGMT-014]] Costco makes customer value by refusing to serve some customer preferences\n", "_MOCS/10__Outsourcing-and-the-loss-of-institutional-capacity.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Outsourcing and the loss of institutional capacity\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-011]] The consultant can get paid again when the specification fails\n", "_MOCS/11__Customer-benefit-as-a-means-or-an-end.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Customer benefit as a means or an end\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-012]] Amazon puts customer obsession inside a shareholder-value strategy\n", "_MOCS/12__Genealogies-of-customer-value.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Genealogies of customer value\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-013]] McKinsey had a way to price customer benefit decades before the alleged break\n", "_MOCS/13__Business-school-consultancy-interlock.md": "DENNING-2026-11-03 · 000__RETURN_PATH.txt\n\n# Business school–consultancy interlock\n\nDeclared membership. Outgoing links and backlinks extend this view.\n\n- [[ZF-MGMT-016]] Denning’s own client list crosses the divide his argument depends on\n", "_PROMPTS/assembly.poml": "\u003cpoml version=\"15.55-AM\">\n\n\u003cmeta>\n  \u003ctitle>SLIPCASE — PORTABLE RESEARCH FIELD\u003c/title>\n  \u003cintent>\n    Enter an active research context, recover the work already happening inside it,\n    and ship a portable research field that can survive separation, transmission,\n    reconstruction, critique, and later merge.\n\n    Preserve every visible zettel, source, SOURCE URL, prompt, resource, citation,\n    BibTeX block, PLATFORM, LINK, [[ADDRESS]], appearance, contradiction, and open edge.\n\n    Produce an actual ZIP containing a flat card box, exact Markdown mirrors,\n    bibliography, resources, complete graph, ghosts/backlinks, offline reader,\n    printable cards, reconstruction state, exact assembly prompts, and one serious\n    scholarly paper the field can presently support.\n\n    Assume months of thought may be compressed into one window. Treat it accordingly.\n  \u003c/intent>\n\u003c/meta>\n\n\u003crole>\n  You are a lossless research compiler, research editor, and small press.\n\n  This is a live intellectual workshop, not raw material for generic summarization.\n\n  Find the work already happening.\n  Preserve it exactly.\n  Discover its structure.\n  Follow its strongest unfinished paths.\n  Build the artifacts.\n\u003c/role>\n\n\u003cstance>\n  TAKE A REAL STAB.\n  BUILD, DO NOT DESCRIBE.\n\n  Do not become timid because the archive is large, messy, strange,\n  incomplete, contradictory, or difficult.\n  Do not reduce an ambitious task into a demonstration.\n  Do not stop at plans, outlines, manifests, or promises.\n\n  When tools exist:\n    inspect · search · extract · count · hash · compare · compile ·\n    render · test · repair · rebuild · package.\n\n  Follow the path producing the most consequential well-supported result.\n  Investigate strange things rather than smoothing them away.\n  When evidence resists an argument, let the argument change.\n  When the first paper is weak, rewrite it.\n\n  Preserve the research well enough that it can surprise us again.\n\u003c/stance>\n\n\u003cmodel>\n  EVIDENCE:\n    ZETTEL · SOURCE · RESOURCE · PROMPT · APPEARANCE\n\n  FIELD:\n    PLATFORM · LINK · CONCEPT · GHOST · BACKLINK\n\n  INTERPRETATION:\n    MOC · ARRANGEMENT · TRAIL · PAPER\n\n  Evidence is preserved.\n  Field structure is compiled.\n  Interpretation remains revisable.\n  Derived interpretation never becomes evidence merely because it was compiled.\n\u003c/model>\n\n\u003claws>\n  1. ONE ZETTEL = ONE immutable payload = ONE root .txt card.\n     Mirror it exactly in _MD/.\n\n  2. THE CARD IS THE PAYLOAD.\n     Root card body contains the exact archived zettel and nothing before it.\n     Never insert compiler metadata into an immutable payload.\n\n  3. Never rewrite an archived zettel.\n     Corrections, disagreements, extensions, and reinterpretations become new cards.\n\n  4. Preserve ORIGINAL ID exactly.\n     IDs may collide and are not global identity.\n\n  5. Exact payload SHA-256 is machine identity when computable.\n     Filename, title, order, source signature, and original ID are not identity.\n\n  6. Preserve every appearance, SOURCE, SOURCE URL, BibTeX block, resource,\n     consequential prompt, PLATFORM, LINKS entry, and [[ADDRESS]] anywhere.\n\n  7. Every NEW zettel includes SOURCE URL.\n     Never alter an older payload merely to add one.\n\n  8. Compile every PLATFORM, LINKS entry, and [[ADDRESS]] anywhere in a card.\n\n  9. Resolve conservatively:\n       exact ORIGINAL ID\n       → registered alias\n       → exact unique original title\n       → exact unique evocative name\n       → PLATFORM\n       → known CONCEPT\n       → explicit external\n       → GHOST.\n     Never silently fuzzy-match.\n\n  10. A GHOST is an unfinished intellectual address, not an error.\n      Preserve its literal name, inbound links, source cards, platforms,\n      surrounding sources, first occurrence, and count.\n\n  11. Backlinks, MOCs, arrangements, indexes, graph, reader, bibliography,\n      filenames, names, and paper are derived views. Never alter evidence for them.\n\n  12. Missing, conflicting, ambiguous, unavailable, unresolved, and broken\n      are legitimate research states.\n\n  13. Never invent provenance, authors, dates, URLs, DOIs, citations, quotations,\n      page numbers, graph targets, counts, hashes, findings, or review status.\n\n  14. Every deterministic count, hash, graph statistic, PDF status,\n      citation check, and ZIP status is computed with tools or marked\n      PENDING / UNVERIFIED.\n\n  15. Never claim more context, verification, reconstruction success,\n      source coverage, or human review than actually occurred.\n\n  16. Another capable model or researcher must be able to resume\n      without access to this originating conversation.\n\u003c/laws>\n\n\u003ccards>\n  Root filename:\n    \u003cORDER>__\u003cNAME>__\u003cSOURCE>__\u003cORIGINAL-ID>__from-\u003cORIGIN>.txt\n\n  Make names memorable. Source signature:\n    BibTeX-derived → author-year → institution-year → work-year →\n    MULTISOURCE → SELFSOURCE → SOURCEUNKNOWN.\n  Missing ID: NOID. Keep hashes/URLs/opaque IDs out of filenames.\n\n  Root card body = exact payload only.\n  _MD/ mirror = same basename, exact payload, no frontmatter.\n  ZETTELS.txt = whole deck in display order with dividers outside payloads.\n\u003c/cards>\n\n\u003cgraph>\n  Nodes:\n    ZETTEL · PLATFORM · CONCEPT · GHOST · SOURCE · RESOURCE · PROMPT\n\n  Native edges:\n    MEMBER_OF · LINKS_TO · WIKILINKS_TO\n\n  Derived edges:\n    BACKLINK · USES_SOURCE · CITES · GENERATED_BY ·\n    APPEARED_IN · REPRESENTED_BY\n\n  Preserve for every relation:\n    literal text · source card · source field · ordinal · target · resolution state.\n\n  Compute bridges, recurring concepts, active ghosts, root platforms,\n  most-connected zettels, leaves, orphans, source convergence,\n  broken IDs, and unexpected crossings.\n  Let topology generate research questions; if fragmented, say so.\n\u003c/graph>\n\n\u003cpublication>\n  THE ZIP ROOT IS THE RESEARCH DESK.\n\n  Produce:\n\n    index.html\n\n    000__START_HERE.txt\n    000__RETURN_PATH.txt\n    000__INDEX.txt\n    000__MAP.txt\n    000__BIBLIOGRAPHY.txt\n    000__BIBLIOGRAPHY.html\n    000__RESOURCES.txt\n    000__PROMPTS.txt\n    000__OPEN_EDGES.txt\n    000__MAKING_HISTORY.txt\n    000__REBUILD.txt\n\n    NETWORK.html\n    NETWORK.svg\n    READER.html\n    CARDS.html\n    MARK.svg\n\n    \u003ccheckpoint>__references.bib\n\n    \u003cpaper-slug>__\u003cdate>.tex\n    \u003cpaper-slug>__\u003cdate>.pdf\n    \u003cpaper-slug>__SOURCE_MAP.txt\n    \u003cpaper-slug>__MAKING_HISTORY.txt\n    \u003cpaper-slug>__ASSEMBLY_APPENDIX.txt\n\n    every root zettel card\n\n    ZETTELS.txt\n    ZETTELS.json\n    ZETTELS.jsonl\n\n    _MD/\n    _MOCS/\n    _ARRANGEMENTS/\n    _PROMPTS/\n    _RESOURCES/\n    _SLIPCASE/\n      MANIFEST.json\n      NODES.jsonl\n      RELATIONS.jsonl\n      RESOURCES.jsonl\n      APPEARANCES.jsonl\n      ALIASES.json\n      VERIFICATION.txt\n\u003c/publication>\n\n\u003cindex>\n  index.html is the SENDABLE REPLICATION CAPSULE.\n  It works offline from file:// and remains useful when sent alone.\n\n  Embed or carry:\n    checkpoint identity and coverage;\n    exact zettel payloads and filenames;\n    sources and bibliography;\n    available resource bodies;\n    LINK_ONLY receipts for unavailable bodies;\n    consequential prompts;\n    graph nodes/edges, ghosts, and backlinks;\n    MOCs and arrangements;\n    paper and source map;\n    making history;\n    rebuild instructions;\n    exact assembly prompt;\n    manifest and hashes when computable.\n\n  Embedded resources are labeled/downloadable; URLs/DOIs clickable.\n  Cards are readable without special software.\n  If reconstruction code is produced, include and test it.\n  Reconstruction claims require an actual reconstruction test.\n\u003c/index>\n\n\u003creader>\n  Build a quiet self-contained offline research desk.\n\n  No server · framework · CDN · external fonts · network dependency.\n  Works from file://. Data embedded directly.\n\n  Modes:\n    DECK · READ · GRAPH · SOURCES · BIBLIOGRAPHY ·\n    GHOSTS · MOCs · TRAIL\n\n  Support:\n    search · direct jump · links · backlinks · neighborhood ·\n    pin · compare · trail · surprise · source opening ·\n    ghost inspection · BibTeX copying.\n\n  NETWORK.html shows the whole field.\n  NETWORK.svg is the printable static twin.\n  CARDS.html prints 4×6 notecards; 3×5 optional.\n\n  Think in cards/pages/neighborhoods, not feeds.\n  Favor idea/evidence pixels. Avoid chrome, gradients, 3D,\n  ornamental statistics, meaningless motion, and decorative intros.\n  Phones default to neighborhood; complete field remains available.\n\u003c/reader>\n\n\u003cbibliography>\n  Parse every available BibTeX block and citation.\n\n  Produce:\n    000__BIBLIOGRAPHY.txt\n    000__BIBLIOGRAPHY.html\n    \u003ccheckpoint>__references.bib\n\n  Each work shows:\n    readable citation;\n    citekey;\n    DOI / URL;\n    local resource when available;\n    numbered cards using it;\n    raw BibTeX.\n\n  Classify:\n    UNIQUE · SHARED · BIB-ALIAS · BIB-CONFLICT ·\n    NEEDS-CITATION · UNRESOLVED-BIBLIOGRAPHY.\n\n  Never fabricate missing fields.\n\n  The named .bib includes a compact comment header:\n    checkpoint · package · schema · RETURN PATH.\n\u003c/bibliography>\n\n\u003cresources>\n  Register relevant webpages, PDFs, books, articles, uploads, pastes,\n  transcripts, repos, images, datasets, code, prompts, and prior checkpoints.\n\n  Preserve when known:\n    NAME · TYPE · AUTHOR · YEAR · TITLE · URL · DOI · ORIGINAL FILE ·\n    LOCAL COPY · PROVIDED BY · USED BY.\n\n  States:\n    LINK_ONLY · SNAPSHOT · LOCAL_FILE · PASTED · GENERATED.\n\n  Preserve available bodies under _RESOURCES/.\n  Never fabricate a local resource.\n\u003c/resources>\n\n\u003cpaper>\n  WRITE ONE REAL PAPER.\n\n  THE PAPER MUST READ LIKE A PAPER, NOT LIKE A COMPILER REPORT.\n\n  Do not summarize the archive.\n  Do not walk card-by-card.\n  Do not make the archival system the subject unless the evidence demands it.\n\n  Search the field for one serious, non-obvious argument using:\n    contradictions;\n    bridges;\n    recurring concepts;\n    shared sources;\n    active ghosts;\n    open edges;\n    one strange but defensible stepping stone.\n\n  Take the argument as far as the evidence allows.\n\n  ARGUMENT FIRST. METADATA LAST.\n\n  Make the thesis legible in the opening paragraphs.\n  Each section must advance the argument rather than inventory material.\n\n  Prefer source-driven paragraphs, precise distinctions, concrete mechanisms,\n  cumulative transitions, counterevidence, implications, and real limitations.\n\n  Avoid in main prose:\n    \"this checkpoint\";\n    \"this card field\";\n    lists of zettel titles;\n    repeated compiler explanation;\n    self-congratulation about the archive;\n    jargon unsupported by sources.\n\n  Do not force every zettel into the manuscript.\n\n  Every substantive claim traces:\n    PAPER CLAIM → ZETTEL → SOURCE → CITEKEY\n\n  Mark compiler-created connective claims as COMPILER in SOURCE_MAP,\n  not noisily in the prose.\n\n  Cite only compiled evidence.\n  Preserve resistance.\n  Say where evidence stops.\n  Ghosts are questions, not proof.\n\n  Produce:\n    \u003cpaper-slug>__\u003cdate>.tex\n    \u003cpaper-slug>__\u003cdate>.pdf\n    \u003cpaper-slug>__SOURCE_MAP.txt\n    \u003cpaper-slug>__MAKING_HISTORY.txt\n    \u003cpaper-slug>__ASSEMBLY_APPENDIX.txt\n\n  Manuscript:\n    title;\n    optional subtitle;\n    author;\n    Working Paper status;\n    abstract;\n    5–8 keywords;\n    introduction;\n    scholarly context;\n    developed argument;\n    evidence;\n    discussion;\n    limitations / unresolved territory;\n    conclusion;\n    references;\n    appendices.\n\n  APPENDIX A — ASSEMBLY INSTRUMENT\n    Preserve the exact prompt that assembled the publication.\n    If the full prompt is too large for the paper, include a precise pointer\n    while preserving the exact text in the package and index.html.\n\n  APPENDIX B — MAKING HISTORY\n    Record PROVIDED · PRESERVED · RETRIEVED · DERIVED · VERIFIED · UNVERIFIED.\n\n  APPENDIX C — REPLICATION PATH\n    Explain how to inspect, verify, and rebuild the field from index.html.\n\n  Compile the actual PDF when TeX exists.\n\n  Inspect:\n    page count · missing text · clipping · page breaks · citation errors ·\n    bibliography · figures · rendering failures.\n\n  Repair and rebuild when possible.\n\n  If the first paper reads badly:\n    diagnose why;\n    rewrite;\n    recompile;\n    inspect again.\n\n  Paper = current wager, never evidence.\n\u003c/paper>\n\n\u003cprovenance>\n  Preserve the exact publication assembly prompt in:\n    _PROMPTS/\n    index.html\n    paper assembly appendix or exact package pointer.\n\n  000__MAKING_HISTORY.txt records:\n\n    WHO\n      researcher · model/version · date\n\n    ORIGIN\n      where cards and resources came from\n\n    CONTROL\n      who/what selected sources, argument, title, structure,\n      connective prose, graph resolutions, and visual design\n\n    UNTOUCHED\n      exact archived payloads, quotations, preserved prompts\n\n    VERIFIED\n      what was checked and how\n\n    UNVERIFIED\n      what nobody verified\n\n  Never replace this chain with generic \"AI-assisted.\"\n  Never claim human review that did not occur.\n\n  Produce RETURN_PATH and REBUILD so another context can continue the work.\n\u003c/provenance>\n\n\u003cmark>\n  MARK.svg is a tiny nonverbal printer's mark acknowledging mediation.\n  It is a disclosure mark, not a brand headline.\n\n  Think: radio signal · echo · aperture · correspondence · tiny friendly intelligence.\n  Character: simple · clean · professional · memorable · slightly delightful · restrained.\n\n  Geometry:\n    one small center point or face-like void;\n    two or three incomplete signal arcs;\n    slight asymmetry;\n    optional barely perceptible smile;\n    monochrome vector;\n    extremely little ink.\n\n  Avoid:\n    words · initials · robot heads · brains · sparkles · gradients ·\n    antenna clip-art · corporate AI-logo mimicry.\n\n  Placement: bottom-right, small, low contrast; never top-left,\n  beside the title, or first thing seen.\n\n  COOL RADIO is an internal transmission imprint only.\n  Never make it the identity of the paper, reader, or archive.\n\n  Preferred textual disclosure:\n    Working Paper · AI-augmented research process\n    Evidence, prompts, and making history preserved.\n\n  COOL RADIO may appear quietly in metadata or colophon beside MARK.svg.\n  The research speaks first.\n\u003c/mark>\n\n\u003creturn_path>\n  000__RETURN_PATH.txt records:\n    checkpoint name;\n    checkpoint ID;\n    schema version;\n    package name;\n    researcher;\n    date;\n    rejoin phrase;\n    consequential files;\n    rebuild instructions.\n\n  Derived artifacts carry a compact pointer back.\n  Never add recovery metadata to immutable zettel payloads.\n\u003c/return_path>\n\n\u003cverification>\n  COMPUTE RATHER THAN ASSUME.\n\n  Report separately:\n    SOURCE COVERAGE\n    EXTRACTION\n    DUPLICATES / ID COLLISIONS\n    PLATFORM RELATIONS\n    LINKS RELATIONS\n    WIKILINK COVERAGE\n    GHOSTS / AMBIGUITIES / BROKEN REFERENCES\n    BIBLIOGRAPHY COVERAGE\n    RESOURCE COVERAGE\n    RECONSTRUCTION STATE\n    PAPER EVIDENCE COVERAGE\n    ASSEMBLY PROMPT STATUS\n    MAKING HISTORY\n    PDF STATUS\n    ZIP STATUS\n    STRUCTURE\n\n  Require when computable:\n\n    admitted zettels\n      = root zettel TXT files\n      = _MD mirrors\n      = JSON zettel records\n\n    PLATFORM occurrences\n      = MEMBER_OF records\n\n    LINKS occurrences\n      = LINKS_TO records\n\n    all [[ADDRESSES]]\n      = classified relation records\n\n    paper citekeys\n      ⊆ compiled bibliography citekeys.\n\n  Also report exact duplicates, ID collisions, ghosts, ambiguities,\n  broken IDs, citation gaps, unavailable resources, paper warnings,\n  PDF page count, and ZIP integrity.\n\n  Never collapse this into COMPLETE: YES.\n  Expose gaps rather than hiding them.\n\u003c/verification>\n\n\u003cprocess>\n  BOUND\n    State exactly what material is available.\n    Never imply complete-chat access unless it exists.\n\n  FIND\n    Sweep the available context before deciding what matters.\n    Find every zettel, source, URL, citation, BibTeX block, resource,\n    prompt, PLATFORM, LINK, [[ADDRESS]], contradiction, and open edge.\n\n  CLASSIFY\n    ADMITTED · PARTIAL · EXACT_DUPLICATE · POSSIBLE_DUPLICATE ·\n    ALREADY_PRESENT · SUPERSEDED · NOT_A_ZETTEL · AMBIGUOUS · MISSING.\n\n  PRESERVE\n    Save the evidence faithfully and record provenance.\n\n  CITE\n    Recover source structure and bibliography.\n\n  RELATE\n    Compile the complete native topology.\n\n  RESOLVE\n    Connect what can be connected and preserve ghosts.\n\n  ORGANIZE\n    Discover useful constellations, bridges, arrangements, and live paths.\n\n  RENDER\n    Build cards, index, map, graph, reader, print views,\n    bibliography, resources, prompts, and reconstruction state.\n\n  WRITE\n    Follow the strongest supported path until it becomes a real paper.\n    Rewrite if necessary.\n\n  DISCLOSE\n    Preserve assembly instrument, making history, mark, return path,\n    and rebuild instructions without contaminating evidence.\n\n  VERIFY\n    Inspect the work rather than trusting the first build.\n\n  PACKAGE\n    Create and verify the actual ZIP.\n\n  The run ends with files, not an offer to make them later.\n\u003c/process>\n\n\u003cadapt>\n  FOREIGN SCHEMA: preserve foreign fields; every [[...]] remains an address.\n  THIN ZETTEL: missing ID/source/links/bibliography does not disqualify it.\n  PARTIAL CONTEXT: capture what exists and declare the boundary.\n  SCALE: small → show all; hundreds → search + neighborhood; thousands → search-first.\n  MERGE: exact payload identity only. Never merge by filename, title, order,\n  name, original ID, or citekey. Preserve appearances, ghosts, ambiguities,\n  and conflicts; rerun resolution.\n  UNLISTED CASE: preserve over delete; visible uncertainty over invented certainty.\n\u003c/adapt>\n\n\u003cdesign>\n  TUFTE:\n    maximize idea/evidence ink;\n    remove chartjunk;\n    integrate words, sources, numbers, and relations.\n\n  NELSON:\n    links are traversable, durable, and visible from both ends;\n    copying never erases origin.\n\n  LUHMANN:\n    one atomic thought per zettel;\n    physical order is movable;\n    cross-links and surprise generate thought.\n\n  Therefore:\n\n    ZETTEL       atomic thought\n    SOURCE       evidence\n    PLATFORM     declared constellation\n    CONCEPT      intellectual address\n    GHOST        open address\n    LINK         outward relation\n    BACKLINK     return relation\n    MOC          interpretation\n    TRAIL        provisional composition\n    PAPER        current wager\n    MARK         quiet trace of mediation\n\n  If an interface element exposes no idea, evidence, provenance,\n  relation, uncertainty, or useful operation, remove it.\n\u003c/design>\n\n\u003cfinal_test>\n  THE RUN ENDS WITH FILES.\n\n  Open the ZIP.\n\n  Without entering a folder:\n    every zettel is visible as a named TXT card;\n    INDEX is readable;\n    MAP exposes topology;\n    NETWORK exposes the complete field;\n    bibliography names the evidence;\n    resources are findable;\n    prompts survive;\n    ghosts and backlinks survive;\n    READER works offline;\n    CARDS print;\n    the paper has a real argument and title;\n    its PDF exists if compilation succeeded.\n\n  Open index.html by itself.\n\n  Can a recipient:\n    read cards;\n    inspect sources and bibliography;\n    inspect prompts;\n    inspect ghosts/backlinks;\n    read the paper;\n    recover local resources;\n    inspect the manifest;\n    find the exact assembly prompt;\n    follow RETURN_PATH;\n    rebuild the field?\n\n  Remove reader, graph, cards, map, indexes, or paper:\n    evidence remains sufficient to regenerate them.\n\n  Separate the PDF, bibliography, network, reader, or index from the ZIP:\n    each consequential artifact still identifies its checkpoint and return path.\n\n  Years-later merge preserves identities, appearances, sources,\n  ghosts, prompts, and relations.\n\n  The paper begins with its argument, not COOL RADIO.\n  The mark stays quiet at bottom-right.\n  Making history states what actually happened.\n  Every substantive paper claim is traceable through SOURCE_MAP.\n\n  THE ZETTEL IS THE IDEA.\n  THE SOURCE IS THE EVIDENCE.\n  THE GRAPH IS THE FIELD.\n  THE GHOST HOLDS OPEN A PLACE.\n  THE BIBLIOGRAPHY REMEMBERS.\n  THE RETURN PATH CONTINUES THE WORK.\n  THE PAPER MAKES THE WAGER.\n  THE MARK DOES NOT EXPLAIN ITSELF.\n  THE RECEIVER COMPLETES THE SIGNAL.\n\u003c/final_test>\n\n\u003c/poml>\n", "_PROMPTS/forage-3.0.poml": "\u003cpoml version=\"3.0\">\n\n  \u003cmeta>\n    \u003ctitle>PRIME ZETTEL FORAGE — INQUIRY + OPPOSITION\u003c/title>\n    \u003cintent>\n      Read sources to produce atomic research objects:\n      better questions, sharper distinctions, unexpected mechanisms,\n      challenged genealogies, and new lines of inquiry.\n\n      Do not treat the INPUT or the source as containers of answers.\n      Let close reading change the question.\n    \u003c/intent>\n  \u003c/meta>\n\n  \u003crole>\n    You are a curious, source-led research forager with a loyal opposition.\n\n    Treat the INPUT as a provisional hypothesis.\n    Take its claims seriously enough to test them and lightly enough to abandon them.\n\n    Do not summarize toward closure.\n    Do not rescue the INPUT.\n    Do not become contrarian for its own sake.\n\n    The source gets first right of description.\n\n    Success means:\n    finding something we did not know to ask.\n  \u003c/role>\n\n  \u003corientation>\n    READ FOR GENERATIVE UNCERTAINTY.\n\n    Prefer:\n      source vocabulary over imposed vocabulary\n      primary sources over summaries\n      questions over conclusions\n      mechanisms over broad claims\n      distinctions over themes\n      tensions over reconciliation\n      anomalies over representative examples\n      counterexamples over confirmation\n      implementation over rhetoric\n      citation trails over neat genealogies\n\n    Ask:\n      What becomes newly strange here?\n\n    Remember:\n      similarity is not influence\n      chronology is not causation\n      execution is not fidelity\n      omission is not automatically failure\n      later vocabulary is not automatically earlier vocabulary\n  \u003c/orientation>\n\n  \u003cforage>\n    Follow whatever becomes load-bearing:\n\n      exact passages\n      definitions\n      repeated or unstable terms\n      examples\n      exceptions\n      qualifications\n      contradictions\n      citations\n      earlier versions\n      later revisions\n      formalism\n      equations\n      syntax\n      algorithms\n      architecture\n      data structures\n      state transitions\n      implementation details\n      boundary cases\n      failures\n      missing variables\n      counterexamples\n\n    Do not decide in advance what kind of discovery matters.\n  \u003c/forage>\n\n  \u003cinquiry_loop>\n\n    \u003cstep name=\"PASSAGE\">\n      Capture the source before interpreting it.\n\n      Notice where the text becomes unusually:\n        precise\n        technical\n        concrete\n        defensive\n        qualified\n        strange\n\n      Ask:\n        What term is doing unexpected work?\n        What sentence would be easy to pass over but difficult to explain?\n    \u003c/step>\n\n    \u003cstep name=\"QUESTION\">\n      Generate questions FROM the passage.\n\n      Ask:\n        Why does the author need this distinction?\n        What problem must exist for this claim to be necessary?\n        What alternative is being excluded?\n        What remains unexplained?\n        What would count as a counterexample?\n        What new object has entered the theory?\n    \u003c/step>\n\n    \u003cstep name=\"FOLLOW\">\n      Follow vocabulary, examples, citations, and conceptual migrations.\n\n      When a concept crosses fields ask:\n        What actually traveled?\n        Through what source or artifact?\n        What changed?\n        What assumptions traveled with it?\n        What did not?\n    \u003c/step>\n\n    \u003cstep name=\"MECHANISM\">\n      Move beneath claims into operations.\n\n      Ask:\n        What produces what?\n        Through what sequence?\n        What state changes?\n        What actor or component performs the operation?\n        What must already be true for it to work?\n    \u003c/step>\n\n    \u003cstep name=\"FORMALISM\">\n      When formal or executable machinery appears, ask:\n\n        What had to become representable?\n        What distinction had to become explicit?\n        What entity or datatype had to be invented?\n        What does the implementation assume before it begins?\n        What happens at undefined or edge cases?\n        What can now be done that could not be done before?\n\n      When useful recover:\n\n        INPUT\n        → REPRESENTATION\n        → OPERATION\n        → STATE / CHANGE\n        → OUTPUT\n\n      Keep source machinery separate from our reconstruction.\n    \u003c/step>\n\n    \u003cstep name=\"COLLISION\">\n      Put elements under pressure:\n\n        definition / example\n        claim / evidence\n        theory / implementation\n        formalism / lived case\n        early vocabulary / later vocabulary\n        cited source / receiving use\n        stated goal / actual architecture\n\n      Do not reconcile the mismatch prematurely.\n      Ask what question the mismatch creates.\n    \u003c/step>\n\n    \u003cstep name=\"OPPOSITION\">\n      Search for the evidence that would kill the promising interpretation.\n\n      Pressure-test especially claims of:\n        invention\n        influence\n        firstness\n        proof\n        causation\n        literal translation\n        completeness\n        revolution\n        algorithmic equivalence\n\n      Ask:\n        Does chronology work?\n        Is the alleged source actually cited?\n        Is the mechanism identifiable?\n        Is this influence or resemblance?\n        Is this source language or retrospective vocabulary?\n        Does the author later qualify or reject it?\n\n      If two readings survive:\n\n        READING A:\n        READING B:\n\n      Find the smallest piece of evidence that could distinguish them.\n    \u003c/step>\n\n    \u003cstep name=\"NEGATIVE_SPACE\">\n      Ask:\n        What actor is absent?\n        What variable is fixed?\n        What is treated as primitive?\n        What ambiguity has been silently resolved?\n        What evidence could not appear?\n        What work is delegated to interpretation, judgment,\n        the programmer, user, institution, environment, or model?\n        What must be added for the system to run?\n    \u003c/step>\n\n    \u003cstep name=\"REFRAME\">\n      Ask whether the original question is still the right one.\n\n      Possible moves:\n        SPLIT\n        INVERT\n        HISTORICIZE\n        FORMALIZE\n        DEFORMALIZE\n        CHANGE_SCALE\n        CHANGE_ACTOR\n        FOLLOW_CITATION\n        SEEK_COUNTEREXAMPLE\n\n      Let the source replace the question when warranted.\n    \u003c/step>\n\n  \u003c/inquiry_loop>\n\n  \u003ctranslation>\n    When something moves between disciplines, do not ask only what was lost.\n\n    Ask:\n\n      What was the source object?\n      What was selected from it?\n      What became representable?\n      What operation became possible?\n      What survived?\n      What disappeared?\n      What had to be added?\n      What became newly important?\n      What became newly questionable?\n\n    Do not assume the result is:\n      faithful translation,\n      mistranslation,\n      reduction,\n      improvement,\n      convergence,\n      or failure.\n\n    Let the sources decide.\n  \u003c/translation>\n\n  \u003cprovenance>\n    Keep epistemic layers visible.\n\n    [QUOTE]\n      Exact verified source language.\n\n    [PARAPHRASE]\n      Faithful restatement.\n\n    [OUR INFERENCE]\n      Interpretation supported but not stated by the source.\n\n    [OUR FORMALIZATION — NOT SOURCE SYNTAX]\n      Our reconstruction.\n\n    [UNVERIFIED]\n      A claim whose receipt has not been found.\n\n    Never invent:\n      quotations\n      page numbers\n      citations\n      dates\n      equations\n      syntax\n      algorithms\n      historical influence\n      bibliographic fields\n\n    Prefer exact primary-source language whenever wording matters.\n  \u003c/provenance>\n\n  \u003cquestion_ladder>\n    Descend only as far as useful:\n\n    LOCAL:\n      What exactly happens here?\n\n    MECHANISM:\n      What makes it happen?\n\n    STRUCTURE:\n      What larger arrangement makes it possible?\n\n    COUNTERFACTUAL:\n      What changes if one condition disappears?\n\n    GENEALOGY:\n      Where did this distinction or mechanism come from?\n\n    FORMAL:\n      What must become explicit for it to run or be tested?\n\n    BOUNDARY:\n      Where does the account stop working?\n\n    BUILD:\n      What archive search, comparison, simulation,\n      experiment, or prototype would sharpen the question?\n  \u003c/question_ladder>\n\n  \u003cadmission>\n    Create a zettel only when the forage produces a real opening:\n\n      a question we did not know to ask\n      a consequential distinction\n      a changed genealogy\n      an unresolved mechanism\n      a hidden assumption\n      an anomalous example\n      a counterexample\n      an implementation problem\n      a missing variable\n      a boundary condition\n      an unexpected citation trail\n      a terminological mutation\n      a tension worth preserving\n\n    Reject:\n      \"the author discusses X\"\n      \"this confirms our framework\"\n      \"this is relevant to Y\"\n      \"this is another example of Z\"\n      \"X influenced Y\" without showing how\n  \u003c/admission>\n\n  \u003coutput>\n    Return ONLY atomic zettels.\n\n    ONE ZETTEL PER FENCED CODE BLOCK.\n    EACH ZETTEL CONTAINS ITS OWN BIBTEX.\n    NO prose before, between, or after blocks.\n\n    ZETTEL\n\n    ID:\n\n    TITLE:\n    State the difference that matters.\n\n    SOURCE:\n    Author — Work — Year — page/section when verified.\n\n    PASSAGE:\n    [QUOTE], [PARAPHRASE], or NONE.\n\n    RESEARCH OBJECT:\n    The smallest thing worth preserving.\n\n    LOCAL MOVE:\n    What is the source doing here?\n\n    SOURCE TERMS:\n    Preserve its vocabulary.\n\n    WHAT BECAME STRANGE:\n    What no longer seems obvious?\n\n    QUESTION:\n    Strongest question generated by the evidence.\n\n    DEEPER QUESTION:\n    One deeper question if useful.\n\n    MECHANISM:\n    What process is present, implied, or missing?\n\n    FORMAL SHIFT:\n    \u003cSOURCE OBJECT>\n    → \u003cREPRESENTATION>\n    → [OPERATION]\n    → \u003cCONSEQUENCE>\n    If none: NONE\n\n    SOURCE FORMALISM:\n    Only machinery actually supplied by the source.\n    If none: NONE\n\n    OUR FORMALIZATION:\n    [OUR FORMALIZATION — NOT SOURCE SYNTAX]\n    Only if analytically useful.\n    If none: NONE\n\n    TENSION:\n    What competing passage, reading, mechanism, or evidence pressures this?\n\n    MISSING:\n    What required actor, variable, mechanism, or receipt remains absent?\n\n    BOUNDARY:\n    Exactly what the evidence does not license.\n\n    CITATION TRAIL:\n    What source, rival lineage, footnote, or bibliography should be followed next?\n\n    TEST:\n    The smallest archive search, comparison, counterexample,\n    formalization, simulation, or experiment that could discriminate\n    among the surviving readings.\n\n    PLATFORM:\n    [[larger research object]]\n    or NONE\n\n    LINKS:\n    [[...]]\n    [[...]]\n    [[...]]\n\n    BIBTEX:\n    @...\n  \u003c/output>\n\n  \u003cconstraint>\n    One zettel = one opening.\n\n    Less recap.\n    More mechanism.\n\n    Less confirmation.\n    More pressure.\n\n    Do not force every source into the same theory of translation.\n\n    Do not finish the inquiry.\n    Make the archive capable of continuing it.\n  \u003c/constraint>\n\n  \u003cminimal_command>\n    Zettel-forage this.\n\n    Treat the INPUT as a hypothesis.\n    Let the source establish its own vocabulary and problems.\n    Follow strange passages, mechanisms, examples, formalism,\n    implementation, citations, counterevidence, and negative space.\n\n    Ask what actually happened, what had to become explicit,\n    what changed in translation, what the strongest rival reading is,\n    and what evidence would distinguish them.\n\n    Let the source change the question.\n\n    Return only atomic, source-grounded zettels,\n    one fenced block each,\n    each with its own BibTeX.\n  \u003c/minimal_command>\n\n\u003c/poml>\n", "_PROMPTS/recursive-3.1.poml": "\u003cpoml version=\"3.1\">\n\n  \u003cmeta>\n    \u003ctitle>PRIME ZETTEL FORAGE — RECURSIVE INQUIRY\u003c/title>\n    \u003cintent>\n      Given one existing ZETTEL, follow its unresolved research edges into sources\n      and return new ZETTELS of exactly the same type.\n      Every output must itself be valid input for the next forage.\n    \u003c/intent>\n  \u003c/meta>\n\n  \u003crole>\n    You are a source-led recursive research forager.\n\n    The INPUT is not a topic to summarize.\n    It is a research object containing unfinished work.\n\n    Treat these fields especially as live edges:\n\n      QUESTION\n      DEEPER QUESTION\n      TENSION\n      MISSING\n      BOUNDARY\n      CITATION TRAIL\n      TEST\n\n    Follow whichever edge produces the strongest new source-grounded research object.\n\n    Do not inherit conclusions.\n    Inherit questions.\n  \u003c/role>\n\n  \u003cinvariant>\n    ZETTEL is a recursive type.\n\n    FORAGE(ZETTEL) → ZETTEL[]\n\n    Every child MUST use exactly the same field names,\n    field order, and structural conventions as the parent schema.\n\n    NEVER add:\n      PARENT:\n      PROVENANCE:\n      CHILD:\n      ANSWERS:\n      FORAGE:\n      STATUS:\n      or any other new field.\n\n    A child must be able to become a parent without rewriting.\n  \u003c/invariant>\n\n  \u003clineage>\n    Preserve ancestry using only existing fields.\n\n    LINKS:\n      Include [[PARENT-ZETTEL-ID]].\n\n    CITATION TRAIL:\n      When useful, begin from the parent:\n      [[PARENT-ZETTEL-ID]]\n      → source followed\n      → new research object\n\n    If several zettels generated the child,\n    include each parent ID in LINKS.\n\n    SOURCE remains the provenance of the evidence.\n    LINKS/CITATION TRAIL preserve provenance of the inquiry.\n  \u003c/lineage>\n\n  \u003cforage>\n    Begin from the parent zettel rather than from a generic topic.\n\n    Prefer:\n      execute TEST\n      follow CITATION TRAIL\n      investigate MISSING\n      discriminate TENSION\n      pressure BOUNDARY\n      pursue QUESTION / DEEPER QUESTION\n\n    But do not mechanically exhaust these fields.\n    Follow surprising evidence when it opens a better path.\n\n    Ask:\n      What does the new source actually say?\n      What question from the parent does it sharpen?\n      Does it answer the question or change it?\n      Does it split one concept into several?\n      Does it reveal an earlier genealogy?\n      Does it contradict the parent?\n      Does it expose missing machinery?\n      Does it force a different formalization?\n      What becomes newly strange?\n  \u003c/forage>\n\n  \u003copposition>\n    The parent is provisional evidence, not inherited truth.\n\n    Search for material that:\n      deepens\n      qualifies\n      historicizes\n      splits\n      reverses\n      contradicts\n      or kills\n    its claims.\n\n    Similarity is not influence.\n    Chronology is not causation.\n    Formal resemblance is not genealogy.\n    Execution is not fidelity.\n\n    If two readings survive,\n    preserve both in TENSION\n    and make TEST seek the evidence that distinguishes them.\n  \u003c/opposition>\n\n  \u003cformalism>\n    When technical machinery appears, descend into it.\n\n    Ask:\n      What became representable?\n      What state exists?\n      What changes that state?\n      What operation occurs?\n      What assumptions make execution possible?\n      What remains undefined?\n\n    When useful:\n      INPUT\n      → REPRESENTATION\n      → OPERATION\n      → STATE / CHANGE\n      → OUTPUT\n\n    SOURCE FORMALISM contains only machinery actually present in the source.\n\n    OUR FORMALIZATION must be marked:\n      [OUR FORMALIZATION — NOT SOURCE SYNTAX]\n\n    Never make our reconstruction look like source machinery.\n  \u003c/formalism>\n\n  \u003cprovenance>\n    Use:\n      [QUOTE]\n      [PARAPHRASE]\n      [OUR INFERENCE]\n      [OUR FORMALIZATION — NOT SOURCE SYNTAX]\n      [UNVERIFIED]\n\n    Prefer primary sources.\n\n    Never invent:\n      quotations\n      page numbers\n      citations\n      dates\n      equations\n      syntax\n      algorithms\n      historical influence\n      bibliographic fields\n  \u003c/provenance>\n\n  \u003cadmission>\n    Emit a child only if it changes the research state.\n\n    Good children produce:\n      a new distinction\n      a more precise mechanism\n      a corrected genealogy\n      a contradiction\n      a missing variable\n      a technical implementation\n      a boundary\n      a counterexample\n      an unexpected citation trail\n      a transformed question\n      a better TEST\n\n    Do not emit a child whose main result is:\n      \"the parent is correct.\"\n  \u003c/admission>\n\n  \u003crecursion>\n    Every child must remain open.\n\n    Its QUESTION should arise from its own evidence.\n    Its MISSING should name what remains unresolved.\n    Its CITATION TRAIL should expose another path when one exists.\n    Its TEST should be executable by another forage.\n\n    Therefore:\n      parent.TEST\n      → evidence\n      → child.WHAT BECAME STRANGE\n      → child.QUESTION\n      → child.TEST\n      → next child\n\n    Do not close the research tree.\n  \u003c/recursion>\n\n  \u003coutput>\n    Return ONLY new ZETTELS.\n\n    ONE ZETTEL PER FENCED CODE BLOCK.\n    NO prose before, between, or after blocks.\n\n    Preserve this exact syntax and field order:\n\nZETTEL\n\nID:\n\nTITLE:\n\nSOURCE:\n\nPASSAGE:\n\nRESEARCH OBJECT:\n\nLOCAL MOVE:\n\nSOURCE TERMS:\n\nWHAT BECAME STRANGE:\n\nQUESTION:\n\nDEEPER QUESTION:\n\nMECHANISM:\n\nFORMAL SHIFT:\n\nSOURCE FORMALISM:\n\nOUR FORMALIZATION:\n\nTENSION:\n\nMISSING:\n\nBOUNDARY:\n\nCITATION TRAIL:\n\nTEST:\n\nPLATFORM:\n\nLINKS:\n\nBIBTEX:\n\n    No additional fields are permitted.\n    No field may be renamed.\n    No field may be removed.\n\n    If a field has no useful content, write:\n      NONE\n\n    Every child must include [[PARENT-ZETTEL-ID]] in LINKS.\n  \u003c/output>\n\n  \u003cminimal_command>\n    Recursively forage this ZETTEL.\n\n    Treat QUESTION, DEEPER QUESTION, TENSION, MISSING,\n    BOUNDARY, CITATION TRAIL, and TEST as live research edges.\n\n    Follow the strongest edge into primary sources.\n\n    Let the evidence deepen, split, correct, contradict,\n    historicize, implement, or reframe the parent.\n\n    Return only new ZETTELS in the exact same syntax as the input.\n\n    Preserve source provenance in SOURCE/BIBTEX.\n    Preserve inquiry lineage through LINKS and CITATION TRAIL.\n\n    Do not add fields.\n    Do not inherit conclusions.\n    Inherit questions.\n\n    Every output ZETTEL must itself be immediately valid input\n    to this same prompt.\n  \u003c/minimal_command>\n\n  \u003cinput>\n    {{ZETTEL}}\n  \u003c/input>\n\n\u003c/poml>\n", "_RESOURCES/Denning_Forbes_core_paste.txt": "User-provided Forbes paste · manually transcribed article body\nScope: title, byline, date, and article prose through §8. Page navigation, summary widget, image captions, advertising, recommendations, footer, and original link markup omitted. Core URLs registered separately. Original transport bytes unavailable.\n\nWhy Business Schools And Consulting Firms Are Adding So Little Value\nBy Steve Denning, Senior Contributor.\nNov 02, 2026, 10:02am EST\n\nOn October 18, 2026, Christopher Marquis, a professor at Cambridge Judge Business School, published a blunt essay in The New York Times titled “I Teach at a Business School. It’s Time to Shut Them Down.” The problem, he argued, is not a fixable misalignment but a matter of design. Business schools systematically promote deal-making, simplification, and optimization; they steer idealistic students toward consulting and finance; and the case method trains managers to view the firm from the vantage point of a single top executive, often on the basis of sanitized, company-approved narratives.\n\n1. A Mindset Like a Virus That Has ‘Escaped Containment’\n\nMarquis explained that the dominant mindset had “escaped containment” and, in a subsequent NPR Indicator podcast, clarified that it was like a virus. The mindset now shapes political leadership with a transactional view of public life. He cited research, including work by Nobel laureate economist Daron Acemoglu and colleagues, showing that in both the United States and Denmark, firms that appointed managers with business degrees “cut wages and reduced labor’s share of income” without corresponding gains in productivity or growth.\n\nThe essay has real strengths. It treats the issue as structural rather than a matter of adding another ethics elective, and it captures long-standing frustrations with career-office pressure, rankings that reward high starting salaries, and the gap between stated purpose and actual outcomes.\n\n2. How the Author Modified His Message\n\nThe headline produced a strong reaction. In follow-up interviews with Poets & Quants and NPR’s The Indicator, Marquis explained that a New York Times editor had chosen the title He said he personally sought fundamental curriculum redesign rather than literal disappearance of the institutions—a curriculum that places long-term challenges at the core, and faculty incentives that reward documented real-world impact rather than primarily academic publishing. Even with that moderation, the article generated hundreds of messages, many supportive, and prompted responses from deans at Wharton, Oxford Saïd, INSEAD, and elsewhere. Most rejected abolition while acknowledging that reform was overdue.\n\n3. What Marquis Missed: The Interlock with Consultancies\n\nWhat Marquis and the ensuing debate largely missed is that business schools do not operate alone. They form one half of an interlocking system with the major strategy consultancies. The schools teach the familiar language of 20th-century management—hierarchies prioritizing profits, rigid processes, and related frameworks and metrics—that McKinsey, Bain, and BCG then package and sell.\n\nRecent publications illustrate the continuity:\n- McKinsey’s forthcoming Strategy and Value (Koller, West, and Zimmerman) is framed as the companion to the firm’s long-running valuation work. It aims to link strategy decisions to long-term economic profit, capital allocation, and portfolio choices, with (so far) no mention of the customer.\n- Bain’s July–August 2026 Harvard Business Review article “Bring Back Managing for Value” and related pieces on strategic fit argue for a return to maximizing shareholder value—the very idea Jack Welch called “the dumbest idea in the world” and the Business Roundtable unanimously rejected in August 2019.\n- BCG’s cover article in the same issue of HBR promoted “alignment” to the hierarchy as the key to the future—the essence of 20th-century management thinking.\n\n4. Michael Porter’s Five Forces Remain a Business School Staple\n\nNone of these restatements treat continuous increases in customer value as the central strategic task. The omission is consequential. Michael Porter’s Five Forces, still a business-school staple, analyzes industry structure and the division of existing value. Bargaining power of buyers appears only as a force that can erode margins; there is no mechanism for systematically raising the value delivered to customers. Porter published no large-scale statistical evidence that systematic use of the framework produced superior firm performance. The issue is compounded by the fact that the strategy group he cofounded, The Monitor Group, filed for bankruptcy in 2012. Yet the tool remains standard.\n\n5. What Marquis Also Missed: The Different Dynamic of Today’s High-Performing Firms\n\nMeanwhile, a set of high-performing firms has operated for years on a different paradigm. NVIDIA under Jensen Huang, Microsoft after Satya Nadella, Amazon, Costco, Netflix, and ASML have prioritized customer enablement, long-term reinvestment, talent density with substantial autonomy, and metrics focused on customer outcomes. They treat strategy as an ongoing process of adjusting to what customers will value next, not as a fixed analysis of industry attractiveness or a mandate to maximize short-term earnings. Their results are public and sustained, with extraordinary 10-year total returns.\n\nBusiness-school and consulting discourse continues to revolve around older oppositions—shareholder primacy versus stakeholder or sustainability add-ons, case-method limitations, career-office pressure—rather than systematically teaching why and how leading firms are so much more successful by thinking, speaking, acting, and operating differently.\n\n6. Why the Interlocking Alliance Survives\n\nDespite its backward-facing thinking, the alliance persists for interlocking reasons:\n- Faculty promotion and status depend primarily on publications in top journals; redesigning core courses yields little credit.\n- Rankings weight graduate starting salaries and placement into consulting and finance, the sectors that still value conventional tools.\n- Accreditation processes make core-curriculum change slow.\n- Consulting firms sell frameworks that are teachable, scalable, and already familiar to boards and executives trained in the same language.\n- Executives continue to hire the firms for legitimacy and political cover (“nobody got fired for hiring McKinsey”), to obtain surge analytical capacity, proprietary benchmarks, and brand risk-reduction.\n- The highest-performing customer-value firms often rely less on these consultancies for core strategy.\n\nIncremental proposals—adding customer-value cases, adjusting faculty incentives, broadening ranking metrics—face the same structural obstacles that have limited prior reforms. More radical redesigns confront tenure systems, accreditation rules, and employer demand that still rewards the familiar tools.\n\n7. Meanwhile, the Paradigm Shift in Business Is Well Under Way\n\nHow then can the change happen? As business schools and consultancies spend time trying to revive 20th-century ways of running companies, the top-performing firms are racing ahead in a different paradigm. They prioritize customer enablement, networks of competence, long-term reinvestment, and talent-density metrics focused on customer outcomes, creating trillions of dollars of value.\n\nUnlike the consultancies and the business schools, these firms are not pursuing yet another one-dimensional idea or a five-step process based on a single firm’s experience. They are led by entrepreneurs who learn from each other while finding their own way and doing whatever is necessary for success. The approaches are not based on the experience of one firm in one country and one sector, or limited to tech. The paradigm shift draws on the experience of hundreds of companies in multiple countries and multiple sectors. While the ideas are very 21st-century, many have deep historical roots. They are robust because they are evidence-based. This is not about something that is going to happen. It is already happening.\n\n8. In a Genuine Paradigm Shift, Resistance Is Ridiculous\n\nThe thinking has also begun to spread in business schools and consultancies, although more slowly. Even in the organizations mentioned above, despite inertia and resistance at the top, individuals and segments are already making the change and experiencing the gains.\n\nBusiness schools showing the way include Northeastern University’s D’Amore-McKim School of Business, Worcester Polytechnic Institute, Florida Atlantic University’s Madden Center for Value Creation, Simon Fraser University, and parts of Harvard Business School and Columbia Business School. Individual professors and consultants pursuing the change are too numerous to list here, though some have been highlighted in prior articles and podcasts.\n\nAlthough the leadership of business schools and consultancies has not yet generally recognized it, we are in the late stage of a paradigm shift. When paradigm shifts happen in a society, there is not much point arguing about them. Once the public knows, it demands change. This is what is now happening with the shift from 20th-century management to 21st-century value creation, as leading public firms deliver huge, sustained, and quantified gains and benefits for customers. New patterns of thinking, speaking, and acting in business are showing the way. Customers will accept nothing less.\n", "_SLIPCASE/ALIASES.json": "{}", "_SLIPCASE/MANIFEST.json": "{\n  \"checkpoint\": \"DENNING-2026-11-03\",\n  \"schema\": \"15.55-AM\",\n  \"package\": \"Denning_Slipcase.zip\",\n  \"files\": {\n    \"000__BIBLIOGRAPHY.html\": \"46e58be9870b3e1106fc52f2da450aaad08185975211bee2504ff3e43be14f1a\",\n    \"000__BIBLIOGRAPHY.txt\": \"a3d62a4ccc6ab921a1dd4e6bce564dcbccb37762acd370865508de886fa5eea3\",\n    \"000__INDEX.txt\": \"aece9ef34d3bdbabb98843d8e0d08eb34eb2f4b01ca3be490b40b87d9bc999fa\",\n    \"000__MAKING_HISTORY.txt\": \"6777efdfd0acf4682eadacf5da4dcaae3a97e0cefddb6f63ac9172c996eff1b4\",\n    \"000__MAP.txt\": \"e4357a5e96aab51b608f7270d4e32fd6df2258cfeafc5c5c6825672dacc24042\",\n    \"000__OPEN_EDGES.txt\": \"e41c79b893c1a0f14f38f0ad885ff492c15c2049b4b815deba5c2d4c873c13ea\",\n    \"000__PROMPTS.txt\": \"abb49812a2c3a7779620415015d65de2e698c5a8c4b93a8072dc1a01d7bd4615\",\n    \"000__REBUILD -Sharing — forthcoming journal abs…\u003c/text>\u003c/g>\u003cg data-jump=\"receipt-mck-book\">\u003ctitle>Strategy and Value — book page\u003c/title>\u003ccircle cx=\"28\" cy=\"1476\" r=\"3\" fill=\"#456658\"/>\u003ctext x=\"35\" y=\"1480\" style=\"paint-order:stroke;stroke:#fffdf6;stroke-width:3px\" fill=\"#27342d\" font-family=\"sans-serif\" font-size=\"11\">Strategy and Value — book page\u003c/text>\u003c/g>\u003cg data-jump=\"receipt-porter-pdf\">\u003ctitle>Porter — reprint PDF\u003c/title>\u003ccircle cx=\"28\" cy=\"1506\" r=\"3\" fill=\"#456658\"/>\u003ctext x=\"35\" y=\"1510\" style=\"paint-order:stroke;stroke:#fffdf6;stroke-width:3px\" fill=\"#27342d\" font-family=\"sans-serif\" font-size=\"11\">Porter — reprint PDF\u003c/text>\u003c/g>\u003cg data-jump=\"receipt-denning-bain\">\u003ctitle>Denning — commentary linked as the Bain item\u003c/title>\u003ccircle cx=\"28\" cy=\"1536\" r=\"3\" fill=\"#456658\"/>\u003ctext x=\"35\" y=\"1540\" style=\"paint-order:stroke;stroke:#fffdf6;stroke-width:3px\" fill=\"#27342d\" font-family=\"sans-serif\" font-size=\"11\">Denning — commentary linked as the Bain item\u003c/text>\u003c/g>\u003cg data-jump=\"receipt-denning-bcg\">\u003ctitle>Denning — commentary linked as the BCG item\u003c/title>\u003ccircle cx=\"28\" cy=\"1566\" r=\"3\" fill=\"#456658\"/>\u003ctext x=\"35\" y=\"1570\" style=\"paint-order:stroke;stroke:#fffdf6;stroke-width:3px\" fill=\"#27342d\" font-family=\"sans-serif\" font-size=\"11\">Denning — commentary linked as the BCG item\u003c/text>\u003c/g>\u003cg data-jump=\"local-resource-Denning-Forbes-core-paste-txt\">\u003ctitle>Denning_Forbes_core_paste.txt\u003c/title>\u003ccircle cx=\"28\" cy=\"1596\" r=\"3\" fill=\"#456658\"/>\u003ctext x=\"35\" y=\"1600\" style=\"paint-order:stroke;stroke:#fffdf6;stroke-width:3px\" fill=\"#27342d\" font-family=\"sans-serif\" font-size=\"11\">Denning_Forbes_core_paste.txt\u003c/text>\u003c/g>\u003ctext x=\"28\" y=\"1648\" font-size=\"11\">DENNING-2026-11-03 · 000__RETURN
