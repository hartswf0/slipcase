<script>
const d=JSON.parse(document.getElementById('data').textContent), main=document.getElementById('main'), query=document.getElementById('query'), nav=document.getElementById('nav');
const modes=['Deck','Read','Graph','Sources','Bibliography','Ghosts','MOCs','Trail','Files'];
let mode=innerWidth<620?'Read':'Deck', current=d.cards[0].key, pinned=null, trail=[];
const byKey=new Map(d.nodes.map(n=>[n.key,n]));
const card=key=>d.cards.find(c=>c.key===key);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const out=key=>d.native.filter(r=>r.from===key), incoming=key=>d.native.filter(r=>r.to===key);
const jump=key=>'<button class="link" data-jump="'+esc(key)+'">'+esc(byKey.get(key).title)+'</button>';
const href=u=>'<a href="'+esc(u)+'" target="_blank" rel="noreferrer">'+esc(u)+'</a>';
function save(bytes,name,type){const url=URL.createObjectURL(new Blob([bytes],{type})); const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function bytes(b64){return Uint8Array.from(atob(b64),x=>x.charCodeAt(0))}
function openCard(key){current=key;mode='Read';trail.push(key);history.replaceState(null,'','#'+encodeURIComponent(card(key).id));render()}
function renderCard(c){return '<article><small>'+esc(c.id)+' · '+esc(c.sha.slice(0,12))+'</small><h2>'+esc(c.title)+'</h2><div class="tools"><button data-pin="'+c.key+'">Pin for comparison</button><button data-card="'+c.key+'">Save exact card</button></div><h3>Neighborhood</h3><ul>'+out(c.key).map(r=>'<li>'+esc(r.type)+' · '+jump(r.to)+'</li>').join('')+incoming(c.key).map(r=>'<li>BACKLINK · '+jump(r.from)+'</li>').join('')+'</ul><details open><summary>Card payload</summary><pre>'+esc(c.payload)+'</pre></details></article>'}
function render(){
nav.innerHTML=modes.map(m=>'<button data-mode="'+m+'" aria-current="'+(m===mode)+'">'+m+'</button>').join('');
if(mode==='Deck'){const q=query.value.toLowerCase().trim();main.innerHTML=d.cards.filter(c=>c.payload.toLowerCase().includes(q)).map(c=>'<article><small>'+esc(c.id)+'</small><h3>'+jump(c.key)+'</h3><p>'+esc(c.object)+'</p></article>').join('')||'<p>No cards match.</p>'}
if(mode==='Read'){main.innerHTML='<div class="split">'+renderCard(card(current))+(pinned&&pinned!==current?renderCard(card(pinned)):'')+'</div>'}
if(mode==='Graph'){main.innerHTML='<h2>Complete field</h2><p>Columns separate sources, cards, and intellectual addresses. Lines show outgoing evidence or native relations. Backlinks are the same links read in reverse.</p><div class="graph">'+d.svg+'</div><pre>'+esc(d.map)+'</pre>'}
if(mode==='Sources'){main.innerHTML=d.resources.map(r=>'<article><small>'+r.state+'</small><h3>'+esc(r.title)+'</h3><p>'+(r.url?href(r.url):'')+'</p><p>'+r.cards.map(jump).join(' · ')+'</p>'+(r.local?'<button data-file="'+esc(r.local)+'">Read or save local body</button>':'')+'</article>').join('')}
if(mode==='Bibliography'){main.innerHTML=d.bib.map((b,i)=>'<article><small>'+b.status+' · '+esc(b.key)+'</small><h3>'+esc(b.title)+'</h3><p>'+esc(b.citation)+'</p>'+(b.url?href(b.url):'')+'<p>'+b.cards.map(jump).join(' · ')+'</p><button data-bib="'+i+'">Copy BibTeX</button><pre>'+esc(b.raw)+'</pre></article>').join('')}
if(mode==='Ghosts'){main.innerHTML=d.nodes.filter(n=>n.type==='GHOST').map(n=>'<details class="ghost" id="'+n.key+'"><summary>'+esc(n.title)+' · '+incoming(n.key).length+'</summary><ul>'+incoming(n.key).map(r=>'<li>'+jump(r.from)+' · '+esc(r.field)+' · '+esc(r.literal)+'</li>').join('')+'</ul></details>').join('')}
if(mode==='MOCs'){main.innerHTML=d.mocs.map(m=>'<article><h2>'+esc(m.title)+'</h2><p>'+esc(m.note)+'</p>'+m.cards.map(jump).join(' · ')+'</article>').join('')}
if(mode==='Trail'){main.innerHTML='<h2>Reading trail</h2><ol>'+trail.map(k=>'<li>'+jump(k)+'</li>').join('')+'</ol><button id="clear">Clear trail</button>'}
if(mode==='Files'){main.innerHTML='<h2>Checkpoint files</h2>'+Object.keys(d.files).map(f=>'<details><summary>'+esc(f)+'</summary><button data-file="'+esc(f)+'">Save file</button><pre>'+esc(d.files[f])+'</pre></details>').join('')}
}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-jump]');if(!b)return;const a=b.dataset;
if(a.mode){mode=a.mode;render()}
if(a.jump){const n=byKey.get(a.jump);if(n.type==='ZETTEL')openCard(n.key);else if(n.type==='GHOST'){mode='Ghosts';render();const el=document.getElementById(n.key);el.open=true;el.scrollIntoView()}else if(n.type==='PLATFORM'){mode='MOCs';render()}else{mode='Sources';render()}}
if(a.pin){pinned=a.pin;render();const p=document.querySelector('[data-pin="'+a.pin+'"]');if(p)p.textContent='Pinned'}
if(a.card){const c=card(a.card);save(c.payload,c.filename,'text/plain;charset=utf-8')}
if(a.file)save(d.files[a.file],a.file.split('/').pop(),'text/plain;charset=utf-8');
if(a.bib!==undefined){const raw=d.bib[+a.bib].raw;if(navigator.clipboard)navigator.clipboard.writeText(raw).catch(()=>prompt('Copy BibTeX',raw));else prompt('Copy BibTeX',raw)}
if(b.id==='clear'){trail=[];render()}
});
query.addEventListener('input',()=>{mode='Deck';render()});query.addEventListener('keydown',e=>{const c=d.cards.find(c=>c.id.toLowerCase()===query.value.toLowerCase().trim());if(e.key==='Enter'&&c)openCard(c.key)});
document.getElementById('surprise').onclick=()=>{const candidates=d.cards.filter(c=>c.key!==current);openCard(candidates[Math.floor(Math.random()*candidates.length)].key)};
document.getElementById('paper').onclick=()=>save(bytes(d.pdf),d.paperName,'application/pdf');
const cap=document.getElementById('capsule');document.getElementById('archive').hidden=!cap;if(cap)document.getElementById('archive').onclick=()=>save(bytes(cap.textContent),d.zipName,'application/zip');
const found=d.cards.find(c=>'#'+encodeURIComponent(c.id)===location.hash);if(found)openCard(found.key);else render();
</script></html>
