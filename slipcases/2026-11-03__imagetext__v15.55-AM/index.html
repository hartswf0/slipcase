      "id": "IMG-JEPA-01",
      "title": "The positive-pair graph defines what counts as the same scene",
      "sha256": "ac31d18246f2ca300a555c3a0e8ee66b2964265078e63cc9812d1e7240f56dbd",
      "payload": "ZETTEL\n\nID: IMG-JEPA-01\n\nTITLE:\nThe positive-pair graph defines what counts as the same scene\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §§2.1–2.3, Figure 3, §7\n\nPASSAGE:\n[PARAPHRASE] In the spectral setting, the learned directions come from the graph that positive pairs draw on world states. Exact agreement requires shared positives and uniqueness up to rotation. When the graphs differ, the bound depends on their mismatch and on the spectral gap.\n\nRESEARCH OBJECT:\nThe rule for pairing observations as a prior about which differences matter.\n\nLOCAL MOVE:\nThe proof rewrites each modality’s learning objective on the same state space.\n\nSOURCE TERMS:\nPositive-pair distribution, world kernel, injective rendering, spectral gap.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] On Flickr, descriptions are grouped by photograph. The photograph supplies an address for the scene before the text encoder learns anything. Grouping by photographed event instead would change the learning problem.\n\nQUESTION:\nWhat does an imagetext experiment take as its unit of sameness: the image, the depicted event, or the relation a reader is asked to notice?\n\nDEEPER QUESTION:\nCan two descriptions of different images form a better pair for studying composition than two descriptions of the same image?\n\nMECHANISM:\nChanging the pair rule changes the graph. Under the paper’s spectral objective, this can change which distinctions survive in the leading embedding directions.\n\nFORMAL SHIFT:\n\u003cObservations> → \u003cweighted edges between states> → [spectral embedding] → \u003cgeometry of learned similarities>\n\nSOURCE FORMALISM:\nKπ = D^(-1/2) Π D^(-1/2), where Π represents the positive-pair distribution and D = diag(p). With second-order anti-collapse and a spectral gap, the solution is determined by the leading nonconstant eigenspace, up to rotation.\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\nThe proof requires a specified relation among states. In imagetext analysis, deciding whether two views depict the same event can itself be an interpretive judgment.\n\nMISSING:\nA test that varies the grouping rule while holding the actual images and texts fixed.\n\nBOUNDARY:\nThe spectral result supplies a sufficient condition for alignment under its assumptions. The paper leaves uniqueness under LeJEPA’s full-distribution constraint open.\n\nCITATION TRAIL:\nLaplacian eigenmaps and spectral contrastive learning, both cited in §2.1.\n\nTEST:\nTake one staged dispute photographed from several angles and a second dispute staged with the same blocking. Compare grouping by image ID, event ID, and blocking. Hold out one camera angle. Ask which grouping retrieves the same event and which retrieves the same composition.\n\nPLATFORM:\n[[Imagetext as a Unit of Analysis]]\n\nLINKS:\n[[Positive Pair Provenance]]\n[[Scene Identity]]\n[[Composition Across Images]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "title": "A second description can inherit the first description’s omissions",
      "sha256": "78d5b59907e56c0b5dd5282e2a2ad17bca65f505121778d1d7e539bd39959807",
      "payload": "ZETTEL\n\nID: IMG-JEPA-02\n\nTITLE:\nA second description can inherit the first description’s omissions\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — Appendix B, Table 7, §7\n\nPASSAGE:\n[PARAPHRASE] At the 2.24M-image scale, alt-text paired with a text-only paraphrase scores .060 on WIT, against .055 for corrupted views of alt-text alone and .107 for the set using alt-text and two LLaVA recaptions. The recaptions carry information from prior image–text training.\n\nRESEARCH OBJECT:\nWhether a second text comes from looking at the image again or from rewriting the first text.\n\nLOCAL MOVE:\nTable 7 varies both the available descriptions and the rule for drawing positive views.\n\nSOURCE TERMS:\nAlt-text, recaption, paraphrase, good views, bad views, scene-explained fraction.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] Thick prompting can accumulate many sentences while remaining dependent on a single act of seeing. Conversely, two captions written by the same image model may repeat a learned convention even when both are produced from pixels.\n\nQUESTION:\nWhen a caption introduces a detail absent from the first description, how do we tell a fresh observation from a shared captioning convention?\n\nDEEPER QUESTION:\nHow much of measured alignment comes from access to visible evidence, and how much from learning what caption writers tend to mention?\n\nMECHANISM:\nA paraphraser receives the first description. An image captioner receives visual evidence and brings its own training priors. Those are different routes for a detail to enter the second text.\n\nFORMAL SHIFT:\n\u003cCaption or photograph> → \u003cinput to a second describer> → [paraphrase or recaption] → \u003cdifferent evidence available for positive pairing>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nLog each description’s parent evidence: pixels, earlier text, or both. Independently mark whether each newly introduced claim is visible, contradicted, or undecidable from the image.\n\nTENSION:\nThe caption source matters even under the paper’s bad-view rule. At the 50M-image scale, the two LLaVA recaptions with bad views score .092 on WIT, against .056 for alt-text with bad views.\n\nMISSING:\nA control that separates independent access to pixels from captioner conventions and differences in literalness.\n\nBOUNDARY:\nTable 7 supports effects of both data and view construction. Its rows do not isolate a causal effect of independent looking.\n\nCITATION TRAIL:\nRecap-DataComp, cited as [34], and the LLaVA caption provenance discussed in §7.\n\nTEST:\nFor the same Shield of Achilles stills, collect one text-only paraphrase, one image-only description by a fresh observer, and one image-only description from a second captioner. Blindly verify every detail absent from the first text against the image. Count supported discoveries and repeated unsupported additions separately.\n\nPLATFORM:\n[[Thick Prompting as Method]]\n\nLINKS:\n[[Caption Provenance]]\n[[Inherited Omission]]\n[[Independent Looking]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "title": "Viewpoint can be nuisance in a caption and instruction in a prompt",
      "sha256": "46ed05586f66a8ec6e3e0fd465392d6d63f0a96bb6f079043bb5aca805db0f95",
      "payload": "ZETTEL\n\nID: IMG-JEPA-03\n\nTITLE:\nViewpoint can be nuisance in a caption and instruction in a prompt\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §2.3\n\nPASSAGE:\n[QUOTE] “It is a nuisance only for alignment”\n\nRESEARCH OBJECT:\nA variable whose status changes when language moves from describing an image to directing its production.\n\nLOCAL MOVE:\nThe authors distinguish the state a modality shares with others from observation-specific variation. They explicitly acknowledge that a camera-acting world model would need its viewpoint.\n\nSOURCE TERMS:\nState, nuisance, viewpoint, independent nuisances, alignment.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] An image encoder can benefit from treating two camera angles as equivalent for scene recognition. A prompt critic applying that same equivalence could reward a generator for ignoring an explicit camera instruction.\n\nQUESTION:\nCan an imagetext critic recognize the same depicted event across views while remaining sensitive to the requested view?\n\nDEEPER QUESTION:\nWho decides which details should survive alignment when the language itself selects what matters visually?\n\nMECHANISM:\nThe positive-pair rule resamples viewpoint in the source model. A prompt such as “seen directly overhead” instead makes viewpoint a target whose value must affect the rendered image.\n\nFORMAL SHIFT:\n\u003cCamera angle> → \u003cnuisance for scene recognition or constraint for generation> → [ignore or discriminate] → \u003cdifferent judgments of the same image pair>\n\nSOURCE FORMALISM:\nIn §2.3, observations are g_m(z, ν). Good views draw independent nuisance variables ν and ν′; corruptions of one observation share its nuisance.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nKeep separate labels for event identity and prompt-constraint satisfaction. The same image pair may match on one and differ on the other.\n\nTENSION:\nA critic that strongly preserves camera geometry may mistake a viewpoint change for an event change. A critic that suppresses it may miss a visible prompt violation.\n\nMISSING:\nInstruction-conditioned evidence about which differences the critic should ignore.\n\nBOUNDARY:\nThe paper’s nuisance analysis describes an alignment objective. Applying it to prompt compliance is an inference about a different task.\n\nCITATION TRAIL:\n§2.3’s explicit camera-acting example and §3.3’s tests of video frames as image views.\n\nTEST:\nRender the same dispute overhead and at eye level. Use both versions with “a dispute before elders,” then score both against “a dispute before elders seen directly overhead.” A critic passes if it preserves event identity in the first comparison and detects the wrong view in the second.\n\nPLATFORM:\n[[Operative Ekphrasis]]\n\nLINKS:\n[[Cinepromptography]]\n[[Conditional Fidelity]]\n[[Scene Identity]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "n": 4,
      "id": "IMG-JEPA-04",
      "title": "A prompt can change an image without making its meaning recoverable",
      "sha256": "e0bce6c7d7d3db1d8d00c4eb338deffe5ee89c0e5cf0f2400ad43b3f06e5a6c9",
      "payload": "ZETTEL\n\nID: IMG-JEPA-04\n\nTITLE:\nA prompt can change an image without making its meaning recoverable\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §2.1, Appendix A.2, §7\n\nPASSAGE:\n[PARAPHRASE] The proof uses the inverse of each injective rendering on its image. This lets the authors rewrite the objective over observations as an objective over world states. The limitations section identifies lossy real modalities as a departure from that setup.\n\nRESEARCH OBJECT:\nThe difference between a prompt detail having a visual effect and a viewer being able to infer that detail.\n\nLOCAL MOVE:\nInjectivity supplies recoverability in the formal model before learning begins.\n\nSOURCE TERMS:\nInjective rendering, left inverse, world state, population objective.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] Changing “blood-price” to “unpaid debt” could systematically alter a generator’s lighting or blocking while leaving the dispute’s stakes undecidable to viewers. There could be a causal effect without a readable sign of its cause.\n\nQUESTION:\nWhich parts of an imagetext can be reconstructed from the image, and which only become determinate when the text is present?\n\nDEEPER QUESTION:\nIf a classifier recovers the prompt change from lighting but human readers cannot identify the stakes, what exactly has crossed modalities?\n\nMECHANISM:\nA prompt intervention can shift the distribution of outputs. Recovering the intervention from a particular image requires evidence that distinguishes it from competing prompts. The text can supply the distinction directly in the combined imagetext.\n\nFORMAL SHIFT:\n\u003cPrompt contrast> → \u003cdistributions of rendered images> → [blind discrimination] → \u003cestimate of what the image makes recoverable>\n\nSOURCE FORMALISM:\nThe source uses x = g_m(z), with a left inverse on the range of g_m. It gives no model of prompt interventions.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nRecord three results separately: whether outputs change under a prompt edit, whether viewers infer the edited detail from pixels, and whether adding the text changes their reading.\n\nTENSION:\nA failed inference can indicate that the generator ignored the phrase, that it encoded the difference through an incidental visual cue, or that the stakes properly remain in the verbal part of the imagetext. Those readings require different evidence.\n\nMISSING:\nThe viewer and the prompt intervention as explicit variables in the paper’s setup.\n\nBOUNDARY:\nThe theorem does not imply that a generated image is invertible to its prompt, or that an apparent prompt match identifies what caused the image.\n\nCITATION TRAIL:\nThe proof’s change-of-variables step in Appendix A.2 and the lossy-modality limitation in §7.\n\nTEST:\nGenerate matched-seed pairs for “blood-price” and “unpaid debt,” holding staging and style instructions fixed. Test blind image-only judgments, then repeat with the captions swapped. Include a visible inside/outside edit to check that the same viewers can detect a renderable distinction.\n\nPLATFORM:\n[[Imagetext and Operative Ekphrasis]]\n\nLINKS:\n[[Shield of Achilles]]\n[[Causal Fidelity]]\n[[Semantic Recoverability]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "title": "The caption closest to the image embedding did not improve decoding",
      "sha256": "a11110779d08174427f50647903c6bba9c7961d866081679421df5babd3d32f9",
      "payload": "ZETTEL\n\nID: IMG-JEPA-05\n\nTITLE:\nThe caption closest to the image embedding did not improve decoding\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §5.1 and appendix passage “Scaling the captioner”\n\nPASSAGE:\n[PARAPHRASE] The authors generate several captions and select one by its agreement with the others under an n-gram similarity rule. Selecting the beam candidate closest to the rotated image embedding in text-JEPA space does not help. Additional decoder pretraining improves decoding of true caption embeddings without improving Flickr or COCO transfer.\n\nRESEARCH OBJECT:\nA split between geometry that makes captioning possible and a selection rule that produces a good caption.\n\nLOCAL MOVE:\nThe paper fits a map between frozen embedding spaces, then uses a separately trained language decoder and an explicit candidate selection procedure.\n\nSOURCE TERMS:\nRotated image embedding, soft prompt, consensus decoding, minimum Bayes risk, CIDEr.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The caption that most resembles other plausible captions can win even when a rarer caption preserves the detail that makes this image singular.\n\nQUESTION:\nDoes caption consensus remove hallucinated detail, or does it suppress accurate details that the decoder seldom names?\n\nDEEPER QUESTION:\nWhat would count as a good caption when the purpose is to direct attention toward a difficult feature rather than to agree with typical descriptions?\n\nMECHANISM:\nThe pipeline maps vision features into text-embedding space, projects the resulting vector into soft-prompt tokens, and decodes language. The consensus rule rewards lexical agreement among candidates, so a detail’s chance of surviving selection depends partly on how often other samples mention it.\n\nFORMAL SHIFT:\n\u003cImage features> → \u003cmapped text embedding> → [soft-prompt decoding and candidate selection] → \u003cone caption>\n\nSOURCE FORMALISM:\nThe scaled decoder projects an embedding to ten Qwen2.5 input embeddings through a two-layer MLP. Consensus compares 32 sampled captions and one greedy caption using CIDEr-style n-gram similarity without document frequencies.\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\nThe paper reports a useful decoding choice under its evaluation. Whether that choice favors generic descriptions at the expense of rare visible details remains an open empirical question.\n\nMISSING:\nFeature-level judgments of the winning caption and the candidates it displaced.\n\nBOUNDARY:\nThe result does not establish that consensus systematically erases details or that embedding similarity generally fails as a caption critic.\n\nCITATION TRAIL:\nClipCap for the soft-prompt projection and reference [27] for minimum Bayes risk decoding.\n\nTEST:\nUse one candidate pool per image and apply both selectors to that same pool. Choose images with a rare but visible detail. Have readers mark supported rare details and unsupported additions independently of caption fluency. Check whether the selectors trade one error for the other.\n\nPLATFORM:\n[[Imagetext and the Captioning Apparatus]]\n\nLINKS:\n[[Decoder Prior]]\n[[Visual Specificity]]\n[[Consensus Captioning]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "title": "Caption density begins with a rule about what to keep",
      "sha256": "c7a3eec672216366138f4cdf22ce60b1e9a6ef8b3f7b12ba877ff0d641cc54d9",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-02-A\n\nTITLE:\nCaption density begins with a rule about what to keep\n\nSOURCE:\nMinyoung Huh, Brian Cheung, Tongzhou Wang, and Phillip Isola — The Platonic Representation Hypothesis — 2024 — Appendix E\n\nPASSAGE:\n[QUOTE] “especially information from the start of the original description.”\n[QUOTE] “the alignment score also improves as caption length increases.”\n\nRESEARCH OBJECT:\nThe ordering of details in the parent description as a variable in caption-density experiments.\n\nLOCAL MOVE:\nThe authors vary the requested word budget for summaries of an existing description. Their prompt also gives early details priority.\n\nSOURCE TERMS:\nCaption density, granularity, salient visual information, alignment score.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] A longer summary may align better partly because it restores details previously excluded by an instruction that privileges the beginning. The caption’s order can determine which parts of the image become available for alignment.\n\nQUESTION:\nAt a fixed word budget, does moving a visible detail to the beginning of the source description change whether that detail contributes to measured alignment?\n\nDEEPER QUESTION:\nIf two equally accurate captions rank different aspects of one image as salient, which caption should a critic prefer?\n\nMECHANISM:\nA text-only model compresses a description under a word budget and a positional preference. The alignment measurement happens downstream of that selection.\n\nFORMAL SHIFT:\n\u003cOrdered full description> → \u003cword budget and priority instruction> → [summarization] → \u003ccaption used for alignment measurement>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\n[OUR INFERENCE] The length effect could reflect broader coverage of the image, or recovery of particular details systematically excluded at shorter budgets. Both could be present.\n\nMISSING:\nAn order intervention that keeps the image, source propositions, and word budget fixed.\n\nBOUNDARY:\nAppendix E’s reported length effect does not isolate the effect of ordering or of the instruction to favor the beginning.\n\nCITATION TRAIL:\n[[IMG-JEPA-02]] → Huh et al., Appendix E → Urbanek et al.’s Densely Captioned Images dataset and its description hierarchy.\n\nTEST:\nSwap the first and last blocks of each description without changing any wording. Run the same short and long summary prompts on both orders. Compare which propositions survive and whether changes in visual coverage track the alignment score.\n\nPLATFORM:\n[[Thick Prompting as Method]]\n\nLINKS:\n[[IMG-JEPA-02]]\n[[Caption Order]]\n[[Salience in Imagetext]]\n\nBIBTEX:\n@misc{huh2024platonic,\n  author = {Huh, Minyoung and Cheung, Brian and Wang, Tongzhou and Isola, Phillip},\n  title = {The Platonic Representation Hypothesis},\n  year = {2024},\n  eprint = {2405.07987},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2405.07987}\n}",

      "n": 7,
      "id": "IMG-JEPA-02-B",
      "title": "Changing the evaluator changes which captions count as aligned",
      "sha256": "b5cf93c9285fce24de8a36907a9cb3b8916bc539751a3d32ad5210b6e1f5ecf7",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-02-B\n\nTITLE:\nChanging the evaluator changes which captions count as aligned\n\nSOURCE:\nXianhang Li et al. — What If We Recaption Billions of Web Images with LLaMA-3? — 2024 arXiv preprint — §4.2\n\nPASSAGE:\n[QUOTE] “our recaptioned content performs just comparably to the original captions (49.57 vs. 50.43).”\n[QUOTE] “the LongCLIP score of our newly generated caption impressively attains 89.91”\n\nRESEARCH OBJECT:\nA reversal in caption ranking when the evaluator changes from CLIP-Large to LongCLIP-Large.\n\nLOCAL MOVE:\nThe authors evaluate the same recaptioning intervention with two vision–language scorers. Under LongCLIP, the reported score for original captions is 10.09.\n\nSOURCE TERMS:\nSemantic similarity, CLIP-large, LongCLIP-Large, recaptioned content.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The new caption may contain more visible facts. It also has a form that the second evaluator was specifically adapted to process. The score alone cannot separate those advantages.\n\nQUESTION:\nDoes LongCLIP reward an additional true visual claim more than an equally long false claim?\n\nDEEPER QUESTION:\nCan a single image–text score tell us whether the added words are supported by the image or whether the text supplies information of its own?\n\nMECHANISM:\nThe scorers encode the image and caption and evaluate similarity. Changing the scorer changes the representation through which additional caption material can affect the score.\n\nFORMAL SHIFT:\n\u003cFixed image and competing captions> → \u003cscorer-specific embeddings> → [similarity scoring] → \u003ccaption ranking that depends on the scorer>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\n[OUR INFERENCE] One explanation is that LongCLIP can register genuinely supported detail that standard CLIP misses. Another is that it favors properties of longer recaptions even when their added claims are unsupported.\n\nMISSING:\nAn evaluation that varies the truth of an added claim independently of caption length and phrasing.\n\nBOUNDARY:\nThe reported scores compare scorers and caption sets. They do not identify the contribution of any particular visual claim, and their numerical scales cannot be compared directly across scorers.\n\nCITATION TRAIL:\n[[IMG-JEPA-02]] → Recap-DataComp evaluation in §4.2 → LongCLIP, reference [76].\n\nTEST:\nWrite two length-matched extensions of the same short caption. Change one visible relation in the second extension from true to false, such as inside to outside. Test both scorers on whether they prefer the true extension. Repeat with the same relation placed early and late.\n\nPLATFORM:\n[[Evaluating Imagetext]]\n\nLINKS:\n[[IMG-JEPA-02]]\n[[Evaluator Dependence]]\n[[Visual Claim Verification]]\n\nBIBTEX:\n@misc{li2024recaption,\n  author = {Li, Xianhang and Tu, Haoqin and Hui, Mude and Wang, Zeyu and Zhao, Bingchen and Xiao, Junfei and Ren, Sucheng and Mei, Jieru and Liu, Qing and Zheng, Huangjie and Zhou, Yuyin and Xie, Cihang},\n  title = {What If We Recaption Billions of Web Images with {LLaMA-3}?},\n  year = {2024},\n  eprint = {2406.08478},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/pdf/2406.08478}\n}",

      "payload": "ZETTEL\n\nID:\nIMG-JEPA-05-A\n\nTITLE:\nAn image-derived prefix also adapts the decoder to a captioning task\n\nSOURCE:\nRon Mokady, Amir Hertz, and Amit H. Bermano — ClipCap: CLIP Prefix for Image Captioning — 2021 — §3.3\n\nPASSAGE:\n[QUOTE] “The constant has a dual role, first, to retrieve meaningful information from CLIP embedding through the multi-head attention.”\n\nRESEARCH OBJECT:\nThe learned constant supplied alongside the image embedding in ClipCap’s frozen-decoder variant.\n\nLOCAL MOVE:\nThe authors give the transformer mapper both an image-dependent input and a learned constant. They assign the constant a role in extracting information and a role in adapting the frozen language model to the new data.\n\nSOURCE TERMS:\nVisual encoding, learned constant input, multi-head attention, fixed language model.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The ancestor of the JEPA captioner’s soft-prompt technique makes two jobs visible at once. A prefix can help determine which facts reach the decoder and what kind of sentence the decoder tends to produce.\n\nQUESTION:\nCan changing the learned constant alter which visual fact the caption foregrounds while the image features, mapper, and language model stay fixed?\n\nDEEPER QUESTION:\nWhen a caption starts with a person, an object, or an action, how much of that choice comes from the image and how much comes from how the decoder was taught to describe images?\n\nMECHANISM:\nIn this ClipCap variant, the transformer processes the visual encoding together with a learned constant. The resulting prefix conditions the frozen language model’s next-token generation.\n\nFORMAL SHIFT:\n\u003cCLIP image embedding plus learned constant> → \u003ctransformer-generated prefix> → [frozen language-model decoding] → \u003ccaption>\n\nSOURCE FORMALISM:\n§3.3 specifies the two transformer inputs. §3.4 specifies autoregressive decoding conditioned on the visual prefix.\n\nOUR FORMALIZATION:\nNONE\n\nTENSION:\n[OUR INFERENCE] The constant may mostly steer caption style, or it may also change which visible distinctions reliably reach the output. A fluent caption can result in either case.\n\nMISSING:\nA controlled intervention on the constant that distinguishes a change in phrasing from a change in which visible propositions appear.\n\nBOUNDARY:\nThis mechanism belongs to ClipCap’s frozen-decoder transformer variant. The JEPA paper’s scaled captioner uses a two-layer MLP and a fine-tuned Qwen2.5 decoder. The cited connection is prefix conditioning.\n\nCITATION TRAIL:\n[[IMG-JEPA-05]] → ClipCap §3.3 → Li and Liang’s prefix-tuning work, cited in ClipCap §3.2.\n\nTEST:\nFreeze a trained ClipCap transformer mapper and its decoder. Fit separate constants on the same training images with people-first and objects-first captions. Swap only the constant at inference. On held-out images, score sentence openings and supported visual propositions separately.\n\nPLATFORM:\n[[Imagetext and the Captioning Apparatus]]\n\nLINKS:\n[[IMG-JEPA-05]]\n[[Soft Prompt Conditioning]]\n[[Caption Genre]]\n\nBIBTEX:\n@misc{mokady2021clipcap,\n  author = {Mokady, Ron and Hertz, Amir and Bermano, Amit H.},\n  title = {{ClipCap}: {CLIP} Prefix for Image Captioning},\n  year = {2021},\n  eprint = {2111.09734},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/pdf/2111.09734}\n}",

      "payload": "ZETTEL\n\nID:\nIMG-JEPA-04-A\n\nTITLE:\nDescription has an addressee that alignment has no place for\n\nSOURCE:\nW. J. T. Mitchell — Ekphrasis and the Other — 1994 — §18\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §§3 and 5.1\n\nPASSAGE:\n[QUOTE — Mitchell] “the relation of the speaker and the audience or addressee of the ekphrasis”\n\nRESEARCH OBJECT:\nThe addressee as a variable in deciding what a description should do.\n\nLOCAL MOVE:\nMitchell inserts a third position into the encounter between a describer and a depicted object. The description goes to someone whose reception is part of the event.\n\nSOURCE TERMS:\nAddressee, ekphrastic hope, description, ventriloquism.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The JEPA captioner makes the image-to-sentence step executable. Mitchell’s next step happens in reception. A sentence can retrieve the correct photograph while leaving a reader unable to imagine the relation for which the photograph was described.\n\nQUESTION:\nWhen is a good caption a good description for a particular person?\n\nDEEPER QUESTION:\nCan an imagetext work depend on giving one reader something to notice that another reader already sees?\n\nMECHANISM:\nIn the JEPA evaluation, a candidate can succeed by ranking its associated image or caption above alternatives. In Mitchell’s account, a description also mediates between the depicted object and a listener or reader. What the reader already knows changes what the description can accomplish.\n\nFORMAL SHIFT:\nNONE\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nEvaluate the same image–description pair on two axes. Measure whether it identifies the image among alternatives and whether it helps a specified reader recover a specified relation.\n\nTENSION:\nA caption that names Achilles may distinguish a Shield image in an archive. A caption that locates the elders relative to the disputants may better enable a reader to reconstruct its composition. The two tasks can favor different sentences.\n\nMISSING:\nA recipient, a purpose for describing, and evidence of what the recipient came to see.\n\nBOUNDARY:\nThe comparison brings Mitchell’s account of reception to the JEPA evaluation. It establishes no line of influence between the authors.\n\nCITATION TRAIL:\n[[IMG-JEPA-04]] → Mitchell §18 on the ekphrastic triangle → §§21 onward on cups and shields.\n\nTEST:\nWrite two length-matched descriptions of each Shield image, one identifying the narrative and one locating the figures. Have one group retrieve the image among distractors and another reconstruct its blocking from text alone. Compare caption rankings across the tasks.\n\nPLATFORM:\n[[Imagetext as an Addressed Act]]\n\nLINKS:\n[[IMG-JEPA-04]]\n[[Ekphrastic Triangle]]\n[[Description for Whom]]\n\nBIBTEX:\n@incollection{mitchell1994ekphrasis,\n  author = {Mitchell, W. J. T.},\n  title = {Ekphrasis and the Other},\n  booktitle = {Picture Theory: Essays on Verbal and Visual Representation},\n  publisher = {University of Chicago Press},\n  year = {1994},\n  url = {https://complit.utoronto.ca/wp-content/uploads/COL1000-Week11-Nov25_WJT_Mitchell.pdf}\n}\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "sha256": "9fea63601ab8e3af4636ae20bb3c482ac69054a069796688fde4c4c02b271473",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-02-B-A\n\nTITLE:\nA detail that crosses scenes can belong to the composite work\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §2.3 and Appendix B, Table 7\nW. J. T. Mitchell — Beyond Comparison: Picture, Text, and Method — 1994 — Picture Theory, p. 89 n. 9, as reprinted in his introduction to The Future of Text and Image\n\nPASSAGE:\n[QUOTE — Balestriero and LeCun] “alt-texts sharing a brand name”\n[QUOTE — Mitchell] “composite, synthetic works (or concepts) that combine image and text”\n\nRESEARCH OBJECT:\nA brand name that connects photographs of different scenes and also connects each photograph to the page on which it appears.\n\nLOCAL MOVE:\nThe JEPA paper uses a repeated brand name to illustrate how overlapping text corruptions can create links across scenes. Mitchell’s imagetext shifts the unit of analysis to the work made by combining the verbal and visual materials.\n\nSOURCE TERMS:\nAlt-text, nuisance, induced world kernel, imagetext.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The same word can be a shortcut for matching photographs and an indispensable part of understanding how a photograph is published. Removing it could make the text a better view of the pictured scene while making it a poorer account of the page.\n\nQUESTION:\nWhen does a recaption describe the photographed thing more accurately while describing the published imagetext less adequately?\n\nDEEPER QUESTION:\nShould a visible logo, a merchant name supplied by the page, and a merchant name hallucinated by the captioner count as three different kinds of evidence?\n\nMECHANISM:\nIn the paper’s example, shared wording can cause corruptions of texts from distinct scenes to overlap. In a published composite, wording can intentionally connect distinct scenes through sponsorship, authorship, or a series title. The visible pixels can remain identical across those contexts.\n\nFORMAL SHIFT:\n\u003cPhotograph embedded in a page> → \u003cimage ID and associated text strings> → [caption replacement or positive pairing] → \u003cdifferent relations become available to the encoder>\n\nSOURCE FORMALISM:\nThe induced world kernel gives the probability that a positive pair joins observations of two specified states.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nGive each phrase separate provenance labels for pixel evidence and page evidence. Keep unsupported claims distinct from supported claims that require the page.\n\nTENSION:\nTable 7 favors different caption mixtures on Flickr retrieval and WIT alignment. That difference makes the target worth specifying. It does not explain whether the difference comes from literalness, caption genre, or another property of the data.\n\nMISSING:\nThe original page as evidence alongside the isolated image and its text fields.\n\nBOUNDARY:\nThe brand example illustrates an alignment mechanism. It cannot establish that a given brand term is irrelevant to the artifact or that alt-text ordinarily functions as a public caption.\n\nCITATION TRAIL:\n[[IMG-JEPA-02-B]] → JEPA §2.3 on the brand-name example → Mitchell’s distinction among imagetext, image-text, and image/text.\n\nTEST:\nTake one identical photograph published on two pages under different, verifiable sponsorships. Compare literal recaptions with page-aware descriptions. Test scene retrieval and publication attribution separately. Include a case where the sponsor is visible in the image to test whether the two tasks can coincide.\n\nPLATFORM:\n[[The Published Imagetext]]\n\nLINKS:\n[[IMG-JEPA-02-B]]\n[[IMG-JEPA-01]]\n[[Scene Versus Page]]\n[[Description Provenance]]\n\nBIBTEX:\n@article{mitchell1994beyond,\n  author = {Mitchell, W. J. T.},\n  title = {Beyond Comparison: Picture, Text and Method},\n  journal = {Interfaces},\n  volume = {5},\n  pages = {13--38},\n  year = {1994},\n  doi = {10.3406/inter.1994.932},\n  note = {The quoted Picture Theory note is reproduced in Mitchell's introduction to The Future of Text and Image},\n  url = {https://www.cambridgescholars.com/resources/pdfs/978-1-4438-3640-1-sample.pdf}\n}\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "sha256": "5dd250229467bbc1f75f6f6f4c33246eb61f1f433c280b805a40c549a5b5da92",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-05-A-A\n\nTITLE:\nA sheep-shaped cake puts the object and its depiction in the same frame\n\nSOURCE:\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — appendix passage “Scaling the captioner”\nW. J. T. Mitchell — Ekphrasis and the Other — 1994 — §21\n\nPASSAGE:\n[QUOTE — Balestriero and LeCun] “a cake shaped like a sheep”\n[QUOTE — Mitchell] “utilitarian objects that happen to have ornamental or symbolic visual representations attached to them”\n\nRESEARCH OBJECT:\nAn artifact that resembles one thing while being another, photographed for captioning.\n\nLOCAL MOVE:\nThe JEPA authors mention the sheep-shaped cake in a qualitative report about additional decoder pretraining. Mitchell uses artifacts such as cups and shields to locate early ekphrastic objects within practices of making and use.\n\nSOURCE TERMS:\nRecaptions, decoder, ornamental or symbolic visual representations, ekphrastic objects.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] A caption for the cake may need to distinguish three things: the photograph, the object photographed, and the figure the object presents. A caption can name both cake and sheep while still getting their relation wrong.\n\nQUESTION:\nCan the captioner distinguish resemblance, depiction, and physical presence when the same nouns fit all three?\n\nDEEPER QUESTION:\nWhen a model calls something a sheep, is it describing what is present in the photographed space or what an artifact in that space represents?\n\nMECHANISM:\nThe vision encoder supplies features to a mapped embedding. The decoder turns those features into a sentence. An object-level description must assign different roles to the visible material and to the figure it resembles or depicts.\n\nFORMAL SHIFT:\n\u003cPhotograph of a representational artifact> → \u003cvisual embedding and mapped text embedding> → [caption decoding] → \u003ca sentence that may preserve or collapse representational levels>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nUse separate labels for the physical bearer, the represented figure, and the relation between them. For example, cake / sheep / shaped like differs from cake / sheep / printed on and cake / sheep / next to.\n\nTENSION:\nThe paper reports that extra pretraining helps some unusual examples without improving Flickr or COCO transfer. The reported example could indicate better recognition of an uncommon artifact or better description of its representational structure.\n\nMISSING:\nThe specific candidate captions and a controlled comparison that keeps the named objects fixed while changing their relation.\n\nBOUNDARY:\nThe authors’ phrase identifies an example. It is not a transcript of the model’s caption or a quantified result about representational nesting.\n\nCITATION TRAIL:\n[[IMG-JEPA-05-A]] → the JEPA appendix’s qualitative example → Mitchell §21 on the objects of ekphrasis → the Shield as an artifact bearing scenes.\n\nTEST:\nCompare a sheep-shaped cake, a cake with a printed sheep, and a plain cake beside a toy sheep. Score noun recognition and relation recognition separately. Repeat with the same Shield scene embossed on metal, printed on a poster, and staged by actors. Ask whether each caption tells the reader where the depicted figures exist.\n\nPLATFORM:\n[[Imagetext and Representational Nesting]]\n\nLINKS:\n[[IMG-JEPA-05-A]]\n[[Shield of Achilles]]\n[[Bearer and Depicted Figure]]\n[[Description of a Representation]]\n\nBIBTEX:\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}\n@incollection{mitchell1994ekphrasis,\n  author = {Mitchell, W. J. T.},\n  title = {Ekphrasis and the Other},\n  booktitle = {Picture Theory: Essays on Verbal and Visual Representation},\n  publisher = {University of Chicago Press},\n  year = {1994},\n  url = {https://complit.utoronto.ca/wp-content/uploads/COL1000-Week11-Nov25_WJT_Mitchell.pdf}\n}",

      "n": 12,
      "id": "IMG-JEPA-04-A-A",
      "title": "An image must leave something out to remain an image",
      "sha256": "92444c621ab5fdaa81e7ccc89aef43b38c362cd35077b60fb7a4a63f2fa29796",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-04-A-A\n\nTITLE:\nAn image must leave something out to remain an image\n\nSOURCE:\nPlato — Cratylus — 432b–433a — translated by David Horan\n\nPASSAGE:\n[QUOTE] “Would there then be Cratylus and his image, or would there be two Cratyluses?”\n\nRESEARCH OBJECT:\nOmission as a condition of representation, with a separate question about which omissions count as errors.\n\nLOCAL MOVE:\nSocrates imagines a god reproducing Cratylus down to his interior, warmth, motion, soul, and intelligence. Cratylus accepts that the result would be two Cratyluses. Socrates uses this concession to reopen what correctness can mean for an image, then carries the argument into names and sentences.\n\nSOURCE TERMS:\nImage, imitation, correctness, name, impression.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] The question for imagetext is more exact than how much of the object can survive translation. Some differences make the description usable as a description. Others remove the very feature it was meant to bring forward. Counting omissions treats those cases alike.\n\nQUESTION:\nCan a description become more exact by omitting a true feature?\n\nDEEPER QUESTION:\nDoes correctness belong to the description by itself, or to what a reader can do with that description in a particular situation?\n\nMECHANISM:\nSocrates first tests complete resemblance by asking what kind of thing it would produce. He then allows that a name or sentence can contain an unsuitable element and still name or speak of its object. Identifying what the description concerns and judging how well it describes it become separable acts.\n\nFORMAL SHIFT:\nNONE\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nFor each description, distinguish reference, accuracy of individual claims, and adequacy for the reader’s task. Score each independently.\n\nTENSION:\nA sparse description may identify the right image while omitting a crucial relation. A detailed description with one false claim may still let the reader reconstruct the scene more accurately. A single alignment score can rank either one first.\n\nMISSING:\nA criterion for deciding which omissions matter before comparing descriptions.\n\nBOUNDARY:\nThe doubling argument concerns complete duplication. The JEPA theorem concerns alignment of embeddings up to rotation under specified assumptions. The comparison opens a question about selective representation without equating the two kinds of sameness.\n\nCITATION TRAIL:\n[[IMG-JEPA-04-A]] → Cratylus 432b–433a → Mitchell’s account of the addressee in Ekphrasis and the Other §18.\n\nTEST:\nUse one image and two tasks: identify it among alternatives, then reconstruct one spatial relation. Compare a sparse accurate caption, a detailed caption with one false claim, and a caption that omits the diagnostic relation. Ask which caption is best under each task and which error causes each reversal.\n\nPLATFORM:\n[[Correctness of Description]]\n\nLINKS:\n[[IMG-JEPA-04-A]]\n[[IMG-JEPA-04]]\n[[Omission as Selection]]\n[[Reference Versus Adequacy]]\n\nBIBTEX:\n@book{platoCratylusHoran,\n  author = {Plato},\n  title = {Cratylus},\n  translator = {Horan, David},\n  note = {Stephanus 432b--433a},\n  url = {https://www.platonicfoundation.org/media/2025/06/platos-cratylus-english-translation-by-david-horan.pdf}\n}",

      "id": "IMG-JEPA-03-A",
      "title": "A correction to the object can be a distortion from another viewpoint",
      "sha256": "1f9cccd034bc50652ffe4300095c3793c04ad2816052ca6134aea8a4305609fc",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-03-A\n\nTITLE:\nA correction to the object can be a distortion from another viewpoint\n\nSOURCE:\nPlato — Sophist — 235d–236c — translated by Benjamin Jowett\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §2.3\n\nPASSAGE:\n[QUOTE — Plato, Jowett translation] “make only the proportions which appear to be beautiful, disregarding the real ones.”\n\nRESEARCH OBJECT:\nThe large sculpture whose proportions are altered for the spectator’s position.\n\nLOCAL MOVE:\nThe Stranger distinguishes likeness-making from appearance-making. A maker can enlarge distant parts so they look proportionate from below. The passage presents this as abandoning true proportions, even though the alteration is what gives the intended spectator a proportionate appearance.\n\nSOURCE TERMS:\nLikeness-making, appearances, proportions, position of the spectator, viewpoint, nuisance.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] In JEPA §2.3, viewpoint can vary across observations of a fixed object. In the sculpture example, the maker alters the object in anticipation of the viewpoint. What the spectator can see helps determine what gets made.\n\nQUESTION:\nWhen a prompt says “make the figure look proportionate from below,” what should a caption critic check: the dimensions of the figure or the appearance from below?\n\nDEEPER QUESTION:\nCould two images agree on a visible relation precisely because the objects they depict differ?\n\nMECHANISM:\nGeometry and viewing position jointly determine apparent proportions. A maker can change one to compensate for the other. A verbal description can specify either the construction or the desired appearance, and those instructions can call for different objects.\n\nFORMAL SHIFT:\n\u003cObject proportions and spectator position> → \u003cprojected proportions> → [alter the object for the intended view] → \u003cappearance that may cease to match from another position>\n\nSOURCE FORMALISM:\nNONE\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nLabel a description’s target as object geometry, projected appearance from a specified view, or appearance across views.\n\nTENSION:\nThe Stranger’s classification gives priority to actual proportions. A description written for the person standing below the sculpture could be correct about appearance while being wrong if read as a statement about dimensions.\n\nMISSING:\nA way for the critic to tell which level the words specify before it scores a match.\n\nBOUNDARY:\nPlato gives an example of making appearances, with no claim about learned invariance. The connection to the JEPA nuisance variable is an analytical comparison.\n\nCITATION TRAIL:\n[[IMG-JEPA-03]] → JEPA §2.3 on viewpoint → Sophist 235d–236c → Republic X 598a–b on the couch seen from different positions.\n\nTEST:\nMake two renders from below: one of a proportionate figure and one of a figure whose upper body has been enlarged to compensate for perspective. Render each again from eye level. Ask critics to evaluate separately whether the head is oversized and whether it looks oversized from below. Record whether their judgments follow the object or the view.\n\nPLATFORM:\n[[Viewpoint and Description]]\n\nLINKS:\n[[IMG-JEPA-03]]\n[[Likeness and Appearance]]\n[[Cinepromptography]]\n[[Spectator Position]]\n\nBIBTEX:\n@book{platoSophistJowett,\n  author = {Plato},\n  title = {Sophist},\n  translator = {Jowett, Benjamin},\n  note = {Stephanus 235d--236c},\n  url = {https://en.wikisource.org/wiki/Sophist_(Jowett)}\n}\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

      "id": "IMG-JEPA-01-A",
      "title": "The cave analogy leaves open who made the shadows agree",
      "sha256": "593c8ad6d3b736a85c9efe473a823ebb7fbf108558bace0a293451e823b1ba2e",
      "payload": "ZETTEL\n\nID:\nIMG-JEPA-01-A\n\nTITLE:\nThe cave analogy leaves open who made the shadows agree\n\nSOURCE:\nMinyoung Huh, Brian Cheung, Tongzhou Wang, and Phillip Isola — The Platonic Representation Hypothesis — 2024 — §1, Figure 1, §4.1 and note 4\nRandall Balestriero and Yann LeCun — Proving and Improving the Platonic Representation Hypothesis with JEPAs — 2026 — §§2.1–2.3, §7\n\nPASSAGE:\n[QUOTE — Huh et al.] “The training data for our algorithms are shadows on the cave wall”\n[QUOTE — Huh et al.] “the joint distribution of observation indices is itself the platonic reality.”\n\nRESEARCH OBJECT:\nTwo readings of the latent state in the paper that supplies the JEPA paper’s term “Platonic.”\n\nLOCAL MOVE:\nHuh et al. explicitly invoke Plato’s cave in their introduction. Their formal setup later allows an event to be an index for observations without further physical meaning. Note 4 entertains a statistical reading of what counts as reality.\n\nSOURCE TERMS:\nPlatonic representation, observation, event, joint distribution, positive-pair distribution.\n\nWHAT BECAME STRANGE:\n[OUR INFERENCE] A photograph and its machine-written caption can agree because the caption was produced from that very photograph. That agreement can be real and useful while leaving open whether a second camera or witness would support the same account.\n\nQUESTION:\nWhen text and image align, what evidence distinguishes independent access to a scene from descent through the same representational artifact?\n\nDEEPER QUESTION:\nIf an image generates its own descriptions and those descriptions later supervise another model, which part of the resulting agreement belongs to the photographed event and which part belongs to the image’s circulation?\n\nMECHANISM:\nHuh et al.’s Figure 1 allows a description to be produced from an existing measurement or mediated by a different measurement. The JEPA study’s recaptioned corpus gives the first path a concrete implementation. The text encoder can train without pixel inputs while its examples still carry information derived from pixels.\n\nFORMAL SHIFT:\n\u003cScene> → \u003cone photograph or independently obtained views> → [captioning and pairing] → \u003cagreement with different evidentiary histories>\n\nSOURCE FORMALISM:\nHuh et al. model observations as bijective deterministic functions of discrete events in §4.1. Balestriero and LeCun model positive pairs as a distribution over world states in §2.1.\n\nOUR FORMALIZATION:\n[OUR FORMALIZATION — NOT SOURCE SYNTAX]\nFor each positive pair, record the nearest common source: event, photograph, or prior description. Evaluate on held-out evidence produced before the descriptions can influence it.\n\nTENSION:\nReading A treats cross-modal agreement as evidence of recovery of a shared event. Reading B treats it as recovery of structure already stabilized by the photograph and its captions. An evaluation built around the same photographs can support both readings.\n\nMISSING:\nA benchmark in which the description must answer to an observation outside its own production chain.\n\nBOUNDARY:\nThe genealogy verified here is the original PRH paper’s explicit citation of Plato’s cave. The claim about shared representational ancestry is a proposed test of alignment evidence.\n\nCITATION TRAIL:\n[[IMG-JEPA-01]] → Huh et al. §1 and §4.1 note 4 → Plato’s Republic VII → the Nettleship reading cited in the note.\n\nTEST:\nPhotograph a staged scene from two angles. Pair one caption with the first photograph from which it was written, and obtain another description from a witness or second camera. Keep the pairs separate. Test which details transfer to a held-out view, especially details visible in only one original view.\n\nPLATFORM:\n[[Genealogy of the Platonic Representation Hypothesis]]\n\nLINKS:\n[[IMG-JEPA-01]]\n[[IMG-JEPA-02]]\n[[Independent Observation]]\n[[Imagetext Provenance]]\n\nBIBTEX:\n@misc{huh2024platonic,\n  author = {Huh, Minyoung and Cheung, Brian and Wang, Tongzhou and Isola, Phillip},\n  title = {The Platonic Representation Hypothesis},\n  year = {2024},\n  eprint = {2405.07987},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2405.07987}\n}\n@misc{balestriero2026platonic,\n  author = {Balestriero, Randall and LeCun, Yann},\n  title = {Proving and Improving the Platonic Representation Hypothesis with {JEPAs}},\n  year = {2026},\n  eprint = {2610.39302},\n  archivePrefix = {arXiv},\n  url = {https://arxiv.org/html/2610.39302v1}\n}",

 const neighborhood=relations(c.sha256).filter(e=>['BACKLINK','MEMBER_OF','LINKS_TO','WIKILINKS_TO','USES_SOURCE'].includes(e.type));
 return `<article><small>${h(c.id)} · ${h(c.sha256)}</small><h2>${h(c.title)}</h2><div class="actions">${button(pin===c?'Unpin':'Pin for comparison','pin',c.sha256)}${button('Copy BibTeX','bib',c.sha256)}</div><details open><summary>Neighborhood and backlinks</summary><ul>${neighborhood.map(e=>`<li>${h(e.type)} · ${address(e.target)}</li>`).join('')}</ul></details><details open><summary>Card payload</summary><pre>${payload}</pre></details></article>`;
}
function showNode(id){
 if(cardBy[id]){select(cardBy[id]);return;}
 const n=D.nodes[id];if(!n)return;
 const links=relations(id);
 screen.innerHTML=`<article><small>${h(n.type)}</small><h2>${h(n.label)}</h2>${n.url?`<a href="${h(n.url)}">Open source</a>`:''}<ul>${links.map(e=>`<li>${h(e.type)} · ${address(e.target)} · ${h(e.field)}</li>`).join('')}</ul><pre>${h(JSON.stringify(n,null,2))}</pre></article>`;
}
function render(){
 const q=search.value.trim().toLowerCase();
 if(q||mode==='DECK'){
   const rows=D.cards.filter(c=>!q||(c.payload+' '+c.file).toLowerCase().includes(q));
   screen.innerHTML='<h2>Deck</h2><div class="deck">'+rows.map(c=>button(c.id+' · '+c.title,'node',c.sha256)).join('')+'</div>'+(rows.length?'':'<p>No cards found.</p>');return;
 }
 if(mode==='READ'){screen.innerHTML=pin&&pin!==selected?'<div class="pair">'+article(pin)+article(selected)+'</div>':article(selected);return;}
 if(mode==='GRAPH'){screen.innerHTML='<h2>Graph</h2><ul>'+D.edges.map(e=>`<li>${address(e.source)} → ${address(e.target)} · ${h(e.type)} · ${h(e.field)}</li>`).join('')+'</ul>';return;}
 if(mode==='SOURCES'){screen.innerHTML='<h2>Source receipts</h2><ul>'+D.resources.map(r=>`<li><a href="${h(r.url)}">${h(r.label)}</a> · ${h(r.state)} · ${h(r.used_by.join(', '))}</li>`).join('')+'</ul>';return;}
 if(mode==='GHOSTS'){screen.innerHTML='<h2>Open addresses</h2><ul>'+Object.values(D.nodes).filter(n=>n.type==='GHOST').map(n=>`<li>${address(n.id)} · ${n.count}</li>`).join('')+'</ul>';return;}
 if(mode==='TRAIL'){screen.innerHTML='<h2>Session trail</h2><ol>'+trail.map(c=>`<li>${address(c.sha256)}</li>`).join('')+'</ol><pre>'+h(D.views['_ARRANGEMENTS/research-trails.json'])+'</pre>';return;}
 if(mode==='MOCs'){screen.innerHTML='<h2>Maps of content</h2><pre>'+h(D.views['_MOCS/description.md'])+'</pre>';return;}
 if(mode==='BIBLIOGRAPHY'){screen.innerHTML='<h2>Bibliography</h2>'+button('Copy bibliography','copyall')+'<pre>'+h(D.bib)+'</pre>';return;}
 screen.innerHTML=Object.entries(D.views).map(([k,v])=>`<details><summary>${h(k)}</summary><pre>${h(v)}</pre></details>`).join('')+'<details><summary>Manifest and hashes</summary><pre>'+h(JSON.stringify(D.manifest,null,2))+'</pre></details>';
}
function copy(text){
 const area=document.createElement('textarea');area.value=text;screen.prepend(area);area.select();
 try{if(document.execCommand('copy'))area.remove();}catch(e){}
}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='mode'){search.value='';mode=v;render();}
 if(a==='node'){search.value='';showNode(v);}
 if(a==='surprise'){search.value='';select(D.cards[Math.floor(Math.random()*D.cards.length)]);}
 if(a==='pin'){pin=pin===cardBy[v]?null:cardBy[v];render();}
 if(a==='bib')copy(cardBy[v].payload.split('\nBIBTEX:\n').at(-1));
 if(a==='copyall')copy(D.bib);
});
search.addEventListener('input',render);
function file(id,type){
 const data=document.querySelector('#'+id).textContent;
 if(!data)return '';
 return URL.createObjectURL(new Blob([Uint8Array.from(atob(data),c=>c.charCodeAt(0))],{type}));
}
const p=file('pdf-data','application/pdf');document.querySelector('#paper').href=p;
document.querySelector('#preview').src=p;
const kit=file('rebuild-kit','application/zip');const ka=document.querySelector('#kit');if(kit)ka.href=kit;else ka.hidden=true;
trail.push(selected);render();
